name: Reusable Stage 3G full validation

on:
  workflow_call:
    inputs:
      target_sha:
        description: "Exact trusted revision to validate"
        required: true
        type: string
      legacy_regression_only:
        description: "Run the frozen prototype compatibility test without authoring its world"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: yacs-stage3g-full-${{ github.repository }}-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  stage3g-full:
    name: Legacy Stage 3G compatibility regression on yacs-ue58
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      STAGE3G_BOOTSTRAP_DIR: _bootstrap-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
      STAGE3G_WORKTREE_DIR: _stage3g-full-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii

          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

          # Generated material packages can exceed MAX_PATH in nested runner checkouts.
          # Configure the job-local file before either actions/checkout invocation.
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable long paths in isolated Git configuration.' }
          Write-Host "Using isolated Git config: $isolated"
          git config --global --list --show-origin

      - name: Require trusted caller and exact target SHA
        shell: pwsh
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:TARGET_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "target_sha must be a full lowercase commit SHA."
          }

          if ($env:EVENT_NAME -eq 'pull_request') {
            if ($env:PR_HEAD_REPO -ne '${{ github.repository }}') {
              throw "Stage 3G full validation refuses untrusted fork PRs on the self-hosted runner."
            }
            if ($env:TARGET_SHA -ne $env:PR_HEAD_SHA) {
              throw "target_sha '$env:TARGET_SHA' != pull-request head '$env:PR_HEAD_SHA'."
            }
          }
          elseif ($env:EVENT_NAME -eq 'push') {
            if ('${{ github.ref }}' -ne 'refs/heads/main') {
              throw "Push-triggered Stage 3G full validation is allowed only on main."
            }
            if ($env:TARGET_SHA -ne '${{ github.sha }}') {
              throw "target_sha '$env:TARGET_SHA' != push SHA '${{ github.sha }}'."
            }
          }
          else {
            throw "Unsupported caller event for Stage 3G full validation: $env:EVENT_NAME"
          }

      - name: Bootstrap cleanup helper outside persistent worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          path: ${{ env.STAGE3G_BOOTSTRAP_DIR }}
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          lfs: false
          clean: true
          persist-credentials: false

      - name: Release stale Unreal workspace locks
        shell: pwsh
        working-directory: ${{ env.STAGE3G_BOOTSTRAP_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') {
            throw "Unreal runner host is already owned; status=$($state.status). Local/unknown Editors always win over remote CI."
          }
          $bootstrapRoot = Join-Path $env:GITHUB_WORKSPACE $env:STAGE3G_BOOTSTRAP_DIR
          $bootstrap = Join-Path $bootstrapRoot 'scripts/ci/Release-YacsUnrealWorkspaceLocks.ps1'
          & $bootstrap -Workspace $env:GITHUB_WORKSPACE

      - name: Checkout exact trusted revision with full LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.STAGE3G_WORKTREE_DIR }}
          ref: ${{ inputs.target_sha }}
          fetch-depth: 20
          lfs: true
          clean: true
          persist-credentials: false

      - name: Verify full-LFS checkout provenance
        shell: pwsh
        working-directory: ${{ env.STAGE3G_WORKTREE_DIR }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:TARGET_SHA) {
            throw "checkout HEAD '$actual' != trusted target '$env:TARGET_SHA'."
          }

          git lfs install --local
          if ($LASTEXITCODE -ne 0) {
            throw 'Stage 3G failed to install repository-local Git LFS filters.'
          }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) {
            throw 'Stage 3G failed to materialize fetched Git LFS objects.'
          }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) {
            throw 'Stage 3G full-LFS checkout failed git lfs fsck.'
          }

          if (git status --porcelain) {
            throw 'Stage 3G checkout is not clean before validation.'
          }

          $lfsPaths = @(git lfs ls-files --name-only)
          if ($LASTEXITCODE -ne 0 -or $lfsPaths.Count -eq 0) {
            throw 'Stage 3G expected tracked Git LFS assets but could not enumerate them.'
          }

          $pointerSignature = 'version https://git-lfs.github.com/spec/v1'
          $remainingPointers = [System.Collections.Generic.List[string]]::new()
          foreach ($path in $lfsPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Tracked Git LFS path is missing after checkout: $path"
            }

            $stream = [System.IO.File]::OpenRead((Resolve-Path -LiteralPath $path).Path)
            try {
              $length = [Math]::Min(256, [int]$stream.Length)
              $buffer = New-Object byte[] $length
              if ($length -gt 0) {
                [void]$stream.Read($buffer, 0, $length)
              }
              $prefix = [System.Text.Encoding]::UTF8.GetString($buffer)
            }
            finally {
              $stream.Dispose()
            }

            if ($prefix.StartsWith($pointerSignature, [System.StringComparison]::Ordinal)) {
              [void]$remainingPointers.Add($path)
            }
          }

          if ($remainingPointers.Count -gt 0) {
            throw ("Stage 3G Git LFS checkout left pointer files in the working tree: {0}" -f ($remainingPointers -join ', '))
          }

          Write-Host "Stage 3G full-LFS materialization: PASS ($($lfsPaths.Count) files)."

      - name: Respect shared Unreal host ownership before native regression
        shell: pwsh
        working-directory: ${{ env.STAGE3G_WORKTREE_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') {
            throw "Unreal runner host is already owned; status=$($state.status). Local/unknown Editors always win over remote CI."
          }

      - name: Author deterministic Stage 3G environment
        if: ${{ !inputs.legacy_regression_only }}
        shell: pwsh
        working-directory: ${{ env.STAGE3G_WORKTREE_DIR }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/ue/Invoke-YacsStage3GAuthoring.ps1 `
            -ExpectedBranch HEAD `
            -ExpectedHead $env:TARGET_SHA `
            -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GFull/Authoring'

      - name: Run non-mutating Stage 3G final proof
        if: ${{ !inputs.legacy_regression_only }}
        shell: pwsh
        working-directory: ${{ env.STAGE3G_WORKTREE_DIR }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/ue/Invoke-YacsStage3GProof.ps1 `
            -ExpectedBranch HEAD `
            -ExpectedHead $env:TARGET_SHA `
            -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GFull/FinalProof' `
            -SkipBuild

      - name: Verify frozen prototype compatibility without world authoring
        if: ${{ inputs.legacy_regression_only }}
        shell: pwsh
        working-directory: ${{ env.STAGE3G_WORKTREE_DIR }}
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-LegacyStage3GRegression {
            param([string] $ReportRoot, [string] $ExpectedHead)
            $summaryPath = Join-Path $ReportRoot 'unreal_ci_summary.json'
            $summary = Get-Content -LiteralPath $summaryPath -Raw | ConvertFrom-Json
            foreach ($field in @('Head', 'ExpectedHead', 'TestFilter', 'SkipBuild', 'Discovered', 'Passed', 'Failed', 'Errors')) {
              if ($field -notin $summary.PSObject.Properties.Name) {
                throw "Legacy compatibility summary lacks $field."
              }
            }
            $expectedTest = 'CyclingStage3World.PrototypeTerrain'
            if ($summary.Head -cne $ExpectedHead -or $summary.ExpectedHead -cne $ExpectedHead -or
                $summary.TestFilter -cne $expectedTest -or $summary.SkipBuild -isnot [bool] -or
                $summary.SkipBuild -ne $false -or [int]$summary.Discovered -ne 1 -or
                [int]$summary.Passed -ne 1 -or [int]$summary.Failed -ne 0 -or [int]$summary.Errors -ne 0) {
              throw 'Legacy compatibility summary does not prove one exact-head freshly built test.'
            }
            $indexPath = Join-Path $ReportRoot 'Proof/AutomationReport/index.json'
            if (-not (Test-Path -LiteralPath $indexPath -PathType Leaf)) {
              $indexPath = Join-Path $ReportRoot 'Proof/index.json'
            }
            $proof = Get-Content -LiteralPath (Join-Path $ReportRoot 'Proof/summary.json') -Raw | ConvertFrom-Json
            foreach ($field in @('Head', 'IndexPath', 'Discovered', 'Passed', 'Failed', 'Skipped', 'Errors', 'UatExitCode')) {
              if ($field -notin $proof.PSObject.Properties.Name) {
                throw "Legacy Automation summary lacks $field."
              }
            }
            if ($proof.Head -cne $ExpectedHead -or
                [System.IO.Path]::GetFullPath($proof.IndexPath) -ine [System.IO.Path]::GetFullPath($indexPath) -or
                [int]$proof.Discovered -ne 1 -or [int]$proof.Passed -ne 1 -or
                [int]$proof.Failed -ne 0 -or [int]$proof.Skipped -ne 0 -or
                [int]$proof.Errors -ne 0 -or [int]$proof.UatExitCode -ne 0) {
              throw 'Legacy Automation summary does not prove the exact fresh singleton report.'
            }
            $index = Get-Content -LiteralPath $indexPath -Raw | ConvertFrom-Json
            $tests = @($index.tests)
            if ('tests' -notin $index.PSObject.Properties.Name) {
              $tests = @($index.results.tests)
            }
            if ($tests.Count -ne 1 -or $tests[0].fullTestPath -cne $expectedTest -or
                $tests[0].state -cne 'Success' -or
                'errors' -notin $tests[0].PSObject.Properties.Name -or [int]$tests[0].errors -ne 0 -or
                'warnings' -notin $tests[0].PSObject.Properties.Name -or [int]$tests[0].warnings -lt 0) {
              throw 'Legacy compatibility report must contain exactly the requested test with Success.'
            }
            return [ordered]@{
              status = 'LEGACY_STAGE3G_COMPATIBILITY_PASS'
              exact_sha = $ExpectedHead
              test = $expectedTest
              discovered = 1
              warnings = [int]$tests[0].warnings
              world_authoring = $false
              current_world_admission = $false
              summary_sha256 = (Get-FileHash -LiteralPath $summaryPath -Algorithm SHA256).Hash.ToLowerInvariant()
              automation_index_sha256 = (Get-FileHash -LiteralPath $indexPath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $root = Join-Path (Get-Location).Path 'Saved/RuntimeProof/CI/Stage3GFull/LegacyRegression'
          if (Test-Path -LiteralPath $root) { throw 'Legacy regression requires a fresh evidence directory.' }
          ./scripts/ci/Invoke-YacsUnrealCi.ps1 `
            -ExpectedHead $env:TARGET_SHA `
            -TestFilter 'CyclingStage3World.PrototypeTerrain' `
            -ArtifactRoot $root
          if ($LASTEXITCODE -ne 0) { throw 'Frozen prototype compatibility build/Automation failed.' }
          $receipt = Assert-LegacyStage3GRegression -ReportRoot $root -ExpectedHead $env:TARGET_SHA
          $dirty = @(git status --porcelain)
          if ($LASTEXITCODE -ne 0 -or $dirty.Count -ne 0) {
            throw 'Frozen prototype compatibility must preserve the source checkout.'
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $root 'legacy-regression-receipt.json') -Encoding UTF8

      - name: Record ephemeral source mutations
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worktree = Join-Path $env:GITHUB_WORKSPACE $env:STAGE3G_WORKTREE_DIR
          $proofRoot = Join-Path $worktree 'Saved/RuntimeProof/CI/Stage3GFull'
          New-Item -ItemType Directory -Path $proofRoot -Force | Out-Null
          if (Test-Path -LiteralPath (Join-Path $worktree '.git')) {
            Push-Location -LiteralPath $worktree
            try {
              git status --short | Set-Content -LiteralPath (Join-Path $proofRoot 'worktree_status.txt') -Encoding UTF8
              git diff --name-only | Set-Content -LiteralPath (Join-Path $proofRoot 'changed_tracked_files.txt') -Encoding UTF8
            }
            finally {
              Pop-Location
            }
          }
          else {
            'checkout not reached; no git worktree was available' | Set-Content -LiteralPath (Join-Path $proofRoot 'worktree_status.txt') -Encoding UTF8
            '' | Set-Content -LiteralPath (Join-Path $proofRoot 'changed_tracked_files.txt') -Encoding UTF8
          }

      - name: Upload Stage 3G validation proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-full-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.STAGE3G_WORKTREE_DIR }}/Saved/RuntimeProof/CI/Stage3GFull/**/*.json
            ${{ env.STAGE3G_WORKTREE_DIR }}/Saved/RuntimeProof/CI/Stage3GFull/**/*.txt
            ${{ env.STAGE3G_WORKTREE_DIR }}/Saved/RuntimeProof/CI/Stage3GFull/**/*.log
            ${{ env.STAGE3G_WORKTREE_DIR }}/Saved/RuntimeProof/CI/Stage3GFull/**/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Clean isolated Stage 3G worktree
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worktree = Join-Path $env:GITHUB_WORKSPACE $env:STAGE3G_WORKTREE_DIR
          $bootstrapRoot = Join-Path $env:GITHUB_WORKSPACE $env:STAGE3G_BOOTSTRAP_DIR
          $hostState = Join-Path $bootstrapRoot 'scripts/runner/Get-YacsUnrealHostState.ps1'
          if (-not (Test-Path -LiteralPath $hostState -PathType Leaf)) {
            throw 'Stage 3G cleanup cannot verify host ownership; preserving worktree and bootstrap.'
          }
          $state = & $hostState
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') {
            throw "Stage 3G cleanup refuses an owned host; status=$($state.status). Preserving worktree and bootstrap."
          }
          $bootstrap = Join-Path $bootstrapRoot 'scripts/ci/Release-YacsUnrealWorkspaceLocks.ps1'

          if (Test-Path -LiteralPath $worktree) {
            if (Test-Path -LiteralPath $bootstrap -PathType Leaf) {
              & $bootstrap -Workspace $worktree
            }

            if (Test-Path -LiteralPath (Join-Path $worktree '.git')) {
              Push-Location -LiteralPath $worktree
              try {
                git reset --hard
                if ($LASTEXITCODE -ne 0) { throw 'Stage 3G cleanup git reset failed.' }
                git clean -ffdx -e Saved/Logs/YetAnotherCyclingSim.log
                if ($LASTEXITCODE -ne 0) { throw 'Stage 3G cleanup git clean failed.' }
                if (git status --porcelain) {
                  throw 'Stage 3G full-validation isolated worktree is still dirty after cleanup.'
                }
              }
              finally {
                Pop-Location
              }
            }

            Remove-Item -LiteralPath $worktree -Recurse -Force
            Write-Host "Stage 3G per-run worktree cleanup: PASS ($worktree)"
          }
          else {
            Write-Host 'Stage 3G isolated worktree cleanup: no checkout worktree to clean.'
          }

          if (Test-Path -LiteralPath $bootstrapRoot) {
            Remove-Item -LiteralPath $bootstrapRoot -Recurse -Force
          }

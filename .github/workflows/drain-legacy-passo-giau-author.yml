name: Cancel superseded Passo Giau authoring run

on:
  push:
    branches:
      - ci/257-adaptive-unreal-parallelism
    paths:
      - '.github/workflows/drain-legacy-passo-giau-author.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: cancel-superseded-passo-giau-authoring-${{ github.repository }}
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel exact superseded legacy run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GH_REPO}/actions/runs/36638798865/cancel"
          echo "cancel requested for superseded run 36638798865"

name: Passo Giau M3 Embark terrain proof

on:
  push:
    branches:
      - feat/287-embark-terrain-pipeline
    paths:
      - '.github/workflows/passo-giau-embark-terrain.yml'
      - '.gitignore'
      - 'AGENTS.md'
      - '.gitattributes'
      - '.gumball/workflow-lifecycle.json'
      - 'docs/WORLD_BUILDING_BIBLE.md'
      - 'docs/ci/WORKFLOW_LIFECYCLE.md'
      - 'docs/legal/DEPENDENCY_PROVENANCE.md'
      - 'worldgen/embark/**'
      - 'scripts/worldgen/**'
      - 'scripts/assets/download_passo_giau_mase_pst.py'
      - 'scripts/assets/download_passo_giau_veneto_lidar.py'
      - 'scripts/assets/prepare_passo_giau_mase_pst.py'
      - 'scripts/assets/extract_passo_giau_native_dtm_patch.py'
      - 'scripts/assets/download_passo_giau_road_network.py'
      - 'scripts/assets/prepare_passo_giau_road.py'
      - 'scripts/ue/Invoke-YacsPassoGiauPcgExGraph.ps1'
      - 'scripts/ue/Invoke-YacsSp638LocalCorridorVisualProof.ps1'
      - 'scripts/ue/stage3g_capture_sp638_local_corridor.py'
      - 'scripts/geometry/**'
      - 'scripts/ci/classify_changes.py'
      - 'scripts/ci/test_classify_changes.py'
      - 'scripts/ci/test_embark_terrain_pipeline_contract.py'
      - 'Source/YetAnotherCyclingSimEditor/Private/PCG/YacsPassoGiauPcgExGraphCommandlet.cpp'
      - 'Source/YetAnotherCyclingSimEditor/Private/PCG/YacsPassoGiauSp638PathSettings.cpp'
      - 'Source/YetAnotherCyclingSimEditor/Public/PCG/YacsPassoGiauPcgExGraphCommandlet.h'
      - 'Source/YetAnotherCyclingSimEditor/Public/PCG/YacsPassoGiauSp638PathSettings.h'
      - 'Source/YetAnotherCyclingSimEditor/YetAnotherCyclingSimEditor.Build.cs'
      - 'YetAnotherCyclingSim.uproject'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passo-giau-m3-embark-terrain-${{ github.repository }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Embark proof cost
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      proof_mode: ${{ steps.classify.outputs.proof_mode }}
      compile_fingerprint: ${{ steps.classify.outputs.compile_fingerprint }}
    steps:
      - name: Checkout exact revision for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Classify proof mode and compile fingerprint
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/classify_changes.py             --base "${{ steps.base.outputs.base }}"             --head "${{ github.sha }}"             --embark-terrain-proof             --repo-root .             --github-output "$GITHUB_OUTPUT"

      - name: Validate proof routing outputs
        shell: bash
        run: |
          set -euo pipefail
          case "${{ steps.classify.outputs.proof_mode }}" in
            cheap|render|heavy) ;;
            *) echo "Invalid proof mode: ${{ steps.classify.outputs.proof_mode }}" >&2; exit 1 ;;
          esac
          [[ "${{ steps.classify.outputs.compile_fingerprint }}" =~ ^[0-9a-f]{64}$ ]]
          echo "Embark proof mode: ${{ steps.classify.outputs.proof_mode }}"
          echo "Compile fingerprint: ${{ steps.classify.outputs.compile_fingerprint }}"

  contract:
    name: Embark terrain contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate Embark/PCGEx repository contract
        run: python -m unittest scripts.ci.test_embark_terrain_pipeline_contract

  prepare:
    name: Prepare real SP638 authoring input
    needs: [contract, classify]
    if: ${{ needs.classify.outputs.proof_mode != 'cheap' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned GIS preparation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 \
            Pillow==11.3.0 \
            rasterio==1.4.3 \
            shapely==2.1.1

      - name: Compile SP638 and terrain preparation scripts
        run: |
          python -m py_compile \
            scripts/assets/download_passo_giau_mase_pst.py \
            scripts/assets/download_passo_giau_veneto_lidar.py \
            scripts/assets/prepare_passo_giau_mase_pst.py \
            scripts/assets/extract_passo_giau_native_dtm_patch.py \
            scripts/assets/download_passo_giau_road_network.py \
            scripts/assets/prepare_passo_giau_road.py

      - name: Prepare canonical terrain input used for SP638 presentation elevation
        run: |
          python scripts/assets/download_passo_giau_mase_pst.py
          python scripts/assets/download_passo_giau_veneto_lidar.py
          python scripts/assets/prepare_passo_giau_mase_pst.py

      - name: Prepare official SP638 presentation input
        run: |
          python scripts/assets/download_passo_giau_road_network.py
          python scripts/assets/prepare_passo_giau_road.py

      - name: Extract Gate C.3 native DTM near-field patch
        run: python scripts/assets/extract_passo_giau_native_dtm_patch.py

      - name: Validate prepared SP638 authority boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("ExternalAssets/Terrain/PassoGiau/PreparedRoad/passo_giau_sp638_ue_centerline.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          policy = payload.get("yacs_policy") or {}
          if policy.get("presentation_only") is not True:
              raise SystemExit("prepared SP638 input is not presentation-only")
          if policy.get("authoritative_route_geometry") is not False:
              raise SystemExit("prepared SP638 input claims route authority")
          if policy.get("authoritative_physics") is not False:
              raise SystemExit("prepared SP638 input claims physics authority")
          points = payload.get("points") or []
          if len(points) < 2:
              raise SystemExit("prepared SP638 input contains fewer than two points")
          print(f"Prepared SP638 input: {len(points)} points, {payload.get('length_m')} m")
          PY

      - name: Upload prepared SP638 input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: passo-giau-m3-pcgex-input-${{ github.run_id }}
          path: |
            ExternalAssets/Terrain/PassoGiau/PreparedRoad/**
            ExternalAssets/Terrain/PassoGiau/PreparedNearField/**
          if-no-files-found: error
          retention-days: 14

  author:
    name: PCGEx corridor graph authoring
    needs: [contract, classify, prepare]
    if: ${{ needs.classify.outputs.proof_mode != 'cheap' && github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/287-embark-terrain-pipeline' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 120
    env:
      GIT_LFS_SKIP_SMUDGE: '1'

    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-pcgex-author-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact trusted revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: _embark-terrain-worktree
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          clean: false
          persist-credentials: false

      - name: Verify exact SHA and code-only checkout
        shell: pwsh
        working-directory: _embark-terrain-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          # Preserve only ignored compile-cache state. Any tracked or ordinary
          # untracked residue from an interrupted run is discarded fail-closed.
          git reset --hard
          if ($LASTEXITCODE -ne 0) { throw 'Failed to reset PCGEx authoring checkout.' }
          git clean -ffd
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clean non-ignored PCGEx authoring residue.' }
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'PCGEx authoring checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }

          # A previous proof may leave this tracked LFS path materialized in the
          # persistent self-hosted workspace. actions/checkout + reset can keep
          # that payload because it is a valid clean LFS working-tree value.
          # Force the known proof asset back to its pointer before enforcing the
          # code-only checkout contract.
          $spikeMap = 'Content/Prototype/Maps/L_PassoGiauTerrainSpike.umap'
          $spikePath = Join-Path (Get-Location) $spikeMap
          Remove-Item -LiteralPath $spikePath -Force -ErrorAction SilentlyContinue
          git checkout -- $spikeMap
          if ($LASTEXITCODE -ne 0) { throw 'Failed to restore Passo Giau map as an LFS pointer.' }
          $pointerHeader = Get-Content -LiteralPath $spikePath -TotalCount 1 -ErrorAction Stop
          if ($pointerHeader -ne 'version https://git-lfs.github.com/spec/v1') {
            throw 'Passo Giau map remained materialized before code-only checkout guard.'
          }

          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Code-only checkout contract failed.' }
          if (git status --porcelain --untracked-files=all) {
            throw 'PCGEx authoring checkout is dirty before bootstrap.'
          }

      - name: Re-run repository contract
        shell: pwsh
        working-directory: _embark-terrain-worktree
        run: |
          python -m unittest scripts.ci.test_embark_terrain_pipeline_contract
          if ($LASTEXITCODE -ne 0) { throw 'Embark/PCGEx contract failed on the authoring runner.' }

      - name: Download prepared SP638 input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: passo-giau-m3-pcgex-input-${{ github.run_id }}
          path: ${{ runner.temp }}/yacs-pcgex-prepared-road

      - name: Materialize prepared SP638 input for Unreal authoring
        shell: pwsh
        working-directory: _embark-terrain-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadRoot = Join-Path '${{ runner.temp }}' 'yacs-pcgex-prepared-road'
          $source = Get-ChildItem -LiteralPath $downloadRoot -Recurse -File -Filter 'passo_giau_sp638_ue_centerline.json' | Select-Object -First 1
          if (-not $source) { throw 'Prepared SP638 artifact is missing passo_giau_sp638_ue_centerline.json.' }
          $target = Join-Path (Get-Location) 'ExternalAssets/Terrain/PassoGiau/PreparedRoad'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path (Join-Path $source.Directory.FullName '*') -Destination $target -Recurse -Force
          $materialized = Join-Path $target 'passo_giau_sp638_ue_centerline.json'
          if (-not (Test-Path -LiteralPath $materialized -PathType Leaf)) {
            throw 'Prepared SP638 input was not materialized at the PCG source contract path.'
          }
          $payload = Get-Content -LiteralPath $materialized -Raw | ConvertFrom-Json
          if (-not [bool]$payload.yacs_policy.presentation_only) { throw 'SP638 input lost presentation-only policy.' }
          if ([bool]$payload.yacs_policy.authoritative_route_geometry) { throw 'SP638 input unexpectedly claims route authority.' }
          if ([bool]$payload.yacs_policy.authoritative_physics) { throw 'SP638 input unexpectedly claims physics authority.' }
          Write-Host ("Materialized prepared SP638 input: {0} points" -f @($payload.points).Count)

          $patchSource = Get-ChildItem -LiteralPath $downloadRoot -Recurse -File -Filter 'passo_giau_native_dtm_patch.json' | Select-Object -First 1
          if (-not $patchSource) { throw 'Prepared input artifact is missing Gate C.3 native DTM patch metadata.' }
          $patchTarget = Join-Path (Get-Location) 'ExternalAssets/Terrain/PassoGiau/PreparedNearField'
          New-Item -ItemType Directory -Path $patchTarget -Force | Out-Null
          Copy-Item -Path (Join-Path $patchSource.Directory.FullName '*') -Destination $patchTarget -Recurse -Force
          $patchMetadata = Join-Path $patchTarget 'passo_giau_native_dtm_patch.json'
          $patch = Get-Content -LiteralPath $patchMetadata -Raw | ConvertFrom-Json
          $patchBinary = Join-Path $patchTarget ([string]$patch.binary.file)
          if (-not (Test-Path -LiteralPath $patchBinary -PathType Leaf)) {
            throw 'Gate C.3 native DTM patch binary was not materialized.'
          }
          if ([string]$patch.source.kind -ne 'prepared native metric DTM') {
            throw 'Gate C.3 native DTM patch source contract drifted.'
          }
          Write-Host ("Materialized Gate C.3 patch: {0}x{1} @ {2} m" -f $patch.grid.rows,$patch.grid.columns,$patch.grid.step_x_m)

      - name: Resolve compile-fingerprint cache
        id: compile_cache
        shell: pwsh
        working-directory: _embark-terrain-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          $mode = '${{ needs.classify.outputs.proof_mode }}'
          $fingerprint = '${{ needs.classify.outputs.compile_fingerprint }}'
          $expectedPcgExCommit = '39a8f1bdc65b2c4613a1e87b71d93b4576db0a66'
          $statePath = Join-Path (Get-Location) 'Saved/BuildCache/PCGEx/compile-state.json'
          $pluginRoot = Join-Path (Get-Location) 'Plugins/PCGExtendedToolkit'
          $pluginGit = Join-Path $pluginRoot '.git'
          $projectModules = @(
            Get-ChildItem -LiteralPath (Join-Path (Get-Location) 'Binaries/Win64') -File -Filter 'UnrealEditor-YetAnotherCyclingSimEditor*.dll' -ErrorAction SilentlyContinue
          )
          $pluginModules = @(
            Get-ChildItem -LiteralPath (Join-Path $pluginRoot 'Binaries/Win64') -File -Filter '*.dll' -ErrorAction SilentlyContinue
          )

          $environmentResolver = Join-Path (Get-Location) 'scripts/ci/Resolve-YacsUnrealBuildEnvironment.ps1'
          if (-not (Test-Path -LiteralPath $environmentResolver -PathType Leaf)) {
            throw "Shared Unreal build-environment resolver is missing: $environmentResolver"
          }
          . $environmentResolver
          $buildEnvironment = Resolve-YacsUnrealBuildEnvironment -ProjectPath (Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject')
          $environmentIdentity = if ($buildEnvironment) { [string]$buildEnvironment.Identity } else { 'unresolved' }

          $pluginHead = $null
          if (Test-Path -LiteralPath $pluginGit) {
            try { $pluginHead = (& git -C $pluginRoot rev-parse HEAD).Trim() } catch { $pluginHead = $null }
          }

          $compileKind = 'cold'
          $reason = 'missing-cache-state'
          $skipBuild = $false
          $purgeProjectBuild = $true
          $purgePlugin = $true
          $state = $null

          if (Test-Path -LiteralPath $statePath -PathType Leaf) {
            try {
              $state = Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
              $schema = if ($state.PSObject.Properties.Name -contains 'schema_version') { [int]$state.schema_version } else { 0 }
              $statePcgExCommit = if ($state.PSObject.Properties.Name -contains 'pcgex_commit') { [string]$state.pcgex_commit } else { '' }

              if ($schema -eq 1 -and $statePcgExCommit -eq $expectedPcgExCommit) {
                # One-time migration from the pre-environment-fingerprint cache.
                # Never skip the build, but preserve trusted intermediates and
                # let UBT validate/rebuild what is outdated.
                $compileKind = 'warm'
                $reason = 'legacy-cache-schema-migration'
                $purgeProjectBuild = $false
                $purgePlugin = ($pluginHead -ne $expectedPcgExCommit)
              }
              elseif ($schema -ne 2) {
                $compileKind = 'cold'
                $reason = 'cache-schema-mismatch'
              }
              elseif ($environmentIdentity -eq 'unresolved' -or
                      [string]$state.environment_identity -ne $environmentIdentity) {
                $compileKind = 'cold'
                $reason = 'environment-identity-mismatch'
              }
              elseif ([string]$state.pcgex_commit -ne $expectedPcgExCommit) {
                $compileKind = 'cold'
                $reason = 'pcgex-pin-mismatch'
              }
              elseif ($pluginHead -and $pluginHead -ne $expectedPcgExCommit) {
                $compileKind = 'cold'
                $reason = 'pcgex-checkout-drift'
              }
              elseif (-not [bool]$state.compile_passed) {
                $compileKind = 'warm'
                $reason = 'previous-compile-not-verified'
                $purgeProjectBuild = $false
                $purgePlugin = (-not $pluginHead)
              }
              elseif ([string]$state.compile_fingerprint -ne $fingerprint) {
                $compileKind = 'warm'
                $reason = 'compile-fingerprint-mismatch'
                $purgeProjectBuild = $false
                $purgePlugin = ($pluginHead -ne $expectedPcgExCommit)
              }
              elseif ($projectModules.Count -eq 0 -or $pluginModules.Count -eq 0 -or -not $pluginHead) {
                $compileKind = 'warm'
                $reason = 'expected-binary-or-checkout-missing'
                $purgeProjectBuild = $false
                $purgePlugin = (-not $pluginHead)
              }
              else {
                $compileKind = 'none'
                $reason = 'verified-compile-cache-hit'
                $skipBuild = $true
                $purgeProjectBuild = $false
                $purgePlugin = $false
              }
            }
            catch {
              Write-Warning ("Ignoring invalid PCGEx compile cache state: {0}" -f $_.Exception.Message)
              $compileKind = 'cold'
              $reason = 'invalid-cache-state'
              $skipBuild = $false
              $purgeProjectBuild = $true
              $purgePlugin = $true
            }
          }

          if ($environmentIdentity -eq 'unresolved') {
            $compileKind = 'cold'
            $reason = 'environment-identity-unresolved'
            $skipBuild = $false
            $purgeProjectBuild = $true
            $purgePlugin = $true
          }

          if ($skipBuild) {
            Write-Host ("PCGEx compile cache HIT: kind=none fingerprint={0}" -f $fingerprint) -ForegroundColor Green
          }
          else {
            Write-Host ("PCGEx compile required: kind={0} reason={1} fingerprint={2}" -f $compileKind,$reason,$fingerprint) -ForegroundColor Yellow
          }

          if ($purgeProjectBuild) {
            foreach ($relative in @('Binaries','Intermediate')) {
              Remove-Item -LiteralPath (Join-Path (Get-Location) $relative) -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          if ($purgePlugin) {
            Remove-Item -LiteralPath $pluginRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

          if (-not $skipBuild -and $state) {
            # Revoke the previous green lease before mutable compilation so an
            # interrupted run can never be reused as if it had passed.
            try {
              $state.compile_passed = $false
              $state | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $statePath -Encoding UTF8
            }
            catch {
              Remove-Item -LiteralPath $statePath -Force -ErrorAction SilentlyContinue
            }
          }

          "skip_build=$($skipBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "compile_kind=$compileKind" >> $env:GITHUB_OUTPUT
          "reason=$reason" >> $env:GITHUB_OUTPUT
          "environment_identity=$environmentIdentity" >> $env:GITHUB_OUTPUT
          "purged_project_build=$($purgeProjectBuild.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "purged_plugin=$($purgePlugin.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build or reuse binaries and author deterministic PCGEx graph
        shell: pwsh
        working-directory: _embark-terrain-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          $params = @{
            ExpectedBranch = 'HEAD'
            ExpectedHead = '${{ github.sha }}'
            ArtifactRoot = 'Saved/RuntimeProof/CI/M3/PCGExCorridor'
          }
          if ('${{ steps.compile_cache.outputs.skip_build }}' -eq 'true') {
            $params.SkipBuild = $true
          }

          & ./scripts/ue/Invoke-YacsPassoGiauPcgExGraph.ps1 @params
          if ($LASTEXITCODE -ne 0) { throw 'PCGEx corridor graph proof failed.' }

          if ('${{ steps.compile_cache.outputs.skip_build }}' -ne 'true') {
            $statePath = Join-Path (Get-Location) 'Saved/BuildCache/PCGEx/compile-state.json'
            New-Item -ItemType Directory -Path (Split-Path -Parent $statePath) -Force | Out-Null
            [ordered]@{
              schema_version = 2
              compile_fingerprint = '${{ needs.classify.outputs.compile_fingerprint }}'
              environment_identity = '${{ steps.compile_cache.outputs.environment_identity }}'
              validated_head = '${{ github.sha }}'
              pcgex_commit = '39a8f1bdc65b2c4613a1e87b71d93b4576db0a66'
              compile_passed = $true
              compile_kind = '${{ steps.compile_cache.outputs.compile_kind }}'
              proof_mode = '${{ needs.classify.outputs.proof_mode }}'
              updated_utc = (Get-Date).ToUniversalTime().ToString('o')
            } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $statePath -Encoding UTF8
            Write-Host ("Persisted validated PCGEx compile state: kind={0}." -f '${{ steps.compile_cache.outputs.compile_kind }}') -ForegroundColor Green
          }

      - name: Render PCGEx rider-close corridor proof
        shell: pwsh
        working-directory: _embark-terrain-worktree
        run: |
          $ErrorActionPreference = 'Stop'

          # The graph commandlet intentionally authors a transient proof asset.
          # The rider-close renderer consumes only pcgex_graph_output.json, while
          # its fail-closed preflight correctly rejects unrelated untracked
          # Content. Preserve the authored asset as evidence under ignored Saved/
          # and remove only the generated, untracked WorldGen directory before
          # starting the visual proof.
          $generatedAsset = Join-Path (Get-Location) 'Content/WorldGen/PCGEx/PCG_PassoGiau_SP638_Corridor.uasset'
          if (-not (Test-Path -LiteralPath $generatedAsset -PathType Leaf)) {
            throw 'Generated PCGEx graph asset is missing before rider proof.'
          }
          $evidenceAsset = Join-Path (Get-Location) 'Saved/RuntimeProof/CI/M3/PCGExCorridor/PCG_PassoGiau_SP638_Corridor.uasset'
          Copy-Item -LiteralPath $generatedAsset -Destination $evidenceAsset -Force
          Remove-Item -LiteralPath (Join-Path (Get-Location) 'Content/WorldGen') -Recurse -Force

          foreach ($variant in @('A','B','C','D','E')) {
            ./scripts/ue/Invoke-YacsSp638LocalCorridorVisualProof.ps1 `
              -ExpectedBranch 'HEAD' `
              -ExpectedHead '${{ github.sha }}' `
              -ArtifactRoot ("Saved/RuntimeProof/CI/M3/PCGExCorridor/Visual/{0}" -f $variant) `
              -PcgExExecutionOutput 'Saved/RuntimeProof/CI/M3/PCGExCorridor/pcgex_graph_output.json' `
              -Variant $variant
            if ($LASTEXITCODE -ne 0) { throw "PCGEx Gate C.1 variant $variant failed." }
          }

          ./scripts/ue/Invoke-YacsSp638LocalCorridorVisualProof.ps1 `
            -ExpectedBranch 'HEAD' `
            -ExpectedHead '${{ github.sha }}' `
            -ArtifactRoot 'Saved/RuntimeProof/CI/M3/PCGExCorridor/Visual/C3' `
            -PcgExExecutionOutput 'Saved/RuntimeProof/CI/M3/PCGExCorridor/pcgex_graph_output.json' `
            -NativeDtmPatchMetadata 'ExternalAssets/Terrain/PassoGiau/PreparedNearField/passo_giau_native_dtm_patch.json' `
            -Variant C3
          if ($LASTEXITCODE -ne 0) { throw 'PCGEx Gate C.3 native-DTM patch failed.' }

      - name: Upload PCGEx authoring evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: passo-giau-m3-pcgex-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _embark-terrain-worktree/Saved/RuntimeProof/CI/M3/PCGExCorridor/**
            _embark-terrain-worktree/Content/WorldGen/PCGEx/PCG_PassoGiau_SP638_Corridor.uasset
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worktree = Join-Path $env:GITHUB_WORKSPACE '_embark-terrain-worktree'
          if (-not (Test-Path -LiteralPath (Join-Path $worktree '.git'))) {
            exit 0
          }
          # Deliberately preserve ignored Binaries/Intermediate/Saved and the
          # ignored exact-SHA PCGEx checkout. Their reuse is gated next run by
          # the compile fingerprint plus required-binary checks.
          git -C $worktree reset --hard
          git -C $worktree clean -ffd
          if (git -C $worktree status --porcelain --untracked-files=all) {
            throw 'PCGEx authoring worktree has non-ignored mutations after cleanup.'
          }


  validate:
    name: PCGEx corridor deviation report
    needs: [classify, prepare, author]
    if: ${{ needs.classify.outputs.proof_mode != 'cheap' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install pinned deviation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            numpy==2.2.6 \
            shapely==2.1.1

      - name: Download prepared SP638 input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: passo-giau-m3-pcgex-input-${{ github.run_id }}
          path: ${{ runner.temp }}/yacs-pcgex-source

      - name: Download executed PCGEx evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: passo-giau-m3-pcgex-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yacs-pcgex-execution

      - name: Measure presentation deviation against official SP638
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$(find "${{ runner.temp }}/yacs-pcgex-source" -type f -name 'passo_giau_sp638_ue_centerline.json' -print -quit)"
          EXECUTION="$(find "${{ runner.temp }}/yacs-pcgex-execution" -type f -name 'pcgex_graph_output.json' -print -quit)"
          test -n "$SOURCE"
          test -n "$EXECUTION"
          python scripts/worldgen/validate_pcgex_corridor_output.py \
            --source "$SOURCE" \
            --execution-output "$EXECUTION" \
            --output Saved/RuntimeProof/CI/M3/PCGExCorridor/pcgex_corridor_deviation.json

      - name: Upload PCGEx deviation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: passo-giau-m3-pcgex-deviation-${{ github.run_id }}-${{ github.run_attempt }}
          path: Saved/RuntimeProof/CI/M3/PCGExCorridor/pcgex_corridor_deviation.json
          if-no-files-found: error
          retention-days: 14

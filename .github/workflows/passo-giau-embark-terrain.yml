name: Passo Giau M3 Embark terrain proof

on:
  push:
    branches:
      - feat/287-embark-terrain-pipeline
    paths:
      - '.github/workflows/passo-giau-embark-terrain.yml'
      - '.gitignore'
      - 'AGENTS.md'
      - '.gitattributes'
      - '.gumball/workflow-lifecycle.json'
      - 'docs/WORLD_BUILDING_BIBLE.md'
      - 'docs/ci/WORKFLOW_LIFECYCLE.md'
      - 'docs/legal/DEPENDENCY_PROVENANCE.md'
      - 'worldgen/embark/**'
      - 'scripts/worldgen/**'
      - 'scripts/ue/Invoke-YacsPassoGiauPcgExGraph.ps1'
      - 'scripts/ci/test_embark_terrain_pipeline_contract.py'
      - 'Source/YetAnotherCyclingSimEditor/Private/PCG/YacsPassoGiauPcgExGraphCommandlet.cpp'
      - 'Source/YetAnotherCyclingSimEditor/Private/PCG/YacsPassoGiauSp638PathSettings.cpp'
      - 'Source/YetAnotherCyclingSimEditor/Public/PCG/YacsPassoGiauPcgExGraphCommandlet.h'
      - 'Source/YetAnotherCyclingSimEditor/Public/PCG/YacsPassoGiauSp638PathSettings.h'
      - 'Source/YetAnotherCyclingSimEditor/YetAnotherCyclingSimEditor.Build.cs'
      - 'YetAnotherCyclingSim.uproject'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passo-giau-m3-embark-terrain-${{ github.repository }}
  cancel-in-progress: true

jobs:
  contract:
    name: Embark terrain contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Verify exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate Embark/PCGEx repository contract
        run: python -m unittest scripts.ci.test_embark_terrain_pipeline_contract

  author:
    name: PCGEx corridor graph authoring
    needs: contract
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/287-embark-terrain-pipeline' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 120
    env:
      GIT_LFS_SKIP_SMUDGE: '1'

    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-pcgex-author-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact trusted revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: _embark-terrain-worktree
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          clean: true
          persist-credentials: false

      - name: Verify exact SHA and code-only checkout
        shell: pwsh
        working-directory: _embark-terrain-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'PCGEx authoring checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Code-only checkout contract failed.' }
          if (git status --porcelain --untracked-files=all) {
            throw 'PCGEx authoring checkout is dirty before bootstrap.'
          }

      - name: Re-run repository contract
        shell: pwsh
        working-directory: _embark-terrain-worktree
        run: |
          python -m unittest scripts.ci.test_embark_terrain_pipeline_contract
          if ($LASTEXITCODE -ne 0) { throw 'Embark/PCGEx contract failed on the authoring runner.' }

      - name: Build and author deterministic PCGEx graph
        shell: pwsh
        working-directory: _embark-terrain-worktree
        run: |
          ./scripts/ue/Invoke-YacsPassoGiauPcgExGraph.ps1 -ExpectedBranch 'HEAD' -ExpectedHead '${{ github.sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/M3/PCGExCorridor'
          if ($LASTEXITCODE -ne 0) { throw 'PCGEx corridor graph proof failed.' }

      - name: Upload PCGEx authoring evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: passo-giau-m3-pcgex-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _embark-terrain-worktree/Saved/RuntimeProof/CI/M3/PCGExCorridor/**
            _embark-terrain-worktree/Content/WorldGen/PCGEx/PCG_PassoGiau_SP638_Corridor.uasset
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worktree = Join-Path $env:GITHUB_WORKSPACE '_embark-terrain-worktree'
          if (-not (Test-Path -LiteralPath (Join-Path $worktree '.git'))) {
            exit 0
          }
          $pcgex = Join-Path $worktree 'Plugins/PCGExtendedToolkit'
          if (Test-Path -LiteralPath $pcgex) {
            Remove-Item -LiteralPath $pcgex -Recurse -Force
          }
          git -C $worktree reset --hard
          git -C $worktree clean -ffd
          if (git -C $worktree status --porcelain --untracked-files=all) {
            throw 'PCGEx authoring worktree has non-ignored mutations after cleanup.'
          }

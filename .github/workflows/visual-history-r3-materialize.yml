name: Materialize Visual History R3 triptychs

on:
  push:
    branches:
      - docs/visual-history-r3-417
    paths:
      - '.github/workflows/visual-history-r3-materialize.yml'
      - 'scripts/ci/materialize_visual_history_r3.py'

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Build durable R3 triptychs from accepted CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          YACS_REPO: ${{ github.repository }}
        run: python scripts/ci/materialize_visual_history_r3.py

      - name: Commit generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/visual-history/stage-3g/R3-valley-high-alpine
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No Visual History changes to commit."
            exit 0
          fi
          git commit -m 'docs(visual-history): persist R3 accepted triptychs'
          git push origin HEAD:docs/visual-history-r3-417

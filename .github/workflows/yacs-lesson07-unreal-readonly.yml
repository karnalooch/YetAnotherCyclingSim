name: YACS Lesson07 native UE readback (non-mutating)

on:
  push:
    branches: [codex/365-world-graph]
    paths:
      - .github/workflows/yacs-lesson07-unreal-readonly.yml

permissions:
  contents: read

concurrency:
  group: yacs-lesson07-native-ue-readonly
  cancel-in-progress: false

jobs:
  ue-readback:
    name: Load saved L07 map and inspect geometry, never save
    if: >-
      github.repository == 'karnalooch/YetAnotherCyclingSim' &&
      github.ref == 'refs/heads/codex/365-world-graph' &&
      github.actor == github.repository_owner
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 16
    defaults:
      run:
        shell: pwsh
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Refuse a busy or low-space host
        run: |
          $ErrorActionPreference = 'Stop'
          $free = ([IO.DriveInfo]::new('D:\')).AvailableFreeSpace
          Write-Host ("D: free = {0:N2} GiB" -f ($free/1GB))
          if ($free -lt 30GB) { throw 'Need at least 30 GiB for read-only map load.' }
          $busy = @(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,hython,houdini,hbatch -ErrorAction SilentlyContinue)
          if ($busy.Count -gt 0) {
            $busy | Select-Object ProcessName,Id | Format-Table
            throw 'Native authoring process is active; refuse concurrent readback.'
          }
          if (-not (Test-Path -LiteralPath 'D:\yacs\project\YetAnotherCyclingSim.uproject' -PathType Leaf)) {
            throw 'Canonical project file is absent.'
          }
          if (-not (Test-Path -LiteralPath 'D:\yacs\project\Content\Generated\YACS\Lesson07_Unified\L_SaCalobra_Lesson07.umap' -PathType Leaf)) {
            throw 'Saved Lesson 07 map is absent.'
          }
      - name: Checkout only reviewed exact-SHA Python reader, no LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _l07_native_reader
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          sparse-checkout: |
            scripts/ue/readback_lesson07_geometry.py
          sparse-checkout-cone-mode: false
      - name: Execute native Unreal map inspection, no bake or save
        run: |
          $ErrorActionPreference = 'Stop'
          $ue = 'D:\yacs\engine\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project = 'D:\yacs\project\YetAnotherCyclingSim.uproject'
          $map = 'D:\yacs\project\Content\Generated\YACS\Lesson07_Unified\L_SaCalobra_Lesson07.umap'
          $script = Join-Path $env:GITHUB_WORKSPACE '_l07_native_reader\scripts\ue\readback_lesson07_geometry.py'
          $log = Join-Path $env:RUNNER_TEMP 'l07-native-editor.log'
          $stdout = Join-Path $env:RUNNER_TEMP 'l07-native-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'l07-native-stderr.log'
          $env:YACS_LESSON07_READBACK_PATH = Join-Path $env:RUNNER_TEMP 'l07-native-geometry.json'
          if (-not (Test-Path -LiteralPath $ue -PathType Leaf) -or
              -not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw 'UnrealEditor-Cmd or pinned proof script is missing.'
          }
          if (([IO.DriveInfo]::new('D:\')).AvailableFreeSpace -lt 30GB) {
            throw 'Disk reserve changed after checkout. Readback prohibited.'
          }
          if (@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,hython,houdini -ErrorAction SilentlyContinue).Count -gt 0) {
            throw 'Another editor/Houdini process started after preflight.'
          }
          $before = (Get-FileHash -LiteralPath $map -Algorithm SHA256).Hash
          $argString = '"' + $project + '" -NullRHI -Unattended -NoSplash -NoSound -NoLiveCoding -NoShaderCompile -ExecutePythonScript="' + $script + '" -AbsLog="' + $log + '"'
          Write-Host 'Opening existing level via editor Python in a new NullRHI process (no map saves).'
          $proc = Start-Process -FilePath $ue -ArgumentList $argString -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $completed = $proc.WaitForExit(660000)
          if (-not $completed) {
            $proc.Kill()
            $proc.WaitForExit()
          }
          $after = (Get-FileHash -LiteralPath $map -Algorithm SHA256).Hash
          if ($after -ne $before) { throw 'Canonical Lesson 07 map changed during readback!' }
          if (-not $completed) { throw 'Unreal native readback exceeded 11 minutes.' }
          if ($proc.ExitCode -ne 0) { throw "Unreal exited $($proc.ExitCode). No acceptance." }
          if (-not (Test-Path -LiteralPath $env:YACS_LESSON07_READBACK_PATH -PathType Leaf)) {
            throw 'Native UE did not produce geometry readback.'
          }
          $proof = Get-Content -LiteralPath $env:YACS_LESSON07_READBACK_PATH -Raw | ConvertFrom-Json
          Write-Host ("Native UE status: {0}" -f $proof.status)
          Write-Host ("Landscape actors: {0}; components: {1}" -f $proof.total_landscape_actors, $proof.total_components)
          Write-Host ("Actual component fields read: {0}" -f $proof.native_component_properties_complete)
          if ($proof.total_landscape_actors -ne 4 -or $proof.total_components -ne 4096) {
            throw 'Native structural inventory differs from expected L07; scene not accepted.'
          }
          Write-Host 'STRUCTURE_READBACK_ONLY: height source, visibility material, UE collisions and tile seams still require proof.'
      - name: Preserve bounded native diagnostics on success or failure
        if: ${{ always() }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tail = Join-Path $env:RUNNER_TEMP 'l07-native-log-tail.txt'
          $log = Join-Path $env:RUNNER_TEMP 'l07-native-editor.log'
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log -Tail 250 -ErrorAction SilentlyContinue |
              Set-Content -LiteralPath $tail -Encoding utf8
          }
      - name: Publish proof without binary assets
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: l07-native-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/l07-native-geometry.json
            ${{ runner.temp }}/l07-native-log-tail.txt
            ${{ runner.temp }}/l07-native-stderr.log
          if-no-files-found: warn
          retention-days: 7

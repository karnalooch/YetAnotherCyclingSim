name: Finalize Visual History R3 merged AFTER

on:
  push:
    branches:
      - docs/visual-history-r3-merged-after
    paths:
      - '.github/workflows/visual-history-r3-finalize-after.yml'
      - 'scripts/ci/finalize_visual_history_r3_after.py'

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact docs revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Build final BEFORE NOW AFTER evidence
        env:
          GH_TOKEN: ${{ github.token }}
          YACS_REPO: ${{ github.repository }}
        run: python scripts/ci/finalize_visual_history_r3_after.py

      - name: Commit final merged-main evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/visual-history/stage-3g/R3-valley-high-alpine
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No final Visual History changes."
            exit 0
          fi
          git commit -m 'docs(visual-history): persist merged R3 AFTER proof'
          git push origin HEAD:docs/visual-history-r3-merged-after

name: Finalize Visual History R3 merged AFTER

on:
  push:
    branches:
      - docs/visual-history-r3-merged-after
    paths:
      - '.github/workflows/visual-history-r3-finalize-after.yml'
      - 'scripts/ci/finalize_visual_history_r3_after.py'

permissions:
  actions: read
  contents: write

jobs:
  finalize:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact docs revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Download pinned source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            "10925330926:before.zip" \
            "10926354963:now.zip" \
            "10927694053:after.zip"
          do
            artifact_id="${spec%%:*}"
            filename="${spec#*:}"
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/karnalooch/YetAnotherCyclingSim/actions/artifacts/${artifact_id}/zip" \
              --output "${RUNNER_TEMP}/${filename}"
            unzip -t "${RUNNER_TEMP}/${filename}" >/dev/null
          done

      - name: Build final BEFORE NOW AFTER evidence
        env:
          GH_TOKEN: ${{ github.token }}
          YACS_REPO: ${{ github.repository }}
          YACS_ARTIFACT_10925330926: ${{ runner.temp }}/before.zip
          YACS_ARTIFACT_10926354963: ${{ runner.temp }}/now.zip
          YACS_ARTIFACT_10927694053: ${{ runner.temp }}/after.zip
        run: python scripts/ci/finalize_visual_history_r3_after.py

      - name: Commit final merged-main evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/visual-history/stage-3g/R3-valley-high-alpine
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No final Visual History changes."
            exit 0
          fi
          git commit -m 'docs(visual-history): persist merged R3 AFTER proof'
          git push origin HEAD:docs/visual-history-r3-merged-after

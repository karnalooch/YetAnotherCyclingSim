name: Visual History R3 bootstrap triptychs

on:
  push:
    branches:
      - docs/visual-history-r3-417
    paths:
      - '.github/workflows/visual-history-r3-bootstrap.yml'

permissions:
  contents: write
  actions: read

jobs:
  persist-triptychs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact docs revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download canonical R2 and R3 proof artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/vh/r2 /tmp/vh/r3
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/vh/r2.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10925330926/zip"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o /tmp/vh/r3.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10926354963/zip"
          python - <<'PY'
          import zipfile
          for src, dst in [("/tmp/vh/r2.zip","/tmp/vh/r2"),("/tmp/vh/r3.zip","/tmp/vh/r3")]:
              with zipfile.ZipFile(src) as z:
                  z.extractall(dst)
          PY

      - name: Install image composer
        run: python -m pip install --disable-pip-version-check pillow

      - name: Compose fail-closed Visual History triptychs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import hashlib, json

          root = Path("docs/visual-history/stage-3g/R3-valley-high-alpine")
          manifest_path = root / "manifest.json"
          hashes_path = root / "capture-hashes.json"
          summary_path = root / "summary.md"
          captures_dir = root / "captures"
          captures_dir.mkdir(parents=True, exist_ok=True)

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          capture_hashes = json.loads(hashes_path.read_text(encoding="utf-8"))
          if manifest.get("visual_history_id") != "VH-3G-R3-001":
              raise SystemExit("Unexpected Visual History ID")
          if manifest["git"]["source_commit_sha"] != "58c89674656ddec1bce9473547d366f6798dcfb5":
              raise SystemExit("Unexpected R3 source SHA")
          if manifest["ci"]["workflow_run_id"] != 36305204327:
              raise SystemExit("Unexpected R3 workflow run")

          r2 = Path("/tmp/vh/r2/FinalProof/Visual")
          r3 = Path("/tmp/vh/r3/FinalProof/Visual")
          specs = [
              ("01-valley-1200m","01_valley_1200m_triptych.jpg","Valley",1200,
               r2/"01_meadow_valley_1200m_AFTER.png",r3/"01_meadow_valley_1200m_AFTER.png"),
              ("02-forest-4900m","02_forest_4900m_triptych.jpg","Forest",4900,
               r2/"02_forest_sector_4900m_AFTER.png",r3/"02_forest_sector_4900m_AFTER.png"),
              ("03-high-alpine-8000m","03_high_alpine_8000m_triptych.jpg","High Alpine",8000,
               r2/"03_high_valley_mountains_8000m_AFTER.png",r3/"03_high_valley_mountains_8000m_AFTER.png"),
          ]
          by_id = {c["capture_id"]: c for c in manifest["captures"]}
          hash_by_id = {c["capture_id"]: c for c in capture_hashes["captures"]}

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          for cid, _, _, _, before, now in specs:
              c = by_id[cid]
              actual_before, actual_now = sha256(before), sha256(now)
              if actual_before != c["before"]["sha256"]:
                  raise SystemExit(f"{cid}: R2 source hash mismatch")
              if actual_now != c["now"]["sha256"]:
                  raise SystemExit(f"{cid}: R3 source hash mismatch")

          font_regular = Path("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf")
          font_bold = Path("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf")
          if not font_regular.is_file() or not font_bold.is_file():
              raise SystemExit("DejaVu fonts unavailable on runner")
          def font(size, bold=False):
              return ImageFont.truetype(str(font_bold if bold else font_regular), size)

          pw, ih, hh, gh = 640, 360, 144, 72
          W, H = pw*3, gh+ih+hh
          BG=(17,20,24); HEADER=(11,13,16); HUD=(18,21,26); BORDER=(72,78,88)
          TXT=(240,242,245); MUTED=(172,178,188); GOOD=(137,223,157); PENDING=(241,196,103)

          def cover(path):
              im=Image.open(path).convert("RGB")
              s=max(pw/im.width, ih/im.height)
              im=im.resize((round(im.width*s),round(im.height*s)),Image.Resampling.LANCZOS)
              left=(im.width-pw)//2; top=(im.height-ih)//2
              return im.crop((left,top,left+pw,top+ih))

          results = {}
          for cid, filename, label, distance, before_path, now_path in specs:
              canvas=Image.new("RGB",(W,H),BG); d=ImageDraw.Draw(canvas)
              d.rectangle((0,0,W,gh),fill=HEADER)
              d.text((18,11),"YACS VISUAL HISTORY",font=font(23,True),fill=TXT)
              d.text((18,40),"VH-3G-R3-001 • Stage 3G / R3 • Valley + High-Alpine PCG",font=font(14),fill=MUTED)
              d.text((W-18,22),f"{label.upper()} • {distance} m",font=font(17,True),fill=TXT,anchor="ra")

              pending_img=Image.new("RGB",(pw,ih),(25,29,35))
              pd=ImageDraw.Draw(pending_img)
              pd.text((pw//2,ih//2-25),"AFTER",font=font(30,True),fill=TXT,anchor="mm")
              pd.text((pw//2,ih//2+14),"PENDING",font=font(23,True),fill=PENDING,anchor="mm")
              pd.text((pw//2,ih//2+48),"Awaiting merged-main proof",font=font(15),fill=MUTED,anchor="mm")
              panels=[cover(before_path),cover(now_path),pending_img]

              for i,im in enumerate(panels):
                  x=i*pw
                  canvas.paste(im,(x,gh))
                  d.rectangle((x,gh+ih,x+pw-1,H-1),fill=HUD)
                  if i:
                      d.line((x,gh,x,H),fill=BORDER,width=2)

              lines=[
                [("BEFORE • VISUAL_ACCEPTED",True,GOOD),("R2 merged • main • fd77094",False,TXT),
                 ("Stage 3G/R2 • CI #398 / 36299298530",False,MUTED),(f"{label} • {distance} m • 1920×1080",False,MUTED),
                 ("Automation PASS • Fresh Load PASS",False,MUTED),("Map Check 0/0 • Visual Capture PASS",False,MUTED)],
                [("NOW • VISUAL_ACCEPTED",True,GOOD),("feat/stage3g-pcg-biomes-r3 • 58c89674",False,TXT),
                 ("Stage 3G/R3 • CI #417 / 36305204327",False,MUTED),(f"{label} • {distance} m • 1920×1080",False,MUTED),
                 ("Automation PASS • Fresh Load PASS",False,MUTED),("Map Check 0/0 • Visual Capture PASS",False,MUTED)],
                [("AFTER • PENDING",True,PENDING),("main • commit pending",False,TXT),
                 ("Stage 3G/R3 • merged-main proof pending",False,MUTED),(f"{label} • {distance} m • 1920×1080",False,MUTED),
                 ("Automation pending • Fresh Load pending",False,MUTED),("Map Check pending • Visual Capture pending",False,MUTED)]
              ]
              for i, panel_lines in enumerate(lines):
                  y=gh+ih+10
                  for j,(text,bold,color) in enumerate(panel_lines):
                      d.text((i*pw+12,y),text,font=font(16 if j==0 else 11,bold),fill=color)
                      y += 21

              target=captures_dir/filename
              canvas.save(target,"JPEG",quality=72,optimize=True,subsampling=2)
              digest=sha256(target)
              results[cid]=(filename,digest,target.stat().st_size)

              c=by_id[cid]
              c["triptych_image"]=f"captures/{filename}"
              c["triptych_sha256"]=digest
              c["triptych_storage_status"]="DURABLY_STORED"
              c["triptych_resolution"]="1920x576"

              hc=hash_by_id[cid]
              hc["triptych_sha256"]=digest
              hc["triptych_image"]=f"captures/{filename}"

          capture_hashes["note"]="BEFORE is the R2 accepted baseline. NOW is the R3 visual-accepted pre-merge revision. Repository-retained triptychs embed both; AFTER remains pending until merged-main proof."
          manifest.setdefault("evidence_storage",{})
          manifest["evidence_storage"].update({
              "triptych_mode":"REPOSITORY_RETAINED_JPEG",
              "triptych_status":"DURABLY_STORED",
              "source_before_artifact":"stage3g-full-validation-36299298530-1",
              "source_now_artifact":"stage3g-full-validation-36305204327-1",
              "after_status":"PENDING_MERGED_MAIN_PROOF"
          })

          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          hashes_path.write_text(json.dumps(capture_hashes,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")

          summary=summary_path.read_text(encoding="utf-8")
          marker="## Durable triptych evidence"
          if marker in summary:
              summary=summary.split(marker,1)[0].rstrip()+"\n"
          summary += "\n## Durable triptych evidence\n\n"
          summary += "The R3 pre-merge Visual History triptychs are retained in the repository under `captures/`. "
          summary += "They were deterministically materialized from the canonical R2 CI #398 and R3 CI #417 proof artifacts after verifying the source PNG SHA-256 values recorded in the manifest.\n\n"
          for cid, filename, _, _, _, _ in specs:
              _, digest, size=results[cid]
              summary += f"- `captures/{filename}` — SHA-256 `{digest}` — {size} bytes\n"
          summary += "\n`AFTER` intentionally remains **PENDING** until #192 is merged and a merged-main exact-SHA proof/capture exists.\n"
          summary_path.write_text(summary,encoding="utf-8")

          print(json.dumps(results,indent=2))
          PY

      - name: Commit durable evidence and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/visual-history-r3-bootstrap.yml
          git add docs/visual-history/stage-3g/R3-valley-high-alpine/captures \
                  docs/visual-history/stage-3g/R3-valley-high-alpine/manifest.json \
                  docs/visual-history/stage-3g/R3-valley-high-alpine/capture-hashes.json \
                  docs/visual-history/stage-3g/R3-valley-high-alpine/summary.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "docs(visual-history): persist R3 triptych evidence"
          git push origin HEAD:docs/visual-history-r3-417

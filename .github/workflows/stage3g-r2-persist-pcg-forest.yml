name: Stage 3G R2 persist PCG forest

on:
  push:
    branches:
      - feat/stage3g-pcg-forest-r2
    paths:
      - '.github/workflows/stage3g-r2-persist-pcg-forest.yml'
      - 'scripts/ue/stage3g_author_pcg_forest.py'
      - 'scripts/ci/test_stage3g_r2_pcg_forest_contract.py'

permissions:
  contents: write

concurrency:
  group: stage3g-r2-persist-pcg-forest-${{ github.repository }}
  cancel-in-progress: false

jobs:
  persist-pcg-forest:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/stage3g-pcg-forest-r2' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 90
    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact trusted recovery revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: true

      - name: Verify checkout, LFS and persisted inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'PCG forest recovery checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }
          $required = @(
            'Content/Prototype/Environment/Stage3G/Imported/Meshes/SM_Stage3G_FirSaplingMedium.uasset',
            'Content/YACS/WorldGen/PCG/PCG_RouteExclusion.uasset'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Persisted Stage 3G R2 input is missing: $path"
            }
          }
          if (git status --porcelain) {
            throw 'PCG forest recovery checkout is dirty.'
          }
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Validate PCG forest authoring contract
        shell: pwsh
        run: |
          python -m unittest scripts.ci.test_stage3g_r2_pcg_forest_contract
          if ($LASTEXITCODE -ne 0) { throw 'PCG forest authoring contract failed.' }

      - name: Author and persist PCG forest graph
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceHead = (git rev-parse HEAD).Trim()
          ./scripts/ue/Invoke-YacsStage3GR2PCGForest.ps1 -ExpectedBranch HEAD -ExpectedHead $sourceHead -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR2/ForestRecovery'
          if ($LASTEXITCODE -ne 0) { throw 'PCG forest authoring failed.' }

          git add -- 'Content/YACS/WorldGen/PCG/PCG_Forest.uasset'
          $staged = @(git diff --cached --name-only)
          if (($staged.Count -ne 1) -or ($staged[0] -ne 'Content/YACS/WorldGen/PCG/PCG_Forest.uasset')) {
            throw ("Unexpected PCG forest staged paths: {0}" -f ($staged -join ', '))
          }

          git commit -m 'feat(stage3g): persist deterministic PCG forest graph'
          if ($LASTEXITCODE -ne 0) { throw 'PCG forest persistence commit failed.' }

          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin feat/stage3g-pcg-forest-r2
            if ($LASTEXITCODE -ne 0) { throw 'PCG forest persistence fetch failed.' }
            git rebase origin/feat/stage3g-pcg-forest-r2
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw 'PCG forest persistence rebase failed.'
            }
            git push origin HEAD:feat/stage3g-pcg-forest-r2
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
            if ($attempt -lt 3) {
              Write-Host "PCG forest push raced with branch update; retrying."
            }
          }
          if (-not $pushed) { throw 'PCG forest persistence push failed after 3 attempts.' }

          $pointer = (git show 'HEAD:Content/YACS/WorldGen/PCG/PCG_Forest.uasset') -join "`n"
          if ($pointer -notmatch '^version https://git-lfs.github.com/spec/v1') {
            throw 'Persisted PCG_Forest is not represented by Git LFS.'
          }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'Post-persist git lfs fsck failed.' }
          if (git status --porcelain) {
            throw 'PCG forest recovery finished with a dirty workspace.'
          }

          @(
            "source_sha=$sourceHead",
            "persisted_sha=$((git rev-parse HEAD).Trim())"
          ) | Set-Content -LiteralPath 'Saved/RuntimeProof/CI/Stage3GR2/ForestRecovery/persisted_head.txt' -Encoding UTF8

      - name: Upload PCG forest recovery proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-r2-pcg-forest-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GR2/ForestRecovery/**/*.json
            Saved/RuntimeProof/CI/Stage3GR2/ForestRecovery/**/*.txt
            Saved/RuntimeProof/CI/Stage3GR2/ForestRecovery/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard
          git clean -ffdx
          if (git status --porcelain) {
            throw 'PCG forest recovery workspace is dirty after cleanup.'
          }
          Write-Host 'PCG forest recovery cleanup: PASS'

name: OpenSSF Scorecard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scorecard.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/reusable-python.yml'
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: karnalooch/engineering-platform/.github/workflows/reusable-scorecard.yml@d9bc67e2b17436e9df1319a6345d0ec388f407fb

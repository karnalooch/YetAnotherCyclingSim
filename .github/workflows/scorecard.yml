name: OpenSSF Scorecard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scorecard.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/reusable-*.yml'
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Supply-chain posture audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: results.sarif
          category: openssf-scorecard

      - name: Preserve Scorecard SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssf-scorecard-sarif
          path: results.sarif
          retention-days: 14
          if-no-files-found: error

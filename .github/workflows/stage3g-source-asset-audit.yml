name: Stage 3G source asset audit
run-name: Source asset audit ${{ inputs.gumball_request_id }}

on:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: Exact 40-character PR HEAD SHA to prove
        required: true
        type: string
      gumball_request_id:
        description: Deterministic Gumball proof request id
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: stage3g-source-asset-audit-${{ github.repository }}-${{ inputs.gumball_request_id }}
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 45
    steps:
      - name: Checkout exact trusted revision with LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.exact_sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: false

      - name: Verify exact SHA and full LFS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ inputs.exact_sha }}') {
            throw 'Source-asset audit checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }
          if (git status --porcelain) { throw 'Source-asset audit checkout is dirty before proof.' }

      - name: Validate source-asset audit contract
        shell: pwsh
        run: |
          python -m unittest scripts.ci.test_stage3g_source_asset_audit_contract
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G source-asset audit contract failed.' }

      - name: Run non-mutating Stage 3G source-asset audit
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsStage3GSourceAssetAudit.ps1 -ExpectedBranch HEAD -ExpectedHead '${{ inputs.exact_sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GSourceAssetAudit'
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G source-asset lifecycle audit failed.' }

      - name: Run 1080p60 environment regression after source audit
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsStage3GEnvironmentPerformance.ps1 -ExpectedBranch HEAD -ExpectedHead '${{ inputs.exact_sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GSourceAssetAudit/EnvironmentPerformance' -SkipBuild
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G performance regression after source-asset validation failed.' }

      - name: Upload reusable successful source-asset audit evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-source-asset-audit-${{ inputs.exact_sha }}
          path: |
            Saved/RuntimeProof/CI/Stage3GSourceAssetAudit/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed source-asset audit diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-source-asset-audit-${{ inputs.exact_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GSourceAssetAudit/**
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard
          git clean -ffdx
          if (git status --porcelain) {
            throw 'Source-asset audit runner workspace is dirty after cleanup.'
          }

name: Stage 3G source asset audit

on:
  push:
    branches:
      - audit/stage3g-source-assets
    paths:
      - '.github/workflows/stage3g-source-asset-audit.yml'
      - 'scripts/ue/stage3g_source_asset_audit.py'
      - 'scripts/ue/Invoke-YacsStage3GSourceAssetAudit.ps1'
      - 'scripts/ci/test_stage3g_source_asset_audit_contract.py'
      - 'scripts/ue/stage3g_import_source_assets.py'
      - 'scripts/ue/Invoke-YacsStage3GAuthoring.ps1'
      - 'scripts/ue/Invoke-YacsStage3GBoulderLodAuthor.ps1'
      - 'scripts/ue/stage3g_author_boulder_lods.py'
      - 'Content/Prototype/Environment/Stage3G/Imported/Meshes/SM_Stage3G_Boulder.uasset'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage3g-source-asset-audit-${{ github.repository }}
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 45
    steps:
      - name: Checkout exact trusted revision with LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: false

      - name: Verify exact SHA and full LFS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Source-asset audit checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }
          if (git status --porcelain) { throw 'Source-asset audit checkout is dirty before proof.' }

      - name: Validate source-asset audit contract
        shell: pwsh
        run: |
          python -m unittest scripts.ci.test_stage3g_source_asset_audit_contract
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G source-asset audit contract failed.' }

      - name: Run non-mutating Stage 3G source-asset audit
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsStage3GSourceAssetAudit.ps1 -ExpectedBranch HEAD -ExpectedHead '${{ github.sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GSourceAssetAudit'
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G source-asset lifecycle audit failed.' }

      - name: Run 1080p60 environment regression after source audit
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsStage3GEnvironmentPerformance.ps1 -ExpectedBranch HEAD -ExpectedHead '${{ github.sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GSourceAssetAudit/EnvironmentPerformance' -SkipBuild
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G performance regression after source-asset validation failed.' }

      - name: Upload source-asset audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-source-asset-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GSourceAssetAudit/**
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard
          git clean -ffdx
          if (git status --porcelain) {
            throw 'Source-asset audit runner workspace is dirty after cleanup.'
          }

name: Stage 3G forest target-density authoring

on:
  workflow_dispatch:
  push:
    branches:
      - feat/stage3g-forest-target-density
    paths:
      - 'Source/YetAnotherCyclingSimEditor/Public/PCG/Stage3GForestCandidatesSettings.h'
      - 'Source/YetAnotherCyclingSimEditor/Private/PCG/Stage3GForestCandidatesSettings.cpp'
      - 'Source/YetAnotherCyclingSim/Public/Cycling/Stage3GForestLayout.h'
      - 'Source/YetAnotherCyclingSim/Private/Cycling/Stage3GForestLayout.cpp'
      - 'Source/YetAnotherCyclingSim/Private/Cycling/Stage3PrototypeTerrainActor.cpp'
      - 'Source/YetAnotherCyclingSim/Private/Tests/Stage3GForestLayout.spec.cpp'
      - 'Source/YetAnotherCyclingSim/Private/Tests/Stage3PrototypeTerrain.spec.cpp'
      - 'scripts/ue/stage3g_author_pcg_forest.py'
      - 'scripts/ue/Invoke-YacsStage3GR2PCGForest.ps1'
      - 'scripts/ue/Invoke-YacsStage3GForestTargetAuthor.ps1'
      - 'worldgen/specs/stage3g_alpine_reference.worldspec.yml'

permissions:
  contents: write

concurrency:
  group: stage3g-forest-target-density-author-${{ github.repository }}
  cancel-in-progress: true

jobs:
  author:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/stage3g-forest-target-density' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 90
    steps:
      - name: Bootstrap cleanup helper outside persistent worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          path: _bootstrap-cleanup
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          clean: true
          persist-credentials: false

      - name: Release stale Unreal workspace locks
        shell: pwsh
        run: |
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE '_bootstrap-cleanup/scripts/ci/Release-YacsUnrealWorkspaceLocks.ps1'
          & $bootstrap -Workspace $env:GITHUB_WORKSPACE
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '_bootstrap-cleanup') -Recurse -Force
      - name: Checkout exact trusted revision in isolated author worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _author-worktree
          ref: ${{ github.sha }}
          fetch-depth: 20
          lfs: false
          clean: true
          persist-credentials: true

      - name: Verify exact SHA and full LFS
        shell: pwsh
        working-directory: _author-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Forest target-density checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }

          git lfs fsck
          if ($LASTEXITCODE -ne 0) {
            Write-Warning 'Local LFS cache is incomplete; fetching exact trusted revision explicitly.'
            git lfs fetch origin '${{ github.sha }}'
            if ($LASTEXITCODE -ne 0) { throw 'git lfs fetch for exact trusted revision failed.' }
            git lfs checkout
            if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout after fetch failed.' }
            git lfs fsck
            if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed after exact-revision fetch.' }
          }
          if (git status --porcelain) { throw 'Forest target-density checkout is dirty.' }

      - name: Validate forest target-density contract
        shell: pwsh
        working-directory: _author-worktree
        run: |
          python -m unittest scripts.ci.test_stage3g_r2_pcg_forest_contract scripts.ci.test_stage3g_forest_target_density_contract
          if ($LASTEXITCODE -ne 0) { throw 'Forest target-density contract failed.' }

      - name: Author target-density PCG forest and canonical map
        shell: pwsh
        working-directory: _author-worktree
        run: |
          ./scripts/ue/Invoke-YacsStage3GForestTargetAuthor.ps1 -ExpectedBranch HEAD -ExpectedHead '${{ github.sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/ForestTargetDensity/Author'
          if ($LASTEXITCODE -ne 0) { throw 'Target-density forest/map authoring failed.' }

      - name: Commit only target-density forest assets
        shell: pwsh
        working-directory: _author-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Content/YACS/WorldGen/PCG/PCG_Forest.uasset'
          $map = 'Content/Prototype/Maps/L_CyclingTest.umap'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $asset $map
          $staged = @(git diff --cached --name-only | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $unexpected = @($staged | Where-Object { $_ -ne $asset -and $_ -ne $map })
          if ($unexpected.Count -gt 0 -or $staged.Count -ne 2 -or $staged -notcontains $asset -or $staged -notcontains $map) {
            throw ("Unexpected staged paths: {0}" -f ($staged -join ', '))
          }
          if (git diff --cached --quiet) { throw 'Target-density authoring produced no persisted forest/map changes.' }
          git commit -m 'asset(stage3g): persist target-density forest and map'
          if ($LASTEXITCODE -ne 0) { throw 'Target-density PCG_Forest commit failed.' }

          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin feat/stage3g-forest-target-density
            if ($LASTEXITCODE -ne 0) { throw 'Target-density PCG_Forest fetch failed.' }
            git rebase origin/feat/stage3g-forest-target-density
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw 'Target-density PCG_Forest rebase failed.'
            }
            git push origin HEAD:feat/stage3g-forest-target-density
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
          }
          if (-not $pushed) { throw 'Target-density PCG_Forest push failed after 3 attempts.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'Post-authoring LFS fsck failed.' }

      - name: Upload authoring evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-forest-target-density-author-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _author-worktree/Saved/RuntimeProof/CI/ForestTargetDensity/Author/**
          if-no-files-found: warn
          retention-days: 14

      - name: Clean isolated author worktree
        if: ${{ always() }}
        shell: pwsh
        working-directory: _author-worktree
        run: |
          if (Test-Path -LiteralPath '.git') {
            git reset --hard
            if ($LASTEXITCODE -ne 0) { throw 'Author worktree cleanup git reset failed.' }
            git clean -ffdx -e Saved/Logs/YetAnotherCyclingSim.log
            if ($LASTEXITCODE -ne 0) { throw 'Author worktree cleanup git clean failed.' }
          }
          else {
            Write-Host 'Author worktree cleanup: no checkout worktree to clean.'
          }

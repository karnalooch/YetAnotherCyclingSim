name: Lesson07 bounded material checkpoint retention

# Explicit owner push markers only. These export saved bytes and upload their
# exact Git LFS objects; neither mode starts UE or updates any remote Git ref.
# [l07-export-materials] = eight successful import outputs + approved Macro MI.
# [l07-export-macro] = only the existing hash-pinned Macro MI, never a fallback.
# Full mode remains blocked until reviewed successful producer pins are set in
# export_lesson07_material_checkpoint.py. The connector performs pointer commit
# and normal exact-head CI separately after reviewing the publication receipt.
on:
  push:
    branches: [codex/365-world-graph]
    paths:
      - .github/workflows/lesson07-material-delivery.yml
      - scripts/ci/export_lesson07_material_checkpoint.py
      - scripts/ci/test_export_lesson07_material_checkpoint.py

permissions:
  contents: read

jobs:
  admit:
    name: Validate explicit checkpoint scope and exporter
    if: >-
      github.repository == 'karnalooch/YetAnotherCyclingSim' &&
      github.ref == 'refs/heads/codex/365-world-graph' &&
      github.actor == 'karnalooch' &&
      (contains(github.event.head_commit.message, '[l07-export-materials]') ||
       contains(github.event.head_commit.message, '[l07-export-macro]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:limit=1m
          sparse-checkout: |
            scripts/ci
            .github/workflows
          lfs: false
          persist-credentials: false
      - name: Validate exporter and real local Git LFS staging boundaries
        run: python -B -m unittest scripts.ci.test_export_lesson07_material_checkpoint -v
      - name: Require exactly one explicit mode and populated producer pins
        id: scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mode=$(python -B scripts/ci/export_lesson07_material_checkpoint.py admit --event "$GITHUB_EVENT_PATH" --source-commit "$GITHUB_SHA")
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

  export:
    name: Copy only reviewed canonical material packages
    needs: admit
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 15
    concurrency:
      group: yacs-unreal-ci-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.export.outputs.archive_sha256 }}
      archive_bytes: ${{ steps.export.outputs.archive_bytes }}
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_OPTIONAL_LOCKS: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      DELIVERY_MODE: ${{ needs.admit.outputs.mode }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Isolate job Git configuration without touching canonical Git
        run: |
          $ErrorActionPreference='Stop'
          $config=Join-Path $env:RUNNER_TEMP 'l07-material-export-${{ github.run_id }}-${{ github.run_attempt }}.gitconfig'
          if (Test-Path -LiteralPath $config) { throw 'Export Git configuration already exists.' }
          [IO.File]::WriteAllText($config, "[core]`n  autocrlf = false`n  eol = lf`n  longpaths = true`n")
          "GIT_CONFIG_GLOBAL=$config" >> $env:GITHUB_ENV
          'GIT_CONFIG_NOSYSTEM=1' >> $env:GITHUB_ENV
      - name: Checkout only exact exporter source into a new job directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: l07-export-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          filter: blob:limit=1m
          sparse-checkout: |
            scripts/ci
          lfs: false
          clean: false
          persist-credentials: false
      - name: Export fixed saved package bytes without any Unreal or process calls
        id: export
        working-directory: l07-export-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Exporter checkout differs from exact event SHA.' }
          $python='D:\yacs\tool-cache\material-forge\python\Scripts\python.exe'
          $result=& $python -B scripts/ci/export_lesson07_material_checkpoint.py export --mode $env:DELIVERY_MODE --source-commit $env:GITHUB_SHA --run-token '${{ github.run_id }}-${{ github.run_attempt }}'
          if ($LASTEXITCODE -ne 0) { throw 'Bounded checkpoint export failed; preserve its directory and source bytes.' }
          $receipt=$result | ConvertFrom-Json
          if ($receipt.status -cne 'CHECKPOINT_EXPORT_VERIFIED_BRANCH_PENDING') { throw 'Exporter did not verify immutable output.' }
          Write-Host ($receipt | ConvertTo-Json -Compress)
          "directory=$($receipt.directory)" >> $env:GITHUB_OUTPUT
          "archive_sha256=$($receipt.archive_sha256)" >> $env:GITHUB_OUTPUT
          "archive_bytes=$($receipt.archive_bytes)" >> $env:GITHUB_OUTPUT
          "manifest_sha256=$($receipt.manifest_sha256)" >> $env:GITHUB_OUTPUT
      - name: Retain immutable checkpoint archive and exact identity receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: lesson07-material-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.export.outputs.directory }}/checkpoint.zip
            ${{ steps.export.outputs.directory }}/manifest.json
            ${{ steps.export.outputs.directory }}/export-receipt.json
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          retention-days: 30

  upload_lfs:
    name: Upload explicit LFS objects and independently verify server bytes
    needs: [admit, export]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DELIVERY_MODE: ${{ needs.admit.outputs.mode }}
      EXPORT_ARCHIVE_SHA256: ${{ needs.export.outputs.archive_sha256 }}
      EXPORT_ARCHIVE_BYTES: ${{ needs.export.outputs.archive_bytes }}
      EXPORT_MANIFEST_SHA256: ${{ needs.export.outputs.manifest_sha256 }}
    steps:
      - name: Isolate publication Git settings on the disposable hosted runner
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/l07-lfs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.gitconfig"
          test ! -e "$config"
          printf '[core]\n  autocrlf = false\n  eol = lf\n' > "$config"
          printf 'GIT_CONFIG_GLOBAL=%s\nGIT_CONFIG_NOSYSTEM=1\n' "$config" >> "$GITHUB_ENV"
      - name: Checkout exact source with job-local authentication for LFS only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: l07-lfs-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          filter: blob:limit=1m
          sparse-checkout: |
            scripts/ci
          lfs: false
          clean: false
          persist-credentials: true
      - name: Download only this run's immutable checkpoint artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: lesson07-material-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: l07-download-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload reviewed OIDs, verify fresh server readback and emit pointer text
        id: upload
        working-directory: l07-lfs-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          result=$(python -B scripts/ci/export_lesson07_material_checkpoint.py upload-lfs \
            --mode "$DELIVERY_MODE" --source-commit "$GITHUB_SHA" \
            --run-token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --archive "$GITHUB_WORKSPACE/l07-download-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/checkpoint.zip" \
            --archive-sha256 "$EXPORT_ARCHIVE_SHA256" --archive-bytes "$EXPORT_ARCHIVE_BYTES" \
            --manifest-sha256 "$EXPORT_MANIFEST_SHA256")
          printf '%s\n' "$result"
          directory=$(python -c 'import json,sys; r=json.load(sys.stdin); assert r["status"]=="REMOTE_LFS_BYTES_VERIFIED_BRANCH_NOT_UPDATED"; print(r["directory"])' <<< "$result")
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
      - name: Retain verified server readback and connector-ready text pointers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: lesson07-material-lfs-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.upload.outputs.directory }}/server-lfs-readback.json
            ${{ steps.upload.outputs.directory }}/git-lfs-pointers.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30

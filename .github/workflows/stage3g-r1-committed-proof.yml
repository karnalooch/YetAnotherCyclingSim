name: Stage 3G R1 committed asset proof

on:
  push:
    branches:
      - feat/stage3g-real-assets-r1
    paths:
      - 'Content/Prototype/Environment/Stage3G/**'
      - 'Content/Prototype/Maps/L_CyclingTest.umap'

permissions:
  contents: read

concurrency:
  group: stage3g-r1-committed-proof-${{ github.repository }}
  cancel-in-progress: false

jobs:
  exact-proof:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/stage3g-real-assets-r1' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 120
    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact committed asset revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: false

      - name: Verify exact SHA and LFS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Committed Stage 3G R1 proof checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }
          if (git status --porcelain) {
            throw 'Committed Stage 3G R1 proof checkout is dirty.'
          }

      - name: Run exact-SHA Stage 3G final proof
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsStage3GProof.ps1 `
            -ExpectedBranch HEAD `
            -ExpectedHead '${{ github.sha }}' `
            -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR1Committed'

      - name: Upload committed proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-r1-committed-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GR1Committed/**/*.json
            Saved/RuntimeProof/CI/Stage3GR1Committed/**/*.txt
            Saved/RuntimeProof/CI/Stage3GR1Committed/**/*.log
            Saved/RuntimeProof/CI/Stage3GR1Committed/**/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard
          git clean -ffdx
          if (git status --porcelain) {
            throw 'Stage 3G R1 committed proof workspace is still dirty.'
          }
          Write-Host 'Stage 3G R1 committed proof cleanup: PASS'

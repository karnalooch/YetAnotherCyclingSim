name: GitHub Project status

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, converted_to_draft, ready_for_review, closed]

concurrency:
  group: project-status-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-project-status:
    name: Sync Project status
    if: github.event_name == 'issues' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Detect Projects token
        id: projects-token
        shell: bash
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PROJECTS_TOKEN}" ]]; then
            echo "::warning::PROJECTS_TOKEN is not configured; Project automation is not active yet."
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout repository
        if: steps.projects-token.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.projects-token.outputs.enabled == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Synchronize Issue and PR lifecycle
        if: steps.projects-token.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_TITLE: YACS — MVP
        run: python scripts/ci/project_automation.py sync-event

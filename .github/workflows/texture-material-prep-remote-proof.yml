name: Texture Material Prep remote proof

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/texture-material-prep-remote-proof.yml"
      - "Plugins/YacsTexturePrep/**"
      - "scripts/assets/texture_material_prep*.py"
      - "tools/ue-mcp/guards/YacsTextureGuard.js"
      - "tools/ue-mcp/texture-proof-profile.yml"

permissions:
  contents: read

env:
  BACKUP_TAG: checkpoint-texture-prep-2026-10-05
  ARCHIVE_SHA256: 7c3392ab7aae44388fc52978489fdb85d329a276c7fcd68723d841d7bfdd08d8
  MANIFEST_SHA256: 03ab3b2b3e0df81694918693c432b17744cdd36e220720a5b7ac5e9b253a18c3
  REMOTE_RECEIPT_SHA256: 4443f39c5e7ea7cc68df26c04e36bcc78dd9eb40d6fe9411ddd45b2ffe344b46
  ROCK026_JOB: 7EE0347149883740027D7DB63B63BD90
  ROCK026_SOURCE_ID: 31edfe9c1bbb4394ad28b12447a76ed5

jobs:
  backup-audit:
    name: Authenticated backup and baseline audit
    if: >-
      github.event.pull_request.number == 383 &&
      github.head_ref == 'feat/382-texture-material-prep-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BACKUP_ROOT: ${{ runner.temp }}/texture-prep-backup
      RESTORE_ROOT: ${{ runner.temp }}/texture-prep-restored
      BASELINE_ROOT: ${{ runner.temp }}/rock026-baseline

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Download authenticated draft backup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BACKUP_ROOT"
          gh release download "$BACKUP_TAG" --repo "$GITHUB_REPOSITORY" --dir "$BACKUP_ROOT"
          test -f "$BACKUP_ROOT/texture-prep-checkpoint.zip"
          test -f "$BACKUP_ROOT/restore-manifest.json"
          test -f "$BACKUP_ROOT/remote-backup-receipt.json"

      - name: Verify pinned release hashes and safe archive inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "$ARCHIVE_SHA256  $BACKUP_ROOT/texture-prep-checkpoint.zip" | sha256sum -c -
          echo "$MANIFEST_SHA256  $BACKUP_ROOT/restore-manifest.json" | sha256sum -c -
          echo "$REMOTE_RECEIPT_SHA256  $BACKUP_ROOT/remote-backup-receipt.json" | sha256sum -c -
          python - "$BACKUP_ROOT/texture-prep-checkpoint.zip" "$BACKUP_ROOT/archive-audit.json" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive_path, report_path = sys.argv[1:]
          with ZipFile(archive_path) as archive:
              names = [item.filename for item in archive.infolist() if not item.is_dir()]
          seen = set()
          for name in names:
              path = PurePosixPath(name)
              if (
                  not name
                  or path.is_absolute()
                  or ".." in path.parts
                  or "\\" in name
                  or ":" in name
              ):
                  raise SystemExit(f"unsafe archive member: {name!r}")
              if name in seen:
                  raise SystemExit(f"duplicate archive member: {name!r}")
              seen.add(name)
          if len(names) != 76:
              raise SystemExit(f"archive member count {len(names)} != 76")
          with open(report_path, "w", encoding="utf-8") as stream:
              json.dump(
                  {"status": "PASS", "member_count": len(names), "duplicates": 0, "unsafe_members": 0},
                  stream,
                  indent=2,
              )
          PY

      - name: Rehearse restore into an empty recovery directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RESTORE_ROOT"
          python scripts/assets/restore_workspace_data.py --manifest "$BACKUP_ROOT/restore-manifest.json" --bundle "$BACKUP_ROOT" --destination "$RESTORE_ROOT" --apply | tee "$BACKUP_ROOT/restore-rehearsal.json"

      - name: Isolate archived Rock026 evidence
        shell: bash
        run: |
          set -euo pipefail
          python - "$RESTORE_ROOT" "$BASELINE_ROOT" "$ROCK026_JOB" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          job = sys.argv[3]
          receipts = []
          for path in root.rglob("ue-receipt.json"):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if payload.get("job_id", "").upper() == job.upper():
                  receipts.append(path)
          if len(receipts) != 1:
              raise SystemExit(f"expected one Rock026 receipt, found {len(receipts)}")
          shutil.copytree(receipts[0].parent, destination)
          required = [
              "ue-receipt.json",
              "Source.png",
              "BaseColor.png",
              "Height.png",
              "Normal.png",
              "Roughness.png",
              "MacroMask.png",
          ]
          missing = [name for name in required if not (destination / name).is_file()]
          if missing:
              raise SystemExit(f"Rock026 baseline missing: {missing}")
          (destination / "remote-baseline-location.json").write_text(
              json.dumps(
                  {
                      "status": "PASS",
                      "job_id": job,
                      "archived_receipt": str(receipts[0].relative_to(root)),
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Recompute Rock026 metrics and diagnostic tiling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 Pillow==12.3.0
          validation_dir="$(python scripts/assets/texture_material_prep_bundle.py "$BASELINE_ROOT" | tail -n 1)"
          test -f "$validation_dir/bundle-validation.json"
          rm -rf "$BACKUP_ROOT/baseline-validation"
          cp -a "$validation_dir" "$BACKUP_ROOT/baseline-validation"

      - name: Compare fresh diagnostics with the recorded baseline
        shell: bash
        run: |
          set -euo pipefail
          python - "$BACKUP_ROOT/baseline-validation/bundle-validation.json" "$BACKUP_ROOT/baseline-assertions.json" <<'PY'
          import json
          import math
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          roles = {"BaseColor", "Height", "Normal", "Roughness", "MacroMask"}
          if set(report["outputs"]) != roles:
              raise SystemExit("five-map role set changed")
          base = report["outputs"]["BaseColor"]["metrics"]
          normal = report["outputs"]["Normal"]["normal"]
          scale = report["scale"]
          delight = report["delight_comparison"]

          expected = {
              "seam_x_mean": 0.0367946314,
              "seam_y_mean": 0.0367924951,
              "ratio_x": 0.518,
              "ratio_y": 0.463,
              "luminance_relative_drift": 0.00015243859,
              "normal_unit_length_error_max": 0.0090684,
              "normal_wrap_x_max_deg": 9.0446,
              "normal_wrap_y_max_deg": 5.9855,
          }
          actual = {
              "seam_x_mean": base["axes"]["x"]["boundary"]["mean"],
              "seam_y_mean": base["axes"]["y"]["boundary"]["mean"],
              "ratio_x": base["axes"]["x"]["boundary_to_interior_ratio"],
              "ratio_y": base["axes"]["y"]["boundary_to_interior_ratio"],
              "luminance_relative_drift": delight["mean_relative_drift"],
              "normal_unit_length_error_max": normal["unit_length_error_max"],
              "normal_wrap_x_max_deg": normal["wrap_angles"]["x"]["max_deg"],
              "normal_wrap_y_max_deg": normal["wrap_angles"]["y"]["max_deg"],
          }
          tolerances = {
              "seam_x_mean": 5e-7,
              "seam_y_mean": 5e-7,
              "ratio_x": 0.002,
              "ratio_y": 0.002,
              "luminance_relative_drift": 5e-8,
              "normal_unit_length_error_max": 5e-6,
              "normal_wrap_x_max_deg": 0.01,
              "normal_wrap_y_max_deg": 0.01,
          }
          for name, expected_value in expected.items():
              if not math.isclose(actual[name], expected_value, rel_tol=0.0, abs_tol=tolerances[name]):
                  raise SystemExit(
                      f"{name} changed: actual={actual[name]!r} expected={expected_value!r}"
                  )
          if base["screening"]["status"] != "review_required":
              raise SystemExit("Rock026 seam screen unexpectedly changed")
          required_reasons = {
              "x: boundary contrast",
              "x: gradient mismatch",
              "y: boundary contrast",
              "y: gradient mismatch",
          }
          if not required_reasons.issubset(set(base["screening"]["reasons"])):
              raise SystemExit(f"expected seam flags missing: {base['screening']['reasons']}")
          if delight["clipping_fraction_increase"] != 0 or delight["flags"]:
              raise SystemExit("Rock026 luminance/clipping baseline changed")
          if normal["negative_z_fraction"] != 0:
              raise SystemExit("Rock026 normal contains negative Z")
          if (
              scale["status"] != "proposed"
              or scale["world_size_m"] != [2.0, 2.0]
              or scale["pixels_per_meter"] != [256.0, 256.0]
          ):
              raise SystemExit(f"proposed scale metadata changed: {scale}")
          validation_root = Path(sys.argv[1]).parent
          for role in roles:
              for count in (2, 4):
                  if not (validation_root / role / f"tiling-{count}x{count}.png").is_file():
                      raise SystemExit(f"missing {role} {count}x{count} tiling preview")
          Path(sys.argv[2]).write_text(
              json.dumps(
                  {
                      "status": "PASS_BASELINE_REPRODUCED_REVIEW_REQUIRED",
                      "job_id": report["job_id"],
                      "five_maps": sorted(roles),
                      "actual": actual,
                      "seam_screen": base["screening"],
                      "scale": scale,
                      "luminance": delight,
                      "normal": normal,
                      "material_admission": "review_required",
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Upload backup and offline baseline evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: texture-prep-backup-audit-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.BACKUP_ROOT }}/archive-audit.json
            ${{ env.BACKUP_ROOT }}/restore-rehearsal.json
            ${{ env.BACKUP_ROOT }}/baseline-assertions.json
            ${{ env.BACKUP_ROOT }}/baseline-validation/**/*.json
            ${{ env.BACKUP_ROOT }}/baseline-validation/**/*.png
            ${{ env.BASELINE_ROOT }}/remote-baseline-location.json
          if-no-files-found: warn
          retention-days: 14

  rock026-reopen:
    name: Fresh Rock026 reopen on yacs-ue58
    if: >-
      github.event.pull_request.number == 383 &&
      github.head_ref == 'feat/382-texture-material-prep-foundation'
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: yacs-unreal-ci-${{ github.repository }}
      cancel-in-progress: false
    env:
      BACKUP_ROOT: ${{ runner.temp }}\texture-prep-backup-${{ github.run_id }}-${{ github.run_attempt }}
      RESTORE_ROOT: ${{ runner.temp }}\texture-prep-restored-${{ github.run_id }}-${{ github.run_attempt }}
      PROOF_ROOT: ${{ runner.temp }}\texture-prep-plugin-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_ROOT: ${{ runner.temp }}\texture-prep-remote-evidence-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact PR head without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          lfs: false
          clean: true
          persist-credentials: false

      - name: Verify remote host, disk, UE and GPU capability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:EVIDENCE_ROOT -Force | Out-Null

          $driveRoot = [IO.Path]::GetPathRoot($env:RUNNER_TEMP)
          $driveName = $driveRoot.TrimEnd('\').TrimEnd(':')
          $drive = Get-PSDrive -Name $driveName
          $freeGiB = [math]::Round($drive.Free / 1GB, 2)
          if ($drive.Free -lt 50GB) {
            throw "Remote texture proof requires the repository 50 GiB reserve; available=$freeGiB GiB"
          }

          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $project = (Resolve-Path -LiteralPath './YetAnotherCyclingSim.uproject').Path
          $engine = Resolve-YacsUnrealEngine -ProjectPath $project
          if ($null -eq $engine) {
            throw 'No compatible Unreal Engine installation was discovered by Resolve-YacsUnrealEngine.'
          }
          if (
            $engine.VersionObject.MajorVersion -ne 5 -or
            $engine.VersionObject.MinorVersion -ne 8 -or
            $engine.VersionObject.PatchVersion -ne 2 -or
            $engine.VersionObject.Changelist -ne 56702186
          ) {
            throw "Texture adapter requires UE 5.8.2 CL 56702186; discovered $($engine.Version)"
          }
          if (-not $engine.UnrealEditorPath) {
            throw 'Compatible engine lacks UnrealEditor.exe.'
          }

          $activeEditors = @(Get-Process -Name 'UnrealEditor','UnrealEditor-Cmd' -ErrorAction SilentlyContinue)
          if ($activeEditors.Count -gt 0) {
            $ids = ($activeEditors | ForEach-Object Id) -join ','
            throw "Refusing isolated proof while another Unreal Editor process is active: $ids"
          }

          $video = @(Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, AdapterRAM, PNPDeviceID)
          $realVideo = @($video | Where-Object { $_.Name -notmatch 'Microsoft Basic|Remote Display' })
          if ($realVideo.Count -eq 0) {
            throw 'No non-virtual GPU adapter was discovered on the self-hosted runner.'
          }

          $nvidia = $null
          $smi = Get-Command nvidia-smi.exe -ErrorAction SilentlyContinue
          if ($smi) {
            $nvidia = @(& $smi.Source --query-gpu=name,driver_version,memory.total --format=csv,noheader)
            if ($LASTEXITCODE -ne 0) { throw 'nvidia-smi failed on the GPU runner.' }
          }

          $receipt = [ordered]@{
            status = 'PASS'
            exact_sha = '${{ github.event.pull_request.head.sha }}'
            runner_name = $env:RUNNER_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            hostname = $env:COMPUTERNAME
            free_gib = $freeGiB
            engine = @{
              root = $engine.Root
              version = $engine.Version
              compatible_changelist = $engine.VersionObject.CompatibleChangelist
              build_version_sha256 = $engine.BuildVersionSha256
              editor_cmd_sha256 = $engine.UnrealEditorCmdSha256
            }
            gpu = $video
            nvidia_smi = $nvidia
            transport = 'GitHub Actions outbound-only self-hosted runner'
            mcp_transport = 'not_started; #384 remains blocked'
          }
          $receipt | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:EVIDENCE_ROOT 'remote-environment.json') -Encoding UTF8

          "YACS_UAT=$($engine.UATPath)" >> $env:GITHUB_ENV
          "YACS_EDITOR=$($engine.UnrealEditorPath)" >> $env:GITHUB_ENV
          "YACS_ENGINE_ROOT=$($engine.Root)" >> $env:GITHUB_ENV

      - name: Download authenticated draft backup on the remote runner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command gh.exe -ErrorAction SilentlyContinue)) {
            throw 'GitHub CLI is not installed on the self-hosted runner; authenticated draft-release download is unavailable.'
          }
          New-Item -ItemType Directory -Path $env:BACKUP_ROOT -Force | Out-Null
          gh release download $env:BACKUP_TAG --repo $env:GITHUB_REPOSITORY --dir $env:BACKUP_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated draft-release download failed.' }

          $expected = @{
            'texture-prep-checkpoint.zip' = @{ sha = $env:ARCHIVE_SHA256; bytes = 284770805 }
            'restore-manifest.json' = @{ sha = $env:MANIFEST_SHA256; bytes = 15820 }
            'remote-backup-receipt.json' = @{ sha = $env:REMOTE_RECEIPT_SHA256; bytes = 893 }
          }
          foreach ($name in $expected.Keys) {
            $path = Join-Path $env:BACKUP_ROOT $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing backup asset: $name" }
            $item = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($item.Length -ne $expected[$name].bytes -or $hash -ne $expected[$name].sha) {
              throw "Backup asset identity mismatch: $name"
            }
          }

      - name: Audit archive paths and rehearse isolated restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json
          import os
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive_path = os.path.join(os.environ["BACKUP_ROOT"], "texture-prep-checkpoint.zip")
          report_path = os.path.join(os.environ["EVIDENCE_ROOT"], "archive-audit.json")
          with ZipFile(archive_path) as archive:
              names = [item.filename for item in archive.infolist() if not item.is_dir()]
          seen = set()
          for name in names:
              path = PurePosixPath(name)
              if (
                  not name
                  or path.is_absolute()
                  or ".." in path.parts
                  or "\\" in name
                  or ":" in name
              ):
                  raise SystemExit(f"unsafe archive member: {name!r}")
              if name in seen:
                  raise SystemExit(f"duplicate archive member: {name!r}")
              seen.add(name)
          if len(names) != 76:
              raise SystemExit(f"archive member count {len(names)} != 76")
          with open(report_path, "w", encoding="utf-8") as stream:
              json.dump({"status": "PASS", "member_count": len(names)}, stream, indent=2)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Archive safety audit failed.' }

          New-Item -ItemType Directory -Path $env:RESTORE_ROOT -Force | Out-Null
          python scripts/assets/restore_workspace_data.py --manifest (Join-Path $env:BACKUP_ROOT 'restore-manifest.json') --bundle $env:BACKUP_ROOT --destination $env:RESTORE_ROOT --apply | Tee-Object -FilePath (Join-Path $env:EVIDENCE_ROOT 'restore-rehearsal.json')
          if ($LASTEXITCODE -ne 0) { throw 'Manifest restore rehearsal failed.' }

      - name: Build only the texture plugin for the discovered engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:PROOF_ROOT) {
            throw "Proof destination already exists: $env:PROOF_ROOT"
          }
          $plugin = (Resolve-Path -LiteralPath './Plugins/YacsTexturePrep/YacsTexturePrep.uplugin').Path
          & $env:YACS_UAT BuildPlugin "-Plugin=$plugin" "-Package=$env:PROOF_ROOT" -TargetPlatforms=Win64 -StrictIncludes -NoDeleteHostProject
          if ($LASTEXITCODE -ne 0) { throw 'Isolated YacsTexturePrep BuildPlugin failed.' }
          $proofProject = Join-Path $env:PROOF_ROOT 'HostProject/HostProject.uproject'
          if (-not (Test-Path -LiteralPath $proofProject -PathType Leaf)) {
            throw 'BuildPlugin did not create the disposable HostProject.'
          }

      - name: Restore only Rock026 source, run assets and evidence into HostProject
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:YACS_PROOF_PROJECT_ROOT = Join-Path $env:PROOF_ROOT 'HostProject'
          @'
          import json
          import os
          import shutil
          from pathlib import Path

          restore = Path(os.environ["RESTORE_ROOT"]).resolve()
          project = Path(os.environ["YACS_PROOF_PROJECT_ROOT"]).resolve()
          job = os.environ["ROCK026_JOB"]
          source_id = os.environ["ROCK026_SOURCE_ID"]

          graph_candidates = [
              path.parent
              for path in restore.rglob("TG_YACS_MaterialPrep.uasset")
              if path.parent.name.upper() == job.upper()
              and "/TextureMaterialPrep/Runs/" in path.as_posix()
          ]
          if len(graph_candidates) != 1:
              raise SystemExit(f"expected one Rock026 run asset directory, found {len(graph_candidates)}")
          run_source = graph_candidates[0]

          source_candidates = [
              path.parent
              for path in restore.rglob("YACS_SC_Limestone_01_BaseColor.uasset")
              if source_id.lower() in path.as_posix().lower()
              and "/TextureMaterialPrep/Sources/" in path.as_posix()
          ]
          if len(source_candidates) != 1:
              raise SystemExit(f"expected one Rock026 source asset directory, found {len(source_candidates)}")
          source_source = source_candidates[0]

          receipts = []
          for path in restore.rglob("ue-receipt.json"):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if payload.get("job_id", "").upper() == job.upper():
                  receipts.append(path)
          if len(receipts) != 1:
              raise SystemExit(f"expected one Rock026 evidence receipt, found {len(receipts)}")

          run_target = project / "Content/Generated/YACS/TextureMaterialPrep/Runs" / job
          source_target = project / "Content/Generated/YACS/TextureMaterialPrep/Sources" / source_id
          evidence_target = project / "Saved/RuntimeProof/TextureMaterialPrep" / job
          for target in (run_target, source_target, evidence_target):
              if target.exists():
                  raise SystemExit(f"no-overwrite proof target already exists: {target}")
              target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(run_source, run_target)
          shutil.copytree(source_source, source_target)
          shutil.copytree(receipts[0].parent, evidence_target)
          (project / ".yacs-texture-prep-proof").touch(exist_ok=False)

          required_assets = [
              "TG_YACS_MaterialPrep.uasset",
              "BaseColor.uasset",
              "Height.uasset",
              "Normal.uasset",
              "Roughness.uasset",
              "MacroMask.uasset",
          ]
          missing = [name for name in required_assets if not (run_target / name).is_file()]
          if missing:
              raise SystemExit(f"Rock026 restored run is incomplete: {missing}")
          (Path(os.environ["EVIDENCE_ROOT"]) / "texture-only-restore-selection.json").write_text(
              json.dumps(
                  {
                      "status": "PASS",
                      "job_id": job,
                      "run_source": str(run_source.relative_to(restore)),
                      "source_asset_source": str(source_source.relative_to(restore)),
                      "evidence_source": str(receipts[0].parent.relative_to(restore)),
                      "world_scene_restored_to_host_project": False,
                      "material_assignment_performed": False,
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Texture-only restore selection failed.' }
          "YACS_PROOF_PROJECT_ROOT=$env:YACS_PROOF_PROJECT_ROOT" >> $env:GITHUB_ENV

      - name: Fresh-editor reopen actual Rock026 outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proofProject = Join-Path $env:YACS_PROOF_PROJECT_ROOT 'HostProject.uproject'
          $script = (Resolve-Path -LiteralPath './scripts/assets/texture_material_prep_ue_reopen.py').Path
          $log = Join-Path $env:EVIDENCE_ROOT 'rock026-reopen.engine.log'
          $jobEvidence = Join-Path $env:YACS_PROOF_PROJECT_ROOT "Saved/RuntimeProof/TextureMaterialPrep/$env:ROCK026_JOB"
          $before = @(Get-ChildItem -LiteralPath $jobEvidence -Directory -Filter 'reopen-*' -ErrorAction SilentlyContinue).Count

          $arguments = @(
            ('"' + $proofProject + '"'),
            '-unattended',
            '-nosplash',
            '-nosound',
            '-NoLiveCoding',
            '-RenderOffscreen',
            ('-ExecutePythonScript="' + $script + '"'),
            ('-AbsLog="' + $log + '"')
          )
          $process = Start-Process -FilePath $env:YACS_EDITOR -ArgumentList $arguments -PassThru
          $deadline = [DateTime]::UtcNow.AddSeconds(240)
          $reopen = $null
          while ([DateTime]::UtcNow -lt $deadline) {
            $process.Refresh()
            $candidates = @(
              Get-ChildItem -LiteralPath $jobEvidence -Directory -Filter 'reopen-*' -ErrorAction SilentlyContinue |
                Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'reopen.json') }
            )
            if ($candidates.Count -gt $before) {
              $reopen = $candidates | Sort-Object LastWriteTimeUtc | Select-Object -Last 1
              break
            }
            if ($process.HasExited) {
              throw "Fresh Rock026 editor exited before reopen receipt; exit code=$($process.ExitCode)"
            }
            Start-Sleep -Seconds 2
          }
          if ($null -eq $reopen) {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw 'Fresh Rock026 reopen proof timed out without reopen.json.'
          }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }

          $reopenPayload = Get-Content -LiteralPath (Join-Path $reopen.FullName 'reopen.json') -Raw | ConvertFrom-Json
          if ($reopenPayload.status -ne 'reopened_settings_verified' -or $reopenPayload.job_id -ne $env:ROCK026_JOB) {
            throw 'Fresh Rock026 reopen receipt is invalid.'
          }
          foreach ($role in @('BaseColor','Height','Normal','Roughness','MacroMask')) {
            if (-not (Test-Path -LiteralPath (Join-Path $reopen.FullName "$role.png") -PathType Leaf)) {
              throw "Fresh Rock026 reopen did not export $role.png"
            }
          }
          "YACS_REOPEN_DIR=$($reopen.FullName)" >> $env:GITHUB_ENV

      - name: Compare reopened pixels, five maps, tiling, seams, luminance, normals and scale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP "texture-prep-venv-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Could not create isolated Python environment for diagnostics.' }
          $python = Join-Path $venv 'Scripts/python.exe'
          & $python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned offline diagnostic dependencies could not be installed.' }

          $baseline = Join-Path $env:YACS_PROOF_PROJECT_ROOT "Saved/RuntimeProof/TextureMaterialPrep/$env:ROCK026_JOB"
          $output = @(& $python scripts/assets/texture_material_prep_bundle.py $baseline --reopen $env:YACS_REOPEN_DIR)
          if ($LASTEXITCODE -ne 0) { throw 'Fresh Rock026 bundle/reopen validation failed.' }
          $validation = ($output | Select-Object -Last 1).Trim()
          if (-not (Test-Path -LiteralPath (Join-Path $validation 'bundle-validation.json') -PathType Leaf)) {
            throw "Bundle validator did not produce expected report: $validation"
          }
          Copy-Item -LiteralPath $validation -Destination (Join-Path $env:EVIDENCE_ROOT 'fresh-reopen-validation') -Recurse
          Copy-Item -LiteralPath $env:YACS_REOPEN_DIR -Destination (Join-Path $env:EVIDENCE_ROOT 'fresh-reopen') -Recurse

          $report = Get-Content -LiteralPath (Join-Path $validation 'bundle-validation.json') -Raw | ConvertFrom-Json
          if ($report.reopen_validation.status -ne 'verified_pixels_and_settings') {
            throw 'Fresh-editor decoded pixels/settings did not match the archived Rock026 baseline.'
          }
          if ($report.outputs.PSObject.Properties.Name.Count -ne 5) {
            throw 'Fresh Rock026 validation did not retain exactly five maps.'
          }
          if ($report.outputs.BaseColor.metrics.screening.status -ne 'review_required') {
            throw 'Rock026 seam flags unexpectedly disappeared; baseline must remain review-required.'
          }
          if ($report.scale.status -ne 'proposed' -or $report.scale.world_size_m[0] -ne 2 -or $report.scale.world_size_m[1] -ne 2) {
            throw 'Rock026 scale metadata is not the recorded proposed 2x2m hypothesis.'
          }

          $summary = [ordered]@{
            status = 'PASS_REOPEN_BASELINE_PRESERVED_REVIEW_REQUIRED'
            exact_sha = '${{ github.event.pull_request.head.sha }}'
            job_id = $env:ROCK026_JOB
            reopen_validation = $report.reopen_validation
            technical_validation = $report.technical_validation
            seam_screen = $report.outputs.BaseColor.metrics.screening
            seam_x_mean = $report.outputs.BaseColor.metrics.axes.x.boundary.mean
            seam_y_mean = $report.outputs.BaseColor.metrics.axes.y.boundary.mean
            luminance = $report.delight_comparison
            normal = $report.outputs.Normal.normal
            scale = $report.scale
            compression_readback = $report.compression_readback
            material_admission = $report.admission
            visual_acceptance = $report.visual_acceptance
            mcp_transport = 'not_tested; native registration is not remote transport'
          }
          $summary | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath (Join-Path $env:EVIDENCE_ROOT 'rock026-remote-summary.json') -Encoding UTF8

      - name: Upload fresh remote UE proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: texture-prep-rock026-reopen-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.EVIDENCE_ROOT }}/**/*.json
            ${{ env.EVIDENCE_ROOT }}/**/*.txt
            ${{ env.EVIDENCE_ROOT }}/**/*.log
            ${{ env.EVIDENCE_ROOT }}/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Clean disposable proof and recovery data
        if: ${{ always() }}
        shell: pwsh
        run: |
          foreach ($path in @($env:PROOF_ROOT, $env:RESTORE_ROOT, $env:BACKUP_ROOT)) {
            if ($path -and (Test-Path -LiteralPath $path)) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }


name: Passo Giau official road source probe

on:
  push:
    branches:
      - feat/stage3g-r4-1-passo-giau-road-alignment
    paths:
      - '.github/workflows/passo-giau-road-source-probe.yml'
  pull_request:
    branches:
      - feat/stage3g-r4-1-passo-giau-landscape-spike
    paths:
      - '.github/workflows/passo-giau-road-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official Veneto road features for the terrain AOI
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          bounds = (730406.587, 5148246.775, 738406.587, 5156246.775)
          params = {
              "service": "WFS",
              "version": "1.0.0",
              "request": "GetFeature",
              "typeName": "rv:c01070240012_elementostradale",
              "outputFormat": "application/json",
              "srsName": "EPSG:32632",
              "bbox": ",".join(str(v) for v in bounds) + ",EPSG:32632",
          }
          url = "https://idt2-geoserver.regione.veneto.it/geoserver/wfs?" + urllib.parse.urlencode(params)
          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "YetAnotherCyclingSim-RoadProbe/1.0 (+https://github.com/karnalooch/YetAnotherCyclingSim)",
                  "Accept": "application/json,*/*",
              },
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = response.read()
              print("HTTP", getattr(response, "status", 200))
              print("CONTENT_TYPE", response.headers.get("content-type"))
              print("BYTES", len(payload))

          out = pathlib.Path("passo-giau-road-source.geojson")
          out.write_bytes(payload)

          data = json.loads(payload)
          if data.get("type") != "FeatureCollection":
              raise SystemExit(f"unexpected WFS payload type: {data.get('type')!r}")
          features = data.get("features") or []
          print("FEATURE_COUNT", len(features))
          if not features:
              raise SystemExit("official Veneto WFS returned no road features for Passo Giau AOI")

          keys = sorted({key for feature in features for key in (feature.get("properties") or {})})
          print("PROPERTY_KEYS", json.dumps(keys, ensure_ascii=False))

          def compact(value):
              if isinstance(value, str):
                  return value[:240]
              return value

          for index, feature in enumerate(features[:25]):
              props = {k: compact(v) for k, v in (feature.get("properties") or {}).items() if v not in (None, "")}
              geom = feature.get("geometry") or {}
              coords = geom.get("coordinates") or []
              point_count = len(coords) if geom.get("type") == "LineString" else sum(len(part) for part in coords) if geom.get("type") == "MultiLineString" else 0
              print("FEATURE", index, "ID", feature.get("id"), "GEOM", geom.get("type"), "POINTS", point_count)
              print("PROPS", json.dumps(props, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload source sample
        uses: actions/upload-artifact@v4
        with:
          name: passo-giau-road-source-probe
          path: passo-giau-road-source.geojson
          if-no-files-found: error
          retention-days: 7

name: Passo Giau R4.1B Landscape authoring proof

on:
  push:
    branches:
      - feat/stage3g-r4-1-passo-giau-landscape-spike
    paths:
      - '.github/workflows/passo-giau-r4-1-landscape-author.yml'
      - 'Source/YetAnotherCyclingSim/YetAnotherCyclingSim.Build.cs'
      - 'Source/YetAnotherCyclingSim/Public/Cycling/CyclingPassoGiauLandscapeSpikeCommandlet.h'
      - 'Source/YetAnotherCyclingSim/Private/Editor/CyclingPassoGiauLandscapeSpikeCommandlet.cpp'
      - 'scripts/ue/Invoke-YacsPassoGiauLandscapeSpike.ps1'
      - 'scripts/ue/stage3g_prepare_passo_giau_landscape_map.py'
      - 'scripts/ue/stage3g_capture_passo_giau_landscape.py'
      - 'scripts/ci/test_passo_giau_landscape_author_contract.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: passo-giau-r4-1b-landscape-author-${{ github.repository }}
  cancel-in-progress: true

jobs:
  author:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/stage3g-r4-1-passo-giau-landscape-spike' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 60

    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-passo-giau-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact trusted revision with LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: true

      - name: Verify exact SHA and clean LFS checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Passo Giau authoring checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }
          if (git status --porcelain) { throw 'Passo Giau authoring checkout is dirty.' }

      - name: Run repository contract test
        shell: pwsh
        run: |
          python -m unittest scripts.ci.test_passo_giau_landscape_author_contract
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau authoring contract test failed.' }

      - name: Author and render isolated Passo Giau Landscape
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsPassoGiauLandscapeSpike.ps1 -ExpectedBranch 'feat/stage3g-r4-1-passo-giau-landscape-spike' -ExpectedHead '${{ github.sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR4_1/PassoGiauLandscape'
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau Landscape authoring failed.' }

      - name: Commit only isolated spike map
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Content/Prototype/Maps/L_PassoGiauTerrainSpike.umap'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $asset
          if (git diff --cached --quiet) {
            throw 'Passo Giau authoring produced no staged spike map.'
          }
          $unexpected = @(git diff --cached --name-only | Where-Object { $_ -ne $asset })
          if ($unexpected.Count -gt 0) {
            throw ("Unexpected staged paths: {0}" -f ($unexpected -join ', '))
          }
          git commit -m 'asset(terrain): persist Passo Giau Landscape spike'
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau spike map commit failed.' }
          git push origin HEAD:feat/stage3g-r4-1-passo-giau-landscape-spike
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau spike map push failed.' }

      - name: Upload Passo Giau authoring evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passo-giau-r4-1b-landscape-author-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GR4_1/PassoGiauLandscape/**
            ExternalAssets/Terrain/PassoGiau/Prepared/terrain-report.json
            ExternalAssets/Terrain/PassoGiau/Prepared/passo_giau_hillshade.png
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard
          git clean -ffdx
          if (git status --porcelain) {
            throw 'Passo Giau authoring workspace is dirty after cleanup.'
          }

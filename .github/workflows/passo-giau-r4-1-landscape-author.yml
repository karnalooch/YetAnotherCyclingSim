name: Passo Giau R4.1B Landscape authoring proof

on:
  push:
    branches:
      - feat/247-r4-1b4-meso-ground
    paths:
      - '.github/workflows/passo-giau-r4-1-landscape-author.yml'
      - 'Source/YetAnotherCyclingSim/YetAnotherCyclingSim.Build.cs'
      - 'Source/YetAnotherCyclingSim/Public/Cycling/CyclingPassoGiauLandscapeSpikeCommandlet.h'
      - 'Source/YetAnotherCyclingSim/Private/Editor/CyclingPassoGiauLandscapeSpikeCommandlet.cpp'
      - 'scripts/ue/Invoke-YacsPassoGiauLandscapeSpike.ps1'
      - 'scripts/assets/prepare_passo_giau_heightmap.py'
      - 'scripts/assets/download_passo_giau_mase_pst.py'
      - 'scripts/assets/download_passo_giau_veneto_lidar.py'
      - 'scripts/assets/prepare_passo_giau_mase_pst.py'
      - 'scripts/assets/prepare_passo_giau_veneto_lidar.py' # shared terrain diagnostics
      - 'scripts/ue/stage3g_prepare_passo_giau_landscape_map.py'
      - 'scripts/ue/stage3g_capture_passo_giau_landscape.py'
      - 'scripts/ci/test_passo_giau_landscape_author_contract.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: passo-giau-r4-1b-landscape-author-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  author:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/247-r4-1b4-meso-ground' }}
    runs-on: [self-hosted, yacs-ue58]
    # Single authoritative R4.1B authoring lane; restart on the latest exact SHA.
    timeout-minutes: 90
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      YACS_AUTHOR_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-passo-giau-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

          # The self-hosted checkout directory is reused between runs. A
          # successful authoring pass leaves this generated LFS asset
          # materialized. Remove only that known generated payload before
          # actions/checkout; with GIT_LFS_SKIP_SMUDGE=1 the checkout/reset
          # then recreates the committed pointer instead of retaining bytes
          # from the previous run.
          $staleSpike = Join-Path $env:GITHUB_WORKSPACE '_passo-giau-worktree/Content/Prototype/Maps/L_PassoGiauTerrainSpike.umap'
          if (Test-Path -LiteralPath $staleSpike -PathType Leaf) {
            Remove-Item -LiteralPath $staleSpike -Force
          }

      - name: Checkout exact trusted revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _passo-giau-worktree
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          clean: true
          persist-credentials: true

      - name: Verify exact SHA and clean checkout
        shell: pwsh
        working-directory: _passo-giau-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Passo Giau authoring checkout is not exact SHA.'
          }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git reset failed after exact-SHA checkout.' }
          git clean -ffd
          if ($LASTEXITCODE -ne 0) { throw 'non-ignored workspace cleanup failed.' }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }

          if (git status --porcelain --untracked-files=all) {
            throw 'Passo Giau authoring checkout has non-ignored mutations.'
          }

      - name: Enforce code-only checkout
        shell: pwsh
        working-directory: _passo-giau-worktree
        run: |
          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau code-only checkout contract failed.' }

      - name: Run repository contract test
        shell: pwsh
        working-directory: _passo-giau-worktree
        run: |
          python -m unittest scripts.ci.test_passo_giau_landscape_author_contract
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau authoring contract test failed.' }

      - name: Author and render isolated Passo Giau Landscape
        shell: pwsh
        working-directory: _passo-giau-worktree
        run: |
          ./scripts/ue/Invoke-YacsPassoGiauLandscapeSpike.ps1 -ExpectedBranch 'HEAD' -ExpectedHead '${{ github.sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR4_1/PassoGiauLandscape' -IncludeRoad
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau Landscape authoring failed.' }

      - name: Commit only isolated spike map
        shell: pwsh
        working-directory: _passo-giau-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Content/Prototype/Maps/L_PassoGiauTerrainSpike.umap'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $asset
          if (git diff --cached --quiet) {
            throw 'Passo Giau authoring produced no staged spike map.'
          }
          $unexpected = @(git diff --cached --name-only | Where-Object { $_ -ne $asset })
          if ($unexpected.Count -gt 0) {
            throw ("Unexpected staged paths: {0}" -f ($unexpected -join ', '))
          }
          git commit -m 'asset(terrain): persist Passo Giau Landscape spike'
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau spike map commit failed.' }
          if ($env:YACS_AUTHOR_BRANCH -ne 'feat/247-r4-1b4-meso-ground') {
            throw "Unexpected Passo Giau authoring destination '$env:YACS_AUTHOR_BRANCH'."
          }
          git push origin "HEAD:$env:YACS_AUTHOR_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau spike map push failed.' }

      - name: Upload Passo Giau authoring evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passo-giau-r4-1b-landscape-author-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _passo-giau-worktree/Saved/RuntimeProof/CI/Stage3GR4_1/PassoGiauLandscape/**
            _passo-giau-worktree/ExternalAssets/Terrain/PassoGiau/PreparedMasePstLidar1x1/terrain-report.json
            _passo-giau-worktree/ExternalAssets/Terrain/PassoGiau/PreparedMasePstLidar1x1/passo_giau_mase_pst_2m_preview_hillshade.png
            _passo-giau-worktree/ExternalAssets/Terrain/PassoGiau/MASE_PST_Lidar1x1/mase-pst-download-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worktree = Join-Path $env:GITHUB_WORKSPACE '_passo-giau-worktree'
          if (-not (Test-Path -LiteralPath (Join-Path $worktree '.git'))) {
            Write-Host 'Passo Giau isolated worktree is absent; nothing to clean.'
            exit 0
          }
          git -C $worktree reset --hard
          git -C $worktree clean -ffd
          if (git -C $worktree status --porcelain --untracked-files=all) {
            throw 'Passo Giau authoring worktree has non-ignored mutations after cleanup.'
          }

name: Prepare remote-first mixed-surface checkpoint once

on:
  push:
    branches: [feat/297-mixed-surface-reference]
    paths: [.github/workflows/mixed-surface-checkpoint-once.yml]

permissions: {}

concurrency:
  group: yacs-owner-checkpoint-297
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/297-mixed-surface-reference' && github.actor == 'karnalooch' && github.triggering_actor == 'karnalooch' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact owner-authored checkpoint
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          lfs: false
          persist-credentials: false
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Set up the existing reference Python version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Install existing pinned lint tool
        run: python -m pip install --disable-pip-version-check ruff==0.16.8
      - name: Validate bounded changes before publishing and remove this helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path
          from scripts.ci.check_docs_index import local_targets, read_utf8

          repo = 'karnalooch/YetAnotherCyclingSim'
          branch = 'feat/297-mixed-surface-reference'
          base = '217f57dca3fcd022ffee1ebf39a750bf9d0a3395'
          previous = '6d1f3b8c0575136926d329343e6436ea03f0bbef'
          temporary = '.github/workflows/mixed-surface-checkpoint-once.yml'
          example = 'physics_reference/examples/run_mixed_surface.py'
          test = 'physics_reference/tests/test_mixed_surface_reference.py'
          head = os.environ['GITHUB_SHA']
          expected = {
              'GITHUB_REPOSITORY': repo,
              'GITHUB_REF': 'refs/heads/' + branch,
              'GITHUB_EVENT_NAME': 'push',
              'GITHUB_ACTOR': 'karnalooch',
              'GITHUB_TRIGGERING_ACTOR': 'karnalooch',
          }
          if any(os.environ.get(key) != value for key, value in expected.items()):
              raise SystemExit('Unexpected caller; no write allowed')

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          if git('rev-parse', 'HEAD') != head or git('rev-parse', 'HEAD^') != previous:
              raise SystemExit('Checkpoint source revision drifted')
          if set(git('diff', '--name-only', base, head).splitlines()) != {example, test, temporary}:
              raise SystemExit('Unexpected input diff')

          def replace_once(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit('Absent or ambiguous anchor: ' + old[:80])
              return text.replace(old, new, 1)

          agents = Path('AGENTS.md')
          text = agents.read_text(encoding='utf-8')
          remote = '''### Remote-first delivery and durable owner preferences

          Owner reaffirmation, 2026-10-01 (Issue #297): use authorized remote GitHub delivery from the current conversation whenever available. Do not default to handing the owner a patch or requiring a mode switch merely because local Git, credentials, DNS, Unreal or a workstation is unavailable.

          - Discover the current connector's read and write capabilities, inspect the exact repository/PR state, and attempt the applicable authorized operation before declaring a remote limitation. Historical success is not proof that every current operation is available, but an unavailable local CLI is not proof that GitHub is read-only.
          - Prefer normal connector writes, focused branches/PRs and the trusted Proof Broker. Use an authorized supported alternative when necessary; never obtain hidden credentials, bypass permissions, weaken protection, fabricate CI success or force-push shared history.
          - Report a real failure with the attempted operation, error and affected layer: local container, tool availability, authorization, protected branch, Actions or runner. Do not turn one failing operation into a blanket claim that all remote delivery is impossible.
          - Within the approved scope, the owner's standing authorization covers choosing necessary proofs and normal protected closeout. Keep cost classification, compile reuse, exact-SHA evidence, required tests and visual/performance gates. Do not launch unnecessary heavy jobs or ask repeatedly for approval already given.
          - Distinguish a local candidate, a remote commit, a passing test, a render, a merge and a playable feature. Never promise unattended/background continuation unless an actual supported scheduled mechanism was created.
          - These instructions are durable project memory in this repository. Do not claim to have changed global ChatGPT profile memory without a successful memory-write operation.

          '''
          text = replace_once(text, '### Roadmap and world-building nomenclature\n', remote + '### Roadmap and world-building nomenclature\n')
          agents.write_text(text, encoding='utf-8')

          product = Path('docs/PRODUCT_REQUIREMENTS.md')
          text = product.read_text(encoding='utf-8')
          gravel = '''### 3.2 Jazda mieszana: szosa i gravel

          **Zatwierdzony kierunek właściciela z 2026-10-01; Issue #297.** Docelowa sieć ma umożliwiać jazdę asfalt -> szuter -> asfalt w jednym rzeczywistym świecie, nie na osobnej fikcyjnej mapie gravelowej. Nieutwardzone odcinki nie mają być tylko dekoracją. Udostępnienie ich do jazdy wymaga jednak zaakceptowanego połączenia drogi z terenem oraz weryfikacji źródeł, topologii, nawierzchni i dostępu rowerowego.

          Inwentaryzacja rozróżnia co najmniej asfalt, ubite kruszywo, luźny żwir, grunt i stan nieznany. Surowe informacje źródłowe, gładkość/przeszkody i dostęp pozostają odrębne. Nie wolno uznać każdej górskiej ścieżki, schodów lub trudnego odcinka MTB za łatwy gravel ani wyprowadzać przejezdności wyłącznie z nazwy nawierzchni. Brak danych nie oznacza asfaltu ani pozwolenia na jazdę.

          Jazda mieszana korzysta z tego samego deterministycznego silnika i Road Physics Profile. Opór toczenia oraz przyczepność mają jawne, osobno testowane parametry; nie dodajemy arbitralnego procentowego odejmowania prędkości ani drugiej fizyki. Wygląd i dźwięk pozostają prezentacją. Kalibracja opon, bardziej szczegółowe straty od nierówności i pełny model luźnego podłoża wymagają późniejszych osobnych dowodów, nie są implikowane przez samą etykietę gravel.

          Pierwszy rzeczywisty checkpoint obejmie zweryfikowany odcinek mieszany, ciągłe przejścia nawierzchni, poprawne połączenia i profil fizyczny oraz odbiór z kamery kolarza i pomiar wydajności. Może to być ustalona trasa; wybór skrętu na każdym skrzyżowaniu nie jest warunkiem tego testu. Bieżące MVP nadal wymaga jednego kompletnego przejazdu. Nie rozszerza to zamknięcia PR #294 ani nie oznacza, że sieć jest już przejezdna.

          Obecny przykład `physics_reference/examples/run_mixed_surface.py` i jego testy są wyłącznie syntetycznym dowodem użycia istniejącego modelu referencyjnego. Współczynniki i 300-metrowa trasa są danymi testowymi, nie pomiarami ani skalibrowanym presetem gravela. Przykład nie aktywuje jazdy w UE, nie dowodzi gravelowego pokonywania zakrętów i nie importuje żadnych rzeczywistych dróg.

          '''
          text = replace_once(text, '## 4. Sterowanie MVP\n', gravel + '## 4. Sterowanie MVP\n')
          product.write_text(text, encoding='utf-8')

          bible = Path('docs/WORLD_BUILDING_BIBLE.md')
          text = bible.read_text(encoding='utf-8')
          section = '''### 7.5 Mixed-surface riding destination

          Owner approval of 2026-10-01 (Issue #297) extends the network destination to rideable asphalt/gravel combinations; [Product Requirements section 3.2](PRODUCT_REQUIREMENTS.md#32-jazda-mieszana-szosa-i-gravel) owns this scope. This is not an additional closure requirement for terrain PR #294.

          Preserve surface evidence separately from road class, roughness/obstacles, width, topology and bicycle access. Distinguish asphalt, compacted aggregate, loose gravel, earth and unknown at inventory/authoring boundaries without treating them as calibrated physics presets. Unknown or conflicting inputs remain unresolved; neither a path label nor the appearance of a mesh establishes safe/legal ride activation. Review actual source licenses before any new dataset enters the project.

          Reuse the pinned authoring-only PCGEx corridor and existing route/physics boundaries. Surface-aware presentation must not manufacture asphalt widths, move road XY, merge grade-separated branches or layer competing ground surfaces to hide seams. No separate gravel generator, global streaming disable, arbitrary speed penalty or new dependency is authorized by this requirement.

          The first real mixed-route proof must establish source-backed surface transitions and true road connections, continuous rider state, explicit rolling/grip configuration, neutral rider-camera geometry, regeneration and relevant performance. Keep source coverage, physics calibration, technical tests and visual acceptance distinct. A synthetic reference example cannot stand in for these proofs.

          The current support exercise is `physics_reference/examples/run_mixed_surface.py`, tested through the existing reference-test discovery. It composes RoadPhysicsProfile, SurfaceGripPolicy, Environment and the unchanged step_simulation. Fixture coefficients are explicitly synthetic. Surface selection occurs at current S/D before each fixed substep; batching cannot alter the result. The last substep may pass the test endpoint slightly without resetting distance or velocity. The straight-line exercise reports grip but does not execute a corner/braking solver or prove UE/runtime parity. Detailed tyre/roughness physics and actual network activation remain separate work after the applicable foundation gate.

          '''
          text = replace_once(text, '\n---\n\n## 8. The road/terrain rule that prevents black wedges', '\n' + section + '---\n\n## 8. The road/terrain rule that prevents black wedges')
          bible.write_text(text, encoding='utf-8')

          roadmap = Path('docs/ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          anchor = 'The expansion schedule remains to be assigned after the inventory and foundation proof.\n'
          addition = '\nThe owner also approved mixed asphalt/gravel riding (Issue #297; Product Requirements section 3.2). The existing reference model may receive an independent synthetic support proof now; this does not activate roads, calibrate gravel physics or complete a future gameplay milestone. After the terrain/road foundation and source inventory are accepted, select a real mixed-route checkpoint before expanding activation. A fixed mixed itinerary is sufficient initially; free junction navigation remains a separate feature.\n'
          text = replace_once(text, anchor, anchor + addition)
          roadmap.write_text(text, encoding='utf-8')

          readme = Path('physics_reference/README.md')
          text = readme.read_text(encoding='utf-8')
          if '## Syntetyczny test asfalt - szuter - asfalt' in text:
              raise SystemExit('Reference section already exists')
          text += '''
          ## Syntetyczny test asfalt - szuter - asfalt

          `examples/run_mixed_surface.py` wykonuje ciągły przejazd po 300-metrowej trasie testowej, używając istniejącego Road Physics Profile, oporu toczenia i kroku 0,05 s. Jawna polityka przyczepności jest odczytywana niezależnie; prostoliniowy przykład nie wykonuje pokonywania zakrętów ani hamowania.

          **Wszystkie parametry i geometria są syntetycznymi danymi testowymi. Nie są skalibrowanym modelem gravela, rzeczywistą trasą Passo Giau ani dowodem integracji z Unreal.** Zmiana nawierzchni nie resetuje prędkości, dystansu ani czasu; brak polityki nie zamienia się w asfalt. Ostatni krok może nieznacznie przekroczyć koniec trasy bez ukrytego przycinania stanu.

          Z katalogu głównego repozytorium w PowerShell:

          ```powershell
          $env:PYTHONPATH = "physics_reference/src"
          python physics_reference/examples/run_mixed_surface.py
          python -m unittest discover -s physics_reference/tests -p test_mixed_surface_reference.py -v
          ```

          W powłoce POSIX:

          ```sh
          PYTHONPATH=physics_reference/src python physics_reference/examples/run_mixed_surface.py
          PYTHONPATH=physics_reference/src python -m unittest discover -s physics_reference/tests -p test_mixed_surface_reference.py -v
          ```

          Przykład wypisuje JSON z ostrzeżeniem `SYNTHETIC_ONLY_NOT_CALIBRATED_NOT_A_REAL_ROUTE`, przejściami nawierzchni i końcowym stanem. Zestaw regresji sprawdza granice odcinków, deterministyczność, grupowanie podkroków, niezależność przyczepności/oporu i brak resetowania stanu. Jest automatycznie wykrywany przez istniejące `scripts/ci/run_python_tests.py`; nie potrzebuje renderów ani kompilacji UE.
          '''
          readme.write_text(text, encoding='utf-8')

          # Do not shadow unittest.TestCase.run with a stored fixture result.
          test_path = Path(test)
          text = test_path.read_text(encoding='utf-8')
          text = text.replace('cls.run =', 'cls.reference_result =').replace('self.run', 'self.reference_result')
          test_path.write_text(text, encoding='utf-8')
          paths = ['AGENTS.md', str(product), str(bible), str(roadmap), str(readme), example, test]

          def checked(args, environment=None):
              result = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, env=environment, timeout=300)
              print('$ ' + ' '.join(args))
              print(result.stdout[-5000:])
              if result.returncode:
                  raise SystemExit('Validation failed with exit ' + str(result.returncode))
              return result.stdout

          checked([sys.executable, '-m', 'ruff', 'format', example, test])
          checked([sys.executable, '-m', 'ruff', 'check', example, test, '--select', 'E9,F63,F7,F82'])
          checked([sys.executable, '-m', 'py_compile', example, test])
          environment = dict(os.environ, PYTHONPATH=str(Path('physics_reference/src').resolve()))
          checked([sys.executable, '-m', 'unittest', 'discover', '-s', 'physics_reference/tests', '-p', 'test_mixed_surface_reference.py', '-v'], environment)
          demo = json.loads(checked([sys.executable, example], environment))
          if demo['notice'] != 'SYNTHETIC_ONLY_NOT_CALIBRATED_NOT_A_REAL_ROUTE':
              raise SystemExit('Synthetic evidence label missing')
          if [item['surface_id'] for item in demo['transitions']] != ['asphalt', 'gravel', 'asphalt']:
              raise SystemExit('Expected surface sequence not proven')
          checked([sys.executable, 'scripts/ci/run_python_tests.py'])
          checked([sys.executable, 'scripts/ci/check_docs_index.py'])
          checked(['git', 'diff', '--check'])
          for path in (agents, product, bible, roadmap, readme):
              content = read_utf8(path)
              if any(not target.exists() for target in local_targets(path, content)):
                  raise SystemExit('Broken document link: ' + str(path))
          if set(git('diff', '--name-only').splitlines()) - set(paths):
              raise SystemExit('Unexpected output mutation')
          print('Changed-document UTF-8 and local links: PASS')
          print('Reference sequence and unchanged-core full regression: PASS')

          def api(path, method='GET', body=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  data=None if body is None else json.dumps(body).encode('utf-8'),
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f'Checkpoint API {method} {path}: HTTP {exc.code}') from None

          if api('/git/ref/heads/' + branch)['object']['sha'] != head:
              raise SystemExit('Remote branch moved; refusing overwrite')
          commit = api('/git/commits/' + head)
          entries = [{'path': path, 'mode': '100644', 'type': 'blob', 'content': Path(path).read_text(encoding='utf-8')} for path in paths]
          entries.append({'path': temporary, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('/git/trees', 'POST', {'base_tree': commit['tree']['sha'], 'tree': entries})
          result = api('/git/commits', 'POST', {
              'message': 'feat(physics): record and validate remote-first mixed-surface reference',
              'tree': tree['sha'], 'parents': [head],
          })
          api('/git/refs/heads/' + branch, 'PATCH', {'sha': result['sha'], 'force': False})
          print('VALIDATED_CHECKPOINT=' + result['sha'])
          print('TEMPORARY_HELPER_REMOVED=' + temporary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Remote-first mixed-surface reference checkpoint\n\n')
              summary.write('Commit: `' + result['sha'] + '`\n\n')
              summary.write('Reference fixture/test discovery and full regression: PASS.\n\n')
              summary.write('Documentation links, i18n, structure and freshness: PASS.\n\n')
              summary.write('No terrain/UE/core-physics modification. Synthetic coefficients only; no real gravel ride or calibration claimed. Temporary helper removed.\n')
          PY

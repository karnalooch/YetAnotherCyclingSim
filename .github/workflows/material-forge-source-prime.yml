name: Material Forge source cache prime

on:
  push:
    branches:
      - "codex/363-landscape-material-foundation"
    paths:
      - ".github/workflows/material-forge-source-prime.yml"

permissions:
  contents: read

jobs:
  prime-and-render:
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Prepare pinned source runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = 'D:\yacs\tool-cache\material-forge'
          $godot = Get-ChildItem -LiteralPath (Join-Path $toolRoot 'godot-4.7.2-stable') -Filter 'Godot_v4.7.2-stable_win64.exe' -Recurse -ErrorAction Stop | Select-Object -First 1
          if ($null -eq $godot) { throw 'Pinned Godot 4.7.2 missing.' }
          $mmExe = Get-ChildItem -LiteralPath (Join-Path $toolRoot 'material-maker-1.7') -Filter 'material_maker.exe' -Recurse -ErrorAction Stop | Select-Object -First 1
          if ($null -eq $mmExe) { throw 'Pinned Material Maker 1.7 install missing.' }
          $mmInstall = $mmExe.Directory.FullName
          $source = Join-Path $toolRoot 'material-maker-source-4d29a815489866aae483281cf44b2cfe48d3cc3e'
          if (-not (Test-Path -LiteralPath (Join-Path $source '.git'))) {
            git clone --no-checkout https://github.com/RodZill4/material-maker.git $source
            if ($LASTEXITCODE -ne 0) { throw 'Material Maker source clone failed.' }
          }
          git -C $source fetch --force --depth=1 origin 4d29a815489866aae483281cf44b2cfe48d3cc3e
          if ($LASTEXITCODE -ne 0) { throw 'Source fetch failed.' }
          git -C $source checkout --detach --force 4d29a815489866aae483281cf44b2cfe48d3cc3e
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed.' }
          git -C $source clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'Source cleanup failed.' }
          Set-Content -LiteralPath (Join-Path $source 'steam_appid.txt') -Value '4110830' -Encoding ascii

          $python = Join-Path $toolRoot 'python\Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Python deps unavailable.' }

          $root = Join-Path $env:RUNNER_TEMP "mf-source-prime-$env:GITHUB_SHA"
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          "YACS_PRIME_ROOT=$root" >> $env:GITHUB_ENV
          "YACS_PRIME_SOURCE=$source" >> $env:GITHUB_ENV
          "YACS_PRIME_GODOT=$($godot.FullName)" >> $env:GITHUB_ENV
          "YACS_PRIME_MM_INSTALL=$mmInstall" >> $env:GITHUB_ENV
          "YACS_PRIME_PY=$python" >> $env:GITHUB_ENV

      - name: Prime Godot import and class cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:YACS_PRIME_ROOT 'godot-import.log'
          & $env:YACS_PRIME_GODOT --headless --path $env:YACS_PRIME_SOURCE --import --log-file $log
          $code = $LASTEXITCODE
          [ordered]@{
            exit_code = $code
            class_cache = Test-Path -LiteralPath (Join-Path $env:YACS_PRIME_SOURCE '.godot\global_script_class_cache.cfg')
            imported_dir = Test-Path -LiteralPath (Join-Path $env:YACS_PRIME_SOURCE '.godot\imported')
            imported_count = @(
              Get-ChildItem -LiteralPath (Join-Path $env:YACS_PRIME_SOURCE '.godot\imported') -File -ErrorAction SilentlyContinue
            ).Count
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:YACS_PRIME_ROOT 'prime-receipt.json') -Encoding utf8
          Get-Content -LiteralPath (Join-Path $env:YACS_PRIME_ROOT 'prime-receipt.json') | Write-Host
          if ($code -ne 0) { throw "Godot import failed with exit $code." }
          if (-not (Test-Path -LiteralPath (Join-Path $env:YACS_PRIME_SOURCE '.godot\global_script_class_cache.cfg'))) {
            throw 'Godot import did not create global_script_class_cache.cfg.'
          }

      - name: Author one Forge run
        shell: pwsh
        run: |
          $run = Join-Path $env:YACS_PRIME_ROOT 'run'
          & $env:YACS_PRIME_PY scripts/assets/material_forge.py author --material-maker $env:YACS_PRIME_MM_INSTALL --output $run *> (Join-Path $env:YACS_PRIME_ROOT 'author.log')
          if ($LASTEXITCODE -ne 0) { throw 'Forge authoring failed.' }
          "YACS_PRIME_VARIANT=$(Join-Path $run 'aged_mountain_asphalt\base')" >> $env:GITHUB_ENV

      - name: Render one Forge variant through primed source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $variant = $env:YACS_PRIME_VARIANT
          $export = Join-Path $variant 'export'
          New-Item -ItemType Directory -Force -Path $export | Out-Null
          $prefix = Join-Path $export 'YACS_Material'
          $script = (Resolve-Path 'scripts/assets/render_material_forge.gd').Path
          $graph = Join-Path $variant 'Material.ptex'
          $stdout = Join-Path $env:YACS_PRIME_ROOT 'render.stdout.log'
          $stderr = Join-Path $env:YACS_PRIME_ROOT 'render.stderr.log'

          $args = @(
            '--path', $env:YACS_PRIME_SOURCE,
            '--script', $script,
            '--',
            $graph,
            $prefix,
            '2048'
          )
          $process = Start-Process -FilePath $env:YACS_PRIME_GODOT -ArgumentList $args -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(300000)) {
            $process | Stop-Process -Force
            throw 'Primed source render timed out.'
          }
          [ordered]@{
            exit_code = $process.ExitCode
            outputs = @(
              Get-ChildItem -LiteralPath $export -File -ErrorAction SilentlyContinue |
                Select-Object Name, Length
            )
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:YACS_PRIME_ROOT 'render-receipt.json') -Encoding utf8
          Get-Content -LiteralPath (Join-Path $env:YACS_PRIME_ROOT 'render-receipt.json') | Write-Host
          if ($process.ExitCode -ne 0) { throw "Primed source render exited $($process.ExitCode)." }

          & $env:YACS_PRIME_PY scripts/assets/material_forge.py validate $variant --resolution 2048 *> (Join-Path $env:YACS_PRIME_ROOT 'validation.log')
          if ($LASTEXITCODE -ne 0) { throw 'Primed source render failed CPU validation.' }

      - name: Upload source-prime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: material-forge-source-prime-${{ github.sha }}
          path: ${{ runner.temp }}/mf-source-prime-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

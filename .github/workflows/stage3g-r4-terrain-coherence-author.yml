name: Stage 3G R4 terrain coherence authoring

on:
  push:
    branches:
      - feat/stage3g-r4-route-terrain-coherence
    paths:
      - '.github/workflows/stage3g-r4-terrain-coherence-author.yml'
      - 'Source/YetAnotherCyclingSim/Private/Cycling/Stage3GRouteExclusion.cpp'
      - 'Source/YetAnotherCyclingSim/Public/Cycling/Stage3GRouteExclusion.h'
      - 'Source/YetAnotherCyclingSim/Private/Cycling/Stage3PrototypeTerrainActor.cpp'
      - 'Source/YetAnotherCyclingSim/Private/Tests/Stage3GRouteExclusion.spec.cpp'
      - 'Source/YetAnotherCyclingSim/Private/Tests/Stage3PrototypeTerrain.spec.cpp'
      - 'Source/YetAnotherCyclingSimEditor/Private/PCG/Stage3GBiomeCandidatesSettings.cpp'
      - 'Source/YetAnotherCyclingSimEditor/Private/PCG/Stage3GForestCandidatesSettings.cpp'
      - 'scripts/ci/test_stage3g_r4_terrain_coherence_contract.py'
      - 'scripts/ue/Invoke-YacsStage3GR4TerrainCoherence.ps1'

permissions:
  contents: write

concurrency:
  group: stage3g-r4-terrain-coherence-author-${{ github.repository }}
  cancel-in-progress: true

jobs:
  author:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/stage3g-r4-route-terrain-coherence' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 90
    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii

          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Bootstrap cleanup helper outside persistent worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        with:
          path: _bootstrap-cleanup
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          clean: true
          persist-credentials: false

      - name: Release stale Unreal workspace locks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE '_bootstrap-cleanup/scripts/ci/Release-YacsUnrealWorkspaceLocks.ps1'
          & $bootstrap -Workspace $env:GITHUB_WORKSPACE
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '_bootstrap-cleanup') -Recurse -Force

      - name: Checkout exact trusted revision with LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _stage3g-r4-author-worktree
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: true

      - name: Verify exact SHA and full LFS
        shell: pwsh
        working-directory: _stage3g-r4-author-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Stage 3G R4 checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }
          if (git status --porcelain) { throw 'Stage 3G R4 checkout is dirty.' }

      - name: Validate R4 contract
        shell: pwsh
        working-directory: _stage3g-r4-author-worktree
        run: |
          python -m unittest scripts.ci.test_stage3g_r4_terrain_coherence_contract
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G R4 contract failed.' }

      - name: Rebuild route-aware terrain and map
        shell: pwsh
        working-directory: _stage3g-r4-author-worktree
        run: |
          ./scripts/ue/Invoke-YacsStage3GR4TerrainCoherence.ps1 -ExpectedBranch HEAD -ExpectedHead '${{ github.sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR4/TerrainCoherenceAuthor'
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G R4 authoring failed.' }

      - name: Commit only the rebuilt Stage 3 map
        shell: pwsh
        working-directory: _stage3g-r4-author-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          $map = 'Content/Prototype/Maps/L_CyclingTest.umap'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $map

          $staged = @(git diff --cached --name-only | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          if ($staged.Count -ne 1 -or $staged[0] -ne $map) {
            throw ("Unexpected staged paths: {0}" -f ($staged -join ', '))
          }
          if (git diff --cached --quiet) {
            throw 'Stage 3G R4 map commit has no staged change.'
          }

          git commit -m 'asset(stage3g): persist R4 route-aware terrain'
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G R4 map commit failed.' }
          git push origin HEAD:feat/stage3g-r4-route-terrain-coherence
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G R4 map push failed.' }

      - name: Upload R4 authoring evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-r4-terrain-coherence-author-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _stage3g-r4-author-worktree/Saved/RuntimeProof/CI/Stage3GR4/TerrainCoherenceAuthor/**
          if-no-files-found: warn
          retention-days: 14

      - name: Release Unreal locks before cleanup
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $env:GITHUB_WORKSPACE '_stage3g-r4-author-worktree/scripts/ci/Release-YacsUnrealWorkspaceLocks.ps1'
          if (Test-Path -LiteralPath $helper -PathType Leaf) {
            & $helper -Workspace (Join-Path $env:GITHUB_WORKSPACE '_stage3g-r4-author-worktree')
          }

      - name: Clean isolated R4 authoring worktree
        if: ${{ always() }}
        shell: pwsh
        working-directory: _stage3g-r4-author-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath '.git') {
            git reset --hard
            if ($LASTEXITCODE -ne 0) { throw 'Stage 3G R4 cleanup git reset failed.' }
            git clean -ffdx -e Saved/Logs/YetAnotherCyclingSim.log
            if ($LASTEXITCODE -ne 0) { throw 'Stage 3G R4 cleanup git clean failed.' }
            if (git status --porcelain) {
              throw 'Stage 3G R4 isolated worktree is dirty after cleanup.'
            }
          }
          else {
            Write-Host 'Stage 3G R4 cleanup: no checkout worktree to clean.'
          }

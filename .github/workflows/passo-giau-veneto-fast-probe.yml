name: Passo Giau Veneto DTM fast endpoint probe

on:
  push:
    branches:
      - feat/stage3g-r4-1-passo-giau-landscape-spike
    paths:
      - '.github/workflows/passo-giau-veneto-fast-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe official endpoints
        shell: bash
        run: |
          python - <<'PY'
          import html.parser
          import re
          import urllib.parse
          import urllib.request

          UA = "YetAnotherCyclingSim-VenetoFastProbe/1.0 (+https://github.com/karnalooch/YetAnotherCyclingSim)"

          def fetch(url):
              print("\n=== URL", url)
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      print("STATUS", getattr(response, "status", 200), "FINAL", response.url, "CHARS", len(body))
                      return body, response.url
              except Exception as exc:
                  print("ERROR", repr(exc))
                  return "", url

          for version in ("1.0.0", "2.0.1"):
              params = urllib.parse.urlencode({
                  "service": "WCS",
                  "version": version,
                  "request": "GetCapabilities",
              })
              body, _ = fetch("https://idt2-geoserver.regione.veneto.it/geoserver/wcs?" + params)
              hits = []
              for pattern in (r".{0,180}DTM.{0,500}", r".{0,180}lidar.{0,500}", r".{0,180}Coverage.{0,500}"):
                  hits.extend(re.findall(pattern, body, flags=re.I | re.S))
              for hit in hits[:30]:
                  print("WCS_HIT", re.sub(r"\s+", " ", hit)[:900])

          doc, _ = fetch("https://idt2.regione.veneto.it/geoportal/rest/document?id=c0101071_Lidar5m")
          for hit in re.findall(r".{0,250}(?:download|lidar|dtm|url|resource).{0,700}", doc, flags=re.I | re.S)[:40]:
              print("DOC_HIT", re.sub(r"\s+", " ", hit)[:1100])

          class Scripts(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.srcs = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      src = dict(attrs).get("src")
                      if src:
                          self.srcs.append(src)

          page, final_url = fetch("https://idt2.regione.veneto.it/idt/downloader/download")
          parser = Scripts()
          parser.feed(page)
          print("SCRIPT_SRCS", len(parser.srcs))
          for src in parser.srcs:
              print("SCRIPT", urllib.parse.urljoin(final_url, src))
          for hit in re.findall(r".{0,250}(?:download|lidar|dtm|api).{0,700}", page, flags=re.I | re.S)[:40]:
              print("PAGE_HIT", re.sub(r"\s+", " ", hit)[:1100])
          PY

      - name: Inspect official LiDAR downloader JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.request

          UA = "YetAnotherCyclingSim-VenetoFastProbe/1.1 (+https://github.com/karnalooch/YetAnotherCyclingSim)"
          urls = [
              "https://idt2.regione.veneto.it/idt/downloader/js/scripts/ConfiguratorDownloadDtmLidar5.js",
              "https://idt2.regione.veneto.it/idt/downloader/js/scripts/ConfiguratorDownload.js",
              "https://idt2.regione.veneto.it/idt/commons/js/scripts/MainConfigs/MainConfigs.js",
          ]
          for url in urls:
              print("\n=== JS", url)
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      body = response.read().decode("utf-8", errors="replace")
              except Exception as exc:
                  print("ERROR", repr(exc))
                  continue
              print("CHARS", len(body))
              if "DtmLidar5" in url:
                  print("BEGIN_DTM_LIDAR_JS")
                  print(body[:40000])
                  print("END_DTM_LIDAR_JS")
              else:
                  for hit in re.findall(r".{0,350}(?:url|controller|download|service|base|idt).{0,900}", body, flags=re.I | re.S)[:80]:
                      print("CONFIG_HIT", re.sub(r"\s+", " ", hit)[:1500])
          PY

      - name: Inspect one official Giau LiDAR tile response
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          url = "https://idt2.regione.veneto.it/idt/download/layerDownload/downloadDtmLidar5?dataDtmLidarId=273"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "YetAnotherCyclingSim-VenetoTileProbe/1.0 (+https://github.com/karnalooch/YetAnotherCyclingSim)",
                  "Accept": "*/*",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              print("STATUS", getattr(response, "status", 200))
              print("FINAL_URL", response.url)
              for key, value in response.headers.items():
                  print("HEADER", key, value)
              prefix = response.read(128)
              print("PREFIX_HEX", prefix.hex())
              print("PREFIX_ASCII", repr(prefix))
          PY

      - name: Inspect Giau ASC header
        shell: bash
        run: |
          python - <<'PY'
          import io
          import urllib.request
          import zipfile
          url = "https://idt2.regione.veneto.it/idt/download/layerDownload/downloadDtmLidar5?dataDtmLidarId=273"
          req = urllib.request.Request(url, headers={"User-Agent": "YACS-Terrain-Probe/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = response.read()
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              names = archive.namelist()
              print("ZIP_MEMBERS", names)
              with archive.open("12_2K_0294.asc") as source:
                  for index in range(10):
                      line = source.readline().decode("ascii", errors="replace").rstrip()
                      print(f"ASC_HEAD_{index+1}", line)
          PY

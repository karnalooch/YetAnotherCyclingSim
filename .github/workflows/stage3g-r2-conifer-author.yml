name: Stage 3G R2 Conifer authoring proof

on:
  push:
    branches:
      - feat/stage3g-pcg-forest-r2
    paths:
      - '.github/workflows/stage3g-r2-conifer-author.yml'
      - 'scripts/ue/Invoke-YacsStage3GR2ConiferAuthor.ps1'
      - 'scripts/ue/stage3g_author_conifer.py'
      - 'scripts/ci/test_stage3g_r2_conifer_author_contract.py'
      - 'scripts/assets/stage3g_polyhaven.json'
      - 'scripts/assets/download_stage3g_assets.py'
      - 'YetAnotherCyclingSim.uproject'

permissions:
  contents: read

concurrency:
  group: stage3g-r2-conifer-author-${{ github.repository }}
  cancel-in-progress: true

jobs:
  author-conifer:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/stage3g-pcg-forest-r2' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 90
    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact trusted R2 revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: false

      - name: Verify source checkout and LFS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Stage 3G R2 conifer author checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }
          if (git status --porcelain) {
            throw 'Stage 3G R2 conifer author checkout is dirty.'
          }

      - name: Run conifer authoring contract tests
        shell: pwsh
        run: |
          python -m unittest scripts.ci.test_stage3g_r2_conifer_author_contract
          if ($LASTEXITCODE -ne 0) { throw 'Conifer authoring contract tests failed.' }

      - name: Author production conifer in UE 5.8
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsStage3GR2ConiferAuthor.ps1 -ExpectedBranch HEAD -ExpectedHead '${{ github.sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR2/ConiferAuthor'

      - name: Upload conifer authoring proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-r2-conifer-author-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GR2/ConiferAuthor/**/*.json
            Saved/RuntimeProof/CI/Stage3GR2/ConiferAuthor/**/*.txt
            Saved/RuntimeProof/CI/Stage3GR2/ConiferAuthor/**/*.log
            Content/Prototype/Environment/Stage3G/Imported/Meshes/SM_Stage3G_FirSaplingMedium.uasset
            Content/Prototype/Environment/Stage3G/Imported/Textures/T_Stage3G_Fir*.uasset
            Content/Prototype/Environment/Stage3G/Materials/M*_Stage3G_Fir*.uasset
          if-no-files-found: error
          retention-days: 7

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard
          git clean -ffdx
          if (git status --porcelain) {
            throw 'Stage 3G R2 conifer author workspace is dirty after cleanup.'
          }
          Write-Host 'Stage 3G R2 conifer author cleanup: PASS'

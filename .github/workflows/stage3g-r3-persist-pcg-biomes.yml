name: Stage 3G R3 persist valley and high-Alpine PCG

on:
  push:
    branches:
      - feat/stage3g-pcg-biomes-r3
    paths:
      - '.github/workflows/stage3g-r3-persist-pcg-biomes.yml'
      - 'Source/YetAnotherCyclingSimEditor/Public/PCG/Stage3GBiomeCandidatesSettings.h'
      - 'Source/YetAnotherCyclingSimEditor/Private/PCG/Stage3GBiomeCandidatesSettings.cpp'
      - 'scripts/ue/stage3g_author_pcg_biomes.py'
      - 'scripts/ue/Invoke-YacsStage3GR3PCGBiomes.ps1'
      - 'scripts/ci/test_stage3g_r3_pcg_biomes_contract.py'

permissions:
  contents: write

concurrency:
  group: stage3g-r3-persist-pcg-biomes-${{ github.repository }}
  cancel-in-progress: false

jobs:
  persist-pcg-biomes:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/stage3g-pcg-biomes-r3' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 120
    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact trusted R3 revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: true

      - name: Verify checkout, LFS and R2 dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'R3 biome recovery checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }

          $required = @(
            'Content/Prototype/Environment/Stage3G/Imported/Meshes/SM_Stage3G_Boulder.uasset',
            'Content/YACS/WorldGen/PCG/PCG_RouteExclusion.uasset',
            'Content/YACS/WorldGen/PCG/PCG_Forest.uasset'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Persisted Stage 3G dependency is missing: $path"
            }
          }
          if (git status --porcelain) {
            throw 'R3 biome recovery checkout is dirty.'
          }

          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Validate R3 biome authoring contract
        shell: pwsh
        run: |
          python -m unittest scripts.ci.test_stage3g_r3_pcg_biomes_contract
          if ($LASTEXITCODE -ne 0) { throw 'R3 biome authoring contract failed.' }

      - name: Author and persist valley and high-Alpine graphs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceHead = (git rev-parse HEAD).Trim()

          ./scripts/ue/Invoke-YacsStage3GR3PCGBiomes.ps1 -ExpectedBranch HEAD -ExpectedHead $sourceHead -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR3/BiomeRecovery'
          if ($LASTEXITCODE -ne 0) { throw 'R3 biome PCG authoring failed.' }

          $expected = @(
            'Content/YACS/WorldGen/PCG/PCG_HighAlpine.uasset',
            'Content/YACS/WorldGen/PCG/PCG_Valley.uasset'
          ) | Sort-Object

          git add -- $expected
          $staged = @(git diff --cached --name-only | Sort-Object)
          if (($staged -join [Environment]::NewLine) -ne ($expected -join [Environment]::NewLine)) {
            throw ("Unexpected R3 biome staged paths: {0}" -f ($staged -join ', '))
          }

          git commit -m 'feat(stage3g): persist deterministic valley and high-Alpine PCG graphs'
          if ($LASTEXITCODE -ne 0) { throw 'R3 biome persistence commit failed.' }

          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git fetch origin feat/stage3g-pcg-biomes-r3
            if ($LASTEXITCODE -ne 0) { throw 'R3 biome persistence fetch failed.' }
            git rebase origin/feat/stage3g-pcg-biomes-r3
            if ($LASTEXITCODE -ne 0) {
              git rebase --abort 2>$null
              throw 'R3 biome persistence rebase failed.'
            }
            git push origin HEAD:feat/stage3g-pcg-biomes-r3
            if ($LASTEXITCODE -eq 0) {
              $pushed = $true
              break
            }
            if ($attempt -lt 3) {
              Write-Host 'R3 biome push raced with branch update; retrying.'
            }
          }
          if (-not $pushed) { throw 'R3 biome persistence push failed after 3 attempts.' }

          foreach ($path in $expected) {
            $pointer = (git show "HEAD:$path") -join [Environment]::NewLine
            if ($pointer -notmatch '^version https://git-lfs.github.com/spec/v1') {
              throw "Persisted R3 graph is not represented by Git LFS: $path"
            }
          }

          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'Post-persist git lfs fsck failed.' }
          if (git status --porcelain) {
            throw 'R3 biome recovery finished with a dirty workspace.'
          }

          @(
            "source_sha=$sourceHead",
            "persisted_sha=$((git rev-parse HEAD).Trim())"
          ) | Set-Content -LiteralPath 'Saved/RuntimeProof/CI/Stage3GR3/BiomeRecovery/persisted_head.txt' -Encoding UTF8

      - name: Upload R3 biome recovery proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-r3-pcg-biomes-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GR3/BiomeRecovery/**/*.json
            Saved/RuntimeProof/CI/Stage3GR3/BiomeRecovery/**/*.txt
            Saved/RuntimeProof/CI/Stage3GR3/BiomeRecovery/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard
          git clean -ffdx
          if (git status --porcelain) {
            throw 'R3 biome recovery workspace is dirty after cleanup.'
          }
          Write-Host 'R3 biome recovery cleanup: PASS'

name: Passo Giau R4.1 road authoring proof

on:
  pull_request:
    branches:
      - main
      - feat/stage3g-r4-1-passo-giau-landscape-spike
    paths:
      - '.github/workflows/passo-giau-r4-1-road-author.yml'
      - 'Source/YetAnotherCyclingSim/YetAnotherCyclingSim.Build.cs'
      - 'Source/YetAnotherCyclingSim/Public/Cycling/CyclingPassoGiauLandscapeSpikeCommandlet.h'
      - 'Source/YetAnotherCyclingSim/Private/Editor/CyclingPassoGiauLandscapeSpikeCommandlet.cpp'
      - 'scripts/ue/Invoke-YacsPassoGiauLandscapeSpike.ps1'
      - 'scripts/assets/download_passo_giau_mase_pst.py'
      - 'scripts/assets/download_passo_giau_veneto_lidar.py'
      - 'scripts/assets/prepare_passo_giau_mase_pst.py'
      - 'scripts/assets/prepare_passo_giau_veneto_lidar.py'
      - 'scripts/assets/download_passo_giau_road_network.py'
      - 'scripts/assets/prepare_passo_giau_road.py'
      - 'scripts/ue/stage3g_prepare_passo_giau_landscape_map.py'
      - 'scripts/ue/stage3g_capture_passo_giau_landscape.py'
      - 'scripts/ue/stage3g_capture_passo_giau_road.py'

permissions:
  contents: write

concurrency:
  group: passo-giau-r4-1-road-author-${{ github.repository }}
  cancel-in-progress: true

jobs:
  author:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.head_ref == 'feat/stage3g-r4-1-passo-giau-road-alignment' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 90
    env:
      GIT_LFS_SKIP_SMUDGE: '1'

    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-passo-giau-road-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

          $staleSpike = Join-Path $env:GITHUB_WORKSPACE '_passo-giau-road-worktree/Content/Prototype/Maps/L_PassoGiauTerrainSpike.umap'
          if (Test-Path -LiteralPath $staleSpike -PathType Leaf) {
            Remove-Item -LiteralPath $staleSpike -Force
          }

      - name: Checkout exact trusted revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _passo-giau-road-worktree
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          lfs: false
          clean: true
          persist-credentials: true

      - name: Verify exact SHA and clean checkout
        shell: pwsh
        working-directory: _passo-giau-road-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.event.pull_request.head.sha }}') {
            throw 'Passo Giau road checkout is not exact SHA.'
          }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git reset failed after exact-SHA checkout.' }
          git clean -ffd
          if ($LASTEXITCODE -ne 0) { throw 'non-ignored workspace cleanup failed.' }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          if (git status --porcelain --untracked-files=all) {
            throw 'Passo Giau road checkout has non-ignored mutations.'
          }

      - name: Enforce code-only checkout
        shell: pwsh
        working-directory: _passo-giau-road-worktree
        run: |
          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau road code-only checkout contract failed.' }

      - name: Compile Python road scripts
        shell: pwsh
        working-directory: _passo-giau-road-worktree
        run: |
          python -m py_compile scripts/assets/download_passo_giau_road_network.py scripts/assets/prepare_passo_giau_road.py
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau road Python compile contract failed.' }

      - name: Author Landscape and official SP638 road
        shell: pwsh
        working-directory: _passo-giau-road-worktree
        run: |
          ./scripts/ue/Invoke-YacsPassoGiauLandscapeSpike.ps1 -ExpectedBranch 'HEAD' -ExpectedHead '${{ github.event.pull_request.head.sha }}' -IncludeRoad -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR4_1/PassoGiauRoad'
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau road authoring failed.' }

      - name: Commit only isolated spike map
        shell: pwsh
        working-directory: _passo-giau-road-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Content/Prototype/Maps/L_PassoGiauTerrainSpike.umap'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $asset
          if (git diff --cached --quiet) {
            throw 'Passo Giau road authoring produced no staged spike map.'
          }
          $unexpected = @(git diff --cached --name-only | Where-Object { $_ -ne $asset })
          if ($unexpected.Count -gt 0) {
            throw ("Unexpected staged paths: {0}" -f ($unexpected -join ', '))
          }
          git commit -m 'asset(terrain): persist official SP638 road spline'
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau road map commit failed.' }
          git push origin HEAD:feat/stage3g-r4-1-passo-giau-road-alignment
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau road map push failed.' }

      - name: Upload Passo Giau road authoring evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passo-giau-r4-1-road-author-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _passo-giau-road-worktree/Saved/RuntimeProof/CI/Stage3GR4_1/PassoGiauRoad/**
            _passo-giau-road-worktree/ExternalAssets/Terrain/PassoGiau/RoadNetwork/road-download-report.json
            _passo-giau-road-worktree/ExternalAssets/Terrain/PassoGiau/PreparedRoad/**
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worktree = Join-Path $env:GITHUB_WORKSPACE '_passo-giau-road-worktree'
          if (-not (Test-Path -LiteralPath (Join-Path $worktree '.git'))) {
            Write-Host 'Passo Giau road worktree is absent; nothing to clean.'
            exit 0
          }
          git -C $worktree reset --hard
          git -C $worktree clean -ffd
          if (git -C $worktree status --porcelain --untracked-files=all) {
            throw 'Passo Giau road worktree has non-ignored mutations after cleanup.'
          }

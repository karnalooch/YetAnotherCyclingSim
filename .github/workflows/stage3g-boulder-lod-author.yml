name: One-shot Stage 3G Boulder LOD authoring

on:
  push:
    branches:
      - audit/stage3g-source-assets
    paths:
      - '.github/workflows/stage3g-boulder-lod-author.yml'
      - 'scripts/ue/stage3g_author_boulder_lods.py'
      - 'scripts/ue/Invoke-YacsStage3GBoulderLodAuthor.ps1'

permissions:
  contents: write

concurrency:
  group: stage3g-boulder-lod-author-${{ github.repository }}
  cancel-in-progress: true

jobs:
  author:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 45
    steps:
      - name: Checkout exact trusted revision with LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: true

      - name: Verify exact SHA and full LFS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Boulder authoring checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }
          if (git status --porcelain) { throw 'Boulder authoring checkout is dirty.' }

      - name: Author deterministic Boulder LODs
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsStage3GBoulderLodAuthor.ps1 -ExpectedBranch HEAD -ExpectedHead '${{ github.sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GBoulderLOD'
          if ($LASTEXITCODE -ne 0) { throw 'Boulder LOD authoring failed.' }

      - name: Commit only the persisted Boulder mesh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Content/Prototype/Environment/Stage3G/Imported/Meshes/SM_Stage3G_Boulder.uasset'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $asset
          if (git diff --cached --quiet) {
            throw 'Boulder LOD authoring produced no staged asset change.'
          }
          git commit -m 'asset(stage3g): add deterministic Boulder LODs'
          if ($LASTEXITCODE -ne 0) { throw 'Boulder LOD asset commit failed.' }
          git push origin HEAD:audit/stage3g-source-assets
          if ($LASTEXITCODE -ne 0) { throw 'Boulder LOD asset push failed.' }

      - name: Upload Boulder authoring evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-boulder-lod-author-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GBoulderLOD/**
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          git reset --hard
          git clean -ffdx

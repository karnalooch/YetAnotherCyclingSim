name: YACS runner space recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yacs-unreal-ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    name: Preview stale runner retention candidates
    if: ${{ github.actor == github.repository_owner && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 30
    steps:
      - name: Checkout retention control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _runner-retention-control
          lfs: false
          persist-credentials: false
      - name: Preview only; never sweep from an active worker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & D:/yacs/project/.venv/Scripts/python.exe _runner-retention-control/scripts/runner/archive_stale_probe_runs.py
          if ($LASTEXITCODE -ne 0) { throw 'Retention preview failed; no cleanup applied.' }
          Write-Host 'Apply the hash-bound reviewed plan only from an idle maintenance session.'

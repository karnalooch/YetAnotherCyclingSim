name: Reusable Unreal CI

on:
  workflow_call:

permissions: {}

concurrency:
  group: yacs-unreal-ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  unreal:
    name: Unreal build and Automation
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GIT_LFS_SKIP_SMUDGE: "1"

    env:
      GIT_CONFIG_GLOBAL: ${{ runner.temp }}\yacs-global.gitconfig
      GIT_CONFIG_NOSYSTEM: "1"

    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Content -LiteralPath $env:GIT_CONFIG_GLOBAL -Value '' -Encoding ascii
          Write-Host "Using isolated Git config: $env:GIT_CONFIG_GLOBAL"
          git config --global --list --show-origin

      - name: Checkout exact caller revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: false
          clean: true
          persist-credentials: false

      - name: Enforce code-only checkout
        shell: pwsh
        run: |
          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1

      - name: Verify runner provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') {
            throw "checkout HEAD '$actual' != caller SHA '${{ github.sha }}'"
          }
          git status --short

      - name: Build editor and run scoped Automation
        shell: pwsh
        run: |
          ./scripts/ci/Invoke-YacsUnrealCi.ps1 -ExpectedHead '${{ github.sha }}'

      - name: Upload concise Unreal proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unreal-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Unreal/**/*.json
            Saved/RuntimeProof/CI/Unreal/**/*.txt
            Saved/RuntimeProof/CI/Unreal/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Clean workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          git reset --hard
          git clean -ffdx

name: Reusable Unreal CI

on:
  workflow_call:
    inputs:
      target_sha:
        description: Exact source revision to validate.
        required: true
        type: string
      compile_fingerprint:
        description: Deterministic identity of inputs that can change Editor binaries.
        required: true
        type: string
      proof_fingerprint:
        description: Deterministic identity of code-only Unreal proof/runtime inputs.
        required: true
        type: string
      region_terrain_import:
        description: Explicit owner-approved Sa Calobra migration import checkpoint.
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: yacs-unreal-ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  unreal:
    name: Unreal build and Automation
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      GIT_LFS_SKIP_SMUDGE: "1"
      YACS_UNREAL_WORKTREE: _unreal-ci-warm

    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV
          Write-Host "Using isolated Git config: $isolated"
          git config --global --list --show-origin

      - name: Bootstrap cleanup helper outside persistent worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _bootstrap-cleanup
          fetch-depth: 1
          lfs: false
          clean: true
          persist-credentials: false

      - name: Release stale Unreal workspace locks
        shell: pwsh
        run: |
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE '_bootstrap-cleanup/scripts/ci/Release-YacsUnrealWorkspaceLocks.ps1'
          & $bootstrap -Workspace $env:GITHUB_WORKSPACE
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '_bootstrap-cleanup') -Recurse -Force

      - name: Checkout exact caller revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.YACS_UNREAL_WORKTREE }}
          ref: ${{ inputs.target_sha }}
          fetch-depth: 20
          lfs: false
          clean: false
          persist-credentials: false

      - name: Retain previous owner-handoff LFS payloads before sanitization
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE '_yacs-retained-lfs/handoff-${{ github.run_id }}-${{ github.run_attempt }}'
          python scripts/ci/retain_unreal_assets.py --workspace (Get-Location).Path --archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Previous owner-handoff LFS retention failed; do not sanitize the worktree.' }

      - name: Sanitize tracked workspace while preserving verified build outputs
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard '${{ inputs.target_sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Unreal warm-worktree reset failed.' }
          git clean -ffdx -e '/Binaries/' -e '/Intermediate/' -e '/Plugins/**/Binaries/' -e '/Plugins/**/Intermediate/' -e '/Saved/BuildCache/UnrealCi/' -e '/Saved/Logs/YetAnotherCyclingSim.log' -e '/Saved/RuntimeProof/CI/RegionTerrain/*/*.log' -e '/Saved/RuntimeProof/CI/Unreal/Proof/automation_editor.log' -e '/Saved/RuntimeProof/CI/Unreal/Proof/automation_run.log' -e '/Saved/RuntimeProof/CI/Unreal/Proof-*/automation_editor.log' -e '/Saved/RuntimeProof/CI/Unreal/Proof-*/automation_run.log'
          if ($LASTEXITCODE -ne 0) { throw 'Unreal warm-worktree allow-listed clean failed.' }

      - name: Enforce code-only checkout
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1

      - name: Verify exact SHA and clean tracked state
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ inputs.target_sha }}') {
            throw "checkout HEAD '$actual' != caller SHA '${{ inputs.target_sha }}'"
          }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw 'Warm Unreal worktree is not clean after sanitization.'
          }

      - name: Reset current-run Unreal proof evidence
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $proof = Join-Path (Get-Location) 'Saved/RuntimeProof/CI/Unreal'
          if (Test-Path -LiteralPath $proof) {
            # Retain only diagnostic logs; all reusable receipts are removed.
            Get-ChildItem -LiteralPath $proof -Recurse -File |
              Where-Object { $_.Extension -ne ".log" } |
              Remove-Item -Force
          }

      - name: Resolve verified Unreal execution mode
        id: cache
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          ./scripts/ci/Resolve-YacsUnrealCiCache.ps1 `
            -Action Resolve `
            -ExpectedHead '${{ inputs.target_sha }}' `
            -ExpectedCompileFingerprint '${{ inputs.compile_fingerprint }}' `
            -ExpectedProofFingerprint '${{ inputs.proof_fingerprint }}' `
            -GithubOutput $env:GITHUB_OUTPUT

      - name: Purge incompatible build cache
        if: ${{ steps.cache.outputs.purge_build_cache == 'true' }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @('Binaries', 'Intermediate')) {
            if (Test-Path -LiteralPath $relative) {
              Remove-Item -LiteralPath $relative -Recurse -Force
            }
          }
          if (Test-Path -LiteralPath 'Plugins') {
            Get-ChildItem -LiteralPath 'Plugins' -Directory | ForEach-Object {
              foreach ($leaf in @('Binaries', 'Intermediate')) {
                $candidate = Join-Path $_.FullName $leaf
                if (Test-Path -LiteralPath $candidate) {
                  Remove-Item -LiteralPath $candidate -Recurse -Force
                }
              }
            }
          }

      - name: Build or run runtime-only Automation
        if: ${{ steps.cache.outputs.mode != 'static' }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        env:
          YACS_UNREAL_EXECUTION_MODE: ${{ steps.cache.outputs.mode }}
          YACS_UNREAL_COMPILE_KIND: ${{ steps.cache.outputs.compile_kind }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:YACS_UNREAL_EXECUTION_MODE -eq 'compile') {
            Write-Host ("Unreal compile path: {0}" -f $env:YACS_UNREAL_COMPILE_KIND) -ForegroundColor Cyan
            ./scripts/ci/Invoke-YacsUnrealCi.ps1 -ExpectedHead '${{ inputs.target_sha }}'
          }
          elseif ($env:YACS_UNREAL_EXECUTION_MODE -eq 'runtime') {
            ./scripts/ci/Invoke-YacsUnrealCi.ps1 -ExpectedHead '${{ inputs.target_sha }}' -SkipBuild
          }
          else {
            throw "Unexpected Unreal execution mode '$env:YACS_UNREAL_EXECUTION_MODE'."
          }

      - name: Record verified Unreal state
        if: ${{ steps.cache.outputs.mode != 'static' }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          ./scripts/ci/Resolve-YacsUnrealCiCache.ps1 `
            -Action Record `
            -CompletedMode '${{ steps.cache.outputs.mode }}' `
            -CompletedCompileKind '${{ steps.cache.outputs.compile_kind }}' `
            -ExpectedHead '${{ inputs.target_sha }}' `
            -ExpectedCompileFingerprint '${{ inputs.compile_fingerprint }}' `
            -ExpectedProofFingerprint '${{ inputs.proof_fingerprint }}'

      - name: Report equivalent exact-head proof reuse
        if: ${{ steps.cache.outputs.mode == 'static' }}
        shell: pwsh
        run: |
          Write-Host "STATIC Unreal equivalence proof: exact HEAD ${{ inputs.target_sha }}"
          Write-Host "Compile and proof fingerprints match a previously green run."
          Write-Host "Reason: ${{ steps.cache.outputs.reason }}"
          Write-Host "Compile kind: ${{ steps.cache.outputs.compile_kind }}"

      # Bootstrap the approved region migration inside the existing same-repo
      # CI boundary. This is an import diagnostic, never a broker PASS receipt.
      - name: Materialize verified Sa Calobra source and required editor startup assets
        if: ${{ inputs.region_terrain_import }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'worldgen/terrain/benchmarks/sa_calobra/sa_calobra_8x8km_mdt50cm_epsg25831.tif'
          # A persistent checkout can retain CRLF bytes created before -text
          # source attributes were introduced. Rematerialize from the exact
          # index, then verify before any expensive editor work.
          $pinnedResponses = @{
            'worldgen/terrain/benchmarks/sa_calobra/ma2141_cartociudad_source_2026-10-02.json' = '6520b92486b5d1c63353b8253d388ab21d380c78fda119849311be8344d8ae36'
            'worldgen/terrain/benchmarks/sa_calobra/ma2141_igr_rt_source_2026-10-02.json' = 'ebc7c1c985caae5b7727719856646d52824463803d13095462f8d7ef1fcd7d5f'
          }
          foreach ($response in $pinnedResponses.Keys) {
            $restore = @'
          import hashlib, pathlib, subprocess, sys
          path, expected = sys.argv[1:]
          data = subprocess.check_output(['git', 'show', 'HEAD:' + path])
          if hashlib.sha256(data).hexdigest() != expected:
              raise SystemExit('Pinned response Git blob hash mismatch: ' + path)
          pathlib.Path(path).write_bytes(data)
          '@
            python -c $restore "$response" "$($pinnedResponses[$response])"
            if ($LASTEXITCODE -ne 0) { throw "Pinned response restore failed: $response" }
            $actual = (Get-FileHash -LiteralPath $response -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Pinned response SHA256: $actual ($response)"
            if ($actual -ne $pinnedResponses[$response]) { throw "Pinned response hash mismatch before editor startup: $response" }
            git check-attr --all -- "$response"
            git rev-parse "HEAD:$response" ":$response"
            git hash-object --no-filters "$response"
            git diff --raw -- "$response"
            git diff --numstat -- "$response"
          }
          git update-index --refresh
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source checkout did not refresh to a clean Git index.' }
          $env:GIT_LFS_SKIP_SMUDGE = '0'
          try {
            git lfs install --local --skip-smudge
            if ($LASTEXITCODE -ne 0) { throw 'Local LFS driver installation failed.' }
            # Unreal's asset registry scans Content at editor/commandlet startup.
            # Shared prototype CDOs also load materials there; pointers are not
            # valid packages even when the imported map uses engine-only shading.
            git -c "lfs.fetchinclude=$source,Content/**" -c 'lfs.fetchexclude=' lfs fetch origin '${{ inputs.target_sha }}'
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Sa Calobra LFS object fetch failed.' }
            git lfs checkout "$source"
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Sa Calobra LFS object checkout failed.' }
            git lfs checkout 'Content/**'
            if ($LASTEXITCODE -ne 0) { throw 'Shared editor startup asset checkout failed.' }
            $contentPaths = @(git lfs ls-files --name-only --include='Content/**')
            if ($LASTEXITCODE -ne 0) { throw 'Startup LFS inventory failed.' }
            foreach ($path in $contentPaths) {
              git lfs pointer --check "--file=$path" *> $null
              if ($LASTEXITCODE -eq 0) { throw "Unmaterialized startup package: $path" }
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing startup package: $path" }
            }
            $bytes = (Get-Item -LiteralPath $source).Length
            Write-Host "Sa Calobra source bytes after checkout: $bytes"
            if ($bytes -ne 389039616) { throw 'Sa Calobra TIFF is still a pointer or has the wrong byte count.' }
          }
          finally { $env:GIT_LFS_SKIP_SMUDGE = '1' }
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 rasterio==1.5.2 pyproj==3.8.0 Pillow==12.3.0 shapely==2.1.2
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native terrain dependencies failed to install.' }
          ./scripts/ue/Invoke-YacsRegionTerrainImport.ps1 `
            -ExpectedBranch 'HEAD' `
            -ExpectedHead '${{ inputs.target_sha }}' `
            -PrepareRoadPlan `
            -ArtifactRoot 'Saved/RuntimeProof/CI/RegionTerrain/${{ github.run_id }}-${{ github.run_attempt }}'
          if ($LASTEXITCODE -ne 0) { throw 'Sa Calobra native terrain import failed.' }

      - name: Prepare bounded official Ma-2141 native alignment diagnostic
        if: ${{ inputs.region_terrain_import }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'Saved/RuntimeProof/CI/RegionTerrain/${{ github.run_id }}-${{ github.run_attempt }}'
          python scripts/assets/prepare_ma2141_diagnostic.py `
            --prepared-terrain "$root/Prepared" `
            --output "$root/ma2141-native-alignment.json" `
            --exact-sha '${{ inputs.target_sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Ma-2141 native alignment diagnostic failed.' }
          python scripts/assets/prepare_ma2141_profile.py `
            --prepared-terrain "$root/Prepared" `
            --output "$root/ma2141-profile-candidate.json" `
            --curved-edges "$root/ma2141-curved-edges.json" `
            --exact-sha '${{ inputs.target_sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Ma-2141 profile assessment failed.' }
          $profile = Get-Content "$root/ma2141-profile-candidate.json" -Raw | ConvertFrom-Json
          if ($profile.presentation_plan.status -ne 'PASS' -or
              $profile.presentation_plan.recipe -ne 'native-cliff-convex-bend-v4' -or
              $profile.source_xy_preserved -ne $false -or
              $profile.canonical_source_xy_preserved -ne $true) {
            throw 'Native curved pavement plan was not validated.'
          }
          python scripts/assets/prepare_ma2141_road_preview.py `
            --prepared-terrain "$root/Prepared" `
            --output "$root/ma2141-road-preview.json" `
            --exact-sha '${{ inputs.target_sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Ma-2141 pavement trial preparation failed.' }
          python scripts/assets/prepare_ma2141_cut_patch.py `
            --prepared-terrain "$root/Prepared" `
            --profile "$root/ma2141-profile-candidate.json" `
            --output-manifest "$root/ma2141-cut-patch.json" `
            --output-f32 "$root/ma2141-cut-patch.f32" `
            --exact-sha '${{ inputs.target_sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'BOB bounded Road_Earthworks CUT patch preparation failed.' }
          python scripts/assets/prepare_current_landscape_roads.py `
            --prepared-terrain "$root/Prepared" `
            --output-dir "$root/Network" `
            --exact-sha '${{ inputs.target_sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Current Landscape network preparation failed.' }

      - name: Capture isolated native Sa Calobra terrain
        if: ${{ inputs.region_terrain_import }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path (Get-Location) 'Saved/RuntimeProof/CI/RegionTerrain/${{ github.run_id }}-${{ github.run_attempt }}'
          $env:YACS_TERRAIN_CAPTURE_ROOT = $root
          $env:YACS_TERRAIN_SHA = '${{ inputs.target_sha }}'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $project = Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject'
          $engine = Resolve-YacsUnrealEngine -ProjectPath $project
          $script = Join-Path (Get-Location) 'scripts/ue/capture_region_terrain.py'
          $arguments = @(('"' + $project + '"'), ('-ExecutePythonScript="' + $script + '"'), '-Unattended', '-NoPause', '-NoSplash', '-NoP4', '-windowed', '-ResX=1920', '-ResY=1080', '-NoVSync', '-FixedSeed', '-ScriptErrorsAreFatal', '-stdout', ('-AbsLog="' + (Join-Path $root 'capture.engine.log') + '"'))
          $process = Start-Process -FilePath $engine.UnrealEditorPath -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $root 'capture.stdout.log') -RedirectStandardError (Join-Path $root 'capture.stderr.log')
          if (-not $process.WaitForExit(300000)) {
            $process | Stop-Process -Force
            throw 'Sa Calobra terrain capture timed out.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Terrain capture editor exit $($process.ExitCode)."
          }
          $proof = Get-Content (Join-Path $root 'terrain-capture-proof.json') -Raw | ConvertFrom-Json
          if (
            $proof.technical_capture_status -ne 'PASS' -or
            $proof.exact_sha -ne '${{ inputs.target_sha }}' -or
            $proof.captures.Count -ne 10 -or
            $proof.bob_mode -ne 'INSPECTOR_PLUS_TRANSIENT_CUT_AND_VERTICAL_SUPPORT' -or
            $proof.road_geometry_inspection_required -ne $true
          ) { throw 'Terrain capture proof failed.' }

          $network = Get-Content (Join-Path $root 'network-native-proof.json') -Raw | ConvertFrom-Json
          if ($network.exact_sha -ne '${{ inputs.target_sha }}' -or
              $network.approved_length_m -le 0 -or $network.base_dtm_modified -ne $false -or
              $network.map_saved -ne $false -or
              @($network.windows | Where-Object { $_.asphalt_penetration_count -ne 0 }).Count -ne 0) {
            throw 'Current-Landscape native network proof failed.'
          }

          $fitPath = Join-Path $root 'ma2141-road-terrain-fit-proof.json'
          if (-not (Test-Path -LiteralPath $fitPath -PathType Leaf)) {
            throw 'BOB road-to-terrain fit proof is missing.'
          }
          $fit = Get-Content $fitPath -Raw | ConvertFrom-Json
          if (
            $fit.status -ne 'REVIEW_REQUIRED' -or
            $fit.inspection_complete -ne $true -or
            $fit.role -ne 'INSPECTOR_ONLY' -or
            $fit.sample_count -ne 60025 -or
            $fit.evaluated_sample_count -ne 60025 -or
            $fit.trace_miss_count -ne 0 -or
            $fit.geometry_inspection_view -ne 'road-geometry-inspection-before' -or
            $fit.earthworks_authoring_permitted -ne $false -or
            $fit.geometry_repair_executed -ne $false
          ) { throw 'BOB road-to-terrain fit inspection failed.' }
          $classified = (
            [int]$fit.class_counts.CONTACT_OK +
            [int]$fit.class_counts.CUT_REQUIRED +
            [int]$fit.class_counts.FILL_REQUIRED +
            [int]$fit.class_counts.STRUCTURE_REVIEW
          )
          if ($classified -ne 60025) {
            throw 'BOB terrain-fit classification does not cover every ribbon sample.'
          }

          $cutPath = Join-Path $root 'bob-road-earthworks-cut-proof.json'
          if (-not (Test-Path -LiteralPath $cutPath -PathType Leaf)) {
            throw 'BOB Road_Earthworks CUT proof is missing.'
          }
          python -m scripts.geometry.road_cut_limits --artifact-root $root
          if ($LASTEXITCODE -ne 0) { throw 'BOB CUT receipt spatial policy failed.' }
          $cut = Get-Content $cutPath -Raw | ConvertFrom-Json
          if (
            $cut.exact_sha -ne '${{ inputs.target_sha }}' -or
            $cut.operation -ne 'CUT_ONLY' -or
            $cut.selected_layer -ne 'Road_Earthworks' -or
            $cut.base_layer -ne 'Base_DTM' -or
            $cut.geometry_repair_executed -ne $true -or
            $cut.transient_road_earthworks_modified -ne $true -or
            $cut.base_dtm_modified -ne $false -or
            $cut.map_saved -ne $false -or
            $cut.fill_authored -ne $false -or
            $cut.structures_authored -ne $false -or
            [int]$cut.patch_modified_vertex_count -le 0 -or
            [double]$cut.patch_max_cut_m -gt ([double]$cut.patch_cut_limits.cliff_m + 0.000001) -or
            [int]$cut.before.class_counts.CUT_REQUIRED -ne [int]$fit.class_counts.CUT_REQUIRED -or
            [int]$cut.before.class_counts.STRUCTURE_REVIEW -ne 0 -or
            [int]$cut.after.class_counts.CUT_REQUIRED -ne 0 -or
            [int]$cut.after.class_counts.STRUCTURE_REVIEW -ne 0 -or
            [int]$cut.after.trace_miss_count -ne 0 -or
            $cut.road_admitted -ne $false -or
            $cut.eligible_for_learning -ne $false
          ) { throw 'BOB direct Road_Earthworks CUT proof failed.' }

          # CUT-only remains a historical rejected recipe when it creates fill.
          # The new visual recipe closes those sides with explicit support mesh.
          $support = Get-Content (Join-Path $root 'bob-vertical-support-proof.json') -Raw | ConvertFrom-Json
          if (
            $support.exact_sha -ne '${{ inputs.target_sha }}' -or
            $support.recipe_id -ne 'bob-vertical-support-v1' -or
            $support.status -ne 'GEOMETRY_BUILT_VISUAL_REVIEW_PENDING' -or
            $support.shoulder_m -ne 0.5 -or
            $support.min_shoulder_extent_m -lt 0.4999 -or
            $support.max_shoulder_extent_m -gt 0.51 -or
            $support.station_count -ne 2401 -or
            $support.ground_trace_count -ne 4802 -or
            $support.wall_segment_count -le 0 -or
            $support.base_dtm_modified -ne $false -or
            $support.map_saved -ne $false -or
            $support.road_admitted -ne $false
          ) { throw 'BOB vertical support geometry proof failed.' }
          $supportView = @($proof.captures | Where-Object { $_.name -eq 'road-geometry-inspection-support' })
          if ($supportView.Count -ne 1 -or $supportView[0].actual_viewmode -ne 'VMI_CLAY') {
            throw 'BOB vertical support neutral capture missing.'
          }

          $beforeInspection = @(
            $proof.captures | Where-Object {
              $_.name -eq 'road-geometry-inspection-before'
            }
          )
          $afterInspection = @(
            $proof.captures | Where-Object {
              $_.name -eq 'road-geometry-inspection-after'
            }
          )
          foreach ($inspection in @($beforeInspection[0], $afterInspection[0])) {
            if (
              $null -eq $inspection -or
              $inspection.viewmode -ne 'geometry-inspection-clay-wireframe' -or
              $inspection.geometry_inspection -ne $true -or
              $inspection.inspection_mode -ne 'VMI_CLAY' -or
              $inspection.actual_viewmode -ne 'VMI_CLAY' -or
              $inspection.mesh_edges -ne $true -or
              $inspection.road_selected -ne $true -or
              $inspection.explicit_road_wireframe -ne $true -or
              $inspection.wireframe_color_rgba.Count -ne 4 -or
              $inspection.wireframe_color_rgba[0] -ne 0.0 -or
              $inspection.wireframe_color_rgba[1] -ne 1.0 -or
              $inspection.wireframe_color_rgba[2] -ne 1.0 -or
              $inspection.wireframe_color_rgba[3] -ne 1.0 -or
              $inspection.force_game_view -ne $false
            ) { throw 'Mandatory road Geometry Inspection before/after proof failed.' }
          }
          if (
            $beforeInspection.Count -ne 1 -or
            $beforeInspection[0].earthworks_state -ne 'BEFORE_CUT' -or
            $afterInspection.Count -ne 1 -or
            $afterInspection[0].earthworks_state -ne 'AFTER_CUT'
          ) { throw 'BOB Geometry Inspection before/after identity failed.' }

          $rider = @(
            $proof.captures | Where-Object { $_.name -eq 'road-contact-rider' }
          )
          if (
            $rider.Count -ne 1 -or
            $rider[0].actual_viewmode -ne 'VMI_LIT'
          ) { throw 'Final road rider capture did not return to Lit mode.' }

      - name: Retire owner-approved obsolete Italy payloads
        if: ${{ inputs.region_terrain_import }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $legacyEditors = @(Get-CimInstance Win32_Process | Where-Object {
            $_.Name -like 'UnrealEditor*' -and $_.CommandLine -match '_embark-terrain-worktree|_terrain-recovery-worktree'
          })
          if ($legacyEditors.Count -gt 0) { throw 'Legacy Italy editor is active; refuse payload retirement.' }
          $root = Join-Path (Get-Location) 'Saved/RuntimeProof/CI/RegionTerrain/${{ github.run_id }}-${{ github.run_attempt }}'
          $plan = Join-Path $root 'italy-retirement-plan.json'
          $receipt = Join-Path $root 'italy-retirement-receipt.json'
          python scripts/ci/retire_italy_payloads.py --workspace "$env:GITHUB_WORKSPACE" --plan "$plan"
          if ($LASTEXITCODE -ne 0) { throw 'Italy payload inventory failed.' }
          python scripts/ci/retire_italy_payloads.py --workspace "$env:GITHUB_WORKSPACE" --plan "$plan" --apply --receipt "$receipt"
          if ($LASTEXITCODE -ne 0) { throw 'Italy payload retirement failed; inspect receipt.' }

      - name: Upload native Sa Calobra import diagnostic
        if: ${{ always() && inputs.region_terrain_import }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sa-calobra-import-${{ inputs.target_sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.YACS_UNREAL_WORKTREE }}/Saved/RuntimeProof/CI/RegionTerrain/${{ github.run_id }}-${{ github.run_attempt }}/**/*.json
            ${{ env.YACS_UNREAL_WORKTREE }}/Saved/RuntimeProof/CI/RegionTerrain/${{ github.run_id }}-${{ github.run_attempt }}/**/*.txt
            ${{ env.YACS_UNREAL_WORKTREE }}/Saved/RuntimeProof/CI/RegionTerrain/${{ github.run_id }}-${{ github.run_attempt }}/**/*.png
            ${{ env.YACS_UNREAL_WORKTREE }}/Saved/RuntimeProof/CI/RegionTerrain/${{ github.run_id }}-${{ github.run_attempt }}/**/*.f32
          if-no-files-found: error
          retention-days: 14

      - name: Upload concise Unreal proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unreal-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.YACS_UNREAL_WORKTREE }}/Saved/RuntimeProof/CI/Unreal/**/*.json
            ${{ env.YACS_UNREAL_WORKTREE }}/Saved/RuntimeProof/CI/Unreal/**/*.txt
            ${{ env.YACS_UNREAL_WORKTREE }}/Saved/RuntimeProof/CI/Unreal/**/*.log
          if-no-files-found: error
          retention-days: 7

      - name: Launch interactive Sa Calobra owner handoff
        if: inputs.region_terrain_import
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path (Get-Location) 'Saved/RuntimeProof/CI/RegionTerrain/${{ github.run_id }}-${{ github.run_attempt }}'
          $proofPath = Join-Path $root 'owner-handoff-proof.json'
          if (Test-Path -LiteralPath $proofPath) {
            Remove-Item -LiteralPath $proofPath -Force
          }

          $env:YACS_TERRAIN_CAPTURE_ROOT = $root
          $env:YACS_TERRAIN_SHA = '${{ inputs.target_sha }}'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $project = Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject'
          $engine = Resolve-YacsUnrealEngine -ProjectPath $project
          $arguments = @(('"' + $project + '"'), '-NoP4', '-windowed', '-ResX=1920', '-ResY=1080', '-NoVSync', ('-AbsLog="' + (Join-Path $root 'owner-handoff.engine.log') + '"'))

          $runnerTrackingId = $env:RUNNER_TRACKING_ID
          $env:RUNNER_TRACKING_ID = ''
          $env:YACS_OWNER_HANDOFF = '1'
          try {
            $process = Start-Process -FilePath $engine.UnrealEditorPath -ArgumentList $arguments -PassThru
          }
          finally {
            Remove-Item Env:YACS_OWNER_HANDOFF -ErrorAction SilentlyContinue
            if ([string]::IsNullOrEmpty($runnerTrackingId)) {
              Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
            }
            else {
              $env:RUNNER_TRACKING_ID = $runnerTrackingId
            }
          }

          $deadline = [DateTime]::UtcNow.AddSeconds(120)
          while (-not (Test-Path -LiteralPath $proofPath) -and [DateTime]::UtcNow -lt $deadline) {
            $process.Refresh()
            if ($process.HasExited) {
              throw "Owner handoff Editor exited before proof with code $($process.ExitCode)."
            }
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path -LiteralPath $proofPath)) {
            if (-not $process.HasExited) { $process | Stop-Process -Force }
            throw 'Owner handoff proof timed out.'
          }

          $proof = Get-Content $proofPath -Raw | ConvertFrom-Json
          if (
            $proof.status -ne 'PASS' -or
            $proof.exact_sha -ne '${{ inputs.target_sha }}' -or
            $proof.map -ne '/Game/Worlds/SaCalobra/L_SaCalobraTerrainBaseline' -or
            $proof.view -ne 'road-contact-rider' -or
            $proof.viewmode -ne 'VMI_LIT' -or
            $proof.lighting_status -ne 'PASS' -or
            [double]$proof.directional_light_intensity -le 0.0 -or
            [double]$proof.skylight_intensity -le 0.0 -or
            $proof.bob_mode -ne 'INSPECTOR_PLUS_TRANSIENT_CUT_AND_VERTICAL_SUPPORT' -or
            $proof.cut_patch_applied -ne $true -or
            $proof.vertical_support_built -ne $true -or
            $proof.cut_patch_layer -ne 'Road_Earthworks' -or
            $proof.map_saved -ne $false
          ) { throw 'Owner handoff proof failed.' }

          Start-Sleep -Seconds 3
          $process.Refresh()
          if ($process.HasExited) {
            throw "Owner handoff Editor did not remain open; exit code $($process.ExitCode)."
          }
          Write-Host "OWNER HANDOFF PASS: Unreal Editor pid=$($process.Id) remains open on Sa Calobra road-contact-rider in VMI_LIT with transient Road_Earthworks CUT and diagnostic lighting."

      - name: Clean current-run evidence and non-allow-listed residue
        if: ${{ always() && !inputs.region_terrain_import }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $proof = Join-Path (Get-Location) 'Saved/RuntimeProof/CI/Unreal'
          if (Test-Path -LiteralPath $proof) {
            # Retain only diagnostic logs; all reusable receipts are removed.
            Get-ChildItem -LiteralPath $proof -Recurse -File |
              Where-Object { $_.Extension -ne ".log" } |
              Remove-Item -Force
          }
          if (Test-Path -LiteralPath '.git') {
            if ('${{ inputs.region_terrain_import }}' -eq 'true') {
              # Preserve newly authored Spanish assets and the source TIFF;
              # obsolete Italy payload retirement is a separate bounded step.
              $archive = Join-Path $env:GITHUB_WORKSPACE '_yacs-sa-calobra-assets/${{ github.run_id }}-${{ github.run_attempt }}'
              python scripts/ci/retain_unreal_assets.py --workspace (Get-Location).Path --archive $archive
              if ($LASTEXITCODE -ne 0) { throw 'Sa Calobra retention failed; do not reset or clean.' }
            }
            git reset --hard
            if ($LASTEXITCODE -ne 0) { throw 'Unreal warm-worktree cleanup git reset failed.' }
            git clean -ffdx -e '/Binaries/' -e '/Intermediate/' -e '/Plugins/**/Binaries/' -e '/Plugins/**/Intermediate/' -e '/Saved/BuildCache/UnrealCi/' -e '/Saved/Logs/YetAnotherCyclingSim.log' -e '/Saved/RuntimeProof/CI/RegionTerrain/*/*.log' -e '/Saved/RuntimeProof/CI/Unreal/Proof/automation_editor.log' -e '/Saved/RuntimeProof/CI/Unreal/Proof/automation_run.log' -e '/Saved/RuntimeProof/CI/Unreal/Proof-*/automation_editor.log' -e '/Saved/RuntimeProof/CI/Unreal/Proof-*/automation_run.log'
            if ($LASTEXITCODE -ne 0) { throw 'Unreal warm-worktree cleanup allow-listed clean failed.' }
          }
          else {
            Write-Host 'Unreal warm-worktree cleanup: no checkout worktree to clean.'
          }

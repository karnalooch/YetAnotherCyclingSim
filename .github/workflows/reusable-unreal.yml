name: Reusable Unreal CI

on:
  workflow_call:

permissions: {}

concurrency:
  group: yacs-unreal-ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  unreal:
    name: Unreal build and Automation
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout exact caller revision with LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: false

      - name: Verify runner provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') {
            throw "checkout HEAD '$actual' != caller SHA '${{ github.sha }}'"
          }
          git status --short

      - name: Build editor and run scoped Automation
        shell: pwsh
        run: |
          ./scripts/ci/Invoke-YacsUnrealCi.ps1 -ExpectedHead '${{ github.sha }}'

      - name: Upload concise Unreal proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unreal-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Unreal/**/*.json
            Saved/RuntimeProof/CI/Unreal/**/*.txt
            Saved/RuntimeProof/CI/Unreal/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Clean workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          git reset --hard
          git clean -ffdx

name: Official Unreal MCP native plugin probe

on:
  push:
    branches: [codex/384-official-mcp-spike]
    paths:
      - '.github/workflows/official-unreal-mcp-native-probe.yml'
      - 'Plugins/YacsBobInspection/**'
      - 'scripts/ue/Invoke-YacsOfficialMcpNativeProbe.ps1'
      - 'scripts/ue/Read-YacsOfficialMcpRuntimeDependencies.ps1'
      - 'scripts/ue/Read-YacsAcceptedMaterialCheckpoint.ps1'
      - 'scripts/ue/probe_official_mcp_bob_reflection.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: yacs-unreal-ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  compile:
    name: Build isolated BOB plugin and verify its input boundary
    if: >-
      github.actor == github.repository_owner &&
      github.repository == 'karnalooch/YetAnotherCyclingSim' &&
      github.ref == 'refs/heads/codex/384-official-mcp-spike'
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      TARGET_SHA: ${{ github.sha }}
      YACS_WORKSPACE_CONFIG: 'D:\yacs\workspace.json'
    steps:
      - name: Checkout exact code-only native proof in isolated runner directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          path: _official-mcp-native-probe
          fetch-depth: 1
          lfs: false
          clean: false
          persist-credentials: false

      - name: Build and run the fixed bare-project native proof
        shell: pwsh
        working-directory: _official-mcp-native-probe
        env:
          YACS_CHECKPOINT_READ_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1
          foreach ($source in @(
            'scripts/ue/Invoke-YacsOfficialMcpNativeProbe.ps1',
            'scripts/ue/Read-YacsOfficialMcpRuntimeDependencies.ps1',
            'scripts/ue/Read-YacsAcceptedMaterialCheckpoint.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $source), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors.Message -join '; ') }
          }
          ./scripts/ue/Invoke-YacsOfficialMcpNativeProbe.ps1 -ExpectedHead $env:TARGET_SHA

      - name: Retain bounded compile and bare-project proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-mcp-native-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/native-plugin-build.json
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/native-plugin-build.log
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/python-runtime-settings.json
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/runtime-dependencies.json
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/Accepted363/*.json
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/host-project-original.json
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/host-project-probe.json
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/input-boundary-editor.log
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/input-boundary-stdout.log
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/input-boundary-stderr.log
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/InputBoundaryReport/index.json
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpNativeProbe/${{ github.run_id }}-${{ github.run_attempt }}/native-python-reflection.json
          if-no-files-found: error
          retention-days: 7

name: Official Unreal MCP native plugin probe

on:
  push:
    branches: [codex/384-official-mcp-spike]
    paths:
      - '.github/workflows/official-unreal-mcp-native-probe.yml'
      - 'Plugins/YacsBobInspection/**'
      - 'scripts/ue/Invoke-YacsOfficialMcpNativeProbe.ps1'
      - 'scripts/ue/Read-YacsOfficialMcpRuntimeDependencies.ps1'
      - 'scripts/ue/Read-YacsAcceptedMaterialCheckpoint.ps1'
      - 'scripts/ue/probe_official_mcp_bob_reflection.py'
      - 'scripts/ue/Invoke-YacsOfficialMcpBobSession.ps1'
      - 'scripts/ue/bootstrap_official_mcp_bob_session.py'
      - 'scripts/ue/official_mcp_bob_operation.py'
      - 'scripts/committed_git_blobs.py'
      - 'scripts/ci/official_mcp_bob_session.py'
      - 'scripts/ci/official_mcp_bob_client.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Fixed accepted checkpoint session, or InputBoundary with authenticated compiled plugin reuse
        type: choice
        options: [accepted_session, diagnose_previous_failure]
        default: diagnose_previous_failure
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: yacs-unreal-ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  compile:
    name: Verify InputBoundary with authenticated compiled plugin reuse
    if: >-
      github.actor == github.repository_owner &&
      github.repository == 'karnalooch/YetAnotherCyclingSim' &&
      github.ref == 'refs/heads/codex/384-official-mcp-spike'
    runs-on: [self-hosted, yacs-ue58]
    # Two independently bounded 20-minute builds plus the 420-second session
    # and staging must leave time for owned-process cleanup and evidence upload.
    timeout-minutes: 60
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      TARGET_SHA: ${{ github.sha }}
      YACS_WORKSPACE_CONFIG: 'D:\yacs\workspace.json'
    steps:
      - name: Checkout exact code-only native proof in isolated runner directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          path: _official-mcp-native-probe
          fetch-depth: 1
          lfs: false
          clean: false
          persist-credentials: false

      - name: Verify exact sources and run the fixed session or retained-build unit
        shell: pwsh
        working-directory: _official-mcp-native-probe
        env:
          YACS_CHECKPOINT_READ_TOKEN: ${{ github.token }}
          NATIVE_PROBE_MODE: ${{ github.event.inputs.mode || 'diagnose_previous_failure' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkoutRoot = (Get-Location).Path
          $expectedCheckoutRoot = Join-Path $env:GITHUB_WORKSPACE '_official-mcp-native-probe'
          if (-not [string]::Equals($checkoutRoot, $expectedCheckoutRoot, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'The fixed JSON rewrite requires this Actions isolated checkout.'
          }
          $fixedJsonPaths = @('.gumball/candidates/scoped-agent-role-authority-routing.json', 'docs/ai/ROLE_REGISTRY.json')
          $beforeRewrite = @()
          foreach ($relative in $fixedJsonPaths) {
            $entry = Get-Item -LiteralPath (Join-Path $checkoutRoot $relative) -Force
            if ($entry.PSIsContainer -or $entry.Length -le 0 -or $entry.Length -gt 64KB) { throw 'A fixed JSON rewrite input is not a bounded nonempty regular file.' }
            $beforeRewrite += [ordered]@{ relative_path = $relative; size_bytes = $entry.Length }
            $cursor = [IO.Path]::GetFullPath((Join-Path $checkoutRoot $relative))
            while ($cursor) {
              if ([IO.File]::GetAttributes($cursor) -band [IO.FileAttributes]::ReparsePoint) { throw 'The fixed JSON rewrite refuses reparse paths.' }
              $cursor = [IO.Path]::GetDirectoryName($cursor)
            }
          }
          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          if ($gitCommand -isnot [System.Management.Automation.ApplicationInfo] -or $gitCommand.Source -isnot [string] -or
              [string]::IsNullOrWhiteSpace($gitCommand.Source) -or $gitCommand.Source.Length -gt 1024) { throw 'The fixed JSON rewrite requires one bounded Git executable path.' }
          $checkoutHead = @(& $gitCommand.Source rev-parse HEAD)
          if ($LASTEXITCODE -ne 0 -or $checkoutHead.Count -ne 1 -or $checkoutHead[0] -cne $env:TARGET_SHA) { throw 'The fixed JSON rewrite requires the exact Actions target HEAD.' }
          & $gitCommand.Source diff --cached --quiet --no-ext-diff --no-textconv HEAD -- .gitattributes .gumball/candidates/scoped-agent-role-authority-routing.json docs/ai/ROLE_REGISTRY.json
          if ($LASTEXITCODE -ne 0) { throw 'The fixed JSON rewrite refuses an index differing from target HEAD.' }
          & $gitCommand.Source diff --quiet --no-ext-diff --no-textconv HEAD -- .gitattributes .gumball/candidates/scoped-agent-role-authority-routing.json docs/ai/ROLE_REGISTRY.json
          if ($LASTEXITCODE -ne 0) { throw 'The fixed JSON rewrite refuses index or working content differing from target HEAD.' }
          $ownedRewrite = $null
          try {
            # Git's cached stat can keep old CRLF bytes despite --force.
            # Remove only these recoverable tracked files before restoring them.
            foreach ($relative in $fixedJsonPaths) {
              $path = Join-Path $checkoutRoot $relative
              $entry = Get-Item -LiteralPath $path -Force
              if ($entry.PSIsContainer -or ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $entry.Length -le 0 -or $entry.Length -gt 64KB) { throw 'The fixed JSON deletion requires the checked regular tracked file.' }
              [IO.File]::Delete($path)
            }
            $ownedRewrite = Start-Process -FilePath $gitCommand.Source -WorkingDirectory $checkoutRoot -PassThru -NoNewWindow -ArgumentList @(
              'checkout-index', '--force', '--', '.gumball/candidates/scoped-agent-role-authority-routing.json', 'docs/ai/ROLE_REGISTRY.json'
            )
            if (-not $ownedRewrite.WaitForExit(30000)) { throw 'The fixed JSON checkout exceeded thirty seconds.' }
            $ownedRewrite.WaitForExit()
            if ($ownedRewrite.ExitCode -ne 0) { throw 'The fixed JSON checkout failed.' }
            $afterRewrite = @()
            foreach ($relative in $fixedJsonPaths) {
              $entry = Get-Item -LiteralPath (Join-Path $checkoutRoot $relative) -Force
              if ($entry.PSIsContainer -or ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $entry.Length -le 0 -or $entry.Length -gt 64KB) { throw 'A rewritten JSON is not a bounded nonempty regular file.' }
              $afterRewrite += [ordered]@{ relative_path = $relative; size_bytes = $entry.Length }
            }
            $rewriteJson = [ordered]@{ path_count = 2; exit_code = 0; scope = 'CURRENT_ISOLATED_CHECKOUT_METADATA'; before = $beforeRewrite; after = $afterRewrite } | ConvertTo-Json -Depth 4 -Compress
            if ([Text.Encoding]::UTF8.GetByteCount($rewriteJson) -gt 2KB) { throw 'The fixed JSON rewrite metadata exceeds its2KiB bound.' }
            Write-Host ('MAIN_JSON_CHECKOUT_REWRITTEN ' + $rewriteJson)
          } finally {
            if ($null -ne $ownedRewrite) {
              try {
                if (-not $ownedRewrite.HasExited) {
                  $ownedRewrite.Kill($true)
                  if (-not $ownedRewrite.WaitForExit(10000)) { throw 'The owned JSON rewrite exit was not observed.' }
                }
              } finally { $ownedRewrite.Dispose() }
            }
          }
          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1
          foreach ($source in @(
            'scripts/ue/Invoke-YacsOfficialMcpNativeProbe.ps1',
            'scripts/ue/Invoke-YacsOfficialMcpBobSession.ps1',
            'scripts/ue/Read-YacsOfficialMcpRuntimeDependencies.ps1',
            'scripts/ue/Read-YacsAcceptedMaterialCheckpoint.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $source), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors.Message -join '; ') }
          }
          if ($env:NATIVE_PROBE_MODE -ceq 'diagnose_previous_failure') {
            ./scripts/ue/Invoke-YacsOfficialMcpBobSession.ps1 -ExpectedHead $env:TARGET_SHA -DiagnosePreviousFailure
          } elseif ($env:NATIVE_PROBE_MODE -ceq 'accepted_session') {
            ./scripts/ue/Invoke-YacsOfficialMcpBobSession.ps1 -ExpectedHead $env:TARGET_SHA
          } else { throw 'Unsupported fixed native proof mode.' }

      - name: Retain fixed accepted session evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-mcp-session-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpBobSession/${{ github.run_id }}-${{ github.run_attempt }}/*.json
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpBobSession/${{ github.run_id }}-${{ github.run_attempt }}/*.log
            _official-mcp-native-probe/Saved/RuntimeProof/OfficialMcpBobSession/${{ github.run_id }}-${{ github.run_attempt }}/input-boundary-report/index.json
            D:/yacs/runner/_work/s384/${{ github.run_id }}-${{ github.run_attempt }}/Saved/RuntimeProof/OfficialMcpBob/session-preparation.json
            D:/yacs/runner/_work/s384/${{ github.run_id }}-${{ github.run_attempt }}/Saved/RuntimeProof/OfficialMcpBob/session-context.json
            D:/yacs/runner/_work/s384/${{ github.run_id }}-${{ github.run_attempt }}/Saved/RuntimeProof/OfficialMcpBob/transport-context.json
            D:/yacs/runner/_work/s384/${{ github.run_id }}-${{ github.run_attempt }}/Saved/RuntimeProof/OfficialMcpBob/native-counter.json
            D:/yacs/runner/_work/s384/${{ github.run_id }}-${{ github.run_attempt }}/Saved/RuntimeProof/OfficialMcpBob/native-session.json
            D:/yacs/runner/_work/s384/${{ github.run_id }}-${{ github.run_attempt }}/Saved/RuntimeProof/OfficialMcpBob/transport-receipt.json
            D:/yacs/runner/_work/s384/${{ github.run_id }}-${{ github.run_attempt }}/Saved/RuntimeProof/OfficialMcpBob/bundle/*.json
          if-no-files-found: error
          retention-days: 7

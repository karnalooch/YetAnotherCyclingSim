name: Issue 293 bounded source snapshot
on:
  push:
    branches: [ci/293-source-inspection]
    paths: ['.github/workflows/293-source-snapshot.yml']
permissions: {}
concurrency:
  group: issue-293-source-preparation
  cancel-in-progress: false
jobs:
  dispatch-reviewed-isolation:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/ci/293-source-inspection' && github.actor == 'karnalooch' && github.triggering_actor == 'karnalooch' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Verify the exact reviewed branch and dispatch one full isolation checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import quote
          repo = 'karnalooch/YetAnotherCyclingSim'
          branch = 'fix/293-macro-landscape'
          sha = 'e330aa97608a61a0965b23a0cd1f0799c6ab61e3'
          workflow = 'passo-giau-embark-terrain.yml'
          request_id = 'manual-m3-pr294-e330aa97608a-isolation'
          def api(path, data=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data).encode(),
                  method='GET' if data is None else 'POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=40) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f'GitHub request failed: {exc.code} {exc.read().decode()[:1000]}') from None
          pr = api('/pulls/294')
          if pr['state'] != 'open' or pr['head']['sha'] != sha or pr['head']['ref'] != branch or pr['head']['repo']['full_name'] != repo:
              raise SystemExit('Reviewed PR revision drifted; no dispatch')
          ref = api('/git/ref/heads/' + branch)
          if ref['object']['sha'] != sha:
              raise SystemExit('Branch changed; no dispatch')
          content = api('/contents/.github/workflows/' + workflow + '?ref=' + sha)
          if content['sha'] != '13bbd04e5eba91f8f52927cf441bf6a06f5c5a85':
              raise SystemExit('Workflow definition is not reviewed')
          runs = api('/actions/workflows/' + workflow + '/runs?event=workflow_dispatch&per_page=100')['workflow_runs']
          existing = [run for run in runs if request_id in run.get('display_title', '') or request_id in run.get('name', '')]
          if existing:
              print('Existing request retained; not dispatching twice: ' + str(existing[0]['id']))
          else:
              api('/actions/workflows/' + workflow + '/dispatches', {'ref': branch, 'inputs': {'exact_sha': sha, 'gumball_request_id': request_id, 'include_surface_isolation': 'true'}})
              print('DISPATCH_ACCEPTED=' + request_id)
              print('Exact target: ' + sha + '; A-E/C3 plus explicit F/G. No repository ref changes.')
          PY

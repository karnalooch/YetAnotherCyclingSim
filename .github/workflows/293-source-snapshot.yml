name: Issue 293 bounded source snapshot
on:
  push:
    branches: [ci/293-source-inspection]
    paths: ['.github/workflows/293-source-snapshot.yml']
permissions: {}
concurrency:
  group: issue-293-source-preparation
  cancel-in-progress: false
jobs:
  inspect-installed-landscape-api:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/ci/293-source-inspection' && github.actor == 'karnalooch' && github.triggering_actor == 'karnalooch' && github.event_name == 'push' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Isolate Git configuration for the separate read-only checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'issue293-api-read.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV
          'GIT_LFS_SKIP_SMUDGE=1' >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e330aa97608a61a0965b23a0cd1f0799c6ab61e3
          path: _issue293-api-inspection
          lfs: false
          persist-credentials: false
      - name: Report installed public signatures and bounded spline implementation evidence
        shell: pwsh
        working-directory: _issue293-api-inspection
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $ue = Resolve-YacsUnrealEngine -ProjectPath (Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject')
          $root = $ue.Root
          if (-not $root) { throw 'Canonical resolver did not return Root.' }
          Write-Host ('Inspected engine: ' + $ue.Version)
          $specs = @(
            @{ file='Engine/Source/Runtime/Landscape/Classes/Landscape.h'; pattern='GetLayer\(|GetEditLayer|GetLayerAlpha|GetLayerBlendMode|SetLayerReservedForSplines|GetLandscapeSplinesReservedLayer|GetEditingLayer' },
            @{ file='Engine/Source/Runtime/Landscape/Classes/LandscapeEditLayer.h'; pattern='GetGuid|GetNameBP|GetBlendMode|GetHeightmapBlend|OnLayerCreated|IsVisible|GetAlpha|GetName\(' },
            @{ file='Engine/Source/Runtime/Landscape/Public/LandscapeEdit.h'; pattern='FLandscapeEditDataInterface\(|GetHeightDataFast\(|SetEditLayer|SetHeightData\(' },
            @{ file='Engine/Source/Runtime/Landscape/Private/LandscapeBlueprintSupport.cpp'; pattern='EditorApplySpline|LandscapeEdit\(|GetHeightData|SetHeightData|Rasterize|EditingLayer|BlendMode|LayerIndex' }
          )
          foreach ($spec in $specs) {
            $path = Join-Path $root $spec.file
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { Write-Host ('NOT_INSTALLED=' + $spec.file); continue }
            Write-Host ('FILE=' + $spec.file + ' SHA256=' + (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)
            # Public signatures or short relevant lines only; never distribute complete engine sources.
            $matches = @(Select-String -LiteralPath $path -Pattern $spec.pattern | Select-Object -First 24)
            foreach ($match in $matches) { Write-Host ('{0}: {1}' -f $match.LineNumber,$match.Line.Trim()) }
          }
          Write-Host 'READ_ONLY_API_INSPECTION_DONE: no Unreal launch, no build, no map, cache or production worktree changes.'

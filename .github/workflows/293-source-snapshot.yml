name: Issue 293 bounded source snapshot
on:
  push:
    branches: [ci/293-source-inspection]
    paths: ['.github/workflows/293-source-snapshot.yml']
permissions:
  contents: write
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  publish-reviewed-blobs:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.actor == 'karnalooch' && github.triggering_actor == 'karnalooch' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b22ea83432c96dc7796cba9b802fe4c049001536
          lfs: false
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check ruff==0.16.8
      - name: Apply hash-verified edits and create blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request
          ROOT = Path.cwd()
          BASE = "b22ea83432c96dc7796cba9b802fe4c049001536"
          REPO = "karnalooch/YetAnotherCyclingSim"
          PLAN = [{'path': 'scripts/ue/stage3g_capture_sp638_local_corridor.py', 'before': 'a26ffb00be4dd4dda4ca94c5b7a46a700a924882', 'after': '8a23d70549050337fe45d766d968abaaa2b342a3', 'old': 'request_height_mips=(variant_name == "A"),', 'new': 'request_height_mips=macro_landscape_visible,'}, {'path': 'scripts/ci/test_embark_terrain_pipeline_contract.py', 'before': 'a8527592a70b3777c829de7fb76aa0836a6a0f82', 'after': 'bb1220a993bd2da1bfc6882690450f47346a0d7a', 'old': '        self.assertIn(\'request_height_mips=(variant_name == "A")\', capture)\n', 'new': '        self.assertIn("request_height_mips=macro_landscape_visible", capture)\n\n    def test_only_visible_macro_variants_request_height_mips(self):\n        import ast\n\n        capture = (ROOT / "scripts/ue/stage3g_capture_sp638_local_corridor.py").read_text()\n        tree = ast.parse(capture)\n        variants = next(\n            ast.literal_eval(node.value)\n            for node in tree.body\n            if isinstance(node, ast.Assign)\n            and any(isinstance(target, ast.Name) and target.id == "DIAGNOSTIC_VARIANTS" for target in node.targets)\n        )\n        self.assertEqual(\n            {name for name, policy in variants.items() if policy["macro_landscape_visible"]},\n            {"A", "B", "E"},\n        )\n        calls = [\n            node for node in ast.walk(tree)\n            if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)\n            and node.func.id == "prepare_capture"\n        ]\n        self.assertEqual(len(calls), 1)\n        option = next(keyword.value for keyword in calls[0].keywords if keyword.arg == "request_height_mips")\n        self.assertIsInstance(option, ast.Name)\n        self.assertEqual(option.id, "macro_landscape_visible")\n        self.assertIn(\'macro_landscape_visible = bool(variant["macro_landscape_visible"])\', capture)\n'}, {'path': 'docs/WORLD_BUILDING_BIBLE.md', 'before': 'ab5f834c2393f5fac931e1e6f2309ff9983d778c', 'after': 'aac41c6b5d2d2d1c6eaa201c4e2dd4b481d3599e', 'old': 'M3 run 92 completed this barrier and all six captures but retained macro stepping.\nIts 64 combined height textures still reported 7 of 10 resident mips. A second\nbounded experiment therefore requests a transient 120-second native mip residency\nlease for map-owned, mipmapped height textures in variant A only, followed by the\nsame native loading barrier. B-E/C3 remain controls. The lease must produce full\nnative mip readback before A is captured; a partial/placeholder result fails closed.\nIt expires after the capture process or duration and does not serialize `NeverStream`\nor disable streaming globally. This experiment is not a runtime/performance policy\nand does not prove a terrain repair until the actual A image improves.\n', 'new': 'M3 run 92 completed the native loading barrier but retained macro stepping;\n64 combined height textures still reported 7 of 10 resident mips. The controlled\nrun 94 at `b22ea83432c96dc7796cba9b802fe4c049001536` requested full height mips\nfor variant A only. All 64 became 10/10 and the pronounced macro staircase\nartifact disappeared from that same-camera A image. B/E retained 7/10 and the\ncoarse terrain. The sampled height-texture source exports were byte-identical,\nand camera, PCGEx output and corridor hashes were unchanged. This establishes\nheight-mip residency as a cause of the observed capture defect, not source-data\nquantization or a reason to replace the established road pipeline.\n\nThe bounded capture preparation therefore requests a transient 120-second native\nmip-residency lease for map-owned, mipmapped height textures whenever the macro\nLandscape is visible (A/B/E). C/D/C3 do not request macro mip residency. The native\nloading barrier must finish and full-mip readback must pass before capture;\npartial/placeholder results fail closed. The lease expires after the process or\nduration, does not serialize `NeverStream`, and does not disable streaming globally.\n\nThis fixes a forced-LOD proof resource precondition; it is not a blanket production\nruntime policy, performance acceptance or a cure for every terrain/road seam.\nKeep the single-owner near-field and road/earthwork acceptance gates independent.\nThe A-only causal result does not substitute for reviewing the combined A-E/C3\ncandidate, additional representative locations and performance where required.\n'}]
          def blob(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != BASE:
              raise SystemExit("Unexpected source HEAD")
          paths = [entry["path"] for entry in PLAN]
          assert len(paths) == len(set(paths)) == 3
          for entry in PLAN:
              path = ROOT / entry["path"]
              original = path.read_bytes()
              assert blob(original) == entry["before"], entry["path"]
              original = original.decode("utf-8")
              assert original.count(entry["old"]) == 1, entry["path"]
              data = original.replace(entry["old"], entry["new"], 1).encode("utf-8")
              assert blob(data) == entry["after"], entry["path"]
              path.write_bytes(data)
          subprocess.run(["ruff", "format", "scripts/ci/test_embark_terrain_pipeline_contract.py"], check=True)
          subprocess.run(["ruff", "check", "scripts/ci", "--select", "E9,F63,F7,F82"], check=True)
          subprocess.run(["python", "-m", "unittest", "scripts.ci.test_embark_terrain_pipeline_contract", "-v"], check=True)
          subprocess.run(["python", "-m", "py_compile", "scripts/ue/prepare_landscape_capture.py", "scripts/ue/stage3g_capture_sp638_local_corridor.py"], check=True)
          subprocess.run(["python", "scripts/ci/check_docs_index.py"], check=True)
          results = []
          for entry in PLAN:
              data = (ROOT / entry["path"]).read_bytes()
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + "/git/blobs",
                  data=json.dumps({"content": data.decode("utf-8"), "encoding": "utf-8"}).encode(),
                  method="POST",
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=40) as response:
                  result = json.load(response)
              assert result["sha"] == blob(data), entry["path"]
              results.append({"path": entry["path"], "sha": result["sha"], "mode": "100644", "type": "blob"})
          print("REVIEWED_BLOBS=" + json.dumps(results))
          Path(os.environ["RUNNER_TEMP"], "reviewed-blobs.json").write_text(json.dumps({"parent": BASE, "tree_elements": results}, indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue293-reviewed-visible-mips-patch
          path: |
            ${{ runner.temp }}/reviewed-blobs.json
            scripts/ue/prepare_landscape_capture.py
            scripts/ue/stage3g_capture_sp638_local_corridor.py
            scripts/ci/test_embark_terrain_pipeline_contract.py
            docs/WORLD_BUILDING_BIBLE.md
          if-no-files-found: error
          retention-days: 2

name: Issue 293 bounded source snapshot
on:
  push:
    branches: [ci/293-source-inspection]
    paths: ['.github/workflows/293-source-snapshot.yml']
permissions: {}
concurrency:
  group: issue-293-source-preparation
  cancel-in-progress: false
jobs:
  snapshot:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/ci/293-source-inspection' && github.actor == 'karnalooch' && github.triggering_actor == 'karnalooch' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 32d73652bf8d7638d27644aad04accfd62f07f09
          lfs: false
          persist-credentials: false
      - name: Archive immutable tracked source without checkout credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 32d73652bf8d7638d27644aad04accfd62f07f09
          mkdir -p "$RUNNER_TEMP/pr294-source"
          git archive --format=zip --output="$RUNNER_TEMP/pr294-source/source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/pr294-source/source-sha.txt"
          sha256sum "$RUNNER_TEMP/pr294-source/source.zip" > "$RUNNER_TEMP/pr294-source/source-sha256.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr294-source-32d73652
          path: ${{ runner.temp }}/pr294-source/
          if-no-files-found: error
          retention-days: 2

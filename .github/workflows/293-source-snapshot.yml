name: Issue 293 bounded source snapshot
on:
  push:
    branches: [ci/293-source-inspection]
    paths: ['.github/workflows/293-source-snapshot.yml']
permissions:
  contents: write
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  publish-reviewed-blobs:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.actor == 'karnalooch' && github.triggering_actor == 'karnalooch' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 413aec674e2fe9a2e6cb14a73711dfcb4373e8f7
          lfs: false
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check ruff==0.16.8
      - name: Validate exact edits and create immutable blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import urllib.request
          BASE = '413aec674e2fe9a2e6cb14a73711dfcb4373e8f7'
          REPO = 'karnalooch/YetAnotherCyclingSim'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == BASE
          EXPECTED = {
              'scripts/ue/prepare_landscape_capture.py': ('d8c5f216f12dec99bca3f8af1dd907fb987e8b41','90c8b855350ca44ba9c664ec847d1dbf11670173'),
              'scripts/ue/stage3g_capture_sp638_local_corridor.py': ('0dd2ac9a357fead62f8101c9d8f9b777410a8b64','a26ffb00be4dd4dda4ca94c5b7a46a700a924882'),
              'scripts/ci/test_embark_terrain_pipeline_contract.py': ('4803dec7881b2ada3aef030f116750d8db96cdbc','446c45b56f8933f7265597c790bd44c55edba0d1'),
              'docs/WORLD_BUILDING_BIBLE.md': ('22f8a0284955d52b9f26a809f3392bf0b76b42f5','ab5f834c2393f5fac931e1e6f2309ff9983d778c'),
          }
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
          for path,(before,after) in EXPECTED.items():
              assert blob(Path(path).read_bytes()) == before,path
          helper = '''"""Prepare the current rider viewport with Epic's native loading barrier.

          Editor proof only: do not alter height data, LOD policy, materials or assets.
          Texture telemetry is evidence, not a terrain quality acceptance decision.
          """
          from __future__ import annotations

          import json
          from pathlib import Path
          import time


          # The capture task has a 90-second deadline. This transient request gives it
          # 30 seconds of margin, expires automatically, and is never serialized.
          HEIGHT_MIP_LEASE_SECONDS = 120.0


          def _height_texture_objects(api, landscape) -> list:
              prefix = landscape.get_path_name().split(".", 1)[0] + "."
              textures = sorted(
                  (
                      texture
                      for texture in api.ObjectIterator(api.Texture2D)
                      if texture.get_path_name().startswith(prefix)
                      and texture.get_editor_property("lod_group")
                      == api.TextureGroup.TEXTUREGROUP_TERRAIN_HEIGHTMAP
                  ),
                  key=lambda texture: texture.get_path_name(),
              )
              if not textures:
                  raise RuntimeError("No map-owned Landscape height textures for capture readback")
              return textures


          def _height_textures(api, landscape) -> list[dict]:
              rows = []
              for texture in _height_texture_objects(api, landscape):
                  row = json.loads(api.YacsTextureAuditLibrary.describe_texture(texture))
                  if "error" in row:
                      raise RuntimeError(f"Native capture texture readback failed: {row['error']}")
                  rows.append(row)
              return rows


          def prepare_capture(
              api, landscape, location, rotation, output: Path, *, request_height_mips: bool = False
          ) -> dict:
              """Prime the already-selected camera, finish loading, and preserve readbacks."""
              report = {
                  "schema_version": 2,
                  "status": "STARTED",
                  "native_loading_barrier": "AutomationLibrary.finish_loading_before_screenshot",
                  "saved_to_map": False,
                  "height_edits_applied": False,
                  "terrain_quality_accepted": False,
                  "height_mip_lease_requested": request_height_mips,
                  "height_mip_lease_seconds": HEIGHT_MIP_LEASE_SECONDS if request_height_mips else 0.0,
                  "telemetry_stage": "immediately before screenshot task submission",
              }
              output = Path(output)
              output.mkdir(parents=True, exist_ok=True)
              started = time.monotonic()
              leased = []
              try:
                  viewport = api.get_editor_subsystem(api.UnrealEditorSubsystem)
                  if viewport is None or viewport.get_level_viewport_camera_info() is None:
                      raise RuntimeError("Landscape capture requires an active level viewport")
                  report["textures_before"] = _height_textures(api, landscape)
                  viewport.set_level_viewport_camera_info(location, rotation)
                  report["viewport_primed_at_rider_camera"] = True
                  api.AutomationLibrary.finish_loading_before_screenshot()
                  report["native_loading_barrier_completed"] = True
                  report["textures_after"] = _height_textures(api, landscape)
                  if any(
                      row["is_default_texture"] or row["is_compiling"]
                      for row in report["textures_after"]
                  ):
                      raise RuntimeError("Landscape height textures are not ready after loading barrier")
                  if request_height_mips:
                      report["textures_before_mip_request"] = report["textures_after"]
                      for texture in _height_texture_objects(api, landscape):
                          metadata = json.loads(api.YacsTextureAuditLibrary.describe_texture(texture))
                          if metadata["mips"] > 1:
                              # Only map-owned heightmaps, not material/foliage textures.
                              leased.append(texture)
                              texture.set_force_mip_levels_to_be_resident(HEIGHT_MIP_LEASE_SECONDS, 0)
                      report["mip_residency_request_count"] = len(leased)
                      if not leased:
                          raise RuntimeError("No mipmapped Landscape height textures for residency experiment")
                      api.AutomationLibrary.finish_loading_before_screenshot()
                      report["textures_after"] = _height_textures(api, landscape)
                      if any(
                          row["is_default_texture"] or row["is_compiling"]
                          or row["mips"] <= 0 or row["resident_mips"] != row["mips"]
                          for row in report["textures_after"]
                      ):
                          raise RuntimeError("Requested native Landscape height mips are not fully resident")
                  report["status"] = (
                      "NATIVE_LOADING_AND_MIPS_READY" if request_height_mips else "NATIVE_LOADING_COMPLETED"
                  )
                  return report
              except Exception as exc:
                  report["status"] = "FAILED"
                  report["error"] = str(exc)
                  for texture in leased:
                      try:
                          texture.set_force_mip_levels_to_be_resident(0.0, 0)
                      except Exception as cleanup_error:
                          report.setdefault("lease_cleanup_errors", []).append(str(cleanup_error))
                  raise
              finally:
                  report["duration_seconds"] = round(time.monotonic() - started, 6)
                  (output / "capture-readiness.json").write_text(
                      json.dumps(report, indent=2) + "\\n", encoding="utf-8"
                  )
          '''
          Path('scripts/ue/prepare_landscape_capture.py').write_text(helper,encoding='utf-8')
          p=Path('scripts/ue/stage3g_capture_sp638_local_corridor.py');s=p.read_text();a='        unreal, landscape, camera_location, camera_rotation, _proof_path.parent\n';assert s.count(a)==1;s=s.replace(a,a.rstrip()+',\n        request_height_mips=(variant_name == "A"),\n');p.write_text(s)
          tests = '''    def test_native_mip_request_waits_and_records_full_residency(self):
                  import tempfile
                  from unittest.mock import Mock

                  self.texture.set_force_mip_levels_to_be_resident = Mock(
                      side_effect=lambda *args: self.events.append(("mip-request", args))
                  )
                  def complete_requested_streaming():
                      self.events.append(("barrier", ()))
                      if self.texture.set_force_mip_levels_to_be_resident.called:
                          self.state["resident_mips"] = 10
                  self.api.AutomationLibrary.finish_loading_before_screenshot.side_effect = complete_requested_streaming
                  with tempfile.TemporaryDirectory() as directory:
                      report = self.capture(Path(directory), request_height_mips=True)
                      self.assertEqual(report["status"], "NATIVE_LOADING_AND_MIPS_READY")
                      self.assertEqual(report["textures_before_mip_request"][0]["resident_mips"], 7)
                      self.assertEqual(report["textures_after"][0]["resident_mips"], 10)
                      self.assertEqual(report["mip_residency_request_count"], 1)
                      self.texture.set_force_mip_levels_to_be_resident.assert_called_once_with(120.0, 0)
                      self.assertEqual([event[0] for event in self.events], ["view", "barrier", "mip-request", "barrier"])
                      self.assertFalse(report["terrain_quality_accepted"])

              def test_partial_residency_fails_and_releases_transient_request(self):
                  import tempfile
                  from unittest.mock import Mock, call

                  self.texture.set_force_mip_levels_to_be_resident = Mock()
                  with tempfile.TemporaryDirectory() as directory:
                      with self.assertRaisesRegex(RuntimeError, "not fully resident"):
                          self.capture(Path(directory), request_height_mips=True)
                      self.assertEqual(self.texture.set_force_mip_levels_to_be_resident.call_args_list, [call(120.0, 0), call(0.0, 0)])
                      report = json.loads((Path(directory) / "capture-readiness.json").read_text())
                      self.assertEqual(report["status"], "FAILED")
                      self.assertEqual(report["textures_after"][0]["resident_mips"], 7)

              def test_controls_do_not_request_residency(self):
                  import tempfile
                  from unittest.mock import Mock

                  self.texture.set_force_mip_levels_to_be_resident = Mock()
                  with tempfile.TemporaryDirectory() as directory:
                      report = self.capture(Path(directory))
                      self.texture.set_force_mip_levels_to_be_resident.assert_not_called()
                      self.assertFalse(report["height_mip_lease_requested"])
                      self.assertEqual(report["height_mip_lease_seconds"], 0.0)
                  capture = (ROOT / "scripts/ue/stage3g_capture_sp638_local_corridor.py").read_text()
                  self.assertIn('request_height_mips=(variant_name == "A")', capture)

          '''
          p=Path('scripts/ci/test_embark_terrain_pipeline_contract.py');s=p.read_text();s=s.replace('    def capture(self, output):','    def capture(self, output, **kwargs):',1);s=s.replace('            self.api, self.landscape, "rider-position", "rider-rotation", output\n','            self.api, self.landscape, "rider-position", "rider-rotation", output, **kwargs\n',1);a='    def test_capture_hook_is_after_camera_and_before_screenshot_for_every_variant(self):';assert s.count(a)==1;s=s.replace(a,tests+a);p.write_text(s)
          p=Path('docs/WORLD_BUILDING_BIBLE.md');s=p.read_text();a='Official API references:\n- https://dev.epicgames.com/documentation/en-us/unreal-engine/python-api/class/AutomationLibrary';assert s.count(a)==1
          b='''M3 run 92 completed this barrier and all six captures but retained macro stepping.
          Its 64 combined height textures still reported 7 of 10 resident mips. A second
          bounded experiment therefore requests a transient 120-second native mip residency
          lease for map-owned, mipmapped height textures in variant A only, followed by the
          same native loading barrier. B-E/C3 remain controls. The lease must produce full
          native mip readback before A is captured; a partial/placeholder result fails closed.
          It expires after the capture process or duration and does not serialize `NeverStream`
          or disable streaming globally. This experiment is not a runtime/performance policy
          and does not prove a terrain repair until the actual A image improves.

          Official API references:
          - https://dev.epicgames.com/documentation/en-us/unreal-engine/API/Runtime/Engine/UStreamableRenderAsset
          - https://dev.epicgames.com/documentation/en-us/unreal-engine/python-api/class/AutomationLibrary'''
          s=s.replace(a,b,1);p.write_text(s)
          for path,(before,after) in EXPECTED.items():
              assert blob(Path(path).read_bytes())==after,(path,blob(Path(path).read_bytes()))
          subprocess.run(['ruff','format','scripts/ci/test_embark_terrain_pipeline_contract.py'],check=True)
          subprocess.run(['ruff','check','scripts/ci','--select','E9,F63,F7,F82'],check=True)
          subprocess.run(['python','-m','unittest','scripts.ci.test_embark_terrain_pipeline_contract','-v'],check=True)
          subprocess.run(['python','-m','py_compile','scripts/ue/prepare_landscape_capture.py','scripts/ue/stage3g_capture_sp638_local_corridor.py'],check=True)
          subprocess.run(['python','scripts/ci/check_docs_index.py'],check=True)
          results=[]
          for path in EXPECTED:
              data=Path(path).read_bytes()
              req=urllib.request.Request('https://api.github.com/repos/'+REPO+'/git/blobs',data=json.dumps({'content':data.decode(),'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=40) as response:
                  result=json.load(response)
              assert result['sha']==blob(data),path
              results.append({'path':path,'sha':result['sha'],'mode':'100644','type':'blob'})
          print('REVIEWED_BLOBS='+json.dumps(results))
          Path(os.environ['RUNNER_TEMP'],'reviewed-blobs.json').write_text(json.dumps({'parent':BASE,'tree_elements':results},indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue293-reviewed-mip-patch
          path: |
            ${{ runner.temp }}/reviewed-blobs.json
            scripts/ue/prepare_landscape_capture.py
            scripts/ue/stage3g_capture_sp638_local_corridor.py
            scripts/ci/test_embark_terrain_pipeline_contract.py
            docs/WORLD_BUILDING_BIBLE.md
          if-no-files-found: error
          retention-days: 2

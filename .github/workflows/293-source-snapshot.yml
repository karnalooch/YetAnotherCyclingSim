name: Issue 293 bounded source snapshot
on:
  push:
    branches: [ci/293-source-inspection]
    paths: ['.github/workflows/293-source-snapshot.yml']
permissions: {}
env:
  GIT_LFS_SKIP_SMUDGE: '1'
concurrency:
  group: issue-293-source-preparation
  cancel-in-progress: false
jobs:
  publish-reviewed-blobs:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/ci/293-source-inspection' && github.actor == 'karnalooch' && github.triggering_actor == 'karnalooch' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 35ba65e5cfe69b5653f73d175662df5afbefb035
          fetch-depth: 0
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install --disable-pip-version-check ruff==0.16.8
      - name: Merge pinned main locally, validate reviewed camera edits, publish blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path
          REPO = 'karnalooch/YetAnotherCyclingSim'
          BASE = '35ba65e5cfe69b5653f73d175662df5afbefb035'
          MAIN = '8ba08b12c03c37dc54a9d620c224aa4f06de7fc4'
          PLAN_SHA = 'a2c07e22fb04d2a12b9b0fc420bb549ec0504c89'
          HELPER_SHA = 'a8095a3e9c49896ee626c8c727bac812e29159ef'
          HELPER_PATH = 'scripts/ue/road_capture_camera.py'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          def api(path, body=None):
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + path,
                  data=None if body is None else json.dumps(body).encode(),
                  method='GET' if body is None else 'POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=40) as response:
                  return json.load(response)
          def read_blob(sha):
              data = base64.b64decode(api('/git/blobs/' + sha)['content'])
              if blob(data) != sha:
                  raise SystemExit('Blob hash mismatch: ' + sha)
              return data
          if git('rev-parse', 'HEAD') != BASE:
              raise SystemExit('Unexpected source HEAD')
          if api('/git/ref/heads/fix/293-macro-landscape')['object']['sha'] != BASE:
              raise SystemExit('PR moved; do not prepare stale work')
          plan = json.loads(read_blob(PLAN_SHA))
          if plan['base'] != BASE or plan['main'] != MAIN:
              raise SystemExit('Unexpected source plan')
          for entry in plan['files']:
              if git('rev-parse', BASE + ':' + entry['path']) != entry['before_blob']:
                  raise SystemExit('Source path drift: ' + entry['path'])
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git', 'merge', '--no-commit', '--no-ff', MAIN], check=True)
          for entry in plan['files']:
              path = Path(entry['path'])
              text = path.read_text(encoding='utf-8')
              for edit in entry['edits']:
                  if text.count(edit['old']) != 1:
                      raise SystemExit('Absent or ambiguous patch anchor: ' + str(path))
                  text = text.replace(edit['old'], edit['new'], 1)
              path.write_text(text, encoding='utf-8')
          helper = Path(HELPER_PATH)
          if helper.exists():
              raise SystemExit('Unexpected existing camera helper')
          helper.write_bytes(read_blob(HELPER_SHA))
          subprocess.run(['ruff', 'format', 'scripts/ci/test_embark_terrain_pipeline_contract.py', HELPER_PATH], check=True)
          subprocess.run(['ruff', 'check', 'scripts/ci', HELPER_PATH, '--select', 'E9,F63,F7,F82'], check=True)
          subprocess.run(['python', '-m', 'unittest', 'scripts.ci.test_embark_terrain_pipeline_contract', '-v'], check=True)
          subprocess.run(['python', 'scripts/ci/run_python_tests.py'], check=True)
          subprocess.run(['python', '-m', 'py_compile', HELPER_PATH, 'scripts/ue/stage3g_capture_sp638_local_corridor.py'], check=True)
          subprocess.run(['python', 'scripts/ci/check_docs_index.py'], check=True)
          subprocess.run(['git', 'diff', '--check', 'HEAD'], check=True)
          from scripts.ci.check_docs_index import local_targets, read_utf8
          for path in (Path('AGENTS.md'), Path('docs/PRODUCT_REQUIREMENTS.md'), Path('docs/ROADMAP.md'), Path('docs/WORLD_BUILDING_BIBLE.md')):
              if any(not target.exists() for target in local_targets(path, read_utf8(path))):
                  raise SystemExit('Broken changed-document link: ' + str(path))
          expected = {'AGENTS.md', 'docs/PRODUCT_REQUIREMENTS.md', 'docs/ROADMAP.md', 'docs/WORLD_BUILDING_BIBLE.md', 'physics_reference/README.md', 'physics_reference/examples/run_mixed_surface.py', 'physics_reference/tests/test_mixed_surface_reference.py', 'scripts/ue/stage3g_capture_sp638_local_corridor.py', 'scripts/ci/test_embark_terrain_pipeline_contract.py', HELPER_PATH}
          paths = set(git('diff', 'HEAD', '--name-only').splitlines()) | set(git('ls-files', '--others', '--exclude-standard').splitlines())
          if paths != expected:
              raise SystemExit('Unexpected changed paths: ' + repr(paths ^ expected))
          elements = []
          for path in sorted(paths):
              data = Path(path).read_bytes()
              result = api('/git/blobs', {'content': data.decode('utf-8'), 'encoding': 'utf-8'})
              if result['sha'] != blob(data):
                  raise SystemExit('Published blob mismatch')
              elements.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': result['sha']})
          result = {'parent': BASE, 'additional_parent_shas': [MAIN], 'tree_elements': elements, 'validation': 'camera-contract 33/33; reference 391/391; docs links/i18n/structure/freshness PASS; no UE or visual acceptance claimed'}
          Path(os.environ['RUNNER_TEMP'], 'reviewed-camera-blobs.json').write_text(json.dumps(result, indent=2))
          print('REVIEWED_CAMERA_BLOBS=' + json.dumps(result))
          print('No branch refs changed. No terrain/road geometry or active workflow changed.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue293-reviewed-route-camera
          path: |
            ${{ runner.temp }}/reviewed-camera-blobs.json
            scripts/ue/road_capture_camera.py
            scripts/ue/stage3g_capture_sp638_local_corridor.py
            scripts/ci/test_embark_terrain_pipeline_contract.py
            docs/WORLD_BUILDING_BIBLE.md
            docs/PRODUCT_REQUIREMENTS.md
            docs/ROADMAP.md
            AGENTS.md
          if-no-files-found: error
          retention-days: 2

name: Sa Calobra terrain performance
run-name: Sa Calobra performance ${{ inputs.gumball_request_id }}
on:
  workflow_dispatch:
    inputs:
      exact_sha:
        description: Exact commit containing the native terrain sampler
        required: true
        type: string
      gumball_request_id:
        description: Gumball proof request identity
        required: true
        type: string
      material_consumer:
        description: Measure the saved current material consumer instead of importing bare terrain
        required: false
        default: false
        type: boolean
      consumer_manifest:
        description: Absolute immutable exact-SHA consumer-manifest.json path on the reference runner
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: sa-calobra-terrain-performance
  cancel-in-progress: false
jobs:
  performance:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      YACS_PERF_MATERIAL_CONSUMER: ${{ inputs.material_consumer }}
      YACS_PERF_CONSUMER_MANIFEST: ${{ inputs.consumer_manifest }}
      YACS_PERF_EXPECTED_HEAD: ${{ inputs.exact_sha }}
    steps:
      - name: Reject missing saved-consumer intent before checkout or Unreal
        run: |
          $ErrorActionPreference='Stop'
          if ($env:YACS_PERF_EXPECTED_HEAD -notmatch '^[0-9a-f]{40}$') { throw 'Exact SHA must be immutable.' }
          if ($env:YACS_PERF_MATERIAL_CONSUMER -eq 'true') {
            if (-not [IO.Path]::IsPathRooted($env:YACS_PERF_CONSUMER_MANIFEST) -or -not (Test-Path -LiteralPath $env:YACS_PERF_CONSUMER_MANIFEST -PathType Leaf)) { throw 'Material proof needs an explicit pinned consumer manifest; use reviewed manual workflow_dispatch.' }
            $consumer=Get-Content -LiteralPath $env:YACS_PERF_CONSUMER_MANIFEST -Raw | ConvertFrom-Json
            if ($consumer.exact_sha -ne $env:YACS_PERF_EXPECTED_HEAD -or $consumer.map_package -ne '/Game/Generated/YACS/SaCalobra/WholeMapPreparation/L_SaCalobraMaterialReview') { throw 'Saved-consumer intent is stale or targets another map.' }
          } elseif ($env:YACS_PERF_CONSUMER_MANIFEST) { throw 'Consumer manifest requires material_consumer=true.' }
      - name: Checkout trusted retention helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: _sa-calobra-proof-bootstrap
          lfs: false
          persist-credentials: false
      - name: Retain previous proof assets before checkout
        run: |
          $ErrorActionPreference='Stop'
          python _sa-calobra-proof-bootstrap/scripts/ci/retain_unreal_assets.py --workspace "$env:GITHUB_WORKSPACE/_sa-calobra-performance" --archive "$env:GITHUB_WORKSPACE/_yacs-retained-lfs/sa-perf-before-${{ github.run_id }}-${{ github.run_attempt }}"
          if ($LASTEXITCODE -ne 0) { throw 'Asset retention failed; checkout prohibited.' }
      - name: Checkout exact proof revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: _sa-calobra-performance
          ref: ${{ inputs.exact_sha }}
          lfs: false
          clean: false
          persist-credentials: false
      - name: Verify revision and materialize only Spanish and startup assets
        working-directory: _sa-calobra-performance
        run: |
          $ErrorActionPreference='Stop'
          if ('${{ inputs.exact_sha }}' -notmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD).Trim() -ne '${{ inputs.exact_sha }}') { throw 'Exact SHA mismatch.' }
          if (git diff --name-only HEAD) { throw 'Tracked files are dirty.' }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'LFS setup failed.' }
          git lfs pull --include='Content/**,worldgen/terrain/benchmarks/sa_calobra/*.tif' --exclude=''
          if ($LASTEXITCODE -ne 0) { throw 'Source/startup materialization failed.' }
          python -m pip install --only-binary=:all: numpy==2.3.5 rasterio==1.5.2 pyproj==3.8.0 Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Terrain dependencies failed.' }
      - name: Prove native map and 1080p60 budget
        working-directory: _sa-calobra-performance
        run: |
          $proof=Join-Path (Get-Location).Path 'Saved/RuntimeProof/CI/SaCalobraPerformance/${{ github.run_id }}-${{ github.run_attempt }}'
          if ($env:YACS_PERF_MATERIAL_CONSUMER -eq 'true') {
            python scripts/ci/sa_calobra_performance.py restore-consumer --root $proof --head $env:YACS_PERF_EXPECTED_HEAD --consumer-manifest $env:YACS_PERF_CONSUMER_MANIFEST
            if ($LASTEXITCODE -ne 0) { throw 'Retained saved-consumer packages failed verified no-overwrite restoration.' }
            $config='D:\yacs\workspace.json'
            ./scripts/ue/Invoke-YacsSaCalobraPerformance.ps1 -ExpectedHead $env:YACS_PERF_EXPECTED_HEAD -ArtifactRoot $proof -ConsumerManifest $env:YACS_PERF_CONSUMER_MANIFEST -WorkspaceConfig $config
          } else {
            ./scripts/ue/Invoke-YacsSaCalobraPerformance.ps1 -ExpectedHead $env:YACS_PERF_EXPECTED_HEAD -ArtifactRoot $proof
          }
          if ($LASTEXITCODE -ne 0) { throw 'Sa Calobra performance failed.' }
      - name: Publish successful exact-SHA proof
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-${{ inputs.material_consumer && 'sa-calobra-material-performance' || 'sa-calobra-terrain-performance' }}-${{ inputs.exact_sha }}
          path: |
            _sa-calobra-performance/Saved/RuntimeProof/CI/SaCalobraPerformance/${{ github.run_id }}-${{ github.run_attempt }}/*.json
            _sa-calobra-performance/Saved/RuntimeProof/CI/SaCalobraPerformance/${{ github.run_id }}-${{ github.run_attempt }}/*.csv
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed run diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostic-${{ inputs.material_consumer && 'sa-calobra-material-performance' || 'sa-calobra-terrain-performance' }}-${{ inputs.exact_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _sa-calobra-performance/Saved/RuntimeProof/CI/SaCalobraPerformance/${{ github.run_id }}-${{ github.run_attempt }}/*.log
            _sa-calobra-performance/Saved/RuntimeProof/CI/SaCalobraPerformance/${{ github.run_id }}-${{ github.run_attempt }}/*.json
            _sa-calobra-performance/Saved/RuntimeProof/CI/SaCalobraPerformance/${{ github.run_id }}-${{ github.run_attempt }}/*.csv
            _sa-calobra-performance/Saved/RuntimeProof/CI/SaCalobraPerformanceBuild/*.log
          if-no-files-found: warn
          retention-days: 14
      - name: Retain generated and downloaded assets
        if: ${{ always() }}
        run: |
          python _sa-calobra-proof-bootstrap/scripts/ci/retain_unreal_assets.py --workspace "$env:GITHUB_WORKSPACE/_sa-calobra-performance" --archive "$env:GITHUB_WORKSPACE/_yacs-retained-lfs/sa-perf-after-${{ github.run_id }}-${{ github.run_attempt }}"
          if ($LASTEXITCODE -ne 0) { throw 'Final asset retention failed.' }

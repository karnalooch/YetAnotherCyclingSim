name: Passo Giau R4.1B.3 Geometry Script capability probe

on:
  push:
    branches:
      - spike/r4-1b3-local-ground-corridor
    paths:
      - '.github/workflows/passo-giau-r4-1b3-geometry-probe.yml'
      - 'scripts/ue/Invoke-YacsGeometryScriptProbe.ps1'
      - 'scripts/ue/probe_geometry_script_api.py'
      - 'scripts/ue/probe_sp638_local_corridor_topology.py'
      - 'scripts/ue/Invoke-YacsSp638CorridorTopologyProbe.ps1'
      - 'scripts/ue/stage3g_capture_sp638_local_corridor.py'
      - 'scripts/ue/Invoke-YacsSp638LocalCorridorVisualProof.ps1'
      - 'scripts/geometry/**'
      - 'YetAnotherCyclingSim.uproject'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/passo-giau-r4-1b3-geometry-probe.yml'
      - 'scripts/ue/Invoke-YacsGeometryScriptProbe.ps1'
      - 'scripts/ue/probe_geometry_script_api.py'
      - 'scripts/ue/probe_sp638_local_corridor_topology.py'
      - 'scripts/ue/Invoke-YacsSp638CorridorTopologyProbe.ps1'
      - 'scripts/ue/stage3g_capture_sp638_local_corridor.py'
      - 'scripts/ue/Invoke-YacsSp638LocalCorridorVisualProof.ps1'
      - 'scripts/geometry/**'
      - 'YetAnotherCyclingSim.uproject'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passo-giau-r4-1b3-geometry-probe-${{ github.repository }}
  cancel-in-progress: true

jobs:
  kernel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact spike revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Run deterministic local corridor geometry tests
        run: python -m unittest scripts.geometry.test_sp638_local_corridor scripts.geometry.test_local_terrain_skin

      - name: Syntax-check rider-close Unreal visual proof
        run: python -m py_compile scripts/ue/stage3g_capture_sp638_local_corridor.py

  probe:
    # Interim cost-control gate: keep deterministic kernel checks automatic,
    # but run the heavy trusted-runner UE proof only on explicit dispatch until
    # the R4.1 build-once / prove-many pipeline is implemented.
    if: github.event_name == 'workflow_dispatch'
    needs: kernel-tests
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'

    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-r4-1b3-geometry-probe-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact spike revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _r4-1b3-geometry-probe-worktree
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          clean: true
          persist-credentials: false

      - name: Verify exact SHA and clean checkout
        shell: pwsh
        working-directory: _r4-1b3-geometry-probe-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'R4.1B.3 geometry probe checkout is not exact SHA.'
          }
          git reset --hard HEAD
          git clean -ffd
          if (git status --porcelain --untracked-files=all) {
            throw 'R4.1B.3 geometry probe checkout is dirty.'
          }

      - name: Run UE 5.8 Geometry Script capability probe
        shell: pwsh
        working-directory: _r4-1b3-geometry-probe-worktree
        run: |
          ./scripts/ue/Invoke-YacsGeometryScriptProbe.ps1 `
            -ExpectedBranch 'HEAD' `
            -ExpectedHead '${{ github.sha }}' `
            -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR4_1/GeometryScriptProbe'

      - name: Run real SP638 local corridor topology proof
        shell: pwsh
        working-directory: _r4-1b3-geometry-probe-worktree
        run: |
          ./scripts/ue/Invoke-YacsSp638CorridorTopologyProbe.ps1 `
            -ExpectedBranch 'HEAD' `
            -ExpectedHead '${{ github.sha }}' `
            -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR4_1/LocalCorridorTopology'

      - name: Render rider-close SP638 local corridor proof
        shell: pwsh
        working-directory: _r4-1b3-geometry-probe-worktree
        run: |
          ./scripts/ue/Invoke-YacsSp638LocalCorridorVisualProof.ps1 `
            -ExpectedBranch 'HEAD' `
            -ExpectedHead '${{ github.sha }}' `
            -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR4_1/LocalCorridorVisual'

      - name: Upload capability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passo-giau-r4-1b3-geometry-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _r4-1b3-geometry-probe-worktree/Saved/RuntimeProof/CI/Stage3GR4_1/GeometryScriptProbe/**
            _r4-1b3-geometry-probe-worktree/Saved/RuntimeProof/CI/Stage3GR4_1/LocalCorridorTopology/**
            _r4-1b3-geometry-probe-worktree/Saved/RuntimeProof/CI/Stage3GR4_1/LocalCorridorVisual/**
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worktree = Join-Path $env:GITHUB_WORKSPACE '_r4-1b3-geometry-probe-worktree'
          if (Test-Path -LiteralPath (Join-Path $worktree '.git')) {
            git -C $worktree reset --hard
            git -C $worktree clean -ffd
          }

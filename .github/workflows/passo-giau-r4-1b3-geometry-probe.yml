name: Passo Giau R4.1B.3 Geometry Script capability probe
run-name: Passo Giau R4.1B.3 ${{ inputs.gumball_request_id || github.event_name }}

on:
  push:
    branches:
      - spike/r4-1b3-local-ground-corridor
    paths:
      - '.github/workflows/passo-giau-r4-1b3-geometry-probe.yml'
      - 'scripts/ue/Invoke-YacsGeometryScriptProbe.ps1'
      - 'scripts/ue/Invoke-YacsR4_1ProofSuite.ps1'
      - 'scripts/ue/run_r4_1_proof_session.py'
      - 'scripts/ue/Test-YacsR4_1PreparedWorkspace.ps1'
      - 'scripts/ue/Invoke-YacsPassoGiauHairpinCorridorProof.ps1'
      - 'scripts/ci/test_r4_1_proof_suite_contract.py'
      - 'scripts/ue/probe_geometry_script_api.py'
      - 'scripts/ue/probe_sp638_local_corridor_topology.py'
      - 'scripts/ue/Invoke-YacsSp638CorridorTopologyProbe.ps1'
      - 'scripts/ue/stage3g_capture_sp638_local_corridor.py'
      - 'scripts/ue/Invoke-YacsSp638LocalCorridorVisualProof.ps1'
      - 'scripts/geometry/**'
      - 'YetAnotherCyclingSim.uproject'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/passo-giau-r4-1b3-geometry-probe.yml'
      - 'scripts/ue/Invoke-YacsGeometryScriptProbe.ps1'
      - 'scripts/ue/Invoke-YacsR4_1ProofSuite.ps1'
      - 'scripts/ue/run_r4_1_proof_session.py'
      - 'scripts/ue/Test-YacsR4_1PreparedWorkspace.ps1'
      - 'scripts/ue/Invoke-YacsPassoGiauHairpinCorridorProof.ps1'
      - 'scripts/ci/test_r4_1_proof_suite_contract.py'
      - 'scripts/ue/probe_geometry_script_api.py'
      - 'scripts/ue/probe_sp638_local_corridor_topology.py'
      - 'scripts/ue/Invoke-YacsSp638CorridorTopologyProbe.ps1'
      - 'scripts/ue/stage3g_capture_sp638_local_corridor.py'
      - 'scripts/ue/Invoke-YacsSp638LocalCorridorVisualProof.ps1'
      - 'scripts/geometry/**'
      - 'YetAnotherCyclingSim.uproject'
  workflow_dispatch:
    inputs:
      exact_sha:
        description: Exact 40-character PR HEAD SHA to prove
        required: true
        type: string
      gumball_request_id:
        description: Deterministic Gumball proof request id
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: passo-giau-r4-1b3-geometry-probe-${{ github.repository }}-${{ inputs.gumball_request_id || github.ref }}
  cancel-in-progress: true

jobs:
  kernel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact spike revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.exact_sha || github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Run deterministic local corridor geometry tests
        run: python -m unittest scripts.geometry.test_sp638_local_corridor scripts.geometry.test_local_terrain_skin

      - name: Syntax-check rider-close Unreal visual proof
        run: python -m py_compile scripts/ue/stage3g_capture_sp638_local_corridor.py

  probe:
    # Cost-control gate: deterministic kernel checks remain automatic.
    # The canonical heavy build-once / prove-many UE suite is explicit dispatch.
    if: github.event_name == 'workflow_dispatch'
    needs: kernel-tests
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 60
    env:
      GIT_LFS_SKIP_SMUDGE: '1'

    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-r4-1b3-geometry-probe-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact spike revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _r4-1b3-geometry-probe-worktree
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.exact_sha || github.sha }}
          fetch-depth: 1
          lfs: false
          clean: true
          persist-credentials: false

      - name: Verify exact SHA and clean checkout
        shell: pwsh
        working-directory: _r4-1b3-geometry-probe-worktree
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.event_name == 'workflow_dispatch' && inputs.exact_sha || github.sha }}') {
            throw 'R4.1B.3 geometry probe checkout is not exact SHA.'
          }
          git reset --hard HEAD
          if ($LASTEXITCODE -ne 0) { throw 'R4.1B.3 reset failed before proof-suite preparation.' }
          git clean -ffdx
          if ($LASTEXITCODE -ne 0) { throw 'R4.1B.3 ignored/untracked cleanup failed before proof-suite preparation.' }
          if (git status --porcelain --untracked-files=all) {
            throw 'R4.1B.3 geometry probe checkout is dirty.'
          }

      - name: Run prepared R4.1 build-once proof suite
        shell: pwsh
        working-directory: _r4-1b3-geometry-probe-worktree
        run: |
          ./scripts/ue/Invoke-YacsR4_1ProofSuite.ps1 `
            -ExpectedBranch 'HEAD' `
            -ExpectedHead '${{ github.event_name == 'workflow_dispatch' && inputs.exact_sha || github.sha }}' `
            -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR4_1/PreparedSuite'

      - name: Upload reusable successful R4.1 proof evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proof-r4-1b3-geometry-${{ inputs.exact_sha }}
          path: |
            _r4-1b3-geometry-probe-worktree/Saved/RuntimeProof/CI/Stage3GR4_1/PreparedSuite/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload failed R4.1 proof diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-r4-1b3-geometry-${{ inputs.exact_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            _r4-1b3-geometry-probe-worktree/Saved/RuntimeProof/CI/Stage3GR4_1/PreparedSuite/**
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $worktree = Join-Path $env:GITHUB_WORKSPACE '_r4-1b3-geometry-probe-worktree'
          if (Test-Path -LiteralPath (Join-Path $worktree '.git')) {
            git -C $worktree reset --hard
            if ($LASTEXITCODE -ne 0) { throw 'R4.1 proof-suite reset failed during cleanup.' }
            git -C $worktree clean -ffdx
            if ($LASTEXITCODE -ne 0) { throw 'R4.1 proof-suite ignored/untracked cleanup failed.' }
            if (git -C $worktree status --porcelain --untracked-files=all) {
              throw 'R4.1 proof-suite worktree is dirty after cleanup.'
            }
          }

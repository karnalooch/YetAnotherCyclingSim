name: CyclingSim CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cyclingsim-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-policy:
    name: Repository policy
    permissions:
      contents: read
    uses: karnalooch/engineering-platform/.github/workflows/reusable-repo-policy.yml@d9bc67e2b17436e9df1319a6345d0ec388f407fb
    with:
      max_non_lfs_mib: 10
      required_lfs_extensions: ".uasset,.umap,.fbx,.blend,.wav,.flac,.mp3,.exr,.hdr,.tga"
      forbidden_path_components: ".vs,Binaries,DerivedDataCache,Intermediate,Saved"

  governance:
    name: Governance policy
    permissions:
      contents: read
    uses: karnalooch/engineering-platform/.github/workflows/reusable-governance.yml@d9bc67e2b17436e9df1319a6345d0ec388f407fb
    with:
      additional_high_risk_patterns: |
        *.uproject
        **/*.uproject
        *.uplugin
        **/*.uplugin
        Source/**/*.Build.cs
        Source/**/*.Target.cs
        Config/DefaultEngine.ini

  python-reference:
    name: Python reference model
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-python.yml

  security:
    name: Security baseline
    permissions:
      contents: read
      security-events: write
    uses: karnalooch/engineering-platform/.github/workflows/reusable-security.yml@d9bc67e2b17436e9df1319a6345d0ec388f407fb
    with:
      codeql_languages_json: '["python","c-cpp"]'

  aggregate:
    name: Aggregate CI gate
    if: ${{ always() }}
    needs:
      - repo-policy
      - governance
      - python-reference
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Fail closed unless every required job passed
        shell: bash
        env:
          REPO_POLICY_RESULT: ${{ needs.repo-policy.result }}
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          PYTHON_REFERENCE_RESULT: ${{ needs.python-reference.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          set -euo pipefail
          failed=0
          for entry in \
            "repo-policy=${REPO_POLICY_RESULT}" \
            "governance=${GOVERNANCE_RESULT}" \
            "python-reference=${PYTHON_REFERENCE_RESULT}" \
            "security=${SECURITY_RESULT}"
          do
            name="${entry%%=*}"
            result="${entry#*=}"
            if [ "${result}" != "success" ]; then
              echo "::error::${name}: expected success, got ${result}"
              failed=1
            fi
          done
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
          echo "aggregate: PASS"

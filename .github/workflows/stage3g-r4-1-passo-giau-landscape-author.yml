name: Stage 3G R4.1B Passo Giau Landscape authoring

on:
  push:
    branches:
      - feat/stage3g-r4-1-passo-giau-landscape-spike
    paths:
      - '.github/workflows/stage3g-r4-1-passo-giau-landscape-author.yml'
      - 'Source/YetAnotherCyclingSim/Public/Cycling/CyclingPassoGiauLandscapeSpikeCommandlet.h'
      - 'Source/YetAnotherCyclingSim/Private/Editor/CyclingPassoGiauLandscapeSpikeCommandlet.cpp'
      - 'Source/YetAnotherCyclingSim/YetAnotherCyclingSim.Build.cs'
      - 'scripts/assets/download_passo_giau_dem.py'
      - 'scripts/assets/prepare_passo_giau_heightmap.py'
      - 'scripts/ue/stage3g_prepare_passo_giau_landscape_map.py'
      - 'scripts/ue/stage3g_capture_passo_giau_landscape.py'
      - 'scripts/ue/Invoke-YacsPassoGiauLandscapeSpike.ps1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage3g-r4-1-passo-giau-landscape-author-${{ github.repository }}
  cancel-in-progress: true

jobs:
  author:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 90

    steps:
      - name: Checkout exact trusted revision with LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: true

      - name: Verify exact SHA and full LFS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Passo Giau authoring checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }
          if (git status --porcelain) { throw 'Passo Giau authoring checkout is dirty.' }

      - name: Author isolated Passo Giau Landscape and render proof
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsPassoGiauLandscapeSpike.ps1 -ExpectedBranch HEAD -ExpectedHead '${{ github.sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR4_1/PassoGiauLandscape'
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau Landscape authoring failed.' }

      - name: Commit only isolated spike map
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = 'Content/Prototype/Maps/L_PassoGiauTerrainSpike.umap'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $asset
          if (git diff --cached --quiet) {
            throw 'Passo Giau authoring produced no staged map asset change.'
          }
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -ne 1 -or $staged[0] -ne $asset) {
            throw ('Unexpected staged paths: ' + ($staged -join ', '))
          }
          git commit -m 'asset(stage3g): persist isolated Passo Giau Landscape spike'
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau map commit failed.' }
          git push origin HEAD:feat/stage3g-r4-1-passo-giau-landscape-spike
          if ($LASTEXITCODE -ne 0) { throw 'Passo Giau map push failed.' }

      - name: Upload Passo Giau Landscape evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passo-giau-r4-1b-landscape-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GR4_1/PassoGiauLandscape/**
            ExternalAssets/Terrain/PassoGiau/Prepared/terrain-report.json
            ExternalAssets/Terrain/PassoGiau/Prepared/passo_giau_hillshade.png
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          git reset --hard
          git clean -ffdx

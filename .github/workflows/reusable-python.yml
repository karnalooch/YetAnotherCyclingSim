name: Reusable Python checks

on:
  workflow_call:

permissions: {}

jobs:
  python-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install lint tooling
        run: python -m pip install --disable-pip-version-check ruff==0.16.8

      - name: Lint correctness-critical Python rules
        run: ruff check physics_reference scripts/ci --select E9,F63,F7,F82

      - name: Verify CI helper formatting
        run: ruff format --check scripts/ci

      - name: Compile Python sources
        run: python -m compileall -q physics_reference/src scripts/ci

      - name: Run GitHub Actions platform contract tests
        run: python scripts/ci/test_ci_platform_contract.py

      - name: Run GitHub Windows probe workflow contract tests
        run: python scripts/ci/test_windows_probe_workflow.py

      - name: Run manual Unreal workflow contract tests
        run: python scripts/ci/test_manual_unreal_workflow.py

      - name: Run Phase 1 one-shot Unreal contract tests
        run: python scripts/ci/test_phase1_one_shot_unreal.py

      - name: Parse active CI PowerShell helpers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in @(
            'scripts/ci/Test-YacsCodeOnlyCheckout.ps1',
            'scripts/ci/Invoke-YacsUnrealCi.ps1',
            'scripts/ci/Invoke-YacsWindowsProbe.ps1',
            'scripts/ue/Invoke-YacsPackageProof.ps1',
            'scripts/ue/Invoke-YacsProof.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($error in $errors) {
                Write-Error "${script}: $($error.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

      - name: Execute code-only LFS guard smoke
        shell: pwsh
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1

      - name: Run branch hygiene unit tests
        run: python scripts/ci/test_cleanup_merged_branches.py

      - name: Run PR orchestrator unit tests
        run: python scripts/ci/test_pr_orchestrator.py

      - name: Run change classifier unit tests
        run: python scripts/ci/test_classify_changes.py

      - name: Run asset validation unit tests
        run: python scripts/ci/test_validate_changed_assets.py

      - name: Run change-classifier workflow contract tests
        run: python scripts/ci/test_change_classifier_workflow.py

      - name: Run asset/full workflow contract tests
        run: python scripts/ci/test_asset_full_workflow.py

      - name: Run package proof contract tests
        run: python scripts/ci/test_package_proof_contract.py

      - name: Run Project automation unit tests
        run: python scripts/ci/test_project_automation.py

      - name: Run reference-model unit tests and prevent no-op discovery
        run: python scripts/ci/run_python_tests.py

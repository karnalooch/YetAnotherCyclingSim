name: Reusable Python checks

on:
  workflow_call:

permissions: {}

jobs:
  python-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install lint tooling
        run: python -m pip install --disable-pip-version-check ruff==0.16.8

      - name: Lint correctness-critical Python rules
        run: ruff check physics_reference scripts/ci --select E9,F63,F7,F82

      - name: Verify CI helper formatting
        run: ruff format --check scripts/ci

      - name: Compile Python sources
        run: python -m compileall -q physics_reference/src scripts/ci

      - name: Run CircleCI Windows probe contract tests
        run: python scripts/ci/test_circleci_windows_probe.py

      - name: Run CircleCI Windows Phase B contract tests
        run: python scripts/ci/test_circleci_windows_phase_b.py

      - name: Parse CircleCI Windows PowerShell helpers
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in @(
            'scripts/ci/Prepare-YacsUe58Seed.ps1',
            'scripts/ci/Restore-YacsUe58Seed.ps1',
            'scripts/ci/Test-YacsCodeOnlyCheckout.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($error in $errors) {
                Write-Error "${script}: $($error.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

      - name: Run branch hygiene unit tests
        run: python scripts/ci/test_cleanup_merged_branches.py

      - name: Run Project automation unit tests
        run: python scripts/ci/test_project_automation.py

      - name: Run reference-model unit tests and prevent no-op discovery
        run: python scripts/ci/run_python_tests.py

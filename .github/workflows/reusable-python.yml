name: Reusable Python checks

on:
  workflow_call:

permissions: {}

jobs:
  python-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install lint tooling
        run: python -m pip install --disable-pip-version-check ruff==0.16.8

      - name: Lint correctness-critical Python rules
        run: ruff check physics_reference scripts/ci --select E9,F63,F7,F82

      - name: Verify CI helper formatting
        run: ruff format --check scripts/ci

      - name: Compile Python sources
        run: |
          python -m compileall -q physics_reference/src scripts
          python -m py_compile scripts/assets/yacs_asset_library.py
          python -m py_compile scripts/worldgen/yacs_scene_layout.py

      - name: Validate Gumball Proof Broker policy
        run: python scripts/ops/proof_broker.py validate

      - name: Install native terrain test dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 rasterio==1.5.2 pyproj==3.8.0 Pillow==12.3.0 shapely==2.1.2

      - name: Run every discovered script test
        run: python scripts/ci/run_script_tests.py --output "${{ runner.temp }}/yacs-script-tests"

      - name: Retain hosted test inventory and per-module diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-script-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yacs-script-tests/
          if-no-files-found: error
          retention-days: 14

      - name: Parse active CI PowerShell helpers
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in @(
            'scripts/ci/Test-YacsCodeOnlyCheckout.ps1',
            'scripts/ci/Invoke-YacsUnrealCi.ps1',
            'scripts/ci/Resolve-YacsUnrealCiCache.ps1',
            'scripts/ci/Resolve-YacsUnrealBuildEnvironment.ps1',
            'scripts/ci/Resolve-YacsUnrealEngine.ps1',
            'scripts/ci/Invoke-YacsWindowsProbe.ps1',
            'scripts/ue/Invoke-YacsPackageProof.ps1',
            'scripts/ue/Invoke-YacsProof.ps1',
            'scripts/ue/Preflight-YacsProof.ps1',
            'scripts/ue/Invoke-YacsStage3GAuthoring.ps1',
            'scripts/ue/Invoke-YacsStage3GProof.ps1',
            'scripts/ue/Invoke-YacsR4_1ProofSuite.ps1',
            'scripts/ue/Test-YacsR4_1PreparedWorkspace.ps1',
            'scripts/ue/Invoke-YacsGeometryScriptProbe.ps1',
            'scripts/ue/Invoke-YacsSp638CorridorTopologyProbe.ps1',
            'scripts/ue/Invoke-YacsPassoGiauHairpinCorridorProof.ps1',
            'scripts/ue/Invoke-YacsSp638LocalCorridorVisualProof.ps1',
            'scripts/ue/Invoke-YacsRegionTerrainImport.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $errors) {
                Write-Error "${script}: $($parseError.Message)"
              }
            }
          }
          if ($failed) { exit 1 }

      - name: Execute code-only LFS guard smoke
        shell: pwsh
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1

      - name: Run reference-model unit tests and prevent no-op discovery
        if: ${{ !cancelled() }}
        run: python scripts/ci/run_python_tests.py

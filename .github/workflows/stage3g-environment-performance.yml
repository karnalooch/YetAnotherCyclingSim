name: Stage 3G environment performance

on:
  push:
    branches:
      - perf/stage3g-environment-gate
    paths:
      - '.github/workflows/stage3g-environment-performance.yml'
      - 'Source/YetAnotherCyclingSim/Private/Tests/CyclingStage3GEnvironmentPerformanceProof.spec.cpp'
      - 'scripts/ue/Invoke-YacsStage3GEnvironmentPerformance.ps1'
      - 'scripts/ci/test_stage3g_environment_performance_contract.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage3g-environment-performance-${{ github.repository }}
  cancel-in-progress: true

jobs:
  performance:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 90
    steps:
      - name: Checkout exact trusted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: false

      - name: Verify exact SHA and LFS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Environment performance checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }
          if (git status --porcelain) { throw 'Performance checkout is dirty before proof.' }

      - name: Validate performance gate contract
        shell: pwsh
        run: |
          python -m unittest scripts.ci.test_stage3g_environment_performance_contract
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G environment performance contract failed.' }

      - name: Run Stage 3G 1080p60 environment gate
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsStage3GEnvironmentPerformance.ps1 -ExpectedBranch HEAD -ExpectedHead '${{ github.sha }}' -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GEnvironmentPerformance'
          if ($LASTEXITCODE -ne 0) { throw 'Stage 3G environment performance gate failed.' }

      - name: Upload performance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-environment-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GEnvironmentPerformance/**
          if-no-files-found: warn
          retention-days: 14

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard
          git clean -ffdx
          if (git status --porcelain) {
            throw 'Performance runner workspace is dirty after cleanup.'
          }

name: Sa Calobra Component 230 PCGEx Cliff

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/phase2c-pcgex-cliff-topology"
    paths:
      - ".github/workflows/sa-calobra-cliff-component230-pcgex.yml"
      - ".gumball/workflow-lifecycle.json"
      - "scripts/worldgen/Bootstrap-YacsPcgEx.ps1"
      - "scripts/ue/Invoke-YacsSaCalobraPcgExCliff.ps1"
      - "scripts/ue/capture_sa_calobra_component230_cliff.py"
      - "scripts/assets/prepare_sa_calobra_component230_cliff_visual.py"
      - "scripts/assets/test_sa_calobra_component230_cliff_visual.py"
      - "scripts/assets/analyze_sa_calobra_component230_cliff_visual.py"
      - "scripts/assets/analyze_local_cliff_smoothing.py"
      - "scripts/assets/test_analyze_local_cliff_smoothing.py"
      - "scripts/assets/gate_component230_combined.py"
      - "scripts/assets/test_gate_component230_combined.py"
      - "scripts/assets/test_component230_review_cameras.py"
      - "Source/YetAnotherCyclingSimEditor/Private/Diagnostics/YacsLandscapeMeshDiagnosticLibrary.cpp"
      - "Source/YetAnotherCyclingSimEditor/Private/Diagnostics/YacsLandscapeTerrainTrial.cpp"
      - "scripts/geometry/local_thermal_erosion.py"
      - "scripts/geometry/test_local_thermal_erosion.py"
      - "Source/YetAnotherCyclingSimEditor/Public/Diagnostics/YacsLandscapeMeshDiagnosticLibrary.h"
      - "scripts/assets/analyze_sa_calobra_component230_pcgex_topology.py"
      - "scripts/assets/test_analyze_sa_calobra_component230_pcgex_topology.py"
      - "Source/YetAnotherCyclingSimEditor/Private/PCG/YacsSaCalobraCliffCellsSettings.cpp"
      - "Source/YetAnotherCyclingSimEditor/Public/PCG/YacsSaCalobraCliffCellsSettings.h"
      - "Source/YetAnotherCyclingSimEditor/Private/PCG/YacsSaCalobraPcgExCliffCommandlet.cpp"
      - "Source/YetAnotherCyclingSimEditor/Public/PCG/YacsSaCalobraPcgExCliffCommandlet.h"
      - "Source/YetAnotherCyclingSimEditor/YetAnotherCyclingSimEditor.Build.cs"

permissions:
  contents: read

concurrency:
  group: sa-calobra-component230-pcgex-cliff
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  YACS_CLIFF_NEUTRAL_LANDSCAPE: "1"
  YACS_LFS_CACHE_ROOT: 'D:\yacs\cache\git-lfs\YetAnotherCyclingSim'

jobs:
  phase2c:
    name: PCGEx topology + custom A/B + 8-of-10 gates
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 30

    steps:
      - name: Isolate Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'component230-pcgex.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable long paths.' }

      - name: Checkout exact Phase 2C revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _phase2c-pcgex-cliff
          fetch-depth: 1
          lfs: false
          clean: false
          persist-credentials: false

      - name: Verify exact SHA and idle Unreal host
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "checkout HEAD '$actual' != event SHA '$env:GITHUB_SHA'"
          }
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') {
            throw "Shared Unreal host is already owned; status=$($state.status)."
          }
          "YACS_CLIFF_VISUAL_EXPECTED_SHA=$actual" >> $env:GITHUB_ENV

      - name: Install pinned GIS and image dependencies
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 rasterio==1.5.2 shapely==2.1.2 pillow==12.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C dependency install failed.' }

      - name: Materialize accepted map and complete limestone PBR dependency set
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_LFS_SKIP_SMUDGE = '0'
          try {
            New-Item -ItemType Directory -Force -Path $env:YACS_LFS_CACHE_ROOT | Out-Null
            git lfs install --local --skip-smudge
            if ($LASTEXITCODE -ne 0) { throw 'Local LFS setup failed.' }
            git config --local lfs.storage $env:YACS_LFS_CACHE_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'Persistent LFS storage configuration failed.' }

            $map = 'Content/Worlds/SaCalobra/L_SaCalobraAccepted_20261004.umap'
            $checkpointMaterials = 'Content/Worlds/SaCalobra/CheckpointMaterials'
            $checkpointEarthworks = 'Content/Worlds/SaCalobra/CheckpointEarthworks'
            $landscapeMaterial = 'Content/Generated/YACS/MaskReview/M_MaskReview_1.uasset'
            $landscapeTexture = 'Content/Generated/YACS/MaskReview/T_MaskReview_1.uasset'
            $library = 'Content/Generated/YACS/TextureMaterialPrep/Libraries/3d53743e48394f31beb35e4030dc8a87'
            $exposedBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/C414EA4B402723D66FCB689E49EEB02D/BaseColor.uasset'
            $screeBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/94406E0247C9822CFD006CAB8B20545E/BaseColor.uasset'
            $include = "$map,$checkpointMaterials/**,$checkpointEarthworks/**,$landscapeMaterial,$landscapeTexture,$library/**,$exposedBaseColor,$screeBaseColor"
            git lfs pull --include=$include --exclude=''
            if ($LASTEXITCODE -ne 0) { throw 'Accepted map / limestone transitive LFS pull failed.' }
            git lfs checkout $map $checkpointMaterials $checkpointEarthworks $landscapeMaterial $landscapeTexture $library $exposedBaseColor $screeBaseColor
            if ($LASTEXITCODE -ne 0) { throw 'Accepted map / limestone transitive LFS checkout failed.' }

            if (-not (Test-Path -LiteralPath $map -PathType Leaf)) {
              throw 'Accepted Sa Calobra map is missing after LFS checkout.'
            }
            if ((Get-Item -LiteralPath $map).Length -lt 100000000) {
              throw 'Accepted Sa Calobra map still looks like an LFS pointer.'
            }

            $required = @(
              $landscapeMaterial,
              $landscapeTexture,
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_ExposedRock.uasset",
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_Scree.uasset",
              "$library/ProviderData/ExposedRock/T_Height.uasset",
              "$library/ProviderData/ExposedRock/T_Normal.uasset",
              "$library/ProviderData/ExposedRock/T_Roughness.uasset",
              "$library/ProviderData/Scree/T_Height.uasset",
              "$library/ProviderData/Scree/T_Normal.uasset",
              "$library/ProviderData/Scree/T_Roughness.uasset",
              "$library/Sources/T_Source_ExposedRock.uasset",
              "$library/Sources/T_Source_Scree.uasset",
              $exposedBaseColor,
              $screeBaseColor
            )
            $required += @(0..2 | ForEach-Object { "$checkpointMaterials/MI_Accepted_$_.uasset" })
            $required += @(0..184 | ForEach-Object { "$checkpointEarthworks/T_Cut_$('{0:D3}' -f $_).uasset" })
            foreach ($asset in $required) {
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                throw "Required scene proof asset missing: $asset"
              }
              if ((Get-Item -LiteralPath $asset).Length -lt 1024) {
                throw "Required scene proof asset is still an LFS pointer: $asset"
              }
            }
          }
          finally {
            $env:GIT_LFS_SKIP_SMUDGE = '1'
          }

      - name: Resolve frozen inputs and isolated evidence roots
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $worldRoot = Join-Path $env:RUNNER_WORKSPACE '_yacs-world-data\sa-calobra-working-v1'
          $normalized = Join-Path $worldRoot 'normalized-context-v1a-2026-10-04\manifest.json'
          $pcg = Join-Path $worldRoot 'pcg-masks-v1-2026-10-04\pcg-mask-manifest.json'
          $context = Join-Path $worldRoot 'context-exclusions-v2-2026-10-04\context-mask-manifest.json'
          foreach ($path in @($normalized, $pcg, $context)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required frozen Phase 2C input missing: $path"
            }
          }

          $rootOut = Join-Path $env:RUNNER_TEMP "component230-pcgex-$env:GITHUB_SHA"
          Remove-Item -LiteralPath $rootOut -Recurse -Force -ErrorAction SilentlyContinue
          $planRoot = Join-Path $rootOut 'plan'
          $topologyRoot = Join-Path $rootOut 'topology'
          $customRoot = Join-Path $rootOut 'custom'
          $pcgexRoot = Join-Path $rootOut 'pcgex'
          New-Item -ItemType Directory -Force -Path $rootOut | Out-Null

          "YACS_CLIFF_NORMALIZED=$normalized" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCG=$pcg" >> $env:GITHUB_ENV
          "YACS_CLIFF_CONTEXT=$context" >> $env:GITHUB_ENV
          "YACS_CLIFF_PHASE2C_ROOT=$rootOut" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_PLAN_ROOT=$planRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_PLAN=$(Join-Path $planRoot 'component230-cliff-visual-plan.json')" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_PROOF_ROOT=$topologyRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_CUSTOM_OUTPUT=$customRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_OUTPUT=$pcgexRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_MESH=$(Join-Path $topologyRoot 'phase2c-pcgex-cliff-a.json')" >> $env:GITHUB_ENV

      - name: Prepare unchanged YACS classifier and narrow hard policy
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/assets/prepare_sa_calobra_component230_cliff_visual.py scripts/assets/analyze_sa_calobra_component230_cliff_visual.py scripts/assets/analyze_sa_calobra_component230_pcgex_topology.py scripts/ue/capture_sa_calobra_component230_cliff.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C Python compile failed.' }

          python -m unittest scripts.assets.test_sa_calobra_component230_cliff_visual scripts.assets.test_analyze_sa_calobra_component230_pcgex_topology scripts.assets.test_analyze_local_cliff_smoothing scripts.assets.test_analyze_limestone_edge_rounding scripts.assets.test_gate_component230_combined scripts.assets.test_component230_review_cameras -v
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C cliff plan/topology audit tests failed.' }

          python scripts/assets/prepare_sa_calobra_component230_cliff_visual.py --normalized-manifest $env:YACS_CLIFF_NORMALIZED --pcg-manifest $env:YACS_CLIFF_PCG --context-manifest $env:YACS_CLIFF_CONTEXT --output $env:YACS_CLIFF_VISUAL_PLAN_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C cliff plan preparation failed.' }

          $plan = Get-Content -LiteralPath $env:YACS_CLIFF_VISUAL_PLAN -Raw | ConvertFrom-Json
          if (
            $plan.status -ne 'COMPONENT230_CLIFF_VISUAL_PLAN' -or
            $plan.geometry_mutation -ne $false -or
            $plan.canonical_landscape_mutation -ne $false -or
            $plan.selector_policy_mutation -ne $false -or
            [int]$plan.counts.component_cliff_cells -ne 2611 -or
            [int]$plan.counts.component_scree_cells -ne 1237 -or
            [int]$plan.counts.skin_cell_count -ne 1017 -or
            [int]$plan.counts.skin_cluster_count -ne 14
          ) {
            throw 'Phase 2C input/reference contract drifted.'
          }

      - name: Prove deterministic PCGEx topology at exact HEAD
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/ue/Invoke-YacsSaCalobraPcgExCliff.ps1 -ExpectedBranch $env:GITHUB_REF_NAME -ExpectedHead $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -PlanPath $env:YACS_CLIFF_VISUAL_PLAN -ArtifactRoot $env:YACS_CLIFF_PCGEX_PROOF_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C topology proof failed.' }

          $proof = Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PCGEX_PROOF_ROOT 'phase2c-pcgex-topology-proof.json') -Raw | ConvertFrom-Json
          if (
            $proof.status -ne 'PASS' -or
            $proof.repository_head -ne $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -or
            [int]$proof.determinism.independent_runs -ne 2 -or
            [double]$proof.generator.max_edge_cm_after -gt 157.5 -or
            [int]$proof.generator.triangle_count -gt 120000
          ) {
            throw 'Phase 2C topology proof receipt contract failed.'
          }
          $proof | ConvertTo-Json -Depth 10 | Write-Host

          $topologyAudit = Join-Path $env:YACS_CLIFF_PCGEX_PROOF_ROOT 'phase2c-pcgex-topology-audit.json'
          python scripts/assets/analyze_sa_calobra_component230_pcgex_topology.py --plan $env:YACS_CLIFF_VISUAL_PLAN --mesh $env:YACS_CLIFF_PCGEX_MESH --output $topologyAudit --min-area-retention 0.90
          if ($LASTEXITCODE -ne 0) { throw 'Independent Phase 2C topology authority audit failed.' }
          $audit = Get-Content -LiteralPath $topologyAudit -Raw | ConvertFrom-Json
          if (
            $audit.status -ne 'PASS' -or
            [int]$audit.source.semantic_cluster_count -ne 14 -or
            [int]$audit.mesh.connected_components -ne [int]$audit.gate.expected_connected_components -or
            [int]$audit.mesh.outside_vertices -ne 0 -or
            [int]$audit.mesh.outside_triangle_centroids -ne 0 -or
            [int]$audit.mesh.nonmanifold_edges -ne 0 -or
            [int]$audit.mesh.degenerate_triangles -ne 0 -or
            [double]$audit.mesh.area_retention -lt 0.90 -or
            [double]$audit.mesh.area_retention -gt 1.001
          ) {
            throw 'Independent Phase 2C topology audit receipt contract failed.'
          }
          $audit | ConvertTo-Json -Depth 10 | Write-Host

      - name: Capture custom benchmark A and PCGEx candidate B
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $project = Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject'
          $engine = Resolve-YacsUnrealEngine -ProjectPath $project
          $script = (Resolve-Path 'scripts/ue/capture_sa_calobra_component230_cliff.py').Path

          function Invoke-CliffCapture {
            param(
              [Parameter(Mandatory=$true)] [string] $Label,
              [Parameter(Mandatory=$true)] [string] $Output,
              [Parameter(Mandatory=$true)] [bool] $UsePcgEx
            )

            New-Item -ItemType Directory -Force -Path $Output | Out-Null
            $env:YACS_CLIFF_VISUAL_OUTPUT = $Output
            if ($UsePcgEx) {
              if (-not (Test-Path -LiteralPath $env:YACS_CLIFF_PCGEX_MESH -PathType Leaf)) {
                throw 'PCGEx mesh receipt is missing before candidate render.'
              }
            }
            else {
              Remove-Item Env:YACS_CLIFF_PCGEX_MESH -ErrorAction SilentlyContinue
            }

            $stdout = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.stdout.log"
            $stderr = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.stderr.log"
            $log = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.engine.log"
            $arguments = @(
              ('"' + $project + '"'),
              ('-ExecutePythonScript="' + $script + '"'),
              '-RenderOffscreen',
              '-Unattended',
              '-NoPause',
              '-NoSplash',
              '-NoSound',
              '-NoP4',
              '-NoVSync',
              '-Deterministic',
              '-ScriptErrorsAreFatal',
              '-stdout',
              ('-AbsLog="' + $log + '"')
            )
            $started = Get-Date
            $process = Start-Process -FilePath $engine.UnrealEditorPath -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(480000)) {
              try { $process | Stop-Process -Force } catch { }
              throw "$Label cliff capture timed out."
            }
            $seconds = ((Get-Date) - $started).TotalSeconds
            if ($process.ExitCode -ne 0) {
              foreach ($diagnostic in @($stdout, $stderr, $log)) {
                if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                  Write-Host "===== TAIL $diagnostic ====="
                  Get-Content -LiteralPath $diagnostic -Tail 240 | Write-Host
                }
              }
              throw "$Label cliff capture exited $($process.ExitCode)."
            }

            $materialFallback = @()
            foreach ($diagnostic in @($stdout, $stderr, $log)) {
              if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                $materialFallback += @(
                  Select-String -LiteralPath $diagnostic -SimpleMatch -Pattern @(
                    'Texture Sample > Missing input texture',
                    'Default Material will be used'
                  ) -ErrorAction SilentlyContinue
                )
                $materialFallback += @(
                  Select-String -LiteralPath $diagnostic -Pattern @(
                    "LoadErrors: Error:.*'/Game/Worlds/SaCalobra/Checkpoint",
                    "LoadErrors: Error:.*'/Game/Generated/YACS/MaskReview/",
                    "LoadErrors: Error:.*'/Game/Generated/YACS/TextureMaterialPrep/"
                  ) -ErrorAction SilentlyContinue
                )
              }
            }
            if ($materialFallback.Count -gt 0) {
              $materialFallback | ForEach-Object {
                "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
              } | Write-Host
              throw "$Label material proof detected missing texture or Default Material fallback."
            }

            Assert-CliffCapture -Label $Label -Output $Output -UsePcgEx $UsePcgEx -Seconds $seconds
          }

          function Assert-CliffCapture {
            param([string] $Label, [string] $Output, [bool] $UsePcgEx, [double] $Seconds)
            $receiptPath = Join-Path $Output 'component230-cliff-visual-receipt.json'
            if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
              throw "$Label visual receipt is missing."
            }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if (
              $receipt.status -ne 'COMPONENT230_CLIFF_VISUAL_PASS' -or
              $receipt.exact_sha -ne $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -or
              $receipt.map_saved -ne $false -or
              $receipt.assets_saved -ne $false -or
              $receipt.canonical_landscape_mutation -ne $false -or
              $receipt.selector_policy_mutation -ne $false -or
              $receipt.landscape_presentation_material.enabled -ne $true -or
              $receipt.landscape_presentation_material.restored -ne $true -or
              $receipt.landscape_presentation_material.component -ne 'LandscapeComponent_230' -or
              $receipt.landscape_presentation_material.material -ne '/Engine/BasicShapes/BasicShapeMaterial.BasicShapeMaterial' -or
              [int]@($receipt.captures).Count -ne 4 -or
              [bool]$receipt.mesh.collision_enabled -ne $false -or
              [bool]$receipt.mesh.cast_dynamic_shadows -ne $true
            ) {
              throw "$Label visual receipt contract failed."
            }
            if ($env:YACS_TERRAIN_MESH_TRIAL -eq '1') {
              $edge = $receipt.terrain_erosion_trial
              if (
                $receipt.mesh.generator -ne 'native-source-edge-bevel-only' -or
                $edge.edge_only_mesh -ne $true -or
                $edge.terrain_import_performed -ne $false -or
                $edge.native_landscape -ne $false -or
                $edge.derived_heightfield_modified -ne $false -or
                $edge.erosion.enabled -ne $false -or
                $edge.source_heightfield_unchanged -ne $true -or
                $edge.restored -ne $true -or
                $edge.combined_audit.status -ne 'PASS' -or
                $edge.combined_audit.displacement_limit_cm -ne 20 -or
                $edge.combined_audit.max_displacement_cm -gt 20.000001 -or
                $edge.combined_audit.edge_band_radius_cm -ne 10 -or
                $edge.combined_audit.max_edge_band_distance_cm -gt 10.000001 -or
                $edge.combined_audit.outside_edge_surface_unchanged -ne $true
              ) { throw 'Narrow limestone edge-only receipt failed.' }
            }
            elseif ($env:YACS_TERRAIN_EROSION_TRIAL -eq '1') {
              if (
                $receipt.mesh.generator -ne 'native-landscape-thermal-erosion' -or
                $receipt.terrain_erosion_trial.native_landscape -ne $true -or
                $receipt.terrain_erosion_trial.imported_heightfield_matches -ne $true -or
                $receipt.terrain_erosion_trial.derived_heightfield_modified -ne $true -or
                $receipt.terrain_erosion_trial.source_heightfield_unchanged -ne $true -or
                $receipt.terrain_erosion_trial.restored -ne $true -or
                $receipt.terrain_erosion_trial.erosion.max_abs_change_cm -gt 150 -or
                $receipt.terrain_erosion_trial.erosion.fixed_samples_changed -ne 0 -or
                $receipt.terrain_erosion_trial.erosion.height_sum_delta_units -ne 0
              ) { throw 'Native terrain erosion trial receipt failed.' }
            }
            elseif ($env:YACS_LANDSCAPE_MESH_DIAGNOSTIC -eq '1') {
              if (
                $receipt.mesh.generator -ne 'native-landscape-export' -or
                $receipt.landscape_mesh_diagnostic.restored -ne $true -or
                $receipt.landscape_mesh_diagnostic.pcgex_overlay -ne $false -or
                $receipt.mesh.material.cliff -ne $receipt.landscape_presentation_material.material -or
                $receipt.landscape_mesh_diagnostic.export.max_conversion_error_cm -gt 0.001
              ) { throw 'Native Landscape mesh diagnostic receipt failed.' }
            }
            elseif ($UsePcgEx) {
              if (
                $receipt.mesh.generator -ne 'pcgex-clipper2' -or
                $receipt.mesh.pcgex_topology.max_xy_shift_cm -ne 0.0 -or
                [int]$receipt.mesh.pcgex_topology.interior_vertices -le 0 -or
                [double]$receipt.mesh.pcgex_topology.max_edge_cm_after -gt 157.5 -or
                [int]$receipt.mesh.pcgex_topology.pcgex_triangle_count -gt 120000
              ) {
                throw 'PCGEx visual topology density/performance contract failed.'
              }
            }
            elseif ($receipt.mesh.generator -ne 'yacs-connected-skin') {
              throw 'Custom benchmark generator identity drifted.'
            }

            [ordered]@{
              label = $Label
              seconds = if ($Label -eq 'custom' -and $env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT) { $null } else { [math]::Round([double]$seconds, 3) }
              timing_scope = if ($env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT) { 'shared A/B editor session; no per-candidate timing claim' } else { 'editor process' }
              generator = [string]$receipt.mesh.generator
              cliff_triangles = [int]$receipt.mesh.cliff.triangles
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $Output 'capture-performance.json') -Encoding UTF8
          }

          # Owner-approved replacement diagnostic runs before existing A/B proofs.
          $env:YACS_LANDSCAPE_MESH_DIAGNOSTIC = '1'
          try {
            $terrainRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'landscape-mesh'
            Invoke-CliffCapture -Label 'landscape-mesh' -Output $terrainRoot -UsePcgEx $false
            $env:YACS_LOCAL_CLIFF_SMOOTHING = '1'
            try {
              $localRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'local-cliff-smoothing'
              Invoke-CliffCapture -Label 'local-cliff-smoothing' -Output $localRoot -UsePcgEx $false
              python scripts/assets/analyze_local_cliff_smoothing.py --plan $env:YACS_CLIFF_VISUAL_PLAN --mesh (Join-Path $localRoot 'local-cliff-smoothing-mesh.json') --output (Join-Path $localRoot 'local-cliff-smoothing-audit.json')
              if ($LASTEXITCODE -ne 0) { throw 'Independent local smoothing audit failed.' }
              $local = Get-Content -LiteralPath (Join-Path $localRoot 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json
              if (
                $local.landscape_mesh_diagnostic.export.local_smoothing -ne $true -or
                $local.landscape_mesh_diagnostic.export.folded_xy_triangles -ne 0 -or
                $local.landscape_mesh_diagnostic.export.locked_vertex_displacement_cm -ne 0 -or
                $local.landscape_mesh_diagnostic.export.displacement_limit_cm -ne 100 -or
                $local.landscape_mesh_diagnostic.export.max_displacement_cm -gt 100.000001
              ) { throw 'Local cliff smoothing bounds failed.' }
            }
            finally {
              Remove-Item Env:YACS_LOCAL_CLIFF_SMOOTHING -ErrorAction SilentlyContinue
            }
          }
          finally {
            Remove-Item Env:YACS_LANDSCAPE_MESH_DIAGNOSTIC -ErrorAction SilentlyContinue
          }

          $env:YACS_TERRAIN_EROSION_TRIAL = '1'
          try {
            python -m unittest scripts.geometry.test_local_thermal_erosion -v
            if ($LASTEXITCODE -ne 0) { throw 'Thermal erosion tests failed.' }
            $erosionRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion'
            Invoke-CliffCapture -Label 'terrain-erosion' -Output $erosionRoot -UsePcgEx $false
            $env:YACS_TERRAIN_MESH_TRIAL = '1'
            $env:YACS_TERRAIN_ORIGINAL_MESH = Join-Path $localRoot 'local-cliff-smoothing-mesh.json'
            $combinedRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion-mesh'
            Invoke-CliffCapture -Label 'terrain-erosion-mesh' -Output $combinedRoot -UsePcgEx $false
          }
          finally {
            Remove-Item Env:YACS_TERRAIN_EROSION_TRIAL -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_MESH_TRIAL -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_ORIGINAL_MESH -ErrorAction SilentlyContinue
          }

          $env:YACS_CLIFF_PCGEX_MESH = Join-Path $env:YACS_CLIFF_PCGEX_PROOF_ROOT 'phase2c-pcgex-cliff-a.json'
          $env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT = $env:YACS_CLIFF_CUSTOM_OUTPUT
          try {
            Invoke-CliffCapture -Label 'paired' -Output $env:YACS_CLIFF_PCGEX_OUTPUT -UsePcgEx $true
            Assert-CliffCapture -Label 'custom' -Output $env:YACS_CLIFF_CUSTOM_OUTPUT -UsePcgEx $false -Seconds 0
          }
          finally {
            Remove-Item Env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT -ErrorAction SilentlyContinue
          }

          # Additional owner-requested diagnostic; original A/B inputs stay intact.
          $env:YACS_CLIFF_MATCH_LANDSCAPE_MATERIAL = '1'
          try {
            $sameRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'same-material'
            Invoke-CliffCapture -Label 'same-material' -Output $sameRoot -UsePcgEx $true
            $same = Get-Content -LiteralPath (Join-Path $sameRoot 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json
            if (
              $same.mesh.material.matches_landscape -ne $true -or
              $same.mesh.material.diagnostic_only -ne $true -or
              $same.mesh.material.cliff -ne $same.landscape_presentation_material.material
            ) {
              throw 'Same-material diagnostic did not use the Landscape material.'
            }
          }
          finally {
            Remove-Item Env:YACS_CLIFF_MATCH_LANDSCAPE_MATERIAL -ErrorAction SilentlyContinue
          }

      - name: Measure A/B and enforce 8-of-10 lighting gate
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/assets/analyze_sa_calobra_component230_cliff_visual.py --root $env:YACS_CLIFF_CUSTOM_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Custom benchmark metric analysis failed.' }
          python scripts/assets/analyze_sa_calobra_component230_cliff_visual.py --root $env:YACS_CLIFF_PCGEX_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PCGEx metric analysis failed.' }

          $custom = Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_CUSTOM_OUTPUT 'component230-cliff-metrics.json') -Raw | ConvertFrom-Json
          $pcgex = Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PCGEX_OUTPUT 'component230-cliff-metrics.json') -Raw | ConvertFrom-Json

          if (
            $custom.metrics.baseline_lit.sha256 -ne $pcgex.metrics.baseline_lit.sha256 -or
            $custom.metrics.baseline_lighting_only.sha256 -ne $pcgex.metrics.baseline_lighting_only.sha256
          ) {
            throw 'Custom and PCGEx captures do not share an identical baseline.'
          }

          $a = (Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_CUSTOM_OUTPUT 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json).capture_protocol.shared_baseline
          $b = (Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PCGEX_OUTPUT 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json).capture_protocol.shared_baseline
          if (
            $a.enabled -ne $true -or $b.enabled -ne $true -or
            [string]::IsNullOrWhiteSpace($a.acquisition_id) -or
            $a.acquisition_id -ne $b.acquisition_id -or
            $a.protocol -ne 'single-scene-baseline-custom-pcgex-v1' -or
            $a.protocol -ne $b.protocol -or
            $a.custom_removed_before_pcgex -ne $true -or
            $b.custom_removed_before_pcgex -ne $true
          ) { throw 'A/B shared-baseline acquisition provenance failed.' }

          $failures = @()
          foreach ($threshold in @('0.05','0.10','0.15')) {
            $base = $pcgex.metrics.baseline_lighting_only.thresholds.$threshold
            $customCandidate = $custom.metrics.candidate_lighting_only.thresholds.$threshold
            $pcgexCandidate = $pcgex.metrics.candidate_lighting_only.thresholds.$threshold

            if ([int]$pcgexCandidate.pixels -gt [int]$base.pixels) {
              $failures += "$threshold PCGEx dark pixels exceed baseline: $($pcgexCandidate.pixels) > $($base.pixels)"
            }
            if ([int]$pcgexCandidate.largest_region_pixels -gt [int]$base.largest_region_pixels) {
              $failures += "$threshold PCGEx largest dark region exceeds baseline: $($pcgexCandidate.largest_region_pixels) > $($base.largest_region_pixels)"
            }
            if ([int]$pcgexCandidate.pixels -gt [int]$customCandidate.pixels) {
              $failures += "$threshold PCGEx dark pixels do not beat custom A: $($pcgexCandidate.pixels) > $($customCandidate.pixels)"
            }
            if ([int]$pcgexCandidate.largest_region_pixels -gt [int]$customCandidate.largest_region_pixels) {
              $failures += "$threshold PCGEx largest dark region does not beat custom A: $($pcgexCandidate.largest_region_pixels) > $($customCandidate.largest_region_pixels)"
            }
          }

          $ab = [ordered]@{
            schema_version = 1
            status = $(if ($failures.Count -eq 0) { 'PASS' } else { 'FAIL' })
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            baseline_identical = $true
            custom = $custom.lighting_only_deltas
            pcgex = $pcgex.lighting_only_deltas
            failures = $failures
          }
          $abPath = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'phase2c-ab-gate.json'
          $ab | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $abPath -Encoding UTF8
          $ab | ConvertTo-Json -Depth 10 | Write-Host
          if ($failures.Count -gt 0) {
            throw 'Phase 2C PCGEx candidate did not satisfy the lighting/custom-generator admission gate.'
          }

      - name: Measure combined limestone independently of PCGEx admission
        if: ${{ always() && env.YACS_CLIFF_PHASE2C_ROOT != '' }}
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion-mesh'
          python scripts/assets/analyze_sa_calobra_component230_cliff_visual.py --root $root
          if ($LASTEXITCODE -ne 0) { throw 'Combined neutral fixture analysis failed.' }
          python scripts/assets/gate_component230_combined.py --root $root --expected-sha $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Combined limestone technical admission failed.' }

      - name: Enforce non-persistent checkout
        if: ${{ always() && env.YACS_CLIFF_PHASE2C_ROOT != '' }}
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect proof checkout.' }
          [ordered]@{
            schema_version = 1
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            status = $(if ($tracked.Count -eq 0) { 'PASS' } else { 'FAIL' })
            tracked_changes = $tracked
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'checkout-restoration.json') -Encoding UTF8
          if ($tracked.Count -gt 0) {
            throw "Phase 2C proof mutated tracked files: $($tracked -join '; ')"
          }

      - name: Upload Phase 2C evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sa-calobra-component230-pcgex-cliff
          path: |
            ${{ runner.temp }}/component230-pcgex-${{ github.sha }}/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90

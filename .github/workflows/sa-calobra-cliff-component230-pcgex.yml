name: Sa Calobra Component 230 PCGEx Cliff

on:
  workflow_dispatch:
    inputs:
      tpp_survey:
        description: Run only the frozen-road bidirectional TPP survey in the accepted v8 scene
        type: boolean
        required: false
        default: false
  push:
    branches:
      - "feat/phase2c-pcgex-cliff-topology"
    paths:
      - ".github/workflows/sa-calobra-cliff-component230-pcgex.yml"
      - ".gumball/workflow-lifecycle.json"
      - "scripts/worldgen/Bootstrap-YacsPcgEx.ps1"
      - "scripts/ue/Invoke-YacsSaCalobraPcgExCliff.ps1"
      - "scripts/ue/capture_sa_calobra_component230_cliff.py"
      - "scripts/ue/sa_calobra_tpp_survey_capture.py"
      - "scripts/proof/sa_calobra_tpp_survey.py"
      - "scripts/proof/package_sa_calobra_tpp_survey.py"
      - "scripts/proof/retain_sa_calobra_tpp_survey.py"
      - "scripts/proof/export_sa_calobra_tpp_survey_docs.py"
      - "scripts/ci/test_sa_calobra_tpp_survey.py"
      - "scripts/ci/test_sa_calobra_tpp_survey_capture.py"
      - "scripts/ci/test_package_sa_calobra_tpp_survey.py"
      - "scripts/ci/test_retain_sa_calobra_tpp_survey.py"
      - "scripts/ci/test_export_sa_calobra_tpp_survey_docs.py"
      - "scripts/assets/prepare_sa_calobra_detail_pilot.py"
      - "scripts/assets/run_sa_calobra_detail_pilot.py"
      - "scripts/assets/test_sa_calobra_detail_pilot.py"
      - "scripts/assets/test_run_sa_calobra_detail_pilot.py"
      - "docs/experiments/sa-calobra-component230-detail-pilot-20261008/annotations.json"
      - "scripts/assets/prepare_sa_calobra_component230_cliff_visual.py"
      - "scripts/assets/test_sa_calobra_component230_cliff_visual.py"
      - "scripts/assets/analyze_sa_calobra_component230_cliff_visual.py"
      - "scripts/assets/analyze_local_cliff_smoothing.py"
      - "scripts/assets/test_analyze_local_cliff_smoothing.py"
      - "scripts/assets/gate_component230_combined.py"
      - "scripts/assets/test_gate_component230_combined.py"
      - "scripts/assets/test_component230_review_cameras.py"
      - "Source/YetAnotherCyclingSimEditor/Private/Diagnostics/YacsLandscapeMeshDiagnosticLibrary.cpp"
      - "Source/YetAnotherCyclingSimEditor/Private/Diagnostics/YacsLandscapeTerrainTrial.cpp"
      - "scripts/geometry/local_thermal_erosion.py"
      - "scripts/geometry/test_local_thermal_erosion.py"
      - "Source/YetAnotherCyclingSimEditor/Public/Diagnostics/YacsLandscapeMeshDiagnosticLibrary.h"
      - "scripts/assets/analyze_sa_calobra_component230_pcgex_topology.py"
      - "scripts/assets/test_analyze_sa_calobra_component230_pcgex_topology.py"
      - "Source/YetAnotherCyclingSimEditor/Private/PCG/YacsSaCalobraCliffCellsSettings.cpp"
      - "Source/YetAnotherCyclingSimEditor/Public/PCG/YacsSaCalobraCliffCellsSettings.h"
      - "Source/YetAnotherCyclingSimEditor/Private/PCG/YacsSaCalobraPcgExCliffCommandlet.cpp"
      - "Source/YetAnotherCyclingSimEditor/Public/PCG/YacsSaCalobraPcgExCliffCommandlet.h"
      - "Source/YetAnotherCyclingSimEditor/YetAnotherCyclingSimEditor.Build.cs"

permissions:
  contents: read

concurrency:
  group: sa-calobra-component230-pcgex-cliff
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  YACS_CLIFF_NEUTRAL_LANDSCAPE: "1"
  YACS_LFS_CACHE_ROOT: 'D:\yacs\cache\git-lfs\YetAnotherCyclingSim'

jobs:
  detail-pilot:
    name: Replay source-surface detail masks without Unreal
    if: >-
      github.event_name == 'push' &&
      github.repository == 'karnalooch/YetAnotherCyclingSim' &&
      github.actor == 'karnalooch' &&
      github.ref == 'refs/heads/feat/phase2c-pcgex-cliff-topology' &&
      contains(github.event.head_commit.message, '[detail-pilot]') &&
      !contains(github.event.head_commit.message, '[tpp-survey]') &&
      !contains(github.event.head_commit.message, '[tpp-retain]') &&
      !contains(github.event.head_commit.message, '[tpp-docs]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact pilot revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - name: Set up the existing Python tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the existing pinned array dependency
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5
      - name: Test projection, source protection and replay boundaries
        run: python -m unittest scripts.assets.test_sa_calobra_detail_pilot scripts.assets.test_run_sa_calobra_detail_pilot -v
      - name: Replay verified source triangles and original captured camera poses
        run: >-
          python scripts/assets/run_sa_calobra_detail_pilot.py
          --frames docs/experiments/sa-calobra-tpp-survey-20261008/frames.csv
          --annotations docs/experiments/sa-calobra-component230-detail-pilot-20261008/annotations.json
          --output ${{ runner.temp }}/component230-detail-pilot
      - name: Retain masks, unchanged geometry and original-image vector previews
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: component230-detail-pilot-${{ github.sha }}
          path: ${{ runner.temp }}/component230-detail-pilot/
          if-no-files-found: error
          retention-days: 90

  phase2c:
    if: >-
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[detail-pilot]')) &&
      !(github.event_name == 'workflow_dispatch' && inputs.tpp_survey) &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[tpp-survey]')) &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[tpp-retain]')) &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[tpp-docs]'))
    name: PCGEx topology + custom A/B + 8-of-10 gates
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 30

    steps:
      - name: Isolate Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'component230-pcgex.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable long paths.' }

      - name: Checkout exact Phase 2C revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _phase2c-pcgex-cliff
          fetch-depth: 1
          lfs: false
          clean: false
          persist-credentials: false

      - name: Verify exact SHA and idle Unreal host
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "checkout HEAD '$actual' != event SHA '$env:GITHUB_SHA'"
          }
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') {
            throw "Shared Unreal host is already owned; status=$($state.status)."
          }
          "YACS_CLIFF_VISUAL_EXPECTED_SHA=$actual" >> $env:GITHUB_ENV

      - name: Install pinned GIS and image dependencies
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 rasterio==1.5.2 shapely==2.1.2 pillow==12.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C dependency install failed.' }

      - name: Materialize accepted map and complete limestone PBR dependency set
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_LFS_SKIP_SMUDGE = '0'
          try {
            New-Item -ItemType Directory -Force -Path $env:YACS_LFS_CACHE_ROOT | Out-Null
            git lfs install --local --skip-smudge
            if ($LASTEXITCODE -ne 0) { throw 'Local LFS setup failed.' }
            git config --local lfs.storage $env:YACS_LFS_CACHE_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'Persistent LFS storage configuration failed.' }

            $map = 'Content/Worlds/SaCalobra/L_SaCalobraAccepted_20261004.umap'
            $checkpointMaterials = 'Content/Worlds/SaCalobra/CheckpointMaterials'
            $checkpointEarthworks = 'Content/Worlds/SaCalobra/CheckpointEarthworks'
            $landscapeMaterial = 'Content/Generated/YACS/MaskReview/M_MaskReview_1.uasset'
            $landscapeTexture = 'Content/Generated/YACS/MaskReview/T_MaskReview_1.uasset'
            $library = 'Content/Generated/YACS/TextureMaterialPrep/Libraries/3d53743e48394f31beb35e4030dc8a87'
            $exposedBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/C414EA4B402723D66FCB689E49EEB02D/BaseColor.uasset'
            $screeBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/94406E0247C9822CFD006CAB8B20545E/BaseColor.uasset'
            $include = "$map,$checkpointMaterials/**,$checkpointEarthworks/**,$landscapeMaterial,$landscapeTexture,$library/**,$exposedBaseColor,$screeBaseColor"
            git lfs pull --include=$include --exclude=''
            if ($LASTEXITCODE -ne 0) { throw 'Accepted map / limestone transitive LFS pull failed.' }
            git lfs checkout $map $checkpointMaterials $checkpointEarthworks $landscapeMaterial $landscapeTexture $library $exposedBaseColor $screeBaseColor
            if ($LASTEXITCODE -ne 0) { throw 'Accepted map / limestone transitive LFS checkout failed.' }

            if (-not (Test-Path -LiteralPath $map -PathType Leaf)) {
              throw 'Accepted Sa Calobra map is missing after LFS checkout.'
            }
            if ((Get-Item -LiteralPath $map).Length -lt 100000000) {
              throw 'Accepted Sa Calobra map still looks like an LFS pointer.'
            }

            $required = @(
              $landscapeMaterial,
              $landscapeTexture,
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_ExposedRock.uasset",
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_Scree.uasset",
              "$library/ProviderData/ExposedRock/T_Height.uasset",
              "$library/ProviderData/ExposedRock/T_Normal.uasset",
              "$library/ProviderData/ExposedRock/T_Roughness.uasset",
              "$library/ProviderData/Scree/T_Height.uasset",
              "$library/ProviderData/Scree/T_Normal.uasset",
              "$library/ProviderData/Scree/T_Roughness.uasset",
              "$library/Sources/T_Source_ExposedRock.uasset",
              "$library/Sources/T_Source_Scree.uasset",
              $exposedBaseColor,
              $screeBaseColor
            )
            $required += @(0..2 | ForEach-Object { "$checkpointMaterials/MI_Accepted_$_.uasset" })
            $required += @(0..184 | ForEach-Object { "$checkpointEarthworks/T_Cut_$('{0:D3}' -f $_).uasset" })
            foreach ($asset in $required) {
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                throw "Required scene proof asset missing: $asset"
              }
              if ((Get-Item -LiteralPath $asset).Length -lt 1024) {
                throw "Required scene proof asset is still an LFS pointer: $asset"
              }
            }
          }
          finally {
            $env:GIT_LFS_SKIP_SMUDGE = '1'
          }

      - name: Resolve frozen inputs and isolated evidence roots
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $worldRoot = Join-Path $env:RUNNER_WORKSPACE '_yacs-world-data\sa-calobra-working-v1'
          $normalized = Join-Path $worldRoot 'normalized-context-v1a-2026-10-04\manifest.json'
          $pcg = Join-Path $worldRoot 'pcg-masks-v1-2026-10-04\pcg-mask-manifest.json'
          $context = Join-Path $worldRoot 'context-exclusions-v2-2026-10-04\context-mask-manifest.json'
          foreach ($path in @($normalized, $pcg, $context)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required frozen Phase 2C input missing: $path"
            }
          }

          $rootOut = Join-Path $env:RUNNER_TEMP "component230-pcgex-$env:GITHUB_SHA"
          Remove-Item -LiteralPath $rootOut -Recurse -Force -ErrorAction SilentlyContinue
          $planRoot = Join-Path $rootOut 'plan'
          $topologyRoot = Join-Path $rootOut 'topology'
          $customRoot = Join-Path $rootOut 'custom'
          $pcgexRoot = Join-Path $rootOut 'pcgex'
          New-Item -ItemType Directory -Force -Path $rootOut | Out-Null

          "YACS_CLIFF_NORMALIZED=$normalized" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCG=$pcg" >> $env:GITHUB_ENV
          "YACS_CLIFF_CONTEXT=$context" >> $env:GITHUB_ENV
          "YACS_CLIFF_PHASE2C_ROOT=$rootOut" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_PLAN_ROOT=$planRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_PLAN=$(Join-Path $planRoot 'component230-cliff-visual-plan.json')" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_PROOF_ROOT=$topologyRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_CUSTOM_OUTPUT=$customRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_OUTPUT=$pcgexRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_MESH=$(Join-Path $topologyRoot 'phase2c-pcgex-cliff-a.json')" >> $env:GITHUB_ENV

      - name: Prepare unchanged YACS classifier and narrow hard policy
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/assets/prepare_sa_calobra_component230_cliff_visual.py scripts/assets/analyze_sa_calobra_component230_cliff_visual.py scripts/assets/analyze_sa_calobra_component230_pcgex_topology.py scripts/ue/capture_sa_calobra_component230_cliff.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C Python compile failed.' }

          python -m unittest scripts.assets.test_sa_calobra_component230_cliff_visual scripts.assets.test_analyze_sa_calobra_component230_pcgex_topology scripts.assets.test_analyze_local_cliff_smoothing scripts.assets.test_analyze_limestone_edge_rounding scripts.assets.test_gate_component230_combined scripts.assets.test_component230_review_cameras -v
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C cliff plan/topology audit tests failed.' }

          python scripts/assets/prepare_sa_calobra_component230_cliff_visual.py --normalized-manifest $env:YACS_CLIFF_NORMALIZED --pcg-manifest $env:YACS_CLIFF_PCG --context-manifest $env:YACS_CLIFF_CONTEXT --output $env:YACS_CLIFF_VISUAL_PLAN_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C cliff plan preparation failed.' }

          $plan = Get-Content -LiteralPath $env:YACS_CLIFF_VISUAL_PLAN -Raw | ConvertFrom-Json
          if (
            $plan.status -ne 'COMPONENT230_CLIFF_VISUAL_PLAN' -or
            $plan.geometry_mutation -ne $false -or
            $plan.canonical_landscape_mutation -ne $false -or
            $plan.selector_policy_mutation -ne $false -or
            [int]$plan.counts.component_cliff_cells -ne 2611 -or
            [int]$plan.counts.component_scree_cells -ne 1237 -or
            [int]$plan.counts.skin_cell_count -ne 1017 -or
            [int]$plan.counts.skin_cluster_count -ne 14
          ) {
            throw 'Phase 2C input/reference contract drifted.'
          }

      - name: Prove deterministic PCGEx topology at exact HEAD
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/ue/Invoke-YacsSaCalobraPcgExCliff.ps1 -ExpectedBranch $env:GITHUB_REF_NAME -ExpectedHead $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -PlanPath $env:YACS_CLIFF_VISUAL_PLAN -ArtifactRoot $env:YACS_CLIFF_PCGEX_PROOF_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C topology proof failed.' }

          $proof = Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PCGEX_PROOF_ROOT 'phase2c-pcgex-topology-proof.json') -Raw | ConvertFrom-Json
          if (
            $proof.status -ne 'PASS' -or
            $proof.repository_head -ne $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -or
            [int]$proof.determinism.independent_runs -ne 2 -or
            [double]$proof.generator.max_edge_cm_after -gt 157.5 -or
            [int]$proof.generator.triangle_count -gt 120000
          ) {
            throw 'Phase 2C topology proof receipt contract failed.'
          }
          $proof | ConvertTo-Json -Depth 10 | Write-Host

          $topologyAudit = Join-Path $env:YACS_CLIFF_PCGEX_PROOF_ROOT 'phase2c-pcgex-topology-audit.json'
          python scripts/assets/analyze_sa_calobra_component230_pcgex_topology.py --plan $env:YACS_CLIFF_VISUAL_PLAN --mesh $env:YACS_CLIFF_PCGEX_MESH --output $topologyAudit --min-area-retention 0.90
          if ($LASTEXITCODE -ne 0) { throw 'Independent Phase 2C topology authority audit failed.' }
          $audit = Get-Content -LiteralPath $topologyAudit -Raw | ConvertFrom-Json
          if (
            $audit.status -ne 'PASS' -or
            [int]$audit.source.semantic_cluster_count -ne 14 -or
            [int]$audit.mesh.connected_components -ne [int]$audit.gate.expected_connected_components -or
            [int]$audit.mesh.outside_vertices -ne 0 -or
            [int]$audit.mesh.outside_triangle_centroids -ne 0 -or
            [int]$audit.mesh.nonmanifold_edges -ne 0 -or
            [int]$audit.mesh.degenerate_triangles -ne 0 -or
            [double]$audit.mesh.area_retention -lt 0.90 -or
            [double]$audit.mesh.area_retention -gt 1.001
          ) {
            throw 'Independent Phase 2C topology audit receipt contract failed.'
          }
          $audit | ConvertTo-Json -Depth 10 | Write-Host

      - name: Capture custom benchmark A and PCGEx candidate B
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $project = Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject'
          $engine = Resolve-YacsUnrealEngine -ProjectPath $project
          $script = (Resolve-Path 'scripts/ue/capture_sa_calobra_component230_cliff.py').Path

          function Invoke-CliffCapture {
            param(
              [Parameter(Mandatory=$true)] [string] $Label,
              [Parameter(Mandatory=$true)] [string] $Output,
              [Parameter(Mandatory=$true)] [bool] $UsePcgEx
            )

            New-Item -ItemType Directory -Force -Path $Output | Out-Null
            $env:YACS_CLIFF_VISUAL_OUTPUT = $Output
            if ($UsePcgEx) {
              if (-not (Test-Path -LiteralPath $env:YACS_CLIFF_PCGEX_MESH -PathType Leaf)) {
                throw 'PCGEx mesh receipt is missing before candidate render.'
              }
            }
            else {
              Remove-Item Env:YACS_CLIFF_PCGEX_MESH -ErrorAction SilentlyContinue
            }

            $stdout = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.stdout.log"
            $stderr = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.stderr.log"
            $log = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.engine.log"
            $arguments = @(
              ('"' + $project + '"'),
              ('-ExecutePythonScript="' + $script + '"'),
              '-RenderOffscreen',
              '-Unattended',
              '-NoPause',
              '-NoSplash',
              '-NoSound',
              '-NoP4',
              '-NoVSync',
              '-Deterministic',
              '-ScriptErrorsAreFatal',
              '-stdout',
              ('-AbsLog="' + $log + '"')
            )
            $started = Get-Date
            $process = Start-Process -FilePath $engine.UnrealEditorPath -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(480000)) {
              try { $process | Stop-Process -Force } catch { }
              throw "$Label cliff capture timed out."
            }
            $seconds = ((Get-Date) - $started).TotalSeconds
            if ($process.ExitCode -ne 0) {
              foreach ($diagnostic in @($stdout, $stderr, $log)) {
                if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                  Write-Host "===== TAIL $diagnostic ====="
                  Get-Content -LiteralPath $diagnostic -Tail 240 | Write-Host
                }
              }
              throw "$Label cliff capture exited $($process.ExitCode)."
            }

            $materialFallback = @()
            foreach ($diagnostic in @($stdout, $stderr, $log)) {
              if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                $materialFallback += @(
                  Select-String -LiteralPath $diagnostic -SimpleMatch -Pattern @(
                    'Texture Sample > Missing input texture',
                    'Default Material will be used'
                  ) -ErrorAction SilentlyContinue
                )
                $materialFallback += @(
                  Select-String -LiteralPath $diagnostic -Pattern @(
                    "LoadErrors: Error:.*'/Game/Worlds/SaCalobra/Checkpoint",
                    "LoadErrors: Error:.*'/Game/Generated/YACS/MaskReview/",
                    "LoadErrors: Error:.*'/Game/Generated/YACS/TextureMaterialPrep/"
                  ) -ErrorAction SilentlyContinue
                )
              }
            }
            if ($materialFallback.Count -gt 0) {
              $materialFallback | ForEach-Object {
                "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
              } | Write-Host
              throw "$Label material proof detected missing texture or Default Material fallback."
            }

            Assert-CliffCapture -Label $Label -Output $Output -UsePcgEx $UsePcgEx -Seconds $seconds
          }

          function Assert-CliffCapture {
            param([string] $Label, [string] $Output, [bool] $UsePcgEx, [double] $Seconds)
            $receiptPath = Join-Path $Output 'component230-cliff-visual-receipt.json'
            if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
              throw "$Label visual receipt is missing."
            }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if (
              $receipt.status -ne 'COMPONENT230_CLIFF_VISUAL_PASS' -or
              $receipt.exact_sha -ne $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -or
              $receipt.map_saved -ne $false -or
              $receipt.assets_saved -ne $false -or
              $receipt.canonical_landscape_mutation -ne $false -or
              $receipt.selector_policy_mutation -ne $false -or
              $receipt.landscape_presentation_material.enabled -ne $true -or
              $receipt.landscape_presentation_material.restored -ne $true -or
              $receipt.landscape_presentation_material.component -ne 'LandscapeComponent_230' -or
              $receipt.landscape_presentation_material.material -ne '/Engine/BasicShapes/BasicShapeMaterial.BasicShapeMaterial' -or
              [int]@($receipt.captures).Count -ne 4 -or
              [bool]$receipt.mesh.collision_enabled -ne $false -or
              [bool]$receipt.mesh.cast_dynamic_shadows -ne $true
            ) {
              throw "$Label visual receipt contract failed."
            }
            if ($env:YACS_TERRAIN_MESH_TRIAL -eq '1') {
              $edge = $receipt.terrain_erosion_trial
              if (
                $receipt.mesh.generator -ne 'native-source-rock-reshape' -or
                $edge.edge_only_mesh -ne $false -or
                $edge.reshaped_rock_mesh -ne $true -or
                $edge.reference_source -ne 'original-before-reshaping' -or
                $edge.terrain_import_performed -ne $false -or
                $edge.native_landscape -ne $false -or
                $edge.derived_heightfield_modified -ne $false -or
                $edge.erosion.enabled -ne $false -or
                $edge.source_heightfield_unchanged -ne $true -or
                $edge.restored -ne $true -or
                $edge.combined_audit.status -ne 'PASS' -or
                $edge.combined_audit.displacement_limit_cm -ne 50 -or
                $edge.combined_audit.max_displacement_cm -gt 50.000001 -or
                $edge.combined_audit.folded_xy_triangles -ne 0 -or
                $edge.mesh_export.shape_profile -ne 'rounded-limestone-reshape-v8' -or
                $edge.mesh_export.locked_vertex_displacement_cm -ne 0 -or
                $edge.mesh_export.locked_normal_max_delta -ne 0
              ) { throw 'Bounded limestone rock reshaping receipt failed.' }
            }
            elseif ($env:YACS_TERRAIN_EROSION_TRIAL -eq '1') {
              if (
                $receipt.mesh.generator -ne 'native-landscape-thermal-erosion' -or
                $receipt.terrain_erosion_trial.native_landscape -ne $true -or
                $receipt.terrain_erosion_trial.imported_heightfield_matches -ne $true -or
                $receipt.terrain_erosion_trial.derived_heightfield_modified -ne $true -or
                $receipt.terrain_erosion_trial.source_heightfield_unchanged -ne $true -or
                $receipt.terrain_erosion_trial.restored -ne $true -or
                $receipt.terrain_erosion_trial.erosion.max_abs_change_cm -gt 150 -or
                $receipt.terrain_erosion_trial.erosion.fixed_samples_changed -ne 0 -or
                $receipt.terrain_erosion_trial.erosion.height_sum_delta_units -ne 0
              ) { throw 'Native terrain erosion trial receipt failed.' }
            }
            elseif ($env:YACS_LANDSCAPE_MESH_DIAGNOSTIC -eq '1') {
              if (
                $receipt.mesh.generator -ne 'native-landscape-export' -or
                $receipt.landscape_mesh_diagnostic.restored -ne $true -or
                $receipt.landscape_mesh_diagnostic.pcgex_overlay -ne $false -or
                $receipt.mesh.material.cliff -ne $receipt.landscape_presentation_material.material -or
                $receipt.landscape_mesh_diagnostic.export.max_conversion_error_cm -gt 0.001
              ) { throw 'Native Landscape mesh diagnostic receipt failed.' }
            }
            elseif ($UsePcgEx) {
              if (
                $receipt.mesh.generator -ne 'pcgex-clipper2' -or
                $receipt.mesh.pcgex_topology.max_xy_shift_cm -ne 0.0 -or
                [int]$receipt.mesh.pcgex_topology.interior_vertices -le 0 -or
                [double]$receipt.mesh.pcgex_topology.max_edge_cm_after -gt 157.5 -or
                [int]$receipt.mesh.pcgex_topology.pcgex_triangle_count -gt 120000
              ) {
                throw 'PCGEx visual topology density/performance contract failed.'
              }
            }
            elseif ($receipt.mesh.generator -ne 'yacs-connected-skin') {
              throw 'Custom benchmark generator identity drifted.'
            }

            [ordered]@{
              label = $Label
              seconds = if ($Label -eq 'custom' -and $env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT) { $null } else { [math]::Round([double]$seconds, 3) }
              timing_scope = if ($env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT) { 'shared A/B editor session; no per-candidate timing claim' } else { 'editor process' }
              generator = [string]$receipt.mesh.generator
              cliff_triangles = [int]$receipt.mesh.cliff.triangles
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $Output 'capture-performance.json') -Encoding UTF8
          }

          # Owner-approved replacement diagnostic runs before existing A/B proofs.
          $env:YACS_LANDSCAPE_MESH_DIAGNOSTIC = '1'
          try {
            $terrainRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'landscape-mesh'
            $env:YACS_EDGE_GEOMETRY_PREFLIGHT = '1'
            try {
              Invoke-CliffCapture -Label 'landscape-mesh' -Output $terrainRoot -UsePcgEx $false
            }
            finally {
              Remove-Item Env:YACS_EDGE_GEOMETRY_PREFLIGHT -ErrorAction SilentlyContinue
            }
            $env:YACS_LOCAL_CLIFF_SMOOTHING = '1'
            try {
              $localRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'local-cliff-smoothing'
              Invoke-CliffCapture -Label 'local-cliff-smoothing' -Output $localRoot -UsePcgEx $false
              python scripts/assets/analyze_local_cliff_smoothing.py --plan $env:YACS_CLIFF_VISUAL_PLAN --mesh (Join-Path $localRoot 'local-cliff-smoothing-mesh.json') --output (Join-Path $localRoot 'local-cliff-smoothing-audit.json')
              if ($LASTEXITCODE -ne 0) { throw 'Independent local smoothing audit failed.' }
              $local = Get-Content -LiteralPath (Join-Path $localRoot 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json
              if (
                $local.landscape_mesh_diagnostic.export.local_smoothing -ne $true -or
                $local.landscape_mesh_diagnostic.export.folded_xy_triangles -ne 0 -or
                $local.landscape_mesh_diagnostic.export.locked_vertex_displacement_cm -ne 0 -or
                $local.landscape_mesh_diagnostic.export.displacement_limit_cm -ne 100 -or
                $local.landscape_mesh_diagnostic.export.max_displacement_cm -gt 100.000001
              ) { throw 'Local cliff smoothing bounds failed.' }
            }
            finally {
              Remove-Item Env:YACS_LOCAL_CLIFF_SMOOTHING -ErrorAction SilentlyContinue
            }
          }
          finally {
            Remove-Item Env:YACS_LANDSCAPE_MESH_DIAGNOSTIC -ErrorAction SilentlyContinue
          }

          $env:YACS_TERRAIN_EROSION_TRIAL = '1'
          try {
            python -m unittest scripts.geometry.test_local_thermal_erosion -v
            if ($LASTEXITCODE -ne 0) { throw 'Thermal erosion tests failed.' }
            $erosionRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion'
            Invoke-CliffCapture -Label 'terrain-erosion' -Output $erosionRoot -UsePcgEx $false
            $env:YACS_TERRAIN_MESH_TRIAL = '1'
            $env:YACS_TERRAIN_ORIGINAL_MESH = Join-Path $localRoot 'local-cliff-smoothing-mesh.json'
            $combinedRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion-mesh'
            Invoke-CliffCapture -Label 'terrain-erosion-mesh' -Output $combinedRoot -UsePcgEx $false
          }
          finally {
            Remove-Item Env:YACS_TERRAIN_EROSION_TRIAL -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_MESH_TRIAL -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_ORIGINAL_MESH -ErrorAction SilentlyContinue
          }

          $env:YACS_CLIFF_PCGEX_MESH = Join-Path $env:YACS_CLIFF_PCGEX_PROOF_ROOT 'phase2c-pcgex-cliff-a.json'
          $env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT = $env:YACS_CLIFF_CUSTOM_OUTPUT
          try {
            Invoke-CliffCapture -Label 'paired' -Output $env:YACS_CLIFF_PCGEX_OUTPUT -UsePcgEx $true
            Assert-CliffCapture -Label 'custom' -Output $env:YACS_CLIFF_CUSTOM_OUTPUT -UsePcgEx $false -Seconds 0
          }
          finally {
            Remove-Item Env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT -ErrorAction SilentlyContinue
          }

          # Additional owner-requested diagnostic; original A/B inputs stay intact.
          $env:YACS_CLIFF_MATCH_LANDSCAPE_MATERIAL = '1'
          try {
            $sameRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'same-material'
            Invoke-CliffCapture -Label 'same-material' -Output $sameRoot -UsePcgEx $true
            $same = Get-Content -LiteralPath (Join-Path $sameRoot 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json
            if (
              $same.mesh.material.matches_landscape -ne $true -or
              $same.mesh.material.diagnostic_only -ne $true -or
              $same.mesh.material.cliff -ne $same.landscape_presentation_material.material
            ) {
              throw 'Same-material diagnostic did not use the Landscape material.'
            }
          }
          finally {
            Remove-Item Env:YACS_CLIFF_MATCH_LANDSCAPE_MATERIAL -ErrorAction SilentlyContinue
          }

      - name: Measure A/B and enforce 8-of-10 lighting gate
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/assets/analyze_sa_calobra_component230_cliff_visual.py --root $env:YACS_CLIFF_CUSTOM_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Custom benchmark metric analysis failed.' }
          python scripts/assets/analyze_sa_calobra_component230_cliff_visual.py --root $env:YACS_CLIFF_PCGEX_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PCGEx metric analysis failed.' }

          $custom = Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_CUSTOM_OUTPUT 'component230-cliff-metrics.json') -Raw | ConvertFrom-Json
          $pcgex = Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PCGEX_OUTPUT 'component230-cliff-metrics.json') -Raw | ConvertFrom-Json

          if (
            $custom.metrics.baseline_lit.sha256 -ne $pcgex.metrics.baseline_lit.sha256 -or
            $custom.metrics.baseline_lighting_only.sha256 -ne $pcgex.metrics.baseline_lighting_only.sha256
          ) {
            throw 'Custom and PCGEx captures do not share an identical baseline.'
          }

          $a = (Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_CUSTOM_OUTPUT 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json).capture_protocol.shared_baseline
          $b = (Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PCGEX_OUTPUT 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json).capture_protocol.shared_baseline
          if (
            $a.enabled -ne $true -or $b.enabled -ne $true -or
            [string]::IsNullOrWhiteSpace($a.acquisition_id) -or
            $a.acquisition_id -ne $b.acquisition_id -or
            $a.protocol -ne 'single-scene-baseline-custom-pcgex-v1' -or
            $a.protocol -ne $b.protocol -or
            $a.custom_removed_before_pcgex -ne $true -or
            $b.custom_removed_before_pcgex -ne $true
          ) { throw 'A/B shared-baseline acquisition provenance failed.' }

          $failures = @()
          foreach ($threshold in @('0.05','0.10','0.15')) {
            $base = $pcgex.metrics.baseline_lighting_only.thresholds.$threshold
            $customCandidate = $custom.metrics.candidate_lighting_only.thresholds.$threshold
            $pcgexCandidate = $pcgex.metrics.candidate_lighting_only.thresholds.$threshold

            if ([int]$pcgexCandidate.pixels -gt [int]$base.pixels) {
              $failures += "$threshold PCGEx dark pixels exceed baseline: $($pcgexCandidate.pixels) > $($base.pixels)"
            }
            if ([int]$pcgexCandidate.largest_region_pixels -gt [int]$base.largest_region_pixels) {
              $failures += "$threshold PCGEx largest dark region exceeds baseline: $($pcgexCandidate.largest_region_pixels) > $($base.largest_region_pixels)"
            }
            if ([int]$pcgexCandidate.pixels -gt [int]$customCandidate.pixels) {
              $failures += "$threshold PCGEx dark pixels do not beat custom A: $($pcgexCandidate.pixels) > $($customCandidate.pixels)"
            }
            if ([int]$pcgexCandidate.largest_region_pixels -gt [int]$customCandidate.largest_region_pixels) {
              $failures += "$threshold PCGEx largest dark region does not beat custom A: $($pcgexCandidate.largest_region_pixels) > $($customCandidate.largest_region_pixels)"
            }
          }

          $ab = [ordered]@{
            schema_version = 1
            status = $(if ($failures.Count -eq 0) { 'PASS' } else { 'FAIL' })
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            baseline_identical = $true
            custom = $custom.lighting_only_deltas
            pcgex = $pcgex.lighting_only_deltas
            failures = $failures
          }
          $abPath = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'phase2c-ab-gate.json'
          $ab | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $abPath -Encoding UTF8
          $ab | ConvertTo-Json -Depth 10 | Write-Host
          if ($failures.Count -gt 0) {
            throw 'Phase 2C PCGEx candidate did not satisfy the lighting/custom-generator admission gate.'
          }

      - name: Measure combined limestone independently of PCGEx admission
        if: ${{ always() && env.YACS_CLIFF_PHASE2C_ROOT != '' }}
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion-mesh'
          python scripts/assets/analyze_sa_calobra_component230_cliff_visual.py --root $root
          if ($LASTEXITCODE -ne 0) { throw 'Combined neutral fixture analysis failed.' }
          python scripts/assets/gate_component230_combined.py --root $root --expected-sha $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Combined limestone technical admission failed.' }

      - name: Enforce non-persistent checkout
        if: ${{ always() && env.YACS_CLIFF_PHASE2C_ROOT != '' }}
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect proof checkout.' }
          [ordered]@{
            schema_version = 1
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            status = $(if ($tracked.Count -eq 0) { 'PASS' } else { 'FAIL' })
            tracked_changes = $tracked
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'checkout-restoration.json') -Encoding UTF8
          if ($tracked.Count -gt 0) {
            throw "Phase 2C proof mutated tracked files: $($tracked -join '; ')"
          }

      - name: Upload Phase 2C evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sa-calobra-component230-pcgex-cliff
          path: |
            ${{ runner.temp }}/component230-pcgex-${{ github.sha }}/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90

  bidirectional-survey:
    name: Frozen-road bidirectional TPP survey (accepted v8)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tpp_survey) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[tpp-survey]'))
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 120

    steps:
      - name: Isolate Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'component230-tpp.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable long paths.' }

      - name: Checkout exact survey revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _phase2c-pcgex-cliff
          fetch-depth: 0
          lfs: false
          clean: false
          persist-credentials: false

      - name: Verify owner, exact SHA and idle Unreal host
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTOR -ne 'karnalooch' -or $env:GITHUB_REPOSITORY -ne 'karnalooch/YetAnotherCyclingSim') {
            throw 'The fixed survey intent is restricted to the repository owner.'
          }
          if ($env:GITHUB_REF_NAME -ne 'feat/phase2c-pcgex-cliff-topology') {
            throw 'Survey must use the existing reviewed Component 230 branch.'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "checkout HEAD '$actual' != event SHA '$env:GITHUB_SHA'"
          }
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') {
            throw "Shared Unreal host is already owned; status=$($state.status)."
          }
          git diff --quiet 4f2cba560d54931dc8ba080370d96a7aad24f15b HEAD -- Source/YetAnotherCyclingSimEditor/Private/Diagnostics/YacsLandscapeMeshDiagnosticLibrary.cpp Source/YetAnotherCyclingSimEditor/Private/Diagnostics/YacsLandscapeTerrainTrial.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Owner-accepted native rock geometry implementation changed.' }
          git diff --quiet 4f2cba560d54931dc8ba080370d96a7aad24f15b HEAD -- Content/Worlds/SaCalobra/L_SaCalobraAccepted_20261004.umap Content/Worlds/SaCalobra/CheckpointMaterials Content/Worlds/SaCalobra/CheckpointEarthworks Content/Generated/YACS/MaskReview Content/Generated/YACS/TextureMaterialPrep
          if ($LASTEXITCODE -ne 0) { throw 'Owner-accepted scene or material asset identities changed.' }
          "YACS_CLIFF_VISUAL_EXPECTED_SHA=$actual" >> $env:GITHUB_ENV

      - name: Install pinned GIS and image dependencies
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 rasterio==1.5.2 shapely==2.1.2 pillow==12.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Frozen-survey dependency install failed.' }

      - name: Materialize accepted map and complete limestone PBR dependency set
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_LFS_SKIP_SMUDGE = '0'
          try {
            New-Item -ItemType Directory -Force -Path $env:YACS_LFS_CACHE_ROOT | Out-Null
            git lfs install --local --skip-smudge
            if ($LASTEXITCODE -ne 0) { throw 'Local LFS setup failed.' }
            git config --local lfs.storage $env:YACS_LFS_CACHE_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'Persistent LFS storage configuration failed.' }

            $map = 'Content/Worlds/SaCalobra/L_SaCalobraAccepted_20261004.umap'
            $checkpointMaterials = 'Content/Worlds/SaCalobra/CheckpointMaterials'
            $checkpointEarthworks = 'Content/Worlds/SaCalobra/CheckpointEarthworks'
            $landscapeMaterial = 'Content/Generated/YACS/MaskReview/M_MaskReview_1.uasset'
            $landscapeTexture = 'Content/Generated/YACS/MaskReview/T_MaskReview_1.uasset'
            $library = 'Content/Generated/YACS/TextureMaterialPrep/Libraries/3d53743e48394f31beb35e4030dc8a87'
            $exposedBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/C414EA4B402723D66FCB689E49EEB02D/BaseColor.uasset'
            $screeBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/94406E0247C9822CFD006CAB8B20545E/BaseColor.uasset'
            $include = "$map,$checkpointMaterials/**,$checkpointEarthworks/**,$landscapeMaterial,$landscapeTexture,$library/**,$exposedBaseColor,$screeBaseColor"
            git lfs pull --include=$include --exclude=''
            if ($LASTEXITCODE -ne 0) { throw 'Accepted map / limestone transitive LFS pull failed.' }
            git lfs checkout $map $checkpointMaterials $checkpointEarthworks $landscapeMaterial $landscapeTexture $library $exposedBaseColor $screeBaseColor
            if ($LASTEXITCODE -ne 0) { throw 'Accepted map / limestone transitive LFS checkout failed.' }

            if (-not (Test-Path -LiteralPath $map -PathType Leaf)) {
              throw 'Accepted Sa Calobra map is missing after LFS checkout.'
            }
            if ((Get-Item -LiteralPath $map).Length -lt 100000000) {
              throw 'Accepted Sa Calobra map still looks like an LFS pointer.'
            }

            $required = @(
              $landscapeMaterial,
              $landscapeTexture,
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_ExposedRock.uasset",
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_Scree.uasset",
              "$library/ProviderData/ExposedRock/T_Height.uasset",
              "$library/ProviderData/ExposedRock/T_Normal.uasset",
              "$library/ProviderData/ExposedRock/T_Roughness.uasset",
              "$library/ProviderData/Scree/T_Height.uasset",
              "$library/ProviderData/Scree/T_Normal.uasset",
              "$library/ProviderData/Scree/T_Roughness.uasset",
              "$library/Sources/T_Source_ExposedRock.uasset",
              "$library/Sources/T_Source_Scree.uasset",
              $exposedBaseColor,
              $screeBaseColor
            )
            $required += @(0..2 | ForEach-Object { "$checkpointMaterials/MI_Accepted_$_.uasset" })
            $required += @(0..184 | ForEach-Object { "$checkpointEarthworks/T_Cut_$('{0:D3}' -f $_).uasset" })
            foreach ($asset in $required) {
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                throw "Required scene proof asset missing: $asset"
              }
              if ((Get-Item -LiteralPath $asset).Length -lt 1024) {
                throw "Required scene proof asset is still an LFS pointer: $asset"
              }
            }
          }
          finally {
            $env:GIT_LFS_SKIP_SMUDGE = '1'
          }

      - name: Resolve frozen inputs and isolated evidence roots
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $worldRoot = Join-Path $env:RUNNER_WORKSPACE '_yacs-world-data\sa-calobra-working-v1'
          $normalized = Join-Path $worldRoot 'normalized-context-v1a-2026-10-04\manifest.json'
          $pcg = Join-Path $worldRoot 'pcg-masks-v1-2026-10-04\pcg-mask-manifest.json'
          $context = Join-Path $worldRoot 'context-exclusions-v2-2026-10-04\context-mask-manifest.json'
          foreach ($path in @($normalized, $pcg, $context)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required frozen survey input missing: $path"
            }
          }

          $frozen = Join-Path $worldRoot 'frozen-road-c5573b3-2026-10-04'
          if (-not (Test-Path -LiteralPath (Join-Path $frozen 'source-recipe.json') -PathType Leaf)) {
            throw "Required owner-frozen road artifact missing: $frozen"
          }
          "YACS_SA_CALOBRA_TPP_FROZEN_ROOT=$frozen" >> $env:GITHUB_ENV
          $rootOut = Join-Path $env:RUNNER_TEMP "component230-tpp-$env:GITHUB_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $rootOut) { throw 'Survey evidence root already exists; refusing stale output.' }
          $planRoot = Join-Path $rootOut 'plan'
          $topologyRoot = Join-Path $rootOut 'topology'
          $customRoot = Join-Path $rootOut 'custom'
          $pcgexRoot = Join-Path $rootOut 'pcgex'
          New-Item -ItemType Directory -Force -Path $rootOut | Out-Null

          "YACS_CLIFF_NORMALIZED=$normalized" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCG=$pcg" >> $env:GITHUB_ENV
          "YACS_CLIFF_CONTEXT=$context" >> $env:GITHUB_ENV
          "YACS_CLIFF_PHASE2C_ROOT=$rootOut" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_PLAN_ROOT=$planRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_PLAN=$(Join-Path $planRoot 'component230-cliff-visual-plan.json')" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_PROOF_ROOT=$topologyRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_CUSTOM_OUTPUT=$customRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_OUTPUT=$pcgexRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_MESH=$(Join-Path $topologyRoot 'phase2c-pcgex-cliff-a.json')" >> $env:GITHUB_ENV

      - name: Prepare unchanged YACS classifier and narrow hard policy
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/assets/prepare_sa_calobra_component230_cliff_visual.py scripts/ue/capture_sa_calobra_component230_cliff.py scripts/ue/sa_calobra_tpp_survey_capture.py scripts/proof/sa_calobra_tpp_survey.py scripts/proof/package_sa_calobra_tpp_survey.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen-survey Python compile failed.' }

          python -m unittest scripts.ci.test_sa_calobra_tpp_survey scripts.ci.test_sa_calobra_tpp_survey_capture scripts.ci.test_package_sa_calobra_tpp_survey scripts.assets.test_sa_calobra_component230_cliff_visual scripts.assets.test_analyze_local_cliff_smoothing -v
          if ($LASTEXITCODE -ne 0) { throw 'Frozen-survey planner, capture or package tests failed.' }

          python scripts/assets/prepare_sa_calobra_component230_cliff_visual.py --normalized-manifest $env:YACS_CLIFF_NORMALIZED --pcg-manifest $env:YACS_CLIFF_PCG --context-manifest $env:YACS_CLIFF_CONTEXT --output $env:YACS_CLIFF_VISUAL_PLAN_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Frozen-survey cliff plan preparation failed.' }

          $plan = Get-Content -LiteralPath $env:YACS_CLIFF_VISUAL_PLAN -Raw | ConvertFrom-Json
          if (
            $plan.status -ne 'COMPONENT230_CLIFF_VISUAL_PLAN' -or
            $plan.geometry_mutation -ne $false -or
            $plan.canonical_landscape_mutation -ne $false -or
            $plan.selector_policy_mutation -ne $false -or
            [int]$plan.counts.component_cliff_cells -ne 2611 -or
            [int]$plan.counts.component_scree_cells -ne 1237 -or
            [int]$plan.counts.skin_cell_count -ne 1017 -or
            [int]$plan.counts.skin_cluster_count -ne 14
          ) {
            throw 'Frozen-survey input/reference contract drifted.'
          }

          python -c "import os; from scripts.proof.sa_calobra_tpp_survey import load_frozen_windows, build_survey_plan, SurveyConfig; source=load_frozen_windows(os.environ['YACS_SA_CALOBRA_TPP_FROZEN_ROOT']); plan=build_survey_plan(source['windows'], SurveyConfig(os.environ['YACS_CLIFF_VISUAL_EXPECTED_SHA']), source_identity=source['source_identity']); print('Frozen TPP preflight:', len(plan['windows']), 'windows,', plan['frame_count'], 'bounded frames')"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen road hashes or bounded bidirectional frame plan failed.' }

      - name: Verify installed exact-version primary API source
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $engine = Resolve-YacsUnrealEngine -ProjectPath (Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject')
          if (-not $engine -or $engine.Version -ne '5.8.2-56702186') {
            throw 'Survey requires the accepted UE 5.8.2 CL 56702186 installed source/runtime.'
          }
          $contracts = @(
            @{ path = 'Engine/Source/Runtime/Engine/Classes/GameFramework/Actor.h'; symbols = @('GetActorBounds', 'SetActorScale3D', 'K2_SetActorLocation', 'K2_SetActorRotation') },
            @{ path = 'Engine/Source/Runtime/Engine/Classes/Components/StaticMeshComponent.h'; symbols = @('SetStaticMesh') },
            @{ path = 'Engine/Source/Runtime/Engine/Classes/Components/SceneComponent.h'; symbols = @('Mobility') },
            @{ path = 'Engine/Source/Runtime/Engine/Classes/Engine/EngineTypes.h'; symbols = @('EComponentMobility', 'Movable') },
            @{ path = 'Engine/Source/Runtime/Engine/Classes/Components/PrimitiveComponent.h'; symbols = @('SetCollisionEnabled', 'SetCastShadow') },
            @{ path = 'Engine/Source/Editor/UnrealEd/Public/Subsystems/EditorActorSubsystem.h'; symbols = @('SpawnActorFromClass', 'DestroyActor') }
          )
          $evidence = @()
          foreach ($contract in $contracts) {
            $path = Join-Path $engine.Root $contract.path
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Installed API source missing: $($contract.path)" }
            $source = Get-Content -LiteralPath $path -Raw
            foreach ($symbol in $contract.symbols) {
              if ($source -notmatch ('\b' + [regex]::Escape($symbol) + '\b')) { throw "Installed API source lacks $symbol" }
            }
            $evidence += [ordered]@{
              header = $contract.path
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              verified_symbols = $contract.symbols
            }
          }
          [ordered]@{
            status = 'INSTALLED_PRIMARY_API_SOURCE_VERIFIED'
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            engine_version = $engine.Version
            build_version_sha256 = $engine.BuildVersionSha256
            headers = $evidence
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'native-api-evidence.json') -Encoding UTF8

      - name: Build exact survey head and run scoped Automation once
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrapReport = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'pcgex-bootstrap.json'
          ./scripts/worldgen/Bootstrap-YacsPcgEx.ps1 -Mode Install -ReportPath $bootstrapReport
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PCGEx dependency bootstrap failed.' }
          $bootstrap = Get-Content -LiteralPath $bootstrapReport -Raw | ConvertFrom-Json
          if ($bootstrap.status -ne 'PASS' -or $bootstrap.actual_commit -ne '39a8f1bdc65b2c4613a1e87b71d93b4576db0a66') {
            throw 'Pinned PCGEx dependency source changed.'
          }
          ./scripts/ci/Invoke-YacsUnrealCi.ps1 -ExpectedHead $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -ExpectedBranch $env:GITHUB_REF_NAME -ArtifactRoot (Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'build-automation')
          if ($LASTEXITCODE -ne 0) { throw 'Exact-head survey build or scoped Automation failed.' }

      - name: Capture source controls and accepted v8 bidirectional sphere survey
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $project = Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject'
          $engine = Resolve-YacsUnrealEngine -ProjectPath $project
          $script = (Resolve-Path 'scripts/ue/capture_sa_calobra_component230_cliff.py').Path

          function Invoke-CliffCapture {
            param(
              [Parameter(Mandatory=$true)] [string] $Label,
              [Parameter(Mandatory=$true)] [string] $Output,
              [Parameter(Mandatory=$true)] [bool] $UsePcgEx
            )

            New-Item -ItemType Directory -Force -Path $Output | Out-Null
            $env:YACS_CLIFF_VISUAL_OUTPUT = $Output
            if ($UsePcgEx) {
              if (-not (Test-Path -LiteralPath $env:YACS_CLIFF_PCGEX_MESH -PathType Leaf)) {
                throw 'PCGEx mesh receipt is missing before candidate render.'
              }
            }
            else {
              Remove-Item Env:YACS_CLIFF_PCGEX_MESH -ErrorAction SilentlyContinue
            }

            $stdout = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.stdout.log"
            $stderr = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.stderr.log"
            $log = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.engine.log"
            $arguments = @(
              ('"' + $project + '"'),
              ('-ExecutePythonScript="' + $script + '"'),
              '-RenderOffscreen',
              '-Unattended',
              '-NoPause',
              '-NoSplash',
              '-NoSound',
              '-NoP4',
              '-NoVSync',
              '-Deterministic',
              '-ScriptErrorsAreFatal',
              '-stdout',
              ('-AbsLog="' + $log + '"')
            )
            $started = Get-Date
            $process = Start-Process -FilePath $engine.UnrealEditorPath -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $timeoutMs = if ($env:YACS_SA_CALOBRA_TPP_SURVEY -eq '1') { 5400000 } else { 480000 }
            if (-not $process.WaitForExit($timeoutMs)) {
              try { $process | Stop-Process -Force } catch { }
              throw "$Label cliff capture timed out."
            }
            $seconds = ((Get-Date) - $started).TotalSeconds
            if ($process.ExitCode -ne 0) {
              foreach ($diagnostic in @($stdout, $stderr, $log)) {
                if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                  Write-Host "===== TAIL $diagnostic ====="
                  Get-Content -LiteralPath $diagnostic -Tail 240 | Write-Host
                }
              }
              throw "$Label cliff capture exited $($process.ExitCode)."
            }

            $materialFallback = @()
            foreach ($diagnostic in @($stdout, $stderr, $log)) {
              if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                $materialFallback += @(
                  Select-String -LiteralPath $diagnostic -SimpleMatch -Pattern @(
                    'Texture Sample > Missing input texture',
                    'Default Material will be used'
                  ) -ErrorAction SilentlyContinue
                )
                $materialFallback += @(
                  Select-String -LiteralPath $diagnostic -Pattern @(
                    "LoadErrors: Error:.*'/Game/Worlds/SaCalobra/Checkpoint",
                    "LoadErrors: Error:.*'/Game/Generated/YACS/MaskReview/",
                    "LoadErrors: Error:.*'/Game/Generated/YACS/TextureMaterialPrep/"
                  ) -ErrorAction SilentlyContinue
                )
              }
            }
            if ($materialFallback.Count -gt 0) {
              $materialFallback | ForEach-Object {
                "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
              } | Write-Host
              throw "$Label material proof detected missing texture or Default Material fallback."
            }

            Assert-CliffCapture -Label $Label -Output $Output -UsePcgEx $UsePcgEx -Seconds $seconds
          }

          function Assert-CliffCapture {
            param([string] $Label, [string] $Output, [bool] $UsePcgEx, [double] $Seconds)
            $receiptPath = Join-Path $Output 'component230-cliff-visual-receipt.json'
            if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
              throw "$Label visual receipt is missing."
            }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if (
              $receipt.status -ne 'COMPONENT230_CLIFF_VISUAL_PASS' -or
              $receipt.exact_sha -ne $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -or
              $receipt.map_saved -ne $false -or
              $receipt.assets_saved -ne $false -or
              $receipt.canonical_landscape_mutation -ne $false -or
              $receipt.selector_policy_mutation -ne $false -or
              $receipt.landscape_presentation_material.enabled -ne $true -or
              $receipt.landscape_presentation_material.restored -ne $true -or
              $receipt.landscape_presentation_material.component -ne 'LandscapeComponent_230' -or
              $receipt.landscape_presentation_material.material -ne '/Engine/BasicShapes/BasicShapeMaterial.BasicShapeMaterial' -or
              [int]@($receipt.captures).Count -ne 4 -or
              [bool]$receipt.mesh.collision_enabled -ne $false -or
              [bool]$receipt.mesh.cast_dynamic_shadows -ne $true
            ) {
              throw "$Label visual receipt contract failed."
            }
            if ($env:YACS_TERRAIN_MESH_TRIAL -eq '1') {
              $edge = $receipt.terrain_erosion_trial
              if (
                $receipt.mesh.generator -ne 'native-source-rock-reshape' -or
                $edge.edge_only_mesh -ne $false -or
                $edge.reshaped_rock_mesh -ne $true -or
                $edge.reference_source -ne 'original-before-reshaping' -or
                $edge.terrain_import_performed -ne $false -or
                $edge.native_landscape -ne $false -or
                $edge.derived_heightfield_modified -ne $false -or
                $edge.erosion.enabled -ne $false -or
                $edge.source_heightfield_unchanged -ne $true -or
                $edge.restored -ne $true -or
                $edge.combined_audit.status -ne 'PASS' -or
                $edge.combined_audit.displacement_limit_cm -ne 50 -or
                $edge.combined_audit.max_displacement_cm -gt 50.000001 -or
                $edge.combined_audit.folded_xy_triangles -ne 0 -or
                $edge.mesh_export.shape_profile -ne 'rounded-limestone-reshape-v8' -or
                $edge.mesh_export.locked_vertex_displacement_cm -ne 0 -or
                $edge.mesh_export.locked_normal_max_delta -ne 0
              ) { throw 'Bounded limestone rock reshaping receipt failed.' }
            }
            elseif ($env:YACS_TERRAIN_EROSION_TRIAL -eq '1') {
              if (
                $receipt.mesh.generator -ne 'native-landscape-thermal-erosion' -or
                $receipt.terrain_erosion_trial.native_landscape -ne $true -or
                $receipt.terrain_erosion_trial.imported_heightfield_matches -ne $true -or
                $receipt.terrain_erosion_trial.derived_heightfield_modified -ne $true -or
                $receipt.terrain_erosion_trial.source_heightfield_unchanged -ne $true -or
                $receipt.terrain_erosion_trial.restored -ne $true -or
                $receipt.terrain_erosion_trial.erosion.max_abs_change_cm -gt 150 -or
                $receipt.terrain_erosion_trial.erosion.fixed_samples_changed -ne 0 -or
                $receipt.terrain_erosion_trial.erosion.height_sum_delta_units -ne 0
              ) { throw 'Native terrain erosion trial receipt failed.' }
            }
            elseif ($env:YACS_LANDSCAPE_MESH_DIAGNOSTIC -eq '1') {
              if (
                $receipt.mesh.generator -ne 'native-landscape-export' -or
                $receipt.landscape_mesh_diagnostic.restored -ne $true -or
                $receipt.landscape_mesh_diagnostic.pcgex_overlay -ne $false -or
                $receipt.mesh.material.cliff -ne $receipt.landscape_presentation_material.material -or
                $receipt.landscape_mesh_diagnostic.export.max_conversion_error_cm -gt 0.001
              ) { throw 'Native Landscape mesh diagnostic receipt failed.' }
            }
            elseif ($UsePcgEx) {
              if (
                $receipt.mesh.generator -ne 'pcgex-clipper2' -or
                $receipt.mesh.pcgex_topology.max_xy_shift_cm -ne 0.0 -or
                [int]$receipt.mesh.pcgex_topology.interior_vertices -le 0 -or
                [double]$receipt.mesh.pcgex_topology.max_edge_cm_after -gt 157.5 -or
                [int]$receipt.mesh.pcgex_topology.pcgex_triangle_count -gt 120000
              ) {
                throw 'PCGEx visual topology density/performance contract failed.'
              }
            }
            elseif ($receipt.mesh.generator -ne 'yacs-connected-skin') {
              throw 'Custom benchmark generator identity drifted.'
            }

            [ordered]@{
              label = $Label
              seconds = if ($Label -eq 'custom' -and $env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT) { $null } else { [math]::Round([double]$seconds, 3) }
              timing_scope = if ($env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT) { 'shared A/B editor session; no per-candidate timing claim' } else { 'editor process' }
              generator = [string]$receipt.mesh.generator
              cliff_triangles = [int]$receipt.mesh.cliff.triangles
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $Output 'capture-performance.json') -Encoding UTF8
          }

          # Owner-approved replacement diagnostic runs before existing A/B proofs.
          $env:YACS_LANDSCAPE_MESH_DIAGNOSTIC = '1'
          try {
            $terrainRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'landscape-mesh'
            $env:YACS_EDGE_GEOMETRY_PREFLIGHT = '1'
            try {
              Invoke-CliffCapture -Label 'landscape-mesh' -Output $terrainRoot -UsePcgEx $false
            }
            finally {
              Remove-Item Env:YACS_EDGE_GEOMETRY_PREFLIGHT -ErrorAction SilentlyContinue
            }
            $env:YACS_LOCAL_CLIFF_SMOOTHING = '1'
            try {
              $localRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'local-cliff-smoothing'
              Invoke-CliffCapture -Label 'local-cliff-smoothing' -Output $localRoot -UsePcgEx $false
              python scripts/assets/analyze_local_cliff_smoothing.py --plan $env:YACS_CLIFF_VISUAL_PLAN --mesh (Join-Path $localRoot 'local-cliff-smoothing-mesh.json') --output (Join-Path $localRoot 'local-cliff-smoothing-audit.json')
              if ($LASTEXITCODE -ne 0) { throw 'Independent local smoothing audit failed.' }
              $local = Get-Content -LiteralPath (Join-Path $localRoot 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json
              if (
                $local.landscape_mesh_diagnostic.export.local_smoothing -ne $true -or
                $local.landscape_mesh_diagnostic.export.folded_xy_triangles -ne 0 -or
                $local.landscape_mesh_diagnostic.export.locked_vertex_displacement_cm -ne 0 -or
                $local.landscape_mesh_diagnostic.export.displacement_limit_cm -ne 100 -or
                $local.landscape_mesh_diagnostic.export.max_displacement_cm -gt 100.000001
              ) { throw 'Local cliff smoothing bounds failed.' }
            }
            finally {
              Remove-Item Env:YACS_LOCAL_CLIFF_SMOOTHING -ErrorAction SilentlyContinue
            }
          }
          finally {
            Remove-Item Env:YACS_LANDSCAPE_MESH_DIAGNOSTIC -ErrorAction SilentlyContinue
          }

          # Reproduce the accepted presentation only; no heightfield erosion/import.
          $env:YACS_TERRAIN_EROSION_TRIAL = '1'
          $env:YACS_TERRAIN_MESH_TRIAL = '1'
          $env:YACS_TERRAIN_ORIGINAL_MESH = Join-Path $localRoot 'local-cliff-smoothing-mesh.json'
          $env:YACS_SA_CALOBRA_TPP_SURVEY = '1'
          try {
            $combinedRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion-mesh'
            Invoke-CliffCapture -Label 'terrain-erosion-mesh' -Output $combinedRoot -UsePcgEx $false
          }
          finally {
            Remove-Item Env:YACS_SA_CALOBRA_TPP_SURVEY -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_EROSION_TRIAL -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_MESH_TRIAL -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_ORIGINAL_MESH -ErrorAction SilentlyContinue
          }

      - name: Verify every frame and package durable bidirectional review evidence
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion-mesh/tpp-survey'
          python scripts/proof/package_sa_calobra_tpp_survey.py --root $root --expected-sha $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Bidirectional survey frame/readiness/restoration package verification failed.' }
          # Preserve existing lighting admission honestly; this diagnostic does not admit it.
          python scripts/assets/analyze_sa_calobra_component230_cliff_visual.py --root (Split-Path $root -Parent)
          if ($LASTEXITCODE -ne 0) { throw 'Accepted-v8 control metric analysis failed.' }

      - name: Enforce non-persistent checkout
        if: ${{ always() && env.YACS_CLIFF_PHASE2C_ROOT != '' }}
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect proof checkout.' }
          [ordered]@{
            schema_version = 1
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            status = $(if ($tracked.Count -eq 0) { 'PASS' } else { 'FAIL' })
            tracked_changes = $tracked
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'checkout-restoration.json') -Encoding UTF8
          if ($tracked.Count -gt 0) {
            throw "Frozen TPP survey mutated tracked files: $($tracked -join '; ')"
          }

      - name: Upload immutable survey frames, review bundle and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sa-calobra-bidirectional-tpp-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/component230-tpp-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90

  retain-bidirectional-survey:
    name: Retain completed TPP survey without rendering
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[tpp-retain]') &&
      !contains(github.event.head_commit.message, '[tpp-survey]') &&
      !contains(github.event.head_commit.message, '[tpp-docs]')
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      YACS_TPP_CAPTURE_SHA: b1ea05b33b9f3208e7aeb6884f1a67792d9c6121
      YACS_TPP_CAPTURE_RUN: "37800814004"
      YACS_TPP_CAPTURE_ATTEMPT: "1"

    steps:
      - name: Isolate retention checkout Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'tpp-retention.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact retention helper revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _sa-calobra-tpp-retention
          fetch-depth: 1
          lfs: false
          clean: false
          persist-credentials: false

      - name: Verify fixed retention intent, idle host and canonical workspace configuration
        shell: pwsh
        working-directory: _sa-calobra-tpp-retention
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTOR -ne 'karnalooch' -or $env:GITHUB_REPOSITORY -ne 'karnalooch/YetAnotherCyclingSim' -or $env:GITHUB_REF_NAME -ne 'feat/phase2c-pcgex-cliff-topology') {
            throw 'The fixed retention intent is restricted to the owner and reviewed Component 230 branch.'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) { throw 'Retention helper checkout does not match the exact event SHA.' }
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') { throw "Shared Unreal host is already owned; status=$($state.status)." }
          # Start-YacsRunner.ps1 exports the configured path into its child worker.
          if (-not $env:YACS_WORKSPACE_CONFIG) { throw 'Canonical YACS_WORKSPACE_CONFIG was not exported by the runner.' }
          $workspaceConfig = (Resolve-Path -LiteralPath $env:YACS_WORKSPACE_CONFIG).Path
          python -c "import sys; from pathlib import Path; from scripts.manage_local_workspace import load_workspace; load_workspace(Path(sys.argv[1]))" $workspaceConfig
          if ($LASTEXITCODE -ne 0) { throw 'Canonical persistent workspace configuration failed validation.' }
          $root = Join-Path $env:RUNNER_TEMP "tpp-retention-$env:GITHUB_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Retention evidence root already exists; refusing stale output.' }
          $inputRoot = Join-Path $root 'source-artifact'
          New-Item -ItemType Directory -Path $inputRoot -Force | Out-Null
          "YACS_TPP_RETENTION_ROOT=$root" >> $env:GITHUB_ENV
          "YACS_TPP_RETENTION_INPUT=$inputRoot" >> $env:GITHUB_ENV

      - name: Download the fixed completed survey artifact without another Unreal run
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sa-calobra-bidirectional-tpp-b1ea05b33b9f3208e7aeb6884f1a67792d9c6121-37800814004-1
          repository: karnalooch/YetAnotherCyclingSim
          run-id: 37800814004
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.YACS_TPP_RETENTION_INPUT }}

      - name: Validate and retain complete original evidence in the configured persistent workspace
        shell: pwsh
        working-directory: _sa-calobra-tpp-retention
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest scripts.ci.test_retain_sa_calobra_tpp_survey -v
          if ($LASTEXITCODE -ne 0) { throw 'Survey retention integrity tests failed.' }
          python scripts/proof/retain_sa_calobra_tpp_survey.py --source $env:YACS_TPP_RETENTION_INPUT --expected-sha $env:YACS_TPP_CAPTURE_SHA --run-id $env:YACS_TPP_CAPTURE_RUN --attempt $env:YACS_TPP_CAPTURE_ATTEMPT --workspace-config $env:YACS_WORKSPACE_CONFIG | Tee-Object -FilePath (Join-Path $env:YACS_TPP_RETENTION_ROOT 'retention-receipt.json')
          if ($LASTEXITCODE -ne 0) { throw 'Complete survey artifact validation or durable retention failed.' }
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $tracked.Count -gt 0) { throw 'Retention dirtied its isolated tracked checkout.' }

      - name: Upload the separate durable-retention receipt
        if: ${{ always() && env.YACS_TPP_RETENTION_ROOT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sa-calobra-tpp-retention-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.YACS_TPP_RETENTION_ROOT }}/retention-receipt.json
          if-no-files-found: warn
          retention-days: 90

  publish-survey-docs:
    name: Publish retained survey material to repository docs without rendering
    if: >-
      github.event_name == 'push' &&
      github.repository == 'karnalooch/YetAnotherCyclingSim' &&
      github.actor == 'karnalooch' &&
      github.ref == 'refs/heads/feat/phase2c-pcgex-cliff-topology' &&
      contains(github.event.head_commit.message, '[tpp-docs]') &&
      !contains(github.event.head_commit.message, '[tpp-survey]') &&
      !contains(github.event.head_commit.message, '[tpp-retain]')
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      YACS_TPP_CAPTURE_SHA: b1ea05b33b9f3208e7aeb6884f1a67792d9c6121
      YACS_TPP_CAPTURE_RUN: "37800814004"
      YACS_TPP_CAPTURE_ATTEMPT: "1"
      YACS_TPP_CAPTURE_ARTIFACT: "11562342248"
      YACS_TPP_ARCHIVE_SHA256: f9ad39ae59a16dc1fc4615ef10ca950096a94d443bea4dcb0e624284000a0cab
      YACS_TPP_ARCHIVE_BYTES: "1609577808"

    steps:
      - name: Isolate documentation publication Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'tpp-docs.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact publication revision with job-local Git authentication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _sa-calobra-tpp-docs
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          clean: false
          persist-credentials: true

      - name: Verify fixed owner intent, event-head lease and configured retained source
        shell: pwsh
        working-directory: _sa-calobra-tpp-docs
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTOR -ne 'karnalooch' -or $env:GITHUB_REPOSITORY -ne 'karnalooch/YetAnotherCyclingSim' -or $env:GITHUB_REF_NAME -ne 'feat/phase2c-pcgex-cliff-topology') {
            throw 'Documentation publication is restricted to the owner and reviewed Component 230 branch.'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) { throw 'Publication checkout does not match the exact event SHA.' }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'Publication checkout must start clean.' }
          $remote = @(git ls-remote origin refs/heads/feat/phase2c-pcgex-cliff-topology)
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or (($remote[0] -split '\s+')[0] -ne $env:GITHUB_SHA)) {
            throw 'Publication branch changed after the event; preserve it and stop.'
          }
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') { throw "Shared Unreal host is already owned; status=$($state.status)." }
          if (-not $env:YACS_WORKSPACE_CONFIG) { throw 'Canonical YACS_WORKSPACE_CONFIG was not exported by the runner.' }
          $workspaceJson = python -c "import json,sys; from pathlib import Path; from scripts.manage_local_workspace import load_workspace; print(json.dumps(load_workspace(Path(sys.argv[1]))))" $env:YACS_WORKSPACE_CONFIG
          if ($LASTEXITCODE -ne 0) { throw 'Canonical persistent workspace configuration failed validation.' }
          $workspace = $workspaceJson | ConvertFrom-Json
          $source = Join-Path $workspace.work "proofs/sa-calobra-tpp/$env:YACS_TPP_CAPTURE_SHA/$env:YACS_TPP_CAPTURE_RUN-$env:YACS_TPP_CAPTURE_ATTEMPT"
          if (-not (Test-Path -LiteralPath (Join-Path $source '.yacs-retention/manifest.json') -PathType Leaf)) {
            throw 'Verified persistent source proof is missing; publication never rerenders it.'
          }
          $root = Join-Path $env:RUNNER_TEMP "tpp-docs-$env:GITHUB_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Publication evidence root already exists; refusing stale output.' }
          New-Item -ItemType Directory -Path $root | Out-Null
          "YACS_TPP_DOCS_ROOT=$root" >> $env:GITHUB_ENV
          "YACS_TPP_DOCS_SOURCE=$source" >> $env:GITHUB_ENV
          "YACS_TPP_DOCS_LFS_CACHE=$(Join-Path $workspace.cache 'git-lfs/YetAnotherCyclingSim')" >> $env:GITHUB_ENV

      - name: Download and verify the exact original completed capture ZIP
        shell: pwsh
        working-directory: _sa-calobra-tpp-docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.github.com/repos/karnalooch/YetAnotherCyclingSim/actions'
          $runPath = Join-Path $env:YACS_TPP_DOCS_ROOT 'source-run.json'
          & curl.exe --silent --show-error --fail --proto '=https' --proto-redir '=https' --max-time 60 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -o $runPath "$api/runs/$env:YACS_TPP_CAPTURE_RUN"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed capture run metadata download failed.' }
          $run = Get-Content -LiteralPath $runPath -Raw | ConvertFrom-Json
          if ($run.id -ne 37800814004 -or $run.run_attempt -ne 1 -or $run.head_sha -ne $env:YACS_TPP_CAPTURE_SHA -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') {
            throw 'Fixed source run must be completed successfully at the captured exact SHA.'
          }
          $artifactPath = Join-Path $env:YACS_TPP_DOCS_ROOT 'source-artifact.json'
          & curl.exe --silent --show-error --fail --proto '=https' --proto-redir '=https' --max-time 60 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -o $artifactPath "$api/artifacts/$env:YACS_TPP_CAPTURE_ARTIFACT"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed capture artifact metadata download failed.' }
          $artifact = Get-Content -LiteralPath $artifactPath -Raw | ConvertFrom-Json
          if ($artifact.id -ne 11562342248 -or $artifact.expired -ne $false -or $artifact.workflow_run.id -ne 37800814004 -or $artifact.workflow_run.head_sha -ne $env:YACS_TPP_CAPTURE_SHA -or $artifact.name -ne 'sa-calobra-bidirectional-tpp-b1ea05b33b9f3208e7aeb6884f1a67792d9c6121-37800814004-1') {
            throw 'Fixed source artifact identity failed.'
          }
          $archive = Join-Path $env:YACS_TPP_DOCS_ROOT 'retained-37800814004.zip'
          # Standard curl redirects strip Authorization when the host changes.
          # Never use --location-trusted or forward the token to the storage host.
          & curl.exe --location --silent --show-error --fail --proto '=https' --proto-redir '=https' --max-time 900 --retry 2 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -o $archive "$api/artifacts/$env:YACS_TPP_CAPTURE_ARTIFACT/zip"
          if ($LASTEXITCODE -ne 0) { throw 'Original capture artifact ZIP download failed.' }
          if ((Get-Item -LiteralPath $archive).Length -ne [int64]$env:YACS_TPP_ARCHIVE_BYTES -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:YACS_TPP_ARCHIVE_SHA256) {
            throw 'Original ZIP differs from its pinned capture artifact size or SHA-256.'
          }
          "YACS_TPP_DOCS_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Export actual inspection images, indexes and original ZIP into documentation
        shell: pwsh
        working-directory: _sa-calobra-tpp-docs
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest scripts.ci.test_export_sa_calobra_tpp_survey_docs -v
          if ($LASTEXITCODE -ne 0) { throw 'Survey documentation export integrity tests failed.' }
          python scripts/proof/export_sa_calobra_tpp_survey_docs.py --source $env:YACS_TPP_DOCS_SOURCE --artifact-zip $env:YACS_TPP_DOCS_ARCHIVE --repo (Get-Location).Path --expected-sha $env:YACS_TPP_CAPTURE_SHA --run-id $env:YACS_TPP_CAPTURE_RUN --attempt $env:YACS_TPP_CAPTURE_ATTEMPT | Tee-Object -FilePath (Join-Path $env:YACS_TPP_DOCS_ROOT 'docs-export-receipt.json')
          if ($LASTEXITCODE -ne 0) { throw 'Verified proof documentation export failed.' }
          python scripts/ci/check_docs_index.py | Tee-Object -FilePath (Join-Path $env:YACS_TPP_DOCS_ROOT 'docs-guards.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Required documentation links, i18n, structure or freshness guard failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Documentation whitespace verification failed.' }

      - name: Stage only fixed documentation paths and publish the original ZIP through Git LFS
        shell: pwsh
        working-directory: _sa-calobra-tpp-docs
        run: |
          $ErrorActionPreference = 'Stop'
          $docs = 'docs/experiments/sa-calobra-tpp-survey-20261008'
          $archive = 'docs/experiments/component230-cliff/evidence/retained-37800814004.zip'
          $changed = @(git diff --name-only; git ls-files --others --exclude-standard)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect generated documentation paths.' }
          $outside = @($changed | Where-Object { $_ -ne $archive -and -not $_.StartsWith("$docs/", [StringComparison]::Ordinal) })
          if ($outside.Count -gt 0) { throw "Exporter changed paths outside its fixed documentation boundary: $($outside -join '; ')" }
          New-Item -ItemType Directory -Force -Path $env:YACS_TPP_DOCS_LFS_CACHE | Out-Null
          git lfs install --local --skip-smudge
          if ($LASTEXITCODE -ne 0) { throw 'Documentation Git LFS setup failed.' }
          git config --local lfs.storage $env:YACS_TPP_DOCS_LFS_CACHE
          if ($LASTEXITCODE -ne 0) { throw 'Configured persistent Git LFS storage setup failed.' }
          $filter = (git check-attr filter -- $archive | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $filter.EndsWith(': filter: lfs', [StringComparison]::Ordinal)) { throw 'Original proof ZIP must use the existing Git LFS rule.' }
          git add -- $docs $archive
          if ($LASTEXITCODE -ne 0) { throw 'Fixed documentation path staging failed.' }
          $staged = @(git diff --cached --name-only)
          $outside = @($staged | Where-Object { $_ -ne $archive -and -not $_.StartsWith("$docs/", [StringComparison]::Ordinal) })
          if ($LASTEXITCODE -ne 0 -or $outside.Count -gt 0 -or $staged.Count -lt 2 -or $staged -notcontains $archive) { throw 'Staged publication must contain only the fixed docs entry and original proof ZIP.' }
          $pointer = git show ":$archive" | Out-String
          if ($LASTEXITCODE -ne 0 -or $pointer -notmatch ('(?m)^oid sha256:' + $env:YACS_TPP_ARCHIVE_SHA256 + '\r?$') -or $pointer -notmatch ('(?m)^size ' + $env:YACS_TPP_ARCHIVE_BYTES + '\r?$')) { throw 'Staged original ZIP Git LFS pointer identity failed.' }
          $remote = @(git ls-remote origin refs/heads/feat/phase2c-pcgex-cliff-topology)
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or (($remote[0] -split '\s+')[0] -ne $env:GITHUB_SHA)) { throw 'Branch changed before LFS publication; do not push or rebase.' }
          git lfs push --object-id origin $env:YACS_TPP_ARCHIVE_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Original proof ZIP Git LFS upload failed.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(world): retain bidirectional Sa Calobra TPP inspection material'
          if ($LASTEXITCODE -ne 0) { throw 'Fixed documentation publication commit failed.' }
          $commit = (git rev-parse HEAD).Trim()
          $parent = (git rev-parse HEAD^).Trim()
          if ($LASTEXITCODE -ne 0 -or $parent -ne $env:GITHUB_SHA) { throw 'Publication commit must directly extend its exact event head.' }
          $readbackStorage = Join-Path $env:YACS_TPP_DOCS_ROOT 'independent-lfs-readback'
          if (Test-Path -LiteralPath $readbackStorage) { throw 'Independent LFS readback storage must be fresh.' }
          New-Item -ItemType Directory -Path $readbackStorage | Out-Null
          git -c "lfs.storage=$readbackStorage" -c lfs.fetchrecentalways=false -c lfs.skipdownloaderrors=false lfs fetch --include=$archive --exclude='' origin $commit
          if ($LASTEXITCODE -ne 0) { throw 'Independent server Git LFS proof ZIP download failed.' }
          $oid = $env:YACS_TPP_ARCHIVE_SHA256
          $readbackObject = Join-Path $readbackStorage ("objects/{0}/{1}/{2}" -f $oid.Substring(0, 2), $oid.Substring(2, 2), $oid)
          if (-not (Test-Path -LiteralPath $readbackObject -PathType Leaf)) { throw 'Independent server Git LFS readback object is missing.' }
          if ((Get-Item -LiteralPath $readbackObject).Length -ne [int64]$env:YACS_TPP_ARCHIVE_BYTES -or (Get-FileHash -LiteralPath $readbackObject -Algorithm SHA256).Hash.ToLowerInvariant() -ne $oid) {
            throw 'Independent server Git LFS ZIP bytes differ from the original proof.'
          }
          [ordered]@{
            status = 'REMOTE_LFS_BYTES_VERIFIED'
            publication_commit = $commit
            archive_sha256 = $oid
            archive_size_bytes = [int64]$env:YACS_TPP_ARCHIVE_BYTES
            storage_started_empty = $true
            verification = 'Independent authenticated Git LFS fetch into new storage followed by SHA-256 and size verification'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:YACS_TPP_DOCS_ROOT 'server-lfs-readback.json') -Encoding UTF8
          $remote = @(git ls-remote origin refs/heads/feat/phase2c-pcgex-cliff-topology)
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or (($remote[0] -split '\s+')[0] -ne $env:GITHUB_SHA)) { throw 'Branch changed during LFS upload; preserve the local commit and stop.' }
          git push origin HEAD:refs/heads/feat/phase2c-pcgex-cliff-topology
          if ($LASTEXITCODE -ne 0) { throw 'Fixed branch documentation fast-forward push failed.' }
          $remote = @(git ls-remote origin refs/heads/feat/phase2c-pcgex-cliff-topology)
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or (($remote[0] -split '\s+')[0] -ne $commit)) { throw 'Published documentation head verification failed.' }
          [ordered]@{
            status = 'DOCS_AND_ORIGINAL_ZIP_PUBLISHED'
            publication_commit = $commit
            parent_commit = $parent
            capture_sha = $env:YACS_TPP_CAPTURE_SHA
            capture_run = [int64]$env:YACS_TPP_CAPTURE_RUN
            capture_attempt = [int]$env:YACS_TPP_CAPTURE_ATTEMPT
            archive_sha256 = $env:YACS_TPP_ARCHIVE_SHA256
            archive_size_bytes = [int64]$env:YACS_TPP_ARCHIVE_BYTES
            remote_lfs_readback = 'REMOTE_LFS_BYTES_VERIFIED'
            docs_url = "https://github.com/karnalooch/YetAnotherCyclingSim/tree/$commit/$docs"
            original_zip_url = "https://github.com/karnalooch/YetAnotherCyclingSim/blob/$commit/$archive"
            source_preserved = $true
            unreal_started = $false
            ci_status = 'PENDING_SEPARATE_AUTHORIZED_TRIGGER_GITHUB_TOKEN_PUSH_SUPPRESSES_WORKFLOWS'
            visual_acceptance = 'PENDING_REVIEW'
            performance_acceptance = 'NOT_MEASURED'
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:YACS_TPP_DOCS_ROOT 'docs-publication-receipt.json') -Encoding UTF8

      - name: Upload publication receipt and documentation guard evidence
        if: ${{ always() && env.YACS_TPP_DOCS_ROOT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sa-calobra-tpp-docs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.YACS_TPP_DOCS_ROOT }}/docs-export-receipt.json
            ${{ env.YACS_TPP_DOCS_ROOT }}/docs-publication-receipt.json
            ${{ env.YACS_TPP_DOCS_ROOT }}/server-lfs-readback.json
            ${{ env.YACS_TPP_DOCS_ROOT }}/docs-guards.txt
            ${{ env.YACS_TPP_DOCS_ROOT }}/source-run.json
            ${{ env.YACS_TPP_DOCS_ROOT }}/source-artifact.json
          if-no-files-found: warn
          retention-days: 90

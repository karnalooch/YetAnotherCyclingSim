name: Sa Calobra Component 230 PCGEx Cliff

on:
  workflow_dispatch:
    inputs:
      tpp_survey:
        description: Run only the frozen-road bidirectional TPP survey in the accepted v8 scene
        type: boolean
        required: false
        default: false
  push:
    branches:
      - "feat/phase2c-pcgex-cliff-topology"
    paths:
      - ".github/workflows/sa-calobra-cliff-component230-pcgex.yml"
      - ".gumball/workflow-lifecycle.json"
      - "scripts/worldgen/Bootstrap-YacsPcgEx.ps1"
      - "scripts/ue/Invoke-YacsSaCalobraPcgExCliff.ps1"
      - "scripts/ue/capture_sa_calobra_component230_cliff.py"
      - "scripts/ue/sa_calobra_tpp_survey_capture.py"
      - "scripts/proof/sa_calobra_tpp_survey.py"
      - "scripts/proof/package_sa_calobra_tpp_survey.py"
      - "scripts/proof/retain_sa_calobra_tpp_survey.py"
      - "scripts/proof/export_sa_calobra_tpp_survey_docs.py"
      - "scripts/ci/test_sa_calobra_tpp_survey.py"
      - "scripts/ci/test_sa_calobra_tpp_survey_capture.py"
      - "scripts/ci/test_package_sa_calobra_tpp_survey.py"
      - "scripts/ci/test_retain_sa_calobra_tpp_survey.py"
      - "scripts/ci/test_export_sa_calobra_tpp_survey_docs.py"
      - "scripts/assets/prepare_sa_calobra_detail_pilot.py"
      - "scripts/assets/run_sa_calobra_detail_pilot.py"
      - "scripts/assets/test_sa_calobra_detail_pilot.py"
      - "scripts/assets/test_run_sa_calobra_detail_pilot.py"
      - "scripts/assets/prepare_sa_calobra_detail_treatment.py"
      - "scripts/assets/test_sa_calobra_detail_treatment.py"
      - "scripts/ue/sa_calobra_detail_capture.py"
      - "scripts/ci/test_sa_calobra_detail_capture.py"
      - "scripts/ci/test_sa_calobra_detail_native_workflow.py"
      - "scripts/ci/sa_calobra_whole_map_workflow.py"
      - "scripts/ci/test_sa_calobra_whole_map_workflow.py"
      - "scripts/assets/prepare_sa_calobra_whole_map_surface_prep.py"
      - "scripts/assets/test_sa_calobra_whole_map_surface_prep.py"
      - "scripts/ue/build_sa_calobra_whole_map_master.py"
      - "scripts/ue/sa_calobra_whole_map_prep.py"
      - "scripts/ue/capture_sa_calobra_whole_map_prep.py"
      - "scripts/ci/test_sa_calobra_whole_map_prep.py"
      - "scripts/ci/test_sa_calobra_whole_map_capture_views.py"
      - "docs/experiments/sa-calobra-component230-detail-pilot-20261008/annotations.json"
      - "scripts/assets/prepare_sa_calobra_component230_cliff_visual.py"
      - "scripts/assets/test_sa_calobra_component230_cliff_visual.py"
      - "scripts/assets/analyze_sa_calobra_component230_cliff_visual.py"
      - "scripts/assets/analyze_local_cliff_smoothing.py"
      - "scripts/assets/test_analyze_local_cliff_smoothing.py"
      - "scripts/assets/gate_component230_combined.py"
      - "scripts/assets/test_gate_component230_combined.py"
      - "scripts/assets/test_component230_review_cameras.py"
      - "Source/YetAnotherCyclingSimEditor/Private/Diagnostics/YacsLandscapeMeshDiagnosticLibrary.cpp"
      - "Source/YetAnotherCyclingSimEditor/Private/Diagnostics/YacsLandscapeTerrainTrial.cpp"
      - "Source/YetAnotherCyclingSimEditor/Private/Diagnostics/YacsComponent230Detail.cpp"
      - "scripts/geometry/local_thermal_erosion.py"
      - "scripts/geometry/test_local_thermal_erosion.py"
      - "Source/YetAnotherCyclingSimEditor/Public/Diagnostics/YacsLandscapeMeshDiagnosticLibrary.h"
      - "scripts/assets/analyze_sa_calobra_component230_pcgex_topology.py"
      - "scripts/assets/test_analyze_sa_calobra_component230_pcgex_topology.py"
      - "Source/YetAnotherCyclingSimEditor/Private/PCG/YacsSaCalobraCliffCellsSettings.cpp"
      - "Source/YetAnotherCyclingSimEditor/Public/PCG/YacsSaCalobraCliffCellsSettings.h"
      - "Source/YetAnotherCyclingSimEditor/Private/PCG/YacsSaCalobraPcgExCliffCommandlet.cpp"
      - "Source/YetAnotherCyclingSimEditor/Public/PCG/YacsSaCalobraPcgExCliffCommandlet.h"
      - "Source/YetAnotherCyclingSimEditor/YetAnotherCyclingSimEditor.Build.cs"

permissions:
  contents: read

concurrency:
  group: sa-calobra-component230-pcgex-cliff
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  YACS_CLIFF_NEUTRAL_LANDSCAPE: "1"
  YACS_LFS_CACHE_ROOT: 'D:\yacs\cache\git-lfs\YetAnotherCyclingSim'

jobs:
  wholemap-material:
    name: Whole-map material preparation and native inventory
    if: >-
      github.event_name == 'push' &&
      github.repository == 'karnalooch/YetAnotherCyclingSim' &&
      github.actor == 'karnalooch' &&
      github.ref == 'refs/heads/feat/phase2c-pcgex-cliff-topology' &&
      contains(github.event.head_commit.message, '[wholemap-material]') &&
      !contains(github.event.head_commit.message, '[detail-native]') &&
      !contains(github.event.head_commit.message, '[detail-pilot]') &&
      !contains(github.event.head_commit.message, '[tpp-survey]') &&
      !contains(github.event.head_commit.message, '[tpp-retain]') &&
      !contains(github.event.head_commit.message, '[tpp-docs]')
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 60
    env:
      YACS_UNREAL_WORKTREE: _unreal-ci-warm
    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-wholemap.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV
          $unrealLogRoot = Join-Path $env:RUNNER_TEMP 'yacs-unreal-${{ github.run_id }}-${{ github.run_attempt }}'
          "YACS_UNREAL_LOG_ROOT=$unrealLogRoot" >> $env:GITHUB_ENV
          # Generated material packages can exceed MAX_PATH in nested runner checkouts.
          # Configure the job-local file before either actions/checkout invocation.
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable long paths in isolated Git configuration.' }
          Write-Host "Using isolated Git config: $isolated"
          git config --global --list --show-origin

      - name: Bootstrap cleanup helper outside persistent worktree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _bootstrap-wholemap
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          clean: true
          persist-credentials: false

      - name: Release stale Unreal workspace locks
        shell: pwsh
        run: |
          $bootstrap = Join-Path $env:GITHUB_WORKSPACE '_bootstrap-wholemap/scripts/ci/Release-YacsUnrealWorkspaceLocks.ps1'
          & $bootstrap -Workspace $env:GITHUB_WORKSPACE

      - name: Respect shared Unreal host ownership
        shell: pwsh
        working-directory: _bootstrap-wholemap
        run: |
          $ErrorActionPreference = 'Stop'
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') {
            throw "Unreal runner host is already owned; status=$($state.status). Local/unknown Editors always win over remote CI."
          }

      - name: Select persistent Unreal cache before isolated cleanup
        shell: pwsh
        working-directory: _bootstrap-wholemap
        run: |
          python -m scripts.ci.unreal_ci_workspace select `
            --workspace "$env:GITHUB_WORKSPACE" `
            --run '${{ github.run_id }}-${{ github.run_attempt }}'
          if ($LASTEXITCODE -ne 0) { throw 'Unreal cache selection/retention failed; preserve worktrees.' }

      - name: Remove bootstrap checkout
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '_bootstrap-wholemap') -Recurse -Force

      - name: Checkout exact caller revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ env.YACS_UNREAL_WORKTREE }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          clean: false
          persist-credentials: false

      - name: Retain previous owner-handoff LFS payloads before sanitization
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE '_yacs-retained-lfs/handoff-${{ github.run_id }}-${{ github.run_attempt }}'
          python scripts/ci/retain_unreal_assets.py --workspace (Get-Location).Path --archive $archive
          if ($LASTEXITCODE -ne 0) { throw 'Previous owner-handoff LFS retention failed; do not sanitize the worktree.' }

      - name: Sanitize tracked workspace while preserving verified build outputs
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Unreal warm-worktree reset failed.' }
          git clean -ffdx -e '/Binaries/' -e '/Intermediate/' -e '/Plugins/**/Binaries/' -e '/Plugins/**/Intermediate/' -e '/Saved/BuildCache/UnrealCi/' -e '/Saved/Logs/YetAnotherCyclingSim.log' -e '/Saved/RuntimeProof/CI/RegionTerrain/*/*.log' -e '/Saved/RuntimeProof/CI/Unreal/Proof/automation_editor.log' -e '/Saved/RuntimeProof/CI/Unreal/Proof/automation_run.log'
          if ($LASTEXITCODE -ne 0) { throw 'Unreal warm-worktree allow-listed clean failed.' }
          # Warm-checkout stat caching and old line-ending attributes can leave
          # stale bytes even after checkout-index reports success. Read the
          # three fixed raw Git blobs, verify every original pin before writing,
          # and print mandatory before/after byte readbacks from this checkout.
          python -m scripts.ci.sa_calobra_whole_map_workflow refresh-committed --repo (Get-Location).Path --root $env:YACS_UNREAL_LOG_ROOT --exact-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Raw committed evidence refresh or byte readback failed.' }

      - name: Enforce code-only checkout
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1

      - name: Verify exact SHA and clean tracked state
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') {
            throw "checkout HEAD '$actual' != caller SHA '${{ github.sha }}'"
          }
          $dirty = @(git status --porcelain --untracked-files=all)
          if ($dirty.Count -gt 0) {
            $dirty | ForEach-Object { Write-Host $_ }
            throw 'Warm Unreal worktree is not clean after sanitization.'
          }

      - name: Reset current-run Unreal proof evidence
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path (Get-Location) 'scripts/ci/Release-YacsUnrealWorkspaceLocks.ps1'
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            $helper = Join-Path $env:GITHUB_WORKSPACE '_bootstrap-wholemap/scripts/ci/Release-YacsUnrealWorkspaceLocks.ps1'
          }
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
            throw 'Unreal workspace lock helper is unavailable from both active checkout and bootstrap.'
          }
          & $helper -Workspace $env:GITHUB_WORKSPACE
          $proof = Join-Path (Get-Location) 'Saved/RuntimeProof/CI/Unreal'
          if (Test-Path -LiteralPath $proof) {
            # Two legacy fixed-name Automation logs can remain locked by a stale
            # Windows CIM record even after the native process is gone. New runs
            # write logs to the run-scoped RUNNER_TEMP path below, so preserve only
            # those exact legacy residues and clear every other proof artifact.
            $proofPayload = Join-Path $proof 'Proof'
            Get-ChildItem -LiteralPath $proof -Force | ForEach-Object {
              if ($_.FullName -eq $proofPayload) {
                Get-ChildItem -LiteralPath $proofPayload -Force | ForEach-Object {
                  if ($_.Name -notin @('automation_editor.log', 'automation_run.log')) {
                    Remove-Item -LiteralPath $_.FullName -Recurse -Force
                  }
                }
              }
              else {
                Remove-Item -LiteralPath $_.FullName -Recurse -Force
              }
            }
          }
          New-Item -ItemType Directory -Path $env:YACS_UNREAL_LOG_ROOT -Force | Out-Null

      - name: Resolve immutable whole-map inputs in the configured workspace
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTOR -ne 'karnalooch' -or $env:GITHUB_REPOSITORY -ne 'karnalooch/YetAnotherCyclingSim' -or $env:GITHUB_REF_NAME -ne 'feat/phase2c-pcgex-cliff-topology') { throw 'Whole-map material intent requires the owner and existing reviewed branch.' }
          if (-not $env:YACS_WORKSPACE_CONFIG) { throw 'Canonical YACS_WORKSPACE_CONFIG is required.' }
          $workspaceJson = python -c "import json,sys; from pathlib import Path; from scripts.manage_local_workspace import load_workspace; print(json.dumps(load_workspace(Path(sys.argv[1]))))" $env:YACS_WORKSPACE_CONFIG
          if ($LASTEXITCODE -ne 0) { throw 'Canonical persistent workspace configuration failed validation.' }
          $workspace = $workspaceJson | ConvertFrom-Json
          $root = Join-Path $workspace.work "proofs/sa-calobra-whole-map/$env:GITHUB_SHA/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Whole-map evidence root exists; refusing stale output or overwrite.' }
          New-Item -ItemType Directory -Path $root | Out-Null
          "YACS_WHOLE_MAP_PROOF_ROOT=$root" >> $env:GITHUB_ENV
          "YACS_WHOLE_MAP_PREP=$(Join-Path $root 'whole-map-prep')" >> $env:GITHUB_ENV
          "YACS_WHOLE_MAP_NATIVE_SOURCE=$(Join-Path $root 'native-input')" >> $env:GITHUB_ENV
          "YACS_WHOLE_MAP_MASTER_RECEIPT=$(Join-Path $root 'whole-map-master-receipt.json')" >> $env:GITHUB_ENV
          "YACS_WHOLE_MAP_PLACEMENT=$(Join-Path $workspace.data 'world-data/sa-calobra-working-v1/pcg-masks-v1-2026-10-04')" >> $env:GITHUB_ENV
          "YACS_WHOLE_MAP_RETAINED_SOURCE=$(Join-Path $workspace.work 'proofs/sa-calobra-tpp/b1ea05b33b9f3208e7aeb6884f1a67792d9c6121/37800814004-1')" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_OUTPUT=$(Join-Path $root 'capture')" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_EXPECTED_SHA=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_PLAN=$(Join-Path $root 'native-input/plan/component230-cliff-visual-plan.json')" >> $env:GITHUB_ENV
          "YACS_TERRAIN_ORIGINAL_MESH=$(Join-Path $root 'native-input/source-reference/local-cliff-smoothing-mesh.json')" >> $env:GITHUB_ENV
          # Accepted scene dependencies remain identical; the master is generated only in this isolated checkout.
          git diff --quiet 4f2cba560d54931dc8ba080370d96a7aad24f15b HEAD -- Content/Worlds/SaCalobra/L_SaCalobraAccepted_20261004.umap Content/Worlds/SaCalobra/CheckpointMaterials Content/Worlds/SaCalobra/CheckpointEarthworks Content/Generated/YACS/MaskReview Content/Generated/YACS/TextureMaterialPrep
          if ($LASTEXITCODE -ne 0) { throw 'Accepted scene or original material dependencies changed.' }

      - name: Install pinned whole-grid and image dependencies
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 pillow==12.0.0 rasterio==1.4.3
          if ($LASTEXITCODE -ne 0) { throw 'Whole-map preparation dependency install failed.' }

      - name: Hydrate only the frozen scene and full-grid material inputs
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_LFS_SKIP_SMUDGE = '0'
          try {
            New-Item -ItemType Directory -Force -Path $env:YACS_LFS_CACHE_ROOT | Out-Null
            git lfs install --local --skip-smudge
            if ($LASTEXITCODE -ne 0) { throw 'Local LFS setup failed.' }
            git config --local lfs.storage $env:YACS_LFS_CACHE_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'Persistent LFS cache configuration failed.' }
            $include = 'Content/Worlds/SaCalobra/L_SaCalobraAccepted_20261004.umap,Content/Worlds/SaCalobra/CheckpointMaterials/**,Content/Worlds/SaCalobra/CheckpointEarthworks/**,Content/Generated/YACS/MaskReview/M_MaskReview_1.uasset,Content/Generated/YACS/MaskReview/T_MaskReview_1.uasset,Content/Generated/YACS/TextureMaterialPrep/Libraries/3d53743e48394f31beb35e4030dc8a87/**,Content/Generated/YACS/TextureMaterialPrep/Runs/C414EA4B402723D66FCB689E49EEB02D/BaseColor.uasset,Content/Generated/YACS/TextureMaterialPrep/Runs/94406E0247C9822CFD006CAB8B20545E/BaseColor.uasset,worldgen/materials/visual_fill/*.png'
            git lfs pull --include=$include --exclude=''
            if ($LASTEXITCODE -ne 0) { throw 'Frozen scene and full-grid material LFS hydration failed.' }
          }
          finally { $env:GIT_LFS_SKIP_SMUDGE = '1' }
          python -m scripts.ci.sa_calobra_whole_map_workflow verify-assets --root $env:YACS_WHOLE_MAP_PROOF_ROOT --exact-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Native scene asset hashes do not match exact committed LFS objects.' }

      - name: Test preparation boundaries and prepare all immutable source bundles
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest scripts.assets.test_sa_calobra_whole_map_surface_prep scripts.assets.test_install_sa_calobra_whole_map_prep scripts.assets.test_restore_workspace_data scripts.ci.test_sa_calobra_whole_map_prep scripts.ci.test_sa_calobra_whole_map_capture_views scripts.ci.test_sa_calobra_whole_map_workflow scripts.ci.test_sa_calobra_detail_native_workflow -v
          if ($LASTEXITCODE -ne 0) { throw 'Whole-map CPU and workflow contract tests failed.' }
          python scripts/assets/prepare_sa_calobra_whole_map_surface_prep.py --source-inputs worldgen/materials/visual_fill --placement-inputs $env:YACS_WHOLE_MAP_PLACEMENT --output $env:YACS_WHOLE_MAP_PREP
          if ($LASTEXITCODE -ne 0) { throw 'Full-grid material preparation or mandatory pinned PCG exclusion reasons failed.' }
          python -m scripts.ci.sa_calobra_whole_map_workflow prepare-native --source $env:YACS_WHOLE_MAP_RETAINED_SOURCE --root $env:YACS_WHOLE_MAP_PROOF_ROOT --exact-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Retained native v8 donor validation failed.' }
          python -m scripts.ci.sa_calobra_whole_map_workflow verify-prepared --root $env:YACS_WHOLE_MAP_PROOF_ROOT --placement $env:YACS_WHOLE_MAP_PLACEMENT
          if ($LASTEXITCODE -ne 0) { throw 'Whole-map prepared output inventory failed.' }

      - name: Verify installed exact-version material and Landscape API source
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $engine = Resolve-YacsUnrealEngine -ProjectPath (Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject')
          if (-not $engine -or $engine.Version -ne '5.8.2-56702186') { throw 'Whole-map material proof requires UE 5.8.2 CL 56702186.' }
          $entryMap = Join-Path $engine.Root 'Engine/Content/Maps/Entry.umap'
          if (-not (Test-Path -LiteralPath $entryMap -PathType Leaf) -or (Get-Item -LiteralPath $entryMap).Length -lt 1024) { throw 'Installed empty Entry map is required before starting the material editor passes.' }
          $contracts = @(
            @{ path = 'Engine/Source/Runtime/Engine/Public/Materials/MaterialExpressionCameraPositionWS.h'; symbols = @('UMaterialExpressionCameraPositionWS') },
            @{ path = 'Engine/Source/Runtime/Engine/Public/Materials/MaterialExpressionDistance.h'; symbols = @('UMaterialExpressionDistance', 'A', 'B') },
            @{ path = 'Engine/Source/Runtime/Engine/Public/Materials/MaterialExpressionFloor.h'; symbols = @('UMaterialExpressionFloor') },
            @{ path = 'Engine/Source/Runtime/Engine/Public/Materials/MaterialExpressionFrac.h'; symbols = @('UMaterialExpressionFrac') },
            @{ path = 'Engine/Source/Runtime/Engine/Public/Materials/MaterialExpressionMax.h'; symbols = @('UMaterialExpressionMax') },
            @{ path = 'Engine/Source/Editor/MaterialEditor/Public/MaterialEditingLibrary.h'; symbols = @('CreateMaterialExpression', 'ConnectMaterialProperty', 'RecompileMaterial') },
            @{ path = 'Engine/Source/Runtime/Landscape/Classes/LandscapeComponent.h'; symbols = @('ForcedLOD', 'OverrideMaterial') }
          )
          $evidence = @()
          foreach ($contract in $contracts) {
            $path = Join-Path $engine.Root $contract.path
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing installed primary material API header: $($contract.path)" }
            $source = Get-Content -LiteralPath $path -Raw
            foreach ($symbol in $contract.symbols) {
              if ($source -notmatch ('\b' + [regex]::Escape($symbol) + '\b')) { throw "Installed material API lacks $symbol" }
            }
            $evidence += [ordered]@{ header = $contract.path; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant(); verified_symbols = $contract.symbols }
          }
          [ordered]@{ status = 'INSTALLED_PRIMARY_API_SOURCE_VERIFIED'; exact_sha = $env:GITHUB_SHA; engine_version = $engine.Version; build_version_sha256 = $engine.BuildVersionSha256; headers = $evidence; startup_map = '/Engine/Maps/Entry'; startup_map_sha256 = (Get-FileHash -LiteralPath $entryMap -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:YACS_WHOLE_MAP_PROOF_ROOT 'native-api-evidence.json') -Encoding UTF8

      - name: Fingerprint the exact compile and Automation inputs
        id: fingerprints
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $fingerprints = python -c "import json; from scripts.ci.classify_changes import unreal_compile_fingerprint,unreal_proof_fingerprint; print(json.dumps(dict(compile=unreal_compile_fingerprint('.'),proof=unreal_proof_fingerprint('.'))))"
          if ($LASTEXITCODE -ne 0) { throw 'Exact-head Unreal input fingerprinting failed.' }
          $value = $fingerprints | ConvertFrom-Json
          "compile=$($value.compile)" >> $env:GITHUB_OUTPUT
          "proof=$($value.proof)" >> $env:GITHUB_OUTPUT

      - name: Resolve verified Unreal execution mode
        id: cache
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          ./scripts/ci/Resolve-YacsUnrealCiCache.ps1 -Action Resolve -ExpectedHead $env:GITHUB_SHA -ExpectedCompileFingerprint '${{ steps.fingerprints.outputs.compile }}' -ExpectedProofFingerprint '${{ steps.fingerprints.outputs.proof }}' -GithubOutput $env:GITHUB_OUTPUT

      - name: Purge incompatible build outputs only when resolver requires it
        if: ${{ steps.cache.outputs.purge_build_cache == 'true' }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @('Binaries', 'Intermediate')) {
            if (Test-Path -LiteralPath $relative) { Remove-Item -LiteralPath $relative -Recurse -Force }
          }
          if (Test-Path -LiteralPath 'Plugins') {
            Get-ChildItem -LiteralPath 'Plugins' -Directory | ForEach-Object {
              foreach ($leaf in @('Binaries', 'Intermediate')) {
                $candidate = Join-Path $_.FullName $leaf
                if (Test-Path -LiteralPath $candidate) { Remove-Item -LiteralPath $candidate -Recurse -Force }
              }
            }
          }

      - name: Build or run fresh Automation only when required by verified cache
        if: ${{ steps.cache.outputs.mode != 'static' }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $parameters = @{ ExpectedHead = $env:GITHUB_SHA; ExpectedBranch = 'HEAD' }
          if ('${{ steps.cache.outputs.mode }}' -eq 'runtime') { $parameters.SkipBuild = $true }
          elseif ('${{ steps.cache.outputs.mode }}' -ne 'compile') { throw 'Unexpected verified Unreal execution mode.' }
          ./scripts/ci/Invoke-YacsUnrealCi.ps1 @parameters
          if ($LASTEXITCODE -ne 0) { throw 'Required exact-head compile or Automation failed.' }

      - name: Record and publish only this job's successful non-static proof
        if: ${{ steps.cache.outputs.mode != 'static' }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/ci/Resolve-YacsUnrealCiCache.ps1 -Action Record -CompletedMode '${{ steps.cache.outputs.mode }}' -CompletedCompileKind '${{ steps.cache.outputs.compile_kind }}' -ExpectedHead $env:GITHUB_SHA -ExpectedCompileFingerprint '${{ steps.fingerprints.outputs.compile }}' -ExpectedProofFingerprint '${{ steps.fingerprints.outputs.proof }}'
          if ($LASTEXITCODE -ne 0) { throw 'Actual compile/proof state recording failed.' }
          python -m scripts.ci.unreal_ci_workspace publish --workspace $env:GITHUB_WORKSPACE --run '${{ github.run_id }}-${{ github.run_attempt }}' --worktree $env:YACS_UNREAL_WORKTREE --head $env:GITHUB_SHA --compile-fingerprint '${{ steps.fingerprints.outputs.compile }}' --proof-fingerprint '${{ steps.fingerprints.outputs.proof }}'
          if ($LASTEXITCODE -ne 0) { throw 'Verified compile/proof cache publication failed.' }

      - name: Retain exact binary equivalence evidence before fresh material work
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath 'Saved/RuntimeProof/CI/Unreal/cache_resolution.json' -Destination (Join-Path $env:YACS_WHOLE_MAP_PROOF_ROOT 'compile-cache-resolution.json')
          Copy-Item -LiteralPath 'Saved/BuildCache/UnrealCi/state.json' -Destination (Join-Path $env:YACS_WHOLE_MAP_PROOF_ROOT 'compile-cache-state.json')
          Write-Host 'Binary mode: ${{ steps.cache.outputs.mode }}; compile kind: ${{ steps.cache.outputs.compile_kind }}; reason: ${{ steps.cache.outputs.reason }}'
          Write-Host 'The following material build and full-map capture are fresh even when binary equivalence is static.'

      - name: Prepare fixed master then capture the entire native working map
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $project = Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject'
          $engine = Resolve-YacsUnrealEngine -ProjectPath $project
          $env:YACS_TERRAIN_EROSION_TRIAL = '1'
          $env:YACS_TERRAIN_MESH_TRIAL = '1'
          foreach ($name in @('YACS_DETAIL_NATIVE', 'YACS_CLIFF_PCGEX_MESH', 'YACS_CLIFF_PAIRED_CUSTOM_OUTPUT', 'YACS_SA_CALOBRA_TPP_SURVEY', 'YACS_LANDSCAPE_MESH_DIAGNOSTIC', 'YACS_LOCAL_CLIFF_SMOOTHING')) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
          $passes = @(
            @{ name = 'master'; script = 'scripts/ue/build_sa_calobra_whole_map_master.py'; timeout = 1200000 },
            @{ name = 'capture'; script = 'scripts/ue/capture_sa_calobra_component230_cliff.py'; timeout = 1200000 }
          )
          foreach ($pass in $passes) {
            $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
            if ($state.status -ne 'IDLE') { throw "Whole-map editor pass cannot start on an owned host: $($state.status)." }
            $script = (Resolve-Path $pass.script).Path
            $stdout = Join-Path $env:YACS_WHOLE_MAP_PROOF_ROOT "whole-map-$($pass.name).stdout.log"
            $stderr = Join-Path $env:YACS_WHOLE_MAP_PROOF_ROOT "whole-map-$($pass.name).stderr.log"
            $log = Join-Path $env:YACS_WHOLE_MAP_PROOF_ROOT "whole-map-$($pass.name).engine.log"
            # Both passes start empty. The scene-owning capture loads the accepted map exactly once itself.
            $arguments = @(('"' + $project + '"'), '/Engine/Maps/Entry', ('-ExecutePythonScript="' + $script + '"'), '-RenderOffscreen', '-Unattended', '-NoPause', '-NoSplash', '-NoSound', '-NoP4', '-NoVSync', '-Deterministic', '-ScriptErrorsAreFatal', '-stdout', ('-AbsLog="' + $log + '"'))
            $process = Start-Process -FilePath $engine.UnrealEditorPath -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit($pass.timeout)) {
              try { $process | Stop-Process -Force } catch { }
              throw "Whole-map $($pass.name) editor pass timed out."
            }
            if ($process.ExitCode -ne 0) {
              foreach ($diagnostic in @($stdout, $stderr, $log)) { if (Test-Path -LiteralPath $diagnostic -PathType Leaf) { Get-Content -LiteralPath $diagnostic -Tail 160 | Write-Host } }
              throw "Whole-map $($pass.name) exited $($process.ExitCode)."
            }
            foreach ($diagnostic in @($stdout, $stderr, $log)) {
              if (-not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) { throw 'Whole-map process diagnostics are missing.' }
              $fallback = @(Select-String -LiteralPath $diagnostic -Pattern @('Texture Sample > Missing input texture', 'Default Material will be used', "LoadErrors: Error:.*'/Game/Worlds/SaCalobra/Checkpoint", "LoadErrors: Error:.*'/Game/Generated/YACS/MaskReview/", "LoadErrors: Error:.*'/Game/Generated/YACS/TextureMaterialPrep/", "LoadErrors: Error:.*'/Game/Generated/YACS/SaCalobra/WholeMapPreparation/"))
              if ($fallback.Count -gt 0) { $fallback | Write-Host; throw 'Whole-map proof detected a missing dependency or material fallback.' }
            }
            if ($pass.name -eq 'master') {
              python -m scripts.ci.sa_calobra_whole_map_workflow retain-master --root $env:YACS_WHOLE_MAP_PROOF_ROOT --exact-sha $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw 'Fresh generated material packages could not be retained exactly.' }
            }
          }

      - name: Verify complete native inventory and fresh capture provenance
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          python -m scripts.ci.sa_calobra_whole_map_workflow verify-native --root $env:YACS_WHOLE_MAP_PROOF_ROOT --exact-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Whole-map application, capture or rollback evidence failed.' }

      - name: Verify unchanged map checkout and all retained source bytes
        if: ${{ always() && env.YACS_WHOLE_MAP_PROOF_ROOT != '' }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          python -m scripts.ci.sa_calobra_whole_map_workflow restore --root $env:YACS_WHOLE_MAP_PROOF_ROOT --exact-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Whole-map source/checkout conservation verification failed.' }

      - name: Retain only current-run compile diagnostics under the proof root
        if: ${{ always() && env.YACS_WHOLE_MAP_PROOF_ROOT != '' }}
        shell: pwsh
        working-directory: ${{ env.YACS_UNREAL_WORKTREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path (Get-Location) 'Saved/RuntimeProof/CI/Unreal'
          $destination = Join-Path $env:YACS_WHOLE_MAP_PROOF_ROOT 'build-automation'
          foreach ($relative in @('cache_resolution.json', 'unreal_ci_summary.json', 'failure_context.txt', 'Proof/summary.json', 'Proof/build_editor.log', 'Proof/AutomationReport/index.json')) {
            $file = Join-Path $source $relative
            if (Test-Path -LiteralPath $file -PathType Leaf) {
              $target = Join-Path $destination $relative
              New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force | Out-Null
              Copy-Item -LiteralPath $file -Destination $target
            }
          }

      - name: Upload compact whole-map renders and independently verified receipts
        if: ${{ always() && env.YACS_WHOLE_MAP_PROOF_ROOT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sa-calobra-whole-map-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.YACS_WHOLE_MAP_PROOF_ROOT }}/whole-map-prep/
            ${{ env.YACS_WHOLE_MAP_PROOF_ROOT }}/generated-assets/
            ${{ env.YACS_WHOLE_MAP_PROOF_ROOT }}/capture/whole-map-prep/frames/
            ${{ env.YACS_WHOLE_MAP_PROOF_ROOT }}/capture/whole-map-prep/diagnostics/
            ${{ env.YACS_WHOLE_MAP_PROOF_ROOT }}/capture/whole-map-prep/*.json
            ${{ env.YACS_WHOLE_MAP_PROOF_ROOT }}/capture/whole-map-prep/readiness/**/capture-readiness.json
            ${{ env.YACS_WHOLE_MAP_PROOF_ROOT }}/capture/component230-cliff-visual-receipt.json
            ${{ env.YACS_WHOLE_MAP_PROOF_ROOT }}/*.json
            ${{ env.YACS_WHOLE_MAP_PROOF_ROOT }}/whole-map-*.log
            ${{ env.YACS_WHOLE_MAP_PROOF_ROOT }}/build-automation/
          if-no-files-found: error
          retention-days: 90

  detail-pilot:
    name: Replay source-surface detail masks without Unreal
    if: >-
      github.event_name == 'push' &&
      github.repository == 'karnalooch/YetAnotherCyclingSim' &&
      github.actor == 'karnalooch' &&
      github.ref == 'refs/heads/feat/phase2c-pcgex-cliff-topology' &&
      contains(github.event.head_commit.message, '[detail-pilot]') &&
      !contains(github.event.head_commit.message, '[wholemap-material]') &&
      !contains(github.event.head_commit.message, '[detail-native]') &&
      !contains(github.event.head_commit.message, '[tpp-survey]') &&
      !contains(github.event.head_commit.message, '[tpp-retain]') &&
      !contains(github.event.head_commit.message, '[tpp-docs]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the exact pilot revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          lfs: false
          persist-credentials: false
      - name: Set up the existing Python tooling
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the existing pinned array dependency
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5
      - name: Test projection, source protection and replay boundaries
        run: python -m unittest scripts.assets.test_sa_calobra_detail_pilot scripts.assets.test_run_sa_calobra_detail_pilot -v
      - name: Replay verified source triangles and original captured camera poses
        run: >-
          python scripts/assets/run_sa_calobra_detail_pilot.py
          --frames docs/experiments/sa-calobra-tpp-survey-20261008/frames.csv
          --annotations docs/experiments/sa-calobra-component230-detail-pilot-20261008/annotations.json
          --output ${{ runner.temp }}/component230-detail-pilot
      - name: Retain masks, unchanged geometry and original-image vector previews
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: component230-detail-pilot-${{ github.sha }}
          path: ${{ runner.temp }}/component230-detail-pilot/
          if-no-files-found: error
          retention-days: 90

  detail-native:
    name: Native detail mask and bounded limestone patch
    if: >-
      github.event_name == 'push' &&
      github.repository == 'karnalooch/YetAnotherCyclingSim' &&
      github.actor == 'karnalooch' &&
      github.ref == 'refs/heads/feat/phase2c-pcgex-cliff-topology' &&
      contains(github.event.head_commit.message, '[detail-native]') &&
      !contains(github.event.head_commit.message, '[wholemap-material]') &&
      !contains(github.event.head_commit.message, '[detail-pilot]') &&
      !contains(github.event.head_commit.message, '[tpp-survey]') &&
      !contains(github.event.head_commit.message, '[tpp-retain]') &&
      !contains(github.event.head_commit.message, '[tpp-docs]')
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 45
    steps:
      - name: Isolate detail proof Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'component230-detail-native.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable long paths.' }

      - name: Checkout exact detail proof revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: _phase2c-pcgex-cliff
          fetch-depth: 0
          lfs: false
          clean: false
          persist-credentials: false

      - name: Verify owner intent, exact revision and idle host
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTOR -ne 'karnalooch' -or $env:GITHUB_REPOSITORY -ne 'karnalooch/YetAnotherCyclingSim' -or $env:GITHUB_REF_NAME -ne 'feat/phase2c-pcgex-cliff-topology') {
            throw 'Native detail intent requires the owner and existing Component 230 branch.'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) { throw 'Native detail checkout does not match the exact event SHA.' }
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') { throw "Shared Unreal host is already owned; status=$($state.status)." }
          git diff --quiet 4f2cba560d54931dc8ba080370d96a7aad24f15b HEAD -- Content/Worlds/SaCalobra/L_SaCalobraAccepted_20261004.umap Content/Worlds/SaCalobra/CheckpointMaterials Content/Worlds/SaCalobra/CheckpointEarthworks Content/Generated/YACS/MaskReview Content/Generated/YACS/TextureMaterialPrep
          if ($LASTEXITCODE -ne 0) { throw 'Native detail requires the accepted scene and material asset identities.' }
          if (-not $env:YACS_WORKSPACE_CONFIG) { throw 'Canonical YACS_WORKSPACE_CONFIG was not exported by the runner.' }
          $workspaceJson = python -c "import json,sys; from pathlib import Path; from scripts.manage_local_workspace import load_workspace; print(json.dumps(load_workspace(Path(sys.argv[1]))))" $env:YACS_WORKSPACE_CONFIG
          if ($LASTEXITCODE -ne 0) { throw 'Canonical persistent workspace configuration failed validation.' }
          $workspace = $workspaceJson | ConvertFrom-Json
          $source = Join-Path $workspace.work 'proofs/sa-calobra-tpp/b1ea05b33b9f3208e7aeb6884f1a67792d9c6121/37800814004-1'
          $root = Join-Path $workspace.work "proofs/sa-calobra-detail/$actual/$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Native detail evidence root exists; refusing stale output or overwrite.' }
          New-Item -ItemType Directory -Path $root | Out-Null
          "YACS_DETAIL_PROOF_ROOT=$root" >> $env:GITHUB_ENV
          "YACS_DETAIL_RETAINED_SOURCE=$source" >> $env:GITHUB_ENV
          "YACS_DETAIL_NATIVE=$(Join-Path $root 'input')" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_OUTPUT=$(Join-Path $root 'capture')" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_EXPECTED_SHA=$actual" >> $env:GITHUB_ENV

      - name: Install pinned detail and image dependencies
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 pillow==12.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Native detail dependency install failed.' }

      - name: Validate and copy only fixed retained source files
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $prepare = @'
          import csv, hashlib, io, json, os, struct, subprocess
          from pathlib import Path
          from scripts.assets.run_sa_calobra_detail_pilot import CAPTURE, FRAMES, MESH, RECEIPT, verify_native
          from scripts.proof.retain_sa_calobra_tpp_survey import no_link, read_json
          root = Path(os.environ["YACS_DETAIL_PROOF_ROOT"])
          source = Path(os.environ["YACS_DETAIL_RETAINED_SOURCE"])
          bundle = Path(os.environ["YACS_DETAIL_NATIVE"])
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          def checked(path, expected, size=None):
              for parent in (path, *path.parents):
                  no_link(parent)
              require(path.is_file() and 0 < path.stat().st_size < 32 * 1024 * 1024, "Invalid bounded source file")
              data = path.read_bytes()
              require(hashlib.sha256(data).hexdigest() == expected, "Pinned source SHA256 mismatch: " + path.name)
              require(size is None or len(data) == size, "Pinned source size mismatch")
              return data
          def committed(path, expected):
              # Read immutable Git blob bytes; Windows checkout newline settings cannot alter the selection.
              spec = os.environ["YACS_CLIFF_VISUAL_EXPECTED_SHA"] + ":" + path.as_posix()
              size = int(subprocess.check_output(["git", "cat-file", "-s", spec]))
              require(0 < size < 32 * 1024 * 1024, "Invalid bounded committed selection file")
              data = subprocess.check_output(["git", "cat-file", "blob", spec])
              require(len(data) == size and hashlib.sha256(data).hexdigest() == expected, "Pinned committed selection hash mismatch")
              return data
          retained = read_json(source / ".yacs-retention/manifest.json")
          require(retained.get("status") == "LOCAL_RETAINED"
                  and retained.get("exact_sha") == CAPTURE
                  and retained.get("run_id") == 37800814004 and retained.get("attempt") == 1
                  and retained.get("source_preserved") is True
                  and retained.get("destination_verified") is True, "Completed retained source identity is required")
          inventory = retained["inventory"]["files"]
          require(len({row["path"] for row in inventory}) == len(inventory), "Duplicate retention inventory path")
          inventory = {row["path"]: row for row in inventory}
          fixed = (
              ("terrain-erosion-mesh/combined-mesh.json", "source/combined-mesh.json", MESH),
              ("terrain-erosion-mesh/component230-cliff-visual-receipt.json", "source/component230-cliff-visual-receipt.json", RECEIPT),
              ("local-cliff-smoothing/local-cliff-smoothing-mesh.json", "source-reference/local-cliff-smoothing-mesh.json", "9ed6c9179d2df04117fcc8992224061f942d42a03a714a4a75177c43728b1cd5"),
              ("local-cliff-smoothing/component230-cliff-visual-receipt.json", "source-reference/component230-cliff-visual-receipt.json", "c9494905cbb51f5622e3a414c862eb86d21a261063d6b5adc357ee74ac2a2742"),
              ("plan/component230-cliff-visual-plan.json", "plan/component230-cliff-visual-plan.json", "41768c7680ddea2304f9968d4b2947bf65e1164ffacfa45f74dcefad955b5359"),
          )
          captured = Path("docs/experiments/sa-calobra-tpp-survey-20261008")
          proposal = Path("docs/experiments/sa-calobra-component230-detail-pilot-20261008")
          frames = checked(captured / "frames.csv", FRAMES)
          annotations = committed(proposal / "annotations.json", "0a7703e960d6762d7721dafe0d646c74d889c6ff25c4b115b06129992a7586e8")
          rows = {row["frame_id"]: row for row in csv.DictReader(io.StringIO(frames.decode("utf-8-sig")))}
          ids = [row["frame_id"] for row in json.loads(annotations)["frames"]]
          require(ids == ["window-0021-forward-00005", "window-0023-forward-00000"], "Only the two fixed annotated cameras are admitted")
          entries, records = {}, []
          for relative, destination, expected in fixed:
              require(inventory.get(relative, {}).get("sha256") == expected, "Retained source manifest hash mismatch")
              data = checked(source / relative, expected, inventory[relative]["size_bytes"])
              entries[destination] = data
              records.append(dict(path=relative, sha256=expected, size_bytes=len(data)))
          verify_native(json.loads(entries["source/component230-cliff-visual-receipt.json"]))
          for frame_id in ids:
              row = rows[frame_id]
              require(row["file"] == "frames/" + frame_id + ".png", "Invalid fixed frame path")
              relative = "terrain-erosion-mesh/tpp-survey/" + row["file"]
              require(inventory.get(relative, {}).get("sha256") == row["sha256"], "Retained frame manifest hash mismatch")
              data = checked(source / relative, row["sha256"], int(row["size_bytes"]))
              require(data[:8] == b"\x89PNG\r\n\x1a\n" and struct.unpack(">II", data[16:24]) == (1280, 720), "Original camera PNG dimensions mismatch")
              entries["source/" + frame_id + ".png"] = data
              records.append(dict(path=relative, sha256=row["sha256"], size_bytes=len(data)))
          mask_sha = "6ec02a0e3dac9756923d29c8b603c0c1d79db411d06f3a20bb30956e11390953"
          pilot_sha = "804842ef0893df0d4822caa458ca68b658bf6d9481ef64db5237dde00ec97718"
          entries["pilot/triangle-bands.json"] = committed(proposal / "pilot/triangle-bands.json", mask_sha)
          entries["pilot/manifest.json"] = committed(proposal / "pilot/manifest.json", pilot_sha)
          pilot = json.loads(entries["pilot/manifest.json"])
          require(pilot["mesh_sha256"] == MESH and pilot["frames_csv_sha256"] == FRAMES
                  and pilot["annotations_sha256"] == hashlib.sha256(annotations).hexdigest(), "Published selection source binding mismatch")
          bundle.mkdir(exist_ok=False)
          for name, data in dict(entries, **{"frames.csv": frames, "annotations.json": annotations}).items():
              output = bundle / name
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(data)
          receipt = dict(schema_version=1, status="FIXED_RETAINED_SOURCE_VERIFIED",
                         exact_sha=os.environ["YACS_CLIFF_VISUAL_EXPECTED_SHA"], source_capture_sha=CAPTURE,
                         source_run_id=37800814004, source_attempt=1, source_root=str(source),
                         source_files=records, frames_csv_sha256=FRAMES, frame_ids=ids,
                         mask_sha256=mask_sha, pilot_manifest_sha256=pilot_sha,
                         whole_archive_downloaded=False, source_regenerated=False, selection_recomputed=False)
          (root / "source-input-verification.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          '@
          $prepare | python -
          if ($LASTEXITCODE -ne 0) { throw 'Immutable retained native detail source verification failed.' }
          "YACS_CLIFF_VISUAL_PLAN=$(Join-Path $env:YACS_DETAIL_NATIVE 'plan/component230-cliff-visual-plan.json')" >> $env:GITHUB_ENV
          "YACS_TERRAIN_ORIGINAL_MESH=$(Join-Path $env:YACS_DETAIL_NATIVE 'source-reference/local-cliff-smoothing-mesh.json')" >> $env:GITHUB_ENV

      - name: Test fixed selection and prepare the bounded patch
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest scripts.assets.test_sa_calobra_detail_pilot scripts.assets.test_run_sa_calobra_detail_pilot scripts.assets.test_sa_calobra_detail_treatment scripts.ci.test_sa_calobra_detail_capture scripts.ci.test_sa_calobra_detail_native_workflow -v
          if ($LASTEXITCODE -ne 0) { throw 'Detail source, treatment or native consumer contract tests failed.' }
          $bundle = $env:YACS_DETAIL_NATIVE
          $mask = Join-Path $bundle 'pilot/triangle-bands.json'
          python scripts/assets/prepare_sa_calobra_detail_treatment.py --mesh (Join-Path $bundle 'source/combined-mesh.json') --mask $mask --output (Join-Path $bundle 'treatment')
          if ($LASTEXITCODE -ne 0) { throw 'Bounded limestone patch preparation failed.' }

      - name: Materialize the unchanged accepted scene and limestone dependencies
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_LFS_SKIP_SMUDGE = '0'
          try {
            New-Item -ItemType Directory -Force -Path $env:YACS_LFS_CACHE_ROOT | Out-Null
            git lfs install --local --skip-smudge
            if ($LASTEXITCODE -ne 0) { throw 'Local LFS setup failed.' }
            git config --local lfs.storage $env:YACS_LFS_CACHE_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'Persistent LFS storage configuration failed.' }
            $map = 'Content/Worlds/SaCalobra/L_SaCalobraAccepted_20261004.umap'
            $checkpointMaterials = 'Content/Worlds/SaCalobra/CheckpointMaterials'
            $checkpointEarthworks = 'Content/Worlds/SaCalobra/CheckpointEarthworks'
            $landscapeMaterial = 'Content/Generated/YACS/MaskReview/M_MaskReview_1.uasset'
            $landscapeTexture = 'Content/Generated/YACS/MaskReview/T_MaskReview_1.uasset'
            $library = 'Content/Generated/YACS/TextureMaterialPrep/Libraries/3d53743e48394f31beb35e4030dc8a87'
            $exposedBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/C414EA4B402723D66FCB689E49EEB02D/BaseColor.uasset'
            $screeBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/94406E0247C9822CFD006CAB8B20545E/BaseColor.uasset'
            $include = "$map,$checkpointMaterials/**,$checkpointEarthworks/**,$landscapeMaterial,$landscapeTexture,$library/**,$exposedBaseColor,$screeBaseColor"
            git lfs pull --include=$include --exclude=''
            if ($LASTEXITCODE -ne 0) { throw 'Accepted scene and limestone transitive LFS pull failed.' }
            git lfs checkout $map $checkpointMaterials $checkpointEarthworks $landscapeMaterial $landscapeTexture $library $exposedBaseColor $screeBaseColor
            if ($LASTEXITCODE -ne 0) { throw 'Accepted scene and limestone transitive LFS checkout failed.' }
            if ((Get-FileHash -LiteralPath $map -Algorithm SHA256).Hash.ToLowerInvariant() -ne '276d1621fa083850f6d603b6d115b01b74c9a92c182254d15302e786abfbf29c') {
              throw 'Accepted map bytes differ from the captured v8 scene.'
            }
            $required = @(
              $landscapeMaterial, $landscapeTexture,
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_ExposedRock.uasset",
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_Scree.uasset",
              "$library/ProviderData/ExposedRock/T_Height.uasset", "$library/ProviderData/ExposedRock/T_Normal.uasset",
              "$library/ProviderData/ExposedRock/T_Roughness.uasset", "$library/ProviderData/Scree/T_Height.uasset",
              "$library/ProviderData/Scree/T_Normal.uasset", "$library/ProviderData/Scree/T_Roughness.uasset",
              "$library/Sources/T_Source_ExposedRock.uasset", "$library/Sources/T_Source_Scree.uasset",
              $exposedBaseColor, $screeBaseColor
            )
            $required += @(0..2 | ForEach-Object { "$checkpointMaterials/MI_Accepted_$_.uasset" })
            $required += @(0..184 | ForEach-Object { "$checkpointEarthworks/T_Cut_$('{0:D3}' -f $_).uasset" })
            foreach ($asset in $required) {
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf) -or (Get-Item -LiteralPath $asset).Length -lt 1024) {
                throw "Accepted scene dependency missing or still an LFS pointer: $asset"
              }
            }
          }
          finally { $env:GIT_LFS_SKIP_SMUDGE = '1' }

      - name: Verify installed exact-version detail API source
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $engine = Resolve-YacsUnrealEngine -ProjectPath (Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject')
          if (-not $engine -or $engine.Version -ne '5.8.2-56702186') { throw 'Native detail requires accepted UE 5.8.2 CL 56702186.' }
          $contracts = @(
            @{ path = 'Engine/Source/Runtime/GeometryCore/Public/DynamicMesh/DynamicMesh3.h'; symbols = @('TriangleIndicesItr', 'VertexIndicesItr', 'GetTriangle', 'GetVertex', 'SetVertex', 'InsertTriangle') },
            @{ path = 'Engine/Source/Runtime/GeometryCore/Public/DynamicMesh/DynamicMeshAttributeSet.h'; symbols = @('EnableMaterialID', 'GetMaterialID', 'PrimaryNormals', 'PrimaryUV', 'IsSameAs') },
            @{ path = 'Engine/Source/Runtime/GeometryCore/Public/DynamicMesh/DynamicMeshTriangleAttribute.h'; symbols = @('SetValue', 'GetValue') },
            @{ path = 'Engine/Source/Runtime/GeometryCore/Public/DynamicMesh/MeshNormals.h'; symbols = @('RecomputeOverlayElementNormals') },
            @{ path = 'Engine/Source/Runtime/GeometryCore/Public/DynamicMesh/DynamicMeshOverlay.h'; symbols = @('GetTriangle', 'GetElement', 'GetParentVertex', 'IsSetTriangle', 'SetTriangle', 'AppendElement') },
            @{ path = 'Engine/Source/Runtime/GeometryFramework/Public/UDynamicMesh.h'; symbols = @('GetMeshRef', 'SetMesh') },
            @{ path = 'Engine/Source/Runtime/GeometryFramework/Public/Components/DynamicMeshComponent.h'; symbols = @('GetDynamicMesh') },
            @{ paths = @('Engine/Source/Runtime/Engine/Public/Materials/Material.h', 'Engine/Source/Runtime/Engine/Classes/Materials/Material.h'); symbols = @('SetShadingModel') },
            @{ path = 'Engine/Source/Editor/MaterialEditor/Public/MaterialEditingLibrary.h'; symbols = @('CreateMaterialExpression', 'ConnectMaterialProperty', 'RecompileMaterial') },
            @{ path = 'Engine/Source/Runtime/Engine/Classes/GameFramework/Actor.h'; symbols = @('K2_SetActorLocation', 'K2_SetActorRotation') },
            @{ path = 'Engine/Source/Runtime/Engine/Classes/Camera/CameraComponent.h'; symbols = @('FieldOfView') },
            @{ path = 'Engine/Source/Runtime/Engine/Classes/Components/PrimitiveComponent.h'; symbols = @('SetCollisionEnabled', 'SetCastShadow') }
          )
          $evidence = @()
          foreach ($contract in $contracts) {
            $candidates = if ($contract.ContainsKey('paths')) { @($contract.paths) } else { @($contract.path) }
            $present = @($candidates | Where-Object { Test-Path -LiteralPath (Join-Path $engine.Root $_) -PathType Leaf })
            if ($present.Count -ne 1) { throw 'Installed detail API source is missing or ambiguous.' }
            $header = $present[0]
            $path = Join-Path $engine.Root $header
            $source = Get-Content -LiteralPath $path -Raw
            foreach ($symbol in $contract.symbols) {
              if ($source -notmatch ('\b' + [regex]::Escape($symbol) + '\b')) { throw "Installed detail API source lacks $symbol" }
            }
            $evidence += [ordered]@{ header = $header; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant(); verified_symbols = $contract.symbols }
          }
          [ordered]@{
            status = 'INSTALLED_PRIMARY_API_SOURCE_VERIFIED'
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            engine_version = $engine.Version
            build_version_sha256 = $engine.BuildVersionSha256
            headers = $evidence
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:YACS_DETAIL_PROOF_ROOT 'native-api-evidence.json') -Encoding UTF8

      - name: Build exact native detail head and run scoped Automation once
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrapReport = Join-Path $env:YACS_DETAIL_PROOF_ROOT 'pcgex-bootstrap.json'
          ./scripts/worldgen/Bootstrap-YacsPcgEx.ps1 -Mode Install -ReportPath $bootstrapReport
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PCGEx dependency bootstrap failed.' }
          $bootstrap = Get-Content -LiteralPath $bootstrapReport -Raw | ConvertFrom-Json
          if ($bootstrap.status -ne 'PASS' -or $bootstrap.actual_commit -ne '39a8f1bdc65b2c4613a1e87b71d93b4576db0a66') {
            throw 'Pinned PCGEx dependency source changed.'
          }
          # Checkout is detached at the verified event SHA; the event branch was checked above.
          ./scripts/ci/Invoke-YacsUnrealCi.ps1 -ExpectedHead $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -ExpectedBranch 'HEAD' -TestFilter 'CyclingSession+CyclingPhysics+CyclingInput+YACS.DetailNative' -ArtifactRoot (Join-Path $env:YACS_DETAIL_PROOF_ROOT 'build-automation')
          if ($LASTEXITCODE -ne 0) { throw 'Exact-head native detail build or scoped Automation failed.' }
          $automation = Get-Content -LiteralPath (Join-Path $env:YACS_DETAIL_PROOF_ROOT 'build-automation/Proof/AutomationReport/index.json') -Raw | ConvertFrom-Json
          $detailTests = @($automation.tests | Where-Object { $_.fullTestPath -like 'YACS.DetailNative.*' })
          if ($detailTests.Count -eq 0 -or @($detailTests | Where-Object { $_.state -notmatch '^(Success|Pass)' }).Count -gt 0) {
            throw 'Native detail Automation tests were absent or did not pass.'
          }

      - name: Capture only the two annotated cameras on native v8
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $project = Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject'
          $engine = Resolve-YacsUnrealEngine -ProjectPath $project
          $script = (Resolve-Path 'scripts/ue/capture_sa_calobra_component230_cliff.py').Path
          $env:YACS_TERRAIN_EROSION_TRIAL = '1'
          $env:YACS_TERRAIN_MESH_TRIAL = '1'
          foreach ($name in @('YACS_CLIFF_PCGEX_MESH', 'YACS_CLIFF_PAIRED_CUSTOM_OUTPUT', 'YACS_SA_CALOBRA_TPP_SURVEY', 'YACS_LANDSCAPE_MESH_DIAGNOSTIC', 'YACS_LOCAL_CLIFF_SMOOTHING')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $stdout = Join-Path $env:YACS_DETAIL_PROOF_ROOT 'native-detail.stdout.log'
          $stderr = Join-Path $env:YACS_DETAIL_PROOF_ROOT 'native-detail.stderr.log'
          $log = Join-Path $env:YACS_DETAIL_PROOF_ROOT 'native-detail.engine.log'
          $arguments = @(
            ('"' + $project + '"'), ('-ExecutePythonScript="' + $script + '"'),
            '-RenderOffscreen', '-Unattended', '-NoPause', '-NoSplash', '-NoSound',
            '-NoP4', '-NoVSync', '-Deterministic', '-ScriptErrorsAreFatal', '-stdout',
            ('-AbsLog="' + $log + '"')
          )
          $process = Start-Process -FilePath $engine.UnrealEditorPath -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(900000)) {
            try { $process | Stop-Process -Force } catch { }
            throw 'Native detail capture timed out.'
          }
          if ($process.ExitCode -ne 0) {
            foreach ($diagnostic in @($stdout, $stderr, $log)) {
              if (Test-Path -LiteralPath $diagnostic -PathType Leaf) { Get-Content -LiteralPath $diagnostic -Tail 160 | Write-Host }
            }
            throw "Native detail capture exited $($process.ExitCode)."
          }
          foreach ($diagnostic in @($stdout, $stderr, $log)) {
            if (-not (Test-Path -LiteralPath $diagnostic -PathType Leaf)) { throw 'Native detail process diagnostics are missing.' }
            $fallback = @(Select-String -LiteralPath $diagnostic -Pattern @(
              'Texture Sample > Missing input texture', 'Default Material will be used',
              "LoadErrors: Error:.*'/Game/Worlds/SaCalobra/Checkpoint",
              "LoadErrors: Error:.*'/Game/Generated/YACS/MaskReview/",
              "LoadErrors: Error:.*'/Game/Generated/YACS/TextureMaterialPrep/"
            ))
            if ($fallback.Count -gt 0) { $fallback | Write-Host; throw 'Native detail detected missing scene dependencies or material fallback.' }
          }
          $parentReceipt = Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_VISUAL_OUTPUT 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json
          if ($parentReceipt.status -ne 'COMPONENT230_CLIFF_VISUAL_PASS' -or $parentReceipt.exact_sha -ne $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -or
              $parentReceipt.map_saved -ne $false -or $parentReceipt.assets_saved -ne $false -or
              $parentReceipt.canonical_landscape_mutation -ne $false -or $parentReceipt.selector_policy_mutation -ne $false -or
              $parentReceipt.terrain_erosion_trial.restored -ne $true -or $parentReceipt.terrain_erosion_trial.source_heightfield_unchanged -ne $true -or
              $parentReceipt.terrain_erosion_trial.terrain_import_performed -ne $false -or $parentReceipt.terrain_erosion_trial.derived_heightfield_modified -ne $false -or
              $parentReceipt.terrain_erosion_trial.mesh_export.shape_profile -ne 'rounded-limestone-reshape-v8') {
            throw 'Native detail parent restoration receipt failed.'
          }

      - name: Verify ten primary frames, visibility and trial restoration
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $verify = @'
          import hashlib, json, math, os, re, struct
          from pathlib import Path, PurePosixPath
          from scripts.proof.retain_sa_calobra_tpp_survey import no_link, read_json
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          def verify_rendered_inputs(bundle, report):
              paths = {"source": ("source/combined-mesh.json", 16 * 1024 * 1024),
                       "mask": ("pilot/triangle-bands.json", 4 * 1024 * 1024),
                       "pilot": ("pilot/manifest.json", 1024 * 1024),
                       "trial": ("treatment/treatment-mesh.json", 16 * 1024 * 1024),
                       "manifest": ("treatment/treatment-manifest.json", 1024 * 1024)}
              payloads, hashes = {}, {}
              for name, (relative, limit) in paths.items():
                  path = bundle / relative
                  no_link(path)
                  require(path.is_file() and 0 < path.stat().st_size <= limit, "Invalid bounded rendered input: " + name)
                  with path.open("rb") as stream:
                      payloads[name] = stream.read(limit + 1)
                  require(0 < len(payloads[name]) <= limit, "Oversized rendered input: " + name)
                  hashes[name] = hashlib.sha256(payloads[name]).hexdigest()
              require(hashes == report.get("inputs_sha256"), "Rendered input hash binding failed")
              manifest = json.loads(payloads["manifest"].decode("utf-8-sig"))
              require(manifest.get("status") == "BOUNDED_DETAIL_TRIAL_PREPARED"
                      and manifest.get("source_mesh_sha256") == hashes["source"]
                      and manifest.get("mask_sha256") == hashes["mask"]
                      and manifest.get("trial_mesh_sha256") == hashes["trial"]
                      and manifest.get("trial_mesh_path") == "treatment-mesh.json", "Treatment manifest payload binding failed")
              native_source = report.get("native_source", {})
              require(native_source.get("source_mesh_sha256") == hashes["source"], "Native source does not match rendered source bytes")
              for key in ("vertex_count", "triangle_count", "protected_face_count", "selected_face_count", "changed_vertex_count"):
                  value, actual = manifest.get(key), native_source.get(key)
                  require(type(value) is int and value > 0 and type(actual) in (int, float)
                          and actual == value, "Native and treatment counts disagree: " + key)
              for list_key, count_key, bound_key in (("selected_face_indices", "selected_face_count", "triangle_count"),
                                                     ("changed_vertex_ids", "changed_vertex_count", "vertex_count")):
                  values = manifest.get(list_key)
                  require(isinstance(values, list) and len(values) == manifest[count_key]
                          and all(type(value) is int and 0 <= value < manifest[bound_key] for value in values)
                          and len(set(values)) == len(values), "Treatment identity count or range failed: " + list_key)
              tolerance = 0.000001
              require(manifest.get("bounds") == {"max_added_displacement_cm": 5.0,
                                                 "max_total_source_displacement_cm": 50.0,
                                                 "floating_point_tolerance_cm": tolerance}, "Treatment displacement bounds changed")
              metrics = (("max_additional_displacement_cm", "max_added_displacement_cm", 5.0),
                         ("max_source_displacement_cm", "max_total_source_displacement_cm", 50.0))
              for native_key, manifest_key, ceiling in metrics:
                  actual, expected = native_source.get(native_key), manifest.get(manifest_key)
                  require(all(type(value) in (int, float) and math.isfinite(value)
                              and 0 <= value <= ceiling + tolerance for value in (actual, expected))
                          and abs(actual - expected) <= tolerance, "Native and treatment displacement evidence failed: " + native_key)
              return dict(inputs_sha256=hashes, selected_face_count=manifest["selected_face_count"],
                          changed_vertex_count=manifest["changed_vertex_count"],
                          max_added_displacement_cm=manifest["max_added_displacement_cm"],
                          max_total_source_displacement_cm=manifest["max_total_source_displacement_cm"])
          root = Path(os.environ["YACS_DETAIL_PROOF_ROOT"])
          native = Path(os.environ["YACS_CLIFF_VISUAL_OUTPUT"]) / "detail-native"
          report = read_json(native / "detail-native-receipt.json")
          require(report.get("status") == "DETAIL_NATIVE_CAPTURE_PASS"
                  and report.get("exact_sha") == os.environ["YACS_CLIFF_VISUAL_EXPECTED_SHA"]
                  and report.get("error") is None, "Exact-head native detail receipt must pass")
          require(report.get("native_source", {}).get("status") == "DETAIL_NATIVE_SOURCE_VERIFIED", "Native v8 geometry and attribute binding must be verified")
          require(report.get("cleanup", {}).get("status") == "RESTORED", "Native mesh material, position and attribute restoration is required")
          rendered_inputs = verify_rendered_inputs(Path(os.environ["YACS_DETAIL_NATIVE"]), report)
          trial = report.get("trial", {})
          require(trial.get("applied") is True
                  and trial.get("visibility_before_trial") == "VISIBLE_IN_CAPTURED_SCENE"
                  and trial.get("witness_receipt_file") == "visibility-witness.json"
                  and re.fullmatch(r"[a-f0-9]{64}", trial.get("witness_receipt_sha256", "")), "Trial must follow its recorded native visibility witness")
          visibility = report.get("visibility", {})
          require(visibility.get("status") == "VISIBLE_IN_CAPTURED_SCENE"
                  and visibility.get("min_required_pixels") == 8, "Native scene visibility gate must retain its admitted threshold")
          ids = ["window-0021-forward-00005", "window-0023-forward-00000"]
          visible = visibility.get("frames", [])
          require(len(visible) == 2 and {row["frame_id"] for row in visible} == set(ids)
                  and any(row["corroborated_pixels"] >= 8 for row in visible), "Trial patch has no corroborated scene pixels at the two fixed poses")
          pilot = read_json(Path(os.environ["YACS_DETAIL_NATIVE"]) / "pilot/manifest.json")
          poses = {row["frame_id"]: row for row in pilot["frames"]}
          modes = ("baseline", "mask", "patch-magenta", "patch-cyan", "trial")
          captures = report.get("captures", [])
          require(len(captures) == 10, "Exactly ten primary frames are required")
          require({(row["frame_id"], row["mode"]) for row in captures} == {(fid, mode) for fid in ids for mode in modes}, "Missing or duplicate native frame/mode")
          witness_path = native / "visibility-witness.json"
          witness = read_json(witness_path)
          require(hashlib.sha256(witness_path.read_bytes()).hexdigest() == trial["witness_receipt_sha256"]
                  and witness.get("exact_sha") == report["exact_sha"]
                  and witness.get("status") == "VISIBLE_IN_CAPTURED_SCENE"
                  and witness.get("trial_applied") is False
                  and witness.get("inputs_sha256") == report.get("inputs_sha256")
                  and witness.get("visibility") == visibility
                  and witness.get("paired_captures") == [row for row in captures if row["mode"] in ("patch-magenta", "patch-cyan")],
                  "Pre-treatment visibility witness hash or paired capture binding failed")
          mapping_name = report["native_source"].get("source_row_map_file")
          require(mapping_name == "source-row-native-triangle-map.json", "Missing explicit source-row to native-triangle mapping")
          mapping_path = native / mapping_name
          mapping = read_json(mapping_path)
          require(hashlib.sha256(mapping_path.read_bytes()).hexdigest() == report["native_source"]["source_row_map_sha256"]
                  and len(mapping) == 58216 and len(set(mapping)) == 58216
                  and all(type(index) is int and index >= 0 for index in mapping), "Native triangle identity mapping failed")
          by_key = {(row["frame_id"], row["mode"]): row for row in captures}
          for row in visible:
              pixels_name = row["frame_id"] + "-visible-pixels.json"
              require(row.get("pixel_indices_file") == pixels_name
                      and row.get("pair_pose_and_view_identical") is True
                      and row["magenta_sha256"] == by_key[row["frame_id"], "patch-magenta"]["sha256"]
                      and row["cyan_sha256"] == by_key[row["frame_id"], "patch-cyan"]["sha256"], "Pixel witness is not bound to its captured pair")
              pixels_path = native / pixels_name
              pixels = read_json(pixels_path)
              require(hashlib.sha256(pixels_path.read_bytes()).hexdigest() == row["pixel_indices_sha256"]
                      and len(pixels) == row["corroborated_pixels"] and len(set(pixels)) == len(pixels)
                      and len(pixels) <= row["projected_candidate_pixels"]
                      and all(type(index) is int and 0 <= index < 1280 * 720 for index in pixels), "Native pixel witness inventory failed")
          files, inventory = set(), []
          def same_vector(actual, expected):
              return len(actual) == 3 and all(math.isfinite(float(a)) and abs(float(a) - float(b)) <= 0.001 for a, b in zip(actual, expected))
          for row in captures:
              name = row["file"]
              path = PurePosixPath(name)
              require(path.parts[:1] == ("frames",) and len(path.parts) == 2
                      and path.suffix == ".png" and "\\" not in name and ":" not in name
                      and name not in files, "Unsafe or duplicate primary frame path")
              files.add(name)
              image = native / name
              no_link(image)
              require(image.is_file() and 0 < image.stat().st_size < 32 * 1024 * 1024, "Invalid bounded native PNG")
              data = image.read_bytes()
              require(hashlib.sha256(data).hexdigest() == row["sha256"], "Native frame hash mismatch")
              require(data[:8] == b"\x89PNG\r\n\x1a\n" and struct.unpack(">II", data[16:24]) == (1280, 720)
                      and (row["width_px"], row["height_px"]) == (1280, 720), "Native frame dimensions mismatch")
              pose = poses[row["frame_id"]]
              require(same_vector(row["camera_location_cm"], pose["camera"])
                      and same_vector(row["target_cm"], pose["target"])
                      and abs(row["fov_deg"] - pose["fov"]) <= 0.000001, "Native camera drifted from its captured pose")
              readiness = row["readiness"]
              readiness_name = "readiness/" + row["frame_id"] + "-" + row["mode"] + "/capture-readiness.json"
              require(readiness.get("status") == "NATIVE_LOADING_AND_MIPS_READY"
                      and readiness.get("file") == readiness_name, "Missing native camera loading and mip readiness")
              readiness_path = native / readiness_name
              ready = read_json(readiness_path)
              require(hashlib.sha256(readiness_path.read_bytes()).hexdigest() == readiness["sha256"]
                      and ready.get("status") == "NATIVE_LOADING_AND_MIPS_READY"
                      and ready.get("native_loading_barrier_completed") is True
                      and ready.get("saved_to_map") is False and ready.get("height_edits_applied") is False,
                      "Native loading receipt hash or preservation contract failed")
              inventory.append(dict(file=name, sha256=row["sha256"], size_bytes=len(data), frame_id=row["frame_id"], mode=row["mode"]))
          require({p.relative_to(native).as_posix() for p in (native / "frames").iterdir()} == files, "Unlisted primary frame output")
          receipt = dict(status="NATIVE_DETAIL_EVIDENCE_VERIFIED", exact_sha=report["exact_sha"],
                         primary_frame_count=10, frames=inventory, source_verification="checkout-restoration.json",
                         rendered_inputs=rendered_inputs,
                         performance_acceptance="NOT_MEASURED", visual_acceptance="PENDING_OWNER")
          (root / "native-proof-verification.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          '@
          $verify | python -
          if ($LASTEXITCODE -ne 0) { throw 'Native detail frame, visibility, camera or restoration verification failed.' }

      - name: Verify retained source and checkout are unchanged
        if: ${{ always() && env.YACS_DETAIL_PROOF_ROOT != '' }}
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect detail proof checkout.' }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:YACS_CLIFF_VISUAL_EXPECTED_SHA) { throw 'Native detail checkout HEAD drifted.' }
          $sourceReceiptPath = Join-Path $env:YACS_DETAIL_PROOF_ROOT 'source-input-verification.json'
          $sourceVerified = $false
          if (Test-Path -LiteralPath $sourceReceiptPath -PathType Leaf) {
            $binding = Get-Content -LiteralPath $sourceReceiptPath -Raw | ConvertFrom-Json
            foreach ($file in $binding.source_files) {
              $path = Join-Path $binding.source_root $file.path
              if ((Get-Item -LiteralPath $path).Length -ne $file.size_bytes -or
                  (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.sha256) {
                throw 'Immutable source evidence changed during native detail proof.'
              }
            }
            $sourceVerified = $true
          }
          [ordered]@{
            schema_version = 1
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            status = $(if ($tracked.Count -eq 0 -and $sourceVerified) { 'PASS' } else { 'FAIL' })
            tracked_changes = $tracked
            retained_source_unchanged = $sourceVerified
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:YACS_DETAIL_PROOF_ROOT 'checkout-restoration.json') -Encoding UTF8
          if ($tracked.Count -gt 0) { throw "Native detail mutated tracked files: $($tracked -join '; ')" }
          if (-not $sourceVerified) { throw 'Native detail retained source binding was never verified.' }

      - name: Upload compact native detail frames and proof receipts
        if: ${{ always() && env.YACS_DETAIL_PROOF_ROOT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: component230-detail-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/capture/detail-native/frames/
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/capture/detail-native/*.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/capture/detail-native/readiness/**/capture-readiness.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/capture/component230-cliff-visual-receipt.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/input/treatment/
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/input/pilot/triangle-bands.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/input/pilot/manifest.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/source-input-verification.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/native-api-evidence.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/native-proof-verification.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/checkout-restoration.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/pcgex-bootstrap.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/native-detail.*.log
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/build-automation/unreal_ci_summary.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/build-automation/failure_context.txt
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/build-automation/Proof/summary.json
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/build-automation/Proof/build_editor.log
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/build-automation/Proof/automation_run.log
            ${{ env.YACS_DETAIL_PROOF_ROOT }}/build-automation/Proof/AutomationReport/index.json
          if-no-files-found: error
          retention-days: 90

  phase2c:
    if: >-
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[wholemap-material]')) &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[detail-native]')) &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[detail-pilot]')) &&
      !(github.event_name == 'workflow_dispatch' && inputs.tpp_survey) &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[tpp-survey]')) &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[tpp-retain]')) &&
      !(github.event_name == 'push' && contains(github.event.head_commit.message, '[tpp-docs]'))
    name: PCGEx topology + custom A/B + 8-of-10 gates
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 30

    steps:
      - name: Isolate Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'component230-pcgex.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable long paths.' }

      - name: Checkout exact Phase 2C revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _phase2c-pcgex-cliff
          fetch-depth: 1
          lfs: false
          clean: false
          persist-credentials: false

      - name: Verify exact SHA and idle Unreal host
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "checkout HEAD '$actual' != event SHA '$env:GITHUB_SHA'"
          }
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') {
            throw "Shared Unreal host is already owned; status=$($state.status)."
          }
          "YACS_CLIFF_VISUAL_EXPECTED_SHA=$actual" >> $env:GITHUB_ENV

      - name: Install pinned GIS and image dependencies
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 rasterio==1.5.2 shapely==2.1.2 pillow==12.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C dependency install failed.' }

      - name: Materialize accepted map and complete limestone PBR dependency set
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_LFS_SKIP_SMUDGE = '0'
          try {
            New-Item -ItemType Directory -Force -Path $env:YACS_LFS_CACHE_ROOT | Out-Null
            git lfs install --local --skip-smudge
            if ($LASTEXITCODE -ne 0) { throw 'Local LFS setup failed.' }
            git config --local lfs.storage $env:YACS_LFS_CACHE_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'Persistent LFS storage configuration failed.' }

            $map = 'Content/Worlds/SaCalobra/L_SaCalobraAccepted_20261004.umap'
            $checkpointMaterials = 'Content/Worlds/SaCalobra/CheckpointMaterials'
            $checkpointEarthworks = 'Content/Worlds/SaCalobra/CheckpointEarthworks'
            $landscapeMaterial = 'Content/Generated/YACS/MaskReview/M_MaskReview_1.uasset'
            $landscapeTexture = 'Content/Generated/YACS/MaskReview/T_MaskReview_1.uasset'
            $library = 'Content/Generated/YACS/TextureMaterialPrep/Libraries/3d53743e48394f31beb35e4030dc8a87'
            $exposedBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/C414EA4B402723D66FCB689E49EEB02D/BaseColor.uasset'
            $screeBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/94406E0247C9822CFD006CAB8B20545E/BaseColor.uasset'
            $include = "$map,$checkpointMaterials/**,$checkpointEarthworks/**,$landscapeMaterial,$landscapeTexture,$library/**,$exposedBaseColor,$screeBaseColor"
            git lfs pull --include=$include --exclude=''
            if ($LASTEXITCODE -ne 0) { throw 'Accepted map / limestone transitive LFS pull failed.' }
            git lfs checkout $map $checkpointMaterials $checkpointEarthworks $landscapeMaterial $landscapeTexture $library $exposedBaseColor $screeBaseColor
            if ($LASTEXITCODE -ne 0) { throw 'Accepted map / limestone transitive LFS checkout failed.' }

            if (-not (Test-Path -LiteralPath $map -PathType Leaf)) {
              throw 'Accepted Sa Calobra map is missing after LFS checkout.'
            }
            if ((Get-Item -LiteralPath $map).Length -lt 100000000) {
              throw 'Accepted Sa Calobra map still looks like an LFS pointer.'
            }

            $required = @(
              $landscapeMaterial,
              $landscapeTexture,
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_ExposedRock.uasset",
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_Scree.uasset",
              "$library/ProviderData/ExposedRock/T_Height.uasset",
              "$library/ProviderData/ExposedRock/T_Normal.uasset",
              "$library/ProviderData/ExposedRock/T_Roughness.uasset",
              "$library/ProviderData/Scree/T_Height.uasset",
              "$library/ProviderData/Scree/T_Normal.uasset",
              "$library/ProviderData/Scree/T_Roughness.uasset",
              "$library/Sources/T_Source_ExposedRock.uasset",
              "$library/Sources/T_Source_Scree.uasset",
              $exposedBaseColor,
              $screeBaseColor
            )
            $required += @(0..2 | ForEach-Object { "$checkpointMaterials/MI_Accepted_$_.uasset" })
            $required += @(0..184 | ForEach-Object { "$checkpointEarthworks/T_Cut_$('{0:D3}' -f $_).uasset" })
            foreach ($asset in $required) {
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                throw "Required scene proof asset missing: $asset"
              }
              if ((Get-Item -LiteralPath $asset).Length -lt 1024) {
                throw "Required scene proof asset is still an LFS pointer: $asset"
              }
            }
          }
          finally {
            $env:GIT_LFS_SKIP_SMUDGE = '1'
          }

      - name: Resolve frozen inputs and isolated evidence roots
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $worldRoot = Join-Path $env:RUNNER_WORKSPACE '_yacs-world-data\sa-calobra-working-v1'
          $normalized = Join-Path $worldRoot 'normalized-context-v1a-2026-10-04\manifest.json'
          $pcg = Join-Path $worldRoot 'pcg-masks-v1-2026-10-04\pcg-mask-manifest.json'
          $context = Join-Path $worldRoot 'context-exclusions-v2-2026-10-04\context-mask-manifest.json'
          foreach ($path in @($normalized, $pcg, $context)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required frozen Phase 2C input missing: $path"
            }
          }

          $rootOut = Join-Path $env:RUNNER_TEMP "component230-pcgex-$env:GITHUB_SHA"
          Remove-Item -LiteralPath $rootOut -Recurse -Force -ErrorAction SilentlyContinue
          $planRoot = Join-Path $rootOut 'plan'
          $topologyRoot = Join-Path $rootOut 'topology'
          $customRoot = Join-Path $rootOut 'custom'
          $pcgexRoot = Join-Path $rootOut 'pcgex'
          New-Item -ItemType Directory -Force -Path $rootOut | Out-Null

          "YACS_CLIFF_NORMALIZED=$normalized" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCG=$pcg" >> $env:GITHUB_ENV
          "YACS_CLIFF_CONTEXT=$context" >> $env:GITHUB_ENV
          "YACS_CLIFF_PHASE2C_ROOT=$rootOut" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_PLAN_ROOT=$planRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_PLAN=$(Join-Path $planRoot 'component230-cliff-visual-plan.json')" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_PROOF_ROOT=$topologyRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_CUSTOM_OUTPUT=$customRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_OUTPUT=$pcgexRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_MESH=$(Join-Path $topologyRoot 'phase2c-pcgex-cliff-a.json')" >> $env:GITHUB_ENV

      - name: Prepare unchanged YACS classifier and narrow hard policy
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/assets/prepare_sa_calobra_component230_cliff_visual.py scripts/assets/analyze_sa_calobra_component230_cliff_visual.py scripts/assets/analyze_sa_calobra_component230_pcgex_topology.py scripts/ue/capture_sa_calobra_component230_cliff.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C Python compile failed.' }

          python -m unittest scripts.assets.test_sa_calobra_component230_cliff_visual scripts.assets.test_analyze_sa_calobra_component230_pcgex_topology scripts.assets.test_analyze_local_cliff_smoothing scripts.assets.test_analyze_limestone_edge_rounding scripts.assets.test_gate_component230_combined scripts.assets.test_component230_review_cameras -v
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C cliff plan/topology audit tests failed.' }

          python scripts/assets/prepare_sa_calobra_component230_cliff_visual.py --normalized-manifest $env:YACS_CLIFF_NORMALIZED --pcg-manifest $env:YACS_CLIFF_PCG --context-manifest $env:YACS_CLIFF_CONTEXT --output $env:YACS_CLIFF_VISUAL_PLAN_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C cliff plan preparation failed.' }

          $plan = Get-Content -LiteralPath $env:YACS_CLIFF_VISUAL_PLAN -Raw | ConvertFrom-Json
          if (
            $plan.status -ne 'COMPONENT230_CLIFF_VISUAL_PLAN' -or
            $plan.geometry_mutation -ne $false -or
            $plan.canonical_landscape_mutation -ne $false -or
            $plan.selector_policy_mutation -ne $false -or
            [int]$plan.counts.component_cliff_cells -ne 2611 -or
            [int]$plan.counts.component_scree_cells -ne 1237 -or
            [int]$plan.counts.skin_cell_count -ne 1017 -or
            [int]$plan.counts.skin_cluster_count -ne 14
          ) {
            throw 'Phase 2C input/reference contract drifted.'
          }

      - name: Prove deterministic PCGEx topology at exact HEAD
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/ue/Invoke-YacsSaCalobraPcgExCliff.ps1 -ExpectedBranch $env:GITHUB_REF_NAME -ExpectedHead $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -PlanPath $env:YACS_CLIFF_VISUAL_PLAN -ArtifactRoot $env:YACS_CLIFF_PCGEX_PROOF_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2C topology proof failed.' }

          $proof = Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PCGEX_PROOF_ROOT 'phase2c-pcgex-topology-proof.json') -Raw | ConvertFrom-Json
          if (
            $proof.status -ne 'PASS' -or
            $proof.repository_head -ne $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -or
            [int]$proof.determinism.independent_runs -ne 2 -or
            [double]$proof.generator.max_edge_cm_after -gt 157.5 -or
            [int]$proof.generator.triangle_count -gt 120000
          ) {
            throw 'Phase 2C topology proof receipt contract failed.'
          }
          $proof | ConvertTo-Json -Depth 10 | Write-Host

          $topologyAudit = Join-Path $env:YACS_CLIFF_PCGEX_PROOF_ROOT 'phase2c-pcgex-topology-audit.json'
          python scripts/assets/analyze_sa_calobra_component230_pcgex_topology.py --plan $env:YACS_CLIFF_VISUAL_PLAN --mesh $env:YACS_CLIFF_PCGEX_MESH --output $topologyAudit --min-area-retention 0.90
          if ($LASTEXITCODE -ne 0) { throw 'Independent Phase 2C topology authority audit failed.' }
          $audit = Get-Content -LiteralPath $topologyAudit -Raw | ConvertFrom-Json
          if (
            $audit.status -ne 'PASS' -or
            [int]$audit.source.semantic_cluster_count -ne 14 -or
            [int]$audit.mesh.connected_components -ne [int]$audit.gate.expected_connected_components -or
            [int]$audit.mesh.outside_vertices -ne 0 -or
            [int]$audit.mesh.outside_triangle_centroids -ne 0 -or
            [int]$audit.mesh.nonmanifold_edges -ne 0 -or
            [int]$audit.mesh.degenerate_triangles -ne 0 -or
            [double]$audit.mesh.area_retention -lt 0.90 -or
            [double]$audit.mesh.area_retention -gt 1.001
          ) {
            throw 'Independent Phase 2C topology audit receipt contract failed.'
          }
          $audit | ConvertTo-Json -Depth 10 | Write-Host

      - name: Capture custom benchmark A and PCGEx candidate B
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $project = Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject'
          $engine = Resolve-YacsUnrealEngine -ProjectPath $project
          $script = (Resolve-Path 'scripts/ue/capture_sa_calobra_component230_cliff.py').Path

          function Invoke-CliffCapture {
            param(
              [Parameter(Mandatory=$true)] [string] $Label,
              [Parameter(Mandatory=$true)] [string] $Output,
              [Parameter(Mandatory=$true)] [bool] $UsePcgEx
            )

            New-Item -ItemType Directory -Force -Path $Output | Out-Null
            $env:YACS_CLIFF_VISUAL_OUTPUT = $Output
            if ($UsePcgEx) {
              if (-not (Test-Path -LiteralPath $env:YACS_CLIFF_PCGEX_MESH -PathType Leaf)) {
                throw 'PCGEx mesh receipt is missing before candidate render.'
              }
            }
            else {
              Remove-Item Env:YACS_CLIFF_PCGEX_MESH -ErrorAction SilentlyContinue
            }

            $stdout = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.stdout.log"
            $stderr = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.stderr.log"
            $log = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.engine.log"
            $arguments = @(
              ('"' + $project + '"'),
              ('-ExecutePythonScript="' + $script + '"'),
              '-RenderOffscreen',
              '-Unattended',
              '-NoPause',
              '-NoSplash',
              '-NoSound',
              '-NoP4',
              '-NoVSync',
              '-Deterministic',
              '-ScriptErrorsAreFatal',
              '-stdout',
              ('-AbsLog="' + $log + '"')
            )
            $started = Get-Date
            $process = Start-Process -FilePath $engine.UnrealEditorPath -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(480000)) {
              try { $process | Stop-Process -Force } catch { }
              throw "$Label cliff capture timed out."
            }
            $seconds = ((Get-Date) - $started).TotalSeconds
            if ($process.ExitCode -ne 0) {
              foreach ($diagnostic in @($stdout, $stderr, $log)) {
                if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                  Write-Host "===== TAIL $diagnostic ====="
                  Get-Content -LiteralPath $diagnostic -Tail 240 | Write-Host
                }
              }
              throw "$Label cliff capture exited $($process.ExitCode)."
            }

            $materialFallback = @()
            foreach ($diagnostic in @($stdout, $stderr, $log)) {
              if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                $materialFallback += @(
                  Select-String -LiteralPath $diagnostic -SimpleMatch -Pattern @(
                    'Texture Sample > Missing input texture',
                    'Default Material will be used'
                  ) -ErrorAction SilentlyContinue
                )
                $materialFallback += @(
                  Select-String -LiteralPath $diagnostic -Pattern @(
                    "LoadErrors: Error:.*'/Game/Worlds/SaCalobra/Checkpoint",
                    "LoadErrors: Error:.*'/Game/Generated/YACS/MaskReview/",
                    "LoadErrors: Error:.*'/Game/Generated/YACS/TextureMaterialPrep/"
                  ) -ErrorAction SilentlyContinue
                )
              }
            }
            if ($materialFallback.Count -gt 0) {
              $materialFallback | ForEach-Object {
                "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
              } | Write-Host
              throw "$Label material proof detected missing texture or Default Material fallback."
            }

            Assert-CliffCapture -Label $Label -Output $Output -UsePcgEx $UsePcgEx -Seconds $seconds
          }

          function Assert-CliffCapture {
            param([string] $Label, [string] $Output, [bool] $UsePcgEx, [double] $Seconds)
            $receiptPath = Join-Path $Output 'component230-cliff-visual-receipt.json'
            if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
              throw "$Label visual receipt is missing."
            }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if (
              $receipt.status -ne 'COMPONENT230_CLIFF_VISUAL_PASS' -or
              $receipt.exact_sha -ne $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -or
              $receipt.map_saved -ne $false -or
              $receipt.assets_saved -ne $false -or
              $receipt.canonical_landscape_mutation -ne $false -or
              $receipt.selector_policy_mutation -ne $false -or
              $receipt.landscape_presentation_material.enabled -ne $true -or
              $receipt.landscape_presentation_material.restored -ne $true -or
              $receipt.landscape_presentation_material.component -ne 'LandscapeComponent_230' -or
              $receipt.landscape_presentation_material.material -ne '/Engine/BasicShapes/BasicShapeMaterial.BasicShapeMaterial' -or
              [int]@($receipt.captures).Count -ne 4 -or
              [bool]$receipt.mesh.collision_enabled -ne $false -or
              [bool]$receipt.mesh.cast_dynamic_shadows -ne $true
            ) {
              throw "$Label visual receipt contract failed."
            }
            if ($env:YACS_TERRAIN_MESH_TRIAL -eq '1') {
              $edge = $receipt.terrain_erosion_trial
              if (
                $receipt.mesh.generator -ne 'native-source-rock-reshape' -or
                $edge.edge_only_mesh -ne $false -or
                $edge.reshaped_rock_mesh -ne $true -or
                $edge.reference_source -ne 'original-before-reshaping' -or
                $edge.terrain_import_performed -ne $false -or
                $edge.native_landscape -ne $false -or
                $edge.derived_heightfield_modified -ne $false -or
                $edge.erosion.enabled -ne $false -or
                $edge.source_heightfield_unchanged -ne $true -or
                $edge.restored -ne $true -or
                $edge.combined_audit.status -ne 'PASS' -or
                $edge.combined_audit.displacement_limit_cm -ne 50 -or
                $edge.combined_audit.max_displacement_cm -gt 50.000001 -or
                $edge.combined_audit.folded_xy_triangles -ne 0 -or
                $edge.mesh_export.shape_profile -ne 'rounded-limestone-reshape-v8' -or
                $edge.mesh_export.locked_vertex_displacement_cm -ne 0 -or
                $edge.mesh_export.locked_normal_max_delta -ne 0
              ) { throw 'Bounded limestone rock reshaping receipt failed.' }
            }
            elseif ($env:YACS_TERRAIN_EROSION_TRIAL -eq '1') {
              if (
                $receipt.mesh.generator -ne 'native-landscape-thermal-erosion' -or
                $receipt.terrain_erosion_trial.native_landscape -ne $true -or
                $receipt.terrain_erosion_trial.imported_heightfield_matches -ne $true -or
                $receipt.terrain_erosion_trial.derived_heightfield_modified -ne $true -or
                $receipt.terrain_erosion_trial.source_heightfield_unchanged -ne $true -or
                $receipt.terrain_erosion_trial.restored -ne $true -or
                $receipt.terrain_erosion_trial.erosion.max_abs_change_cm -gt 150 -or
                $receipt.terrain_erosion_trial.erosion.fixed_samples_changed -ne 0 -or
                $receipt.terrain_erosion_trial.erosion.height_sum_delta_units -ne 0
              ) { throw 'Native terrain erosion trial receipt failed.' }
            }
            elseif ($env:YACS_LANDSCAPE_MESH_DIAGNOSTIC -eq '1') {
              if (
                $receipt.mesh.generator -ne 'native-landscape-export' -or
                $receipt.landscape_mesh_diagnostic.restored -ne $true -or
                $receipt.landscape_mesh_diagnostic.pcgex_overlay -ne $false -or
                $receipt.mesh.material.cliff -ne $receipt.landscape_presentation_material.material -or
                $receipt.landscape_mesh_diagnostic.export.max_conversion_error_cm -gt 0.001
              ) { throw 'Native Landscape mesh diagnostic receipt failed.' }
            }
            elseif ($UsePcgEx) {
              if (
                $receipt.mesh.generator -ne 'pcgex-clipper2' -or
                $receipt.mesh.pcgex_topology.max_xy_shift_cm -ne 0.0 -or
                [int]$receipt.mesh.pcgex_topology.interior_vertices -le 0 -or
                [double]$receipt.mesh.pcgex_topology.max_edge_cm_after -gt 157.5 -or
                [int]$receipt.mesh.pcgex_topology.pcgex_triangle_count -gt 120000
              ) {
                throw 'PCGEx visual topology density/performance contract failed.'
              }
            }
            elseif ($receipt.mesh.generator -ne 'yacs-connected-skin') {
              throw 'Custom benchmark generator identity drifted.'
            }

            [ordered]@{
              label = $Label
              seconds = if ($Label -eq 'custom' -and $env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT) { $null } else { [math]::Round([double]$seconds, 3) }
              timing_scope = if ($env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT) { 'shared A/B editor session; no per-candidate timing claim' } else { 'editor process' }
              generator = [string]$receipt.mesh.generator
              cliff_triangles = [int]$receipt.mesh.cliff.triangles
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $Output 'capture-performance.json') -Encoding UTF8
          }

          # Owner-approved replacement diagnostic runs before existing A/B proofs.
          $env:YACS_LANDSCAPE_MESH_DIAGNOSTIC = '1'
          try {
            $terrainRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'landscape-mesh'
            $env:YACS_EDGE_GEOMETRY_PREFLIGHT = '1'
            try {
              Invoke-CliffCapture -Label 'landscape-mesh' -Output $terrainRoot -UsePcgEx $false
            }
            finally {
              Remove-Item Env:YACS_EDGE_GEOMETRY_PREFLIGHT -ErrorAction SilentlyContinue
            }
            $env:YACS_LOCAL_CLIFF_SMOOTHING = '1'
            try {
              $localRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'local-cliff-smoothing'
              Invoke-CliffCapture -Label 'local-cliff-smoothing' -Output $localRoot -UsePcgEx $false
              python scripts/assets/analyze_local_cliff_smoothing.py --plan $env:YACS_CLIFF_VISUAL_PLAN --mesh (Join-Path $localRoot 'local-cliff-smoothing-mesh.json') --output (Join-Path $localRoot 'local-cliff-smoothing-audit.json')
              if ($LASTEXITCODE -ne 0) { throw 'Independent local smoothing audit failed.' }
              $local = Get-Content -LiteralPath (Join-Path $localRoot 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json
              if (
                $local.landscape_mesh_diagnostic.export.local_smoothing -ne $true -or
                $local.landscape_mesh_diagnostic.export.folded_xy_triangles -ne 0 -or
                $local.landscape_mesh_diagnostic.export.locked_vertex_displacement_cm -ne 0 -or
                $local.landscape_mesh_diagnostic.export.displacement_limit_cm -ne 100 -or
                $local.landscape_mesh_diagnostic.export.max_displacement_cm -gt 100.000001
              ) { throw 'Local cliff smoothing bounds failed.' }
            }
            finally {
              Remove-Item Env:YACS_LOCAL_CLIFF_SMOOTHING -ErrorAction SilentlyContinue
            }
          }
          finally {
            Remove-Item Env:YACS_LANDSCAPE_MESH_DIAGNOSTIC -ErrorAction SilentlyContinue
          }

          $env:YACS_TERRAIN_EROSION_TRIAL = '1'
          try {
            python -m unittest scripts.geometry.test_local_thermal_erosion -v
            if ($LASTEXITCODE -ne 0) { throw 'Thermal erosion tests failed.' }
            $erosionRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion'
            Invoke-CliffCapture -Label 'terrain-erosion' -Output $erosionRoot -UsePcgEx $false
            $env:YACS_TERRAIN_MESH_TRIAL = '1'
            $env:YACS_TERRAIN_ORIGINAL_MESH = Join-Path $localRoot 'local-cliff-smoothing-mesh.json'
            $combinedRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion-mesh'
            Invoke-CliffCapture -Label 'terrain-erosion-mesh' -Output $combinedRoot -UsePcgEx $false
          }
          finally {
            Remove-Item Env:YACS_TERRAIN_EROSION_TRIAL -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_MESH_TRIAL -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_ORIGINAL_MESH -ErrorAction SilentlyContinue
          }

          $env:YACS_CLIFF_PCGEX_MESH = Join-Path $env:YACS_CLIFF_PCGEX_PROOF_ROOT 'phase2c-pcgex-cliff-a.json'
          $env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT = $env:YACS_CLIFF_CUSTOM_OUTPUT
          try {
            Invoke-CliffCapture -Label 'paired' -Output $env:YACS_CLIFF_PCGEX_OUTPUT -UsePcgEx $true
            Assert-CliffCapture -Label 'custom' -Output $env:YACS_CLIFF_CUSTOM_OUTPUT -UsePcgEx $false -Seconds 0
          }
          finally {
            Remove-Item Env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT -ErrorAction SilentlyContinue
          }

          # Additional owner-requested diagnostic; original A/B inputs stay intact.
          $env:YACS_CLIFF_MATCH_LANDSCAPE_MATERIAL = '1'
          try {
            $sameRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'same-material'
            Invoke-CliffCapture -Label 'same-material' -Output $sameRoot -UsePcgEx $true
            $same = Get-Content -LiteralPath (Join-Path $sameRoot 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json
            if (
              $same.mesh.material.matches_landscape -ne $true -or
              $same.mesh.material.diagnostic_only -ne $true -or
              $same.mesh.material.cliff -ne $same.landscape_presentation_material.material
            ) {
              throw 'Same-material diagnostic did not use the Landscape material.'
            }
          }
          finally {
            Remove-Item Env:YACS_CLIFF_MATCH_LANDSCAPE_MATERIAL -ErrorAction SilentlyContinue
          }

      - name: Measure A/B and enforce 8-of-10 lighting gate
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/assets/analyze_sa_calobra_component230_cliff_visual.py --root $env:YACS_CLIFF_CUSTOM_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Custom benchmark metric analysis failed.' }
          python scripts/assets/analyze_sa_calobra_component230_cliff_visual.py --root $env:YACS_CLIFF_PCGEX_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'PCGEx metric analysis failed.' }

          $custom = Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_CUSTOM_OUTPUT 'component230-cliff-metrics.json') -Raw | ConvertFrom-Json
          $pcgex = Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PCGEX_OUTPUT 'component230-cliff-metrics.json') -Raw | ConvertFrom-Json

          if (
            $custom.metrics.baseline_lit.sha256 -ne $pcgex.metrics.baseline_lit.sha256 -or
            $custom.metrics.baseline_lighting_only.sha256 -ne $pcgex.metrics.baseline_lighting_only.sha256
          ) {
            throw 'Custom and PCGEx captures do not share an identical baseline.'
          }

          $a = (Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_CUSTOM_OUTPUT 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json).capture_protocol.shared_baseline
          $b = (Get-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PCGEX_OUTPUT 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json).capture_protocol.shared_baseline
          if (
            $a.enabled -ne $true -or $b.enabled -ne $true -or
            [string]::IsNullOrWhiteSpace($a.acquisition_id) -or
            $a.acquisition_id -ne $b.acquisition_id -or
            $a.protocol -ne 'single-scene-baseline-custom-pcgex-v1' -or
            $a.protocol -ne $b.protocol -or
            $a.custom_removed_before_pcgex -ne $true -or
            $b.custom_removed_before_pcgex -ne $true
          ) { throw 'A/B shared-baseline acquisition provenance failed.' }

          $failures = @()
          foreach ($threshold in @('0.05','0.10','0.15')) {
            $base = $pcgex.metrics.baseline_lighting_only.thresholds.$threshold
            $customCandidate = $custom.metrics.candidate_lighting_only.thresholds.$threshold
            $pcgexCandidate = $pcgex.metrics.candidate_lighting_only.thresholds.$threshold

            if ([int]$pcgexCandidate.pixels -gt [int]$base.pixels) {
              $failures += "$threshold PCGEx dark pixels exceed baseline: $($pcgexCandidate.pixels) > $($base.pixels)"
            }
            if ([int]$pcgexCandidate.largest_region_pixels -gt [int]$base.largest_region_pixels) {
              $failures += "$threshold PCGEx largest dark region exceeds baseline: $($pcgexCandidate.largest_region_pixels) > $($base.largest_region_pixels)"
            }
            if ([int]$pcgexCandidate.pixels -gt [int]$customCandidate.pixels) {
              $failures += "$threshold PCGEx dark pixels do not beat custom A: $($pcgexCandidate.pixels) > $($customCandidate.pixels)"
            }
            if ([int]$pcgexCandidate.largest_region_pixels -gt [int]$customCandidate.largest_region_pixels) {
              $failures += "$threshold PCGEx largest dark region does not beat custom A: $($pcgexCandidate.largest_region_pixels) > $($customCandidate.largest_region_pixels)"
            }
          }

          $ab = [ordered]@{
            schema_version = 1
            status = $(if ($failures.Count -eq 0) { 'PASS' } else { 'FAIL' })
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            baseline_identical = $true
            custom = $custom.lighting_only_deltas
            pcgex = $pcgex.lighting_only_deltas
            failures = $failures
          }
          $abPath = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'phase2c-ab-gate.json'
          $ab | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $abPath -Encoding UTF8
          $ab | ConvertTo-Json -Depth 10 | Write-Host
          if ($failures.Count -gt 0) {
            throw 'Phase 2C PCGEx candidate did not satisfy the lighting/custom-generator admission gate.'
          }

      - name: Measure combined limestone independently of PCGEx admission
        if: ${{ always() && env.YACS_CLIFF_PHASE2C_ROOT != '' }}
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion-mesh'
          python scripts/assets/analyze_sa_calobra_component230_cliff_visual.py --root $root
          if ($LASTEXITCODE -ne 0) { throw 'Combined neutral fixture analysis failed.' }
          python scripts/assets/gate_component230_combined.py --root $root --expected-sha $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Combined limestone technical admission failed.' }

      - name: Enforce non-persistent checkout
        if: ${{ always() && env.YACS_CLIFF_PHASE2C_ROOT != '' }}
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect proof checkout.' }
          [ordered]@{
            schema_version = 1
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            status = $(if ($tracked.Count -eq 0) { 'PASS' } else { 'FAIL' })
            tracked_changes = $tracked
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'checkout-restoration.json') -Encoding UTF8
          if ($tracked.Count -gt 0) {
            throw "Phase 2C proof mutated tracked files: $($tracked -join '; ')"
          }

      - name: Upload Phase 2C evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sa-calobra-component230-pcgex-cliff
          path: |
            ${{ runner.temp }}/component230-pcgex-${{ github.sha }}/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90

  bidirectional-survey:
    name: Frozen-road bidirectional TPP survey (accepted v8)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.tpp_survey) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[tpp-survey]') &&
       !contains(github.event.head_commit.message, '[wholemap-material]') &&
       !contains(github.event.head_commit.message, '[detail-native]'))
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 120

    steps:
      - name: Isolate Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'component230-tpp.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable long paths.' }

      - name: Checkout exact survey revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _phase2c-pcgex-cliff
          fetch-depth: 0
          lfs: false
          clean: false
          persist-credentials: false

      - name: Verify owner, exact SHA and idle Unreal host
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTOR -ne 'karnalooch' -or $env:GITHUB_REPOSITORY -ne 'karnalooch/YetAnotherCyclingSim') {
            throw 'The fixed survey intent is restricted to the repository owner.'
          }
          if ($env:GITHUB_REF_NAME -ne 'feat/phase2c-pcgex-cliff-topology') {
            throw 'Survey must use the existing reviewed Component 230 branch.'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "checkout HEAD '$actual' != event SHA '$env:GITHUB_SHA'"
          }
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') {
            throw "Shared Unreal host is already owned; status=$($state.status)."
          }
          git diff --quiet 4f2cba560d54931dc8ba080370d96a7aad24f15b HEAD -- Source/YetAnotherCyclingSimEditor/Private/Diagnostics/YacsLandscapeMeshDiagnosticLibrary.cpp Source/YetAnotherCyclingSimEditor/Private/Diagnostics/YacsLandscapeTerrainTrial.cpp
          if ($LASTEXITCODE -ne 0) { throw 'Owner-accepted native rock geometry implementation changed.' }
          git diff --quiet 4f2cba560d54931dc8ba080370d96a7aad24f15b HEAD -- Content/Worlds/SaCalobra/L_SaCalobraAccepted_20261004.umap Content/Worlds/SaCalobra/CheckpointMaterials Content/Worlds/SaCalobra/CheckpointEarthworks Content/Generated/YACS/MaskReview Content/Generated/YACS/TextureMaterialPrep
          if ($LASTEXITCODE -ne 0) { throw 'Owner-accepted scene or material asset identities changed.' }
          "YACS_CLIFF_VISUAL_EXPECTED_SHA=$actual" >> $env:GITHUB_ENV

      - name: Install pinned GIS and image dependencies
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 rasterio==1.5.2 shapely==2.1.2 pillow==12.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Frozen-survey dependency install failed.' }

      - name: Materialize accepted map and complete limestone PBR dependency set
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_LFS_SKIP_SMUDGE = '0'
          try {
            New-Item -ItemType Directory -Force -Path $env:YACS_LFS_CACHE_ROOT | Out-Null
            git lfs install --local --skip-smudge
            if ($LASTEXITCODE -ne 0) { throw 'Local LFS setup failed.' }
            git config --local lfs.storage $env:YACS_LFS_CACHE_ROOT
            if ($LASTEXITCODE -ne 0) { throw 'Persistent LFS storage configuration failed.' }

            $map = 'Content/Worlds/SaCalobra/L_SaCalobraAccepted_20261004.umap'
            $checkpointMaterials = 'Content/Worlds/SaCalobra/CheckpointMaterials'
            $checkpointEarthworks = 'Content/Worlds/SaCalobra/CheckpointEarthworks'
            $landscapeMaterial = 'Content/Generated/YACS/MaskReview/M_MaskReview_1.uasset'
            $landscapeTexture = 'Content/Generated/YACS/MaskReview/T_MaskReview_1.uasset'
            $library = 'Content/Generated/YACS/TextureMaterialPrep/Libraries/3d53743e48394f31beb35e4030dc8a87'
            $exposedBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/C414EA4B402723D66FCB689E49EEB02D/BaseColor.uasset'
            $screeBaseColor = 'Content/Generated/YACS/TextureMaterialPrep/Runs/94406E0247C9822CFD006CAB8B20545E/BaseColor.uasset'
            $include = "$map,$checkpointMaterials/**,$checkpointEarthworks/**,$landscapeMaterial,$landscapeTexture,$library/**,$exposedBaseColor,$screeBaseColor"
            git lfs pull --include=$include --exclude=''
            if ($LASTEXITCODE -ne 0) { throw 'Accepted map / limestone transitive LFS pull failed.' }
            git lfs checkout $map $checkpointMaterials $checkpointEarthworks $landscapeMaterial $landscapeTexture $library $exposedBaseColor $screeBaseColor
            if ($LASTEXITCODE -ne 0) { throw 'Accepted map / limestone transitive LFS checkout failed.' }

            if (-not (Test-Path -LiteralPath $map -PathType Leaf)) {
              throw 'Accepted Sa Calobra map is missing after LFS checkout.'
            }
            if ((Get-Item -LiteralPath $map).Length -lt 100000000) {
              throw 'Accepted Sa Calobra map still looks like an LFS pointer.'
            }

            $required = @(
              $landscapeMaterial,
              $landscapeTexture,
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_ExposedRock.uasset",
              "$library/LimestonePalette/1b3d9c45b1e24d6085bfcc8859390c19/M_SC_Limestone_Scree.uasset",
              "$library/ProviderData/ExposedRock/T_Height.uasset",
              "$library/ProviderData/ExposedRock/T_Normal.uasset",
              "$library/ProviderData/ExposedRock/T_Roughness.uasset",
              "$library/ProviderData/Scree/T_Height.uasset",
              "$library/ProviderData/Scree/T_Normal.uasset",
              "$library/ProviderData/Scree/T_Roughness.uasset",
              "$library/Sources/T_Source_ExposedRock.uasset",
              "$library/Sources/T_Source_Scree.uasset",
              $exposedBaseColor,
              $screeBaseColor
            )
            $required += @(0..2 | ForEach-Object { "$checkpointMaterials/MI_Accepted_$_.uasset" })
            $required += @(0..184 | ForEach-Object { "$checkpointEarthworks/T_Cut_$('{0:D3}' -f $_).uasset" })
            foreach ($asset in $required) {
              if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
                throw "Required scene proof asset missing: $asset"
              }
              if ((Get-Item -LiteralPath $asset).Length -lt 1024) {
                throw "Required scene proof asset is still an LFS pointer: $asset"
              }
            }
          }
          finally {
            $env:GIT_LFS_SKIP_SMUDGE = '1'
          }

      - name: Resolve frozen inputs and isolated evidence roots
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $worldRoot = Join-Path $env:RUNNER_WORKSPACE '_yacs-world-data\sa-calobra-working-v1'
          $normalized = Join-Path $worldRoot 'normalized-context-v1a-2026-10-04\manifest.json'
          $pcg = Join-Path $worldRoot 'pcg-masks-v1-2026-10-04\pcg-mask-manifest.json'
          $context = Join-Path $worldRoot 'context-exclusions-v2-2026-10-04\context-mask-manifest.json'
          foreach ($path in @($normalized, $pcg, $context)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required frozen survey input missing: $path"
            }
          }

          $frozen = Join-Path $worldRoot 'frozen-road-c5573b3-2026-10-04'
          if (-not (Test-Path -LiteralPath (Join-Path $frozen 'source-recipe.json') -PathType Leaf)) {
            throw "Required owner-frozen road artifact missing: $frozen"
          }
          "YACS_SA_CALOBRA_TPP_FROZEN_ROOT=$frozen" >> $env:GITHUB_ENV
          $rootOut = Join-Path $env:RUNNER_TEMP "component230-tpp-$env:GITHUB_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $rootOut) { throw 'Survey evidence root already exists; refusing stale output.' }
          $planRoot = Join-Path $rootOut 'plan'
          $topologyRoot = Join-Path $rootOut 'topology'
          $customRoot = Join-Path $rootOut 'custom'
          $pcgexRoot = Join-Path $rootOut 'pcgex'
          New-Item -ItemType Directory -Force -Path $rootOut | Out-Null

          "YACS_CLIFF_NORMALIZED=$normalized" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCG=$pcg" >> $env:GITHUB_ENV
          "YACS_CLIFF_CONTEXT=$context" >> $env:GITHUB_ENV
          "YACS_CLIFF_PHASE2C_ROOT=$rootOut" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_PLAN_ROOT=$planRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_VISUAL_PLAN=$(Join-Path $planRoot 'component230-cliff-visual-plan.json')" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_PROOF_ROOT=$topologyRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_CUSTOM_OUTPUT=$customRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_OUTPUT=$pcgexRoot" >> $env:GITHUB_ENV
          "YACS_CLIFF_PCGEX_MESH=$(Join-Path $topologyRoot 'phase2c-pcgex-cliff-a.json')" >> $env:GITHUB_ENV

      - name: Prepare unchanged YACS classifier and narrow hard policy
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/assets/prepare_sa_calobra_component230_cliff_visual.py scripts/ue/capture_sa_calobra_component230_cliff.py scripts/ue/sa_calobra_tpp_survey_capture.py scripts/proof/sa_calobra_tpp_survey.py scripts/proof/package_sa_calobra_tpp_survey.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen-survey Python compile failed.' }

          python -m unittest scripts.ci.test_sa_calobra_tpp_survey scripts.ci.test_sa_calobra_tpp_survey_capture scripts.ci.test_package_sa_calobra_tpp_survey scripts.assets.test_sa_calobra_component230_cliff_visual scripts.assets.test_analyze_local_cliff_smoothing -v
          if ($LASTEXITCODE -ne 0) { throw 'Frozen-survey planner, capture or package tests failed.' }

          python scripts/assets/prepare_sa_calobra_component230_cliff_visual.py --normalized-manifest $env:YACS_CLIFF_NORMALIZED --pcg-manifest $env:YACS_CLIFF_PCG --context-manifest $env:YACS_CLIFF_CONTEXT --output $env:YACS_CLIFF_VISUAL_PLAN_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Frozen-survey cliff plan preparation failed.' }

          $plan = Get-Content -LiteralPath $env:YACS_CLIFF_VISUAL_PLAN -Raw | ConvertFrom-Json
          if (
            $plan.status -ne 'COMPONENT230_CLIFF_VISUAL_PLAN' -or
            $plan.geometry_mutation -ne $false -or
            $plan.canonical_landscape_mutation -ne $false -or
            $plan.selector_policy_mutation -ne $false -or
            [int]$plan.counts.component_cliff_cells -ne 2611 -or
            [int]$plan.counts.component_scree_cells -ne 1237 -or
            [int]$plan.counts.skin_cell_count -ne 1017 -or
            [int]$plan.counts.skin_cluster_count -ne 14
          ) {
            throw 'Frozen-survey input/reference contract drifted.'
          }

          python -c "import os; from scripts.proof.sa_calobra_tpp_survey import load_frozen_windows, build_survey_plan, SurveyConfig; source=load_frozen_windows(os.environ['YACS_SA_CALOBRA_TPP_FROZEN_ROOT']); plan=build_survey_plan(source['windows'], SurveyConfig(os.environ['YACS_CLIFF_VISUAL_EXPECTED_SHA']), source_identity=source['source_identity']); print('Frozen TPP preflight:', len(plan['windows']), 'windows,', plan['frame_count'], 'bounded frames')"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen road hashes or bounded bidirectional frame plan failed.' }

      - name: Verify installed exact-version primary API source
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $engine = Resolve-YacsUnrealEngine -ProjectPath (Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject')
          if (-not $engine -or $engine.Version -ne '5.8.2-56702186') {
            throw 'Survey requires the accepted UE 5.8.2 CL 56702186 installed source/runtime.'
          }
          $contracts = @(
            @{ path = 'Engine/Source/Runtime/Engine/Classes/GameFramework/Actor.h'; symbols = @('GetActorBounds', 'SetActorScale3D', 'K2_SetActorLocation', 'K2_SetActorRotation') },
            @{ path = 'Engine/Source/Runtime/Engine/Classes/Components/StaticMeshComponent.h'; symbols = @('SetStaticMesh') },
            @{ path = 'Engine/Source/Runtime/Engine/Classes/Components/SceneComponent.h'; symbols = @('Mobility') },
            @{ path = 'Engine/Source/Runtime/Engine/Classes/Engine/EngineTypes.h'; symbols = @('EComponentMobility', 'Movable') },
            @{ path = 'Engine/Source/Runtime/Engine/Classes/Components/PrimitiveComponent.h'; symbols = @('SetCollisionEnabled', 'SetCastShadow') },
            @{ path = 'Engine/Source/Editor/UnrealEd/Public/Subsystems/EditorActorSubsystem.h'; symbols = @('SpawnActorFromClass', 'DestroyActor') }
          )
          $evidence = @()
          foreach ($contract in $contracts) {
            $path = Join-Path $engine.Root $contract.path
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Installed API source missing: $($contract.path)" }
            $source = Get-Content -LiteralPath $path -Raw
            foreach ($symbol in $contract.symbols) {
              if ($source -notmatch ('\b' + [regex]::Escape($symbol) + '\b')) { throw "Installed API source lacks $symbol" }
            }
            $evidence += [ordered]@{
              header = $contract.path
              sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              verified_symbols = $contract.symbols
            }
          }
          [ordered]@{
            status = 'INSTALLED_PRIMARY_API_SOURCE_VERIFIED'
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            engine_version = $engine.Version
            build_version_sha256 = $engine.BuildVersionSha256
            headers = $evidence
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'native-api-evidence.json') -Encoding UTF8

      - name: Build exact survey head and run scoped Automation once
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrapReport = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'pcgex-bootstrap.json'
          ./scripts/worldgen/Bootstrap-YacsPcgEx.ps1 -Mode Install -ReportPath $bootstrapReport
          if ($LASTEXITCODE -ne 0) { throw 'Pinned PCGEx dependency bootstrap failed.' }
          $bootstrap = Get-Content -LiteralPath $bootstrapReport -Raw | ConvertFrom-Json
          if ($bootstrap.status -ne 'PASS' -or $bootstrap.actual_commit -ne '39a8f1bdc65b2c4613a1e87b71d93b4576db0a66') {
            throw 'Pinned PCGEx dependency source changed.'
          }
          ./scripts/ci/Invoke-YacsUnrealCi.ps1 -ExpectedHead $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -ExpectedBranch $env:GITHUB_REF_NAME -ArtifactRoot (Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'build-automation')
          if ($LASTEXITCODE -ne 0) { throw 'Exact-head survey build or scoped Automation failed.' }

      - name: Capture source controls and accepted v8 bidirectional sphere survey
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/ci/Resolve-YacsUnrealEngine.ps1
          $project = Join-Path (Get-Location) 'YetAnotherCyclingSim.uproject'
          $engine = Resolve-YacsUnrealEngine -ProjectPath $project
          $script = (Resolve-Path 'scripts/ue/capture_sa_calobra_component230_cliff.py').Path

          function Invoke-CliffCapture {
            param(
              [Parameter(Mandatory=$true)] [string] $Label,
              [Parameter(Mandatory=$true)] [string] $Output,
              [Parameter(Mandatory=$true)] [bool] $UsePcgEx
            )

            New-Item -ItemType Directory -Force -Path $Output | Out-Null
            $env:YACS_CLIFF_VISUAL_OUTPUT = $Output
            if ($UsePcgEx) {
              if (-not (Test-Path -LiteralPath $env:YACS_CLIFF_PCGEX_MESH -PathType Leaf)) {
                throw 'PCGEx mesh receipt is missing before candidate render.'
              }
            }
            else {
              Remove-Item Env:YACS_CLIFF_PCGEX_MESH -ErrorAction SilentlyContinue
            }

            $stdout = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.stdout.log"
            $stderr = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.stderr.log"
            $log = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT "$Label.engine.log"
            $arguments = @(
              ('"' + $project + '"'),
              ('-ExecutePythonScript="' + $script + '"'),
              '-RenderOffscreen',
              '-Unattended',
              '-NoPause',
              '-NoSplash',
              '-NoSound',
              '-NoP4',
              '-NoVSync',
              '-Deterministic',
              '-ScriptErrorsAreFatal',
              '-stdout',
              ('-AbsLog="' + $log + '"')
            )
            $started = Get-Date
            $process = Start-Process -FilePath $engine.UnrealEditorPath -ArgumentList $arguments -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $timeoutMs = if ($env:YACS_SA_CALOBRA_TPP_SURVEY -eq '1') { 5400000 } else { 480000 }
            if (-not $process.WaitForExit($timeoutMs)) {
              try { $process | Stop-Process -Force } catch { }
              throw "$Label cliff capture timed out."
            }
            $seconds = ((Get-Date) - $started).TotalSeconds
            if ($process.ExitCode -ne 0) {
              foreach ($diagnostic in @($stdout, $stderr, $log)) {
                if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                  Write-Host "===== TAIL $diagnostic ====="
                  Get-Content -LiteralPath $diagnostic -Tail 240 | Write-Host
                }
              }
              throw "$Label cliff capture exited $($process.ExitCode)."
            }

            $materialFallback = @()
            foreach ($diagnostic in @($stdout, $stderr, $log)) {
              if (Test-Path -LiteralPath $diagnostic -PathType Leaf) {
                $materialFallback += @(
                  Select-String -LiteralPath $diagnostic -SimpleMatch -Pattern @(
                    'Texture Sample > Missing input texture',
                    'Default Material will be used'
                  ) -ErrorAction SilentlyContinue
                )
                $materialFallback += @(
                  Select-String -LiteralPath $diagnostic -Pattern @(
                    "LoadErrors: Error:.*'/Game/Worlds/SaCalobra/Checkpoint",
                    "LoadErrors: Error:.*'/Game/Generated/YACS/MaskReview/",
                    "LoadErrors: Error:.*'/Game/Generated/YACS/TextureMaterialPrep/"
                  ) -ErrorAction SilentlyContinue
                )
              }
            }
            if ($materialFallback.Count -gt 0) {
              $materialFallback | ForEach-Object {
                "$($_.Path):$($_.LineNumber): $($_.Line.Trim())"
              } | Write-Host
              throw "$Label material proof detected missing texture or Default Material fallback."
            }

            Assert-CliffCapture -Label $Label -Output $Output -UsePcgEx $UsePcgEx -Seconds $seconds
          }

          function Assert-CliffCapture {
            param([string] $Label, [string] $Output, [bool] $UsePcgEx, [double] $Seconds)
            $receiptPath = Join-Path $Output 'component230-cliff-visual-receipt.json'
            if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) {
              throw "$Label visual receipt is missing."
            }
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            if (
              $receipt.status -ne 'COMPONENT230_CLIFF_VISUAL_PASS' -or
              $receipt.exact_sha -ne $env:YACS_CLIFF_VISUAL_EXPECTED_SHA -or
              $receipt.map_saved -ne $false -or
              $receipt.assets_saved -ne $false -or
              $receipt.canonical_landscape_mutation -ne $false -or
              $receipt.selector_policy_mutation -ne $false -or
              $receipt.landscape_presentation_material.enabled -ne $true -or
              $receipt.landscape_presentation_material.restored -ne $true -or
              $receipt.landscape_presentation_material.component -ne 'LandscapeComponent_230' -or
              $receipt.landscape_presentation_material.material -ne '/Engine/BasicShapes/BasicShapeMaterial.BasicShapeMaterial' -or
              [int]@($receipt.captures).Count -ne 4 -or
              [bool]$receipt.mesh.collision_enabled -ne $false -or
              [bool]$receipt.mesh.cast_dynamic_shadows -ne $true
            ) {
              throw "$Label visual receipt contract failed."
            }
            if ($env:YACS_TERRAIN_MESH_TRIAL -eq '1') {
              $edge = $receipt.terrain_erosion_trial
              if (
                $receipt.mesh.generator -ne 'native-source-rock-reshape' -or
                $edge.edge_only_mesh -ne $false -or
                $edge.reshaped_rock_mesh -ne $true -or
                $edge.reference_source -ne 'original-before-reshaping' -or
                $edge.terrain_import_performed -ne $false -or
                $edge.native_landscape -ne $false -or
                $edge.derived_heightfield_modified -ne $false -or
                $edge.erosion.enabled -ne $false -or
                $edge.source_heightfield_unchanged -ne $true -or
                $edge.restored -ne $true -or
                $edge.combined_audit.status -ne 'PASS' -or
                $edge.combined_audit.displacement_limit_cm -ne 50 -or
                $edge.combined_audit.max_displacement_cm -gt 50.000001 -or
                $edge.combined_audit.folded_xy_triangles -ne 0 -or
                $edge.mesh_export.shape_profile -ne 'rounded-limestone-reshape-v8' -or
                $edge.mesh_export.locked_vertex_displacement_cm -ne 0 -or
                $edge.mesh_export.locked_normal_max_delta -ne 0
              ) { throw 'Bounded limestone rock reshaping receipt failed.' }
            }
            elseif ($env:YACS_TERRAIN_EROSION_TRIAL -eq '1') {
              if (
                $receipt.mesh.generator -ne 'native-landscape-thermal-erosion' -or
                $receipt.terrain_erosion_trial.native_landscape -ne $true -or
                $receipt.terrain_erosion_trial.imported_heightfield_matches -ne $true -or
                $receipt.terrain_erosion_trial.derived_heightfield_modified -ne $true -or
                $receipt.terrain_erosion_trial.source_heightfield_unchanged -ne $true -or
                $receipt.terrain_erosion_trial.restored -ne $true -or
                $receipt.terrain_erosion_trial.erosion.max_abs_change_cm -gt 150 -or
                $receipt.terrain_erosion_trial.erosion.fixed_samples_changed -ne 0 -or
                $receipt.terrain_erosion_trial.erosion.height_sum_delta_units -ne 0
              ) { throw 'Native terrain erosion trial receipt failed.' }
            }
            elseif ($env:YACS_LANDSCAPE_MESH_DIAGNOSTIC -eq '1') {
              if (
                $receipt.mesh.generator -ne 'native-landscape-export' -or
                $receipt.landscape_mesh_diagnostic.restored -ne $true -or
                $receipt.landscape_mesh_diagnostic.pcgex_overlay -ne $false -or
                $receipt.mesh.material.cliff -ne $receipt.landscape_presentation_material.material -or
                $receipt.landscape_mesh_diagnostic.export.max_conversion_error_cm -gt 0.001
              ) { throw 'Native Landscape mesh diagnostic receipt failed.' }
            }
            elseif ($UsePcgEx) {
              if (
                $receipt.mesh.generator -ne 'pcgex-clipper2' -or
                $receipt.mesh.pcgex_topology.max_xy_shift_cm -ne 0.0 -or
                [int]$receipt.mesh.pcgex_topology.interior_vertices -le 0 -or
                [double]$receipt.mesh.pcgex_topology.max_edge_cm_after -gt 157.5 -or
                [int]$receipt.mesh.pcgex_topology.pcgex_triangle_count -gt 120000
              ) {
                throw 'PCGEx visual topology density/performance contract failed.'
              }
            }
            elseif ($receipt.mesh.generator -ne 'yacs-connected-skin') {
              throw 'Custom benchmark generator identity drifted.'
            }

            [ordered]@{
              label = $Label
              seconds = if ($Label -eq 'custom' -and $env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT) { $null } else { [math]::Round([double]$seconds, 3) }
              timing_scope = if ($env:YACS_CLIFF_PAIRED_CUSTOM_OUTPUT) { 'shared A/B editor session; no per-candidate timing claim' } else { 'editor process' }
              generator = [string]$receipt.mesh.generator
              cliff_triangles = [int]$receipt.mesh.cliff.triangles
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $Output 'capture-performance.json') -Encoding UTF8
          }

          # Owner-approved replacement diagnostic runs before existing A/B proofs.
          $env:YACS_LANDSCAPE_MESH_DIAGNOSTIC = '1'
          try {
            $terrainRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'landscape-mesh'
            $env:YACS_EDGE_GEOMETRY_PREFLIGHT = '1'
            try {
              Invoke-CliffCapture -Label 'landscape-mesh' -Output $terrainRoot -UsePcgEx $false
            }
            finally {
              Remove-Item Env:YACS_EDGE_GEOMETRY_PREFLIGHT -ErrorAction SilentlyContinue
            }
            $env:YACS_LOCAL_CLIFF_SMOOTHING = '1'
            try {
              $localRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'local-cliff-smoothing'
              Invoke-CliffCapture -Label 'local-cliff-smoothing' -Output $localRoot -UsePcgEx $false
              python scripts/assets/analyze_local_cliff_smoothing.py --plan $env:YACS_CLIFF_VISUAL_PLAN --mesh (Join-Path $localRoot 'local-cliff-smoothing-mesh.json') --output (Join-Path $localRoot 'local-cliff-smoothing-audit.json')
              if ($LASTEXITCODE -ne 0) { throw 'Independent local smoothing audit failed.' }
              $local = Get-Content -LiteralPath (Join-Path $localRoot 'component230-cliff-visual-receipt.json') -Raw | ConvertFrom-Json
              if (
                $local.landscape_mesh_diagnostic.export.local_smoothing -ne $true -or
                $local.landscape_mesh_diagnostic.export.folded_xy_triangles -ne 0 -or
                $local.landscape_mesh_diagnostic.export.locked_vertex_displacement_cm -ne 0 -or
                $local.landscape_mesh_diagnostic.export.displacement_limit_cm -ne 100 -or
                $local.landscape_mesh_diagnostic.export.max_displacement_cm -gt 100.000001
              ) { throw 'Local cliff smoothing bounds failed.' }
            }
            finally {
              Remove-Item Env:YACS_LOCAL_CLIFF_SMOOTHING -ErrorAction SilentlyContinue
            }
          }
          finally {
            Remove-Item Env:YACS_LANDSCAPE_MESH_DIAGNOSTIC -ErrorAction SilentlyContinue
          }

          # Reproduce the accepted presentation only; no heightfield erosion/import.
          $env:YACS_TERRAIN_EROSION_TRIAL = '1'
          $env:YACS_TERRAIN_MESH_TRIAL = '1'
          $env:YACS_TERRAIN_ORIGINAL_MESH = Join-Path $localRoot 'local-cliff-smoothing-mesh.json'
          $env:YACS_SA_CALOBRA_TPP_SURVEY = '1'
          try {
            $combinedRoot = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion-mesh'
            Invoke-CliffCapture -Label 'terrain-erosion-mesh' -Output $combinedRoot -UsePcgEx $false
          }
          finally {
            Remove-Item Env:YACS_SA_CALOBRA_TPP_SURVEY -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_EROSION_TRIAL -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_MESH_TRIAL -ErrorAction SilentlyContinue
            Remove-Item Env:YACS_TERRAIN_ORIGINAL_MESH -ErrorAction SilentlyContinue
          }

      - name: Verify every frame and package durable bidirectional review evidence
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'terrain-erosion-mesh/tpp-survey'
          python scripts/proof/package_sa_calobra_tpp_survey.py --root $root --expected-sha $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Bidirectional survey frame/readiness/restoration package verification failed.' }
          # Preserve existing lighting admission honestly; this diagnostic does not admit it.
          python scripts/assets/analyze_sa_calobra_component230_cliff_visual.py --root (Split-Path $root -Parent)
          if ($LASTEXITCODE -ne 0) { throw 'Accepted-v8 control metric analysis failed.' }

      - name: Enforce non-persistent checkout
        if: ${{ always() && env.YACS_CLIFF_PHASE2C_ROOT != '' }}
        shell: pwsh
        working-directory: _phase2c-pcgex-cliff
        run: |
          $ErrorActionPreference = 'Stop'
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect proof checkout.' }
          [ordered]@{
            schema_version = 1
            exact_sha = $env:YACS_CLIFF_VISUAL_EXPECTED_SHA
            status = $(if ($tracked.Count -eq 0) { 'PASS' } else { 'FAIL' })
            tracked_changes = $tracked
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:YACS_CLIFF_PHASE2C_ROOT 'checkout-restoration.json') -Encoding UTF8
          if ($tracked.Count -gt 0) {
            throw "Frozen TPP survey mutated tracked files: $($tracked -join '; ')"
          }

      - name: Upload immutable survey frames, review bundle and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sa-calobra-bidirectional-tpp-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/component230-tpp-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90

  retain-bidirectional-survey:
    name: Retain completed TPP survey without rendering
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[tpp-retain]') &&
      !contains(github.event.head_commit.message, '[wholemap-material]') &&
      !contains(github.event.head_commit.message, '[detail-native]') &&
      !contains(github.event.head_commit.message, '[tpp-survey]') &&
      !contains(github.event.head_commit.message, '[tpp-docs]')
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      YACS_TPP_CAPTURE_SHA: b1ea05b33b9f3208e7aeb6884f1a67792d9c6121
      YACS_TPP_CAPTURE_RUN: "37800814004"
      YACS_TPP_CAPTURE_ATTEMPT: "1"

    steps:
      - name: Isolate retention checkout Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'tpp-retention.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact retention helper revision without LFS payloads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _sa-calobra-tpp-retention
          fetch-depth: 1
          lfs: false
          clean: false
          persist-credentials: false

      - name: Verify fixed retention intent, idle host and canonical workspace configuration
        shell: pwsh
        working-directory: _sa-calobra-tpp-retention
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTOR -ne 'karnalooch' -or $env:GITHUB_REPOSITORY -ne 'karnalooch/YetAnotherCyclingSim' -or $env:GITHUB_REF_NAME -ne 'feat/phase2c-pcgex-cliff-topology') {
            throw 'The fixed retention intent is restricted to the owner and reviewed Component 230 branch.'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) { throw 'Retention helper checkout does not match the exact event SHA.' }
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') { throw "Shared Unreal host is already owned; status=$($state.status)." }
          # Start-YacsRunner.ps1 exports the configured path into its child worker.
          if (-not $env:YACS_WORKSPACE_CONFIG) { throw 'Canonical YACS_WORKSPACE_CONFIG was not exported by the runner.' }
          $workspaceConfig = (Resolve-Path -LiteralPath $env:YACS_WORKSPACE_CONFIG).Path
          python -c "import sys; from pathlib import Path; from scripts.manage_local_workspace import load_workspace; load_workspace(Path(sys.argv[1]))" $workspaceConfig
          if ($LASTEXITCODE -ne 0) { throw 'Canonical persistent workspace configuration failed validation.' }
          $root = Join-Path $env:RUNNER_TEMP "tpp-retention-$env:GITHUB_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Retention evidence root already exists; refusing stale output.' }
          $inputRoot = Join-Path $root 'source-artifact'
          New-Item -ItemType Directory -Path $inputRoot -Force | Out-Null
          "YACS_TPP_RETENTION_ROOT=$root" >> $env:GITHUB_ENV
          "YACS_TPP_RETENTION_INPUT=$inputRoot" >> $env:GITHUB_ENV

      - name: Download the fixed completed survey artifact without another Unreal run
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: sa-calobra-bidirectional-tpp-b1ea05b33b9f3208e7aeb6884f1a67792d9c6121-37800814004-1
          repository: karnalooch/YetAnotherCyclingSim
          run-id: 37800814004
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.YACS_TPP_RETENTION_INPUT }}

      - name: Validate and retain complete original evidence in the configured persistent workspace
        shell: pwsh
        working-directory: _sa-calobra-tpp-retention
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest scripts.ci.test_retain_sa_calobra_tpp_survey -v
          if ($LASTEXITCODE -ne 0) { throw 'Survey retention integrity tests failed.' }
          python scripts/proof/retain_sa_calobra_tpp_survey.py --source $env:YACS_TPP_RETENTION_INPUT --expected-sha $env:YACS_TPP_CAPTURE_SHA --run-id $env:YACS_TPP_CAPTURE_RUN --attempt $env:YACS_TPP_CAPTURE_ATTEMPT --workspace-config $env:YACS_WORKSPACE_CONFIG | Tee-Object -FilePath (Join-Path $env:YACS_TPP_RETENTION_ROOT 'retention-receipt.json')
          if ($LASTEXITCODE -ne 0) { throw 'Complete survey artifact validation or durable retention failed.' }
          $tracked = @(git status --porcelain=v1 --untracked-files=no)
          if ($LASTEXITCODE -ne 0 -or $tracked.Count -gt 0) { throw 'Retention dirtied its isolated tracked checkout.' }

      - name: Upload the separate durable-retention receipt
        if: ${{ always() && env.YACS_TPP_RETENTION_ROOT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sa-calobra-tpp-retention-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.YACS_TPP_RETENTION_ROOT }}/retention-receipt.json
          if-no-files-found: warn
          retention-days: 90

  publish-survey-docs:
    name: Publish retained survey material to repository docs without rendering
    if: >-
      github.event_name == 'push' &&
      github.repository == 'karnalooch/YetAnotherCyclingSim' &&
      github.actor == 'karnalooch' &&
      github.ref == 'refs/heads/feat/phase2c-pcgex-cliff-topology' &&
      contains(github.event.head_commit.message, '[tpp-docs]') &&
      !contains(github.event.head_commit.message, '[wholemap-material]') &&
      !contains(github.event.head_commit.message, '[detail-native]') &&
      !contains(github.event.head_commit.message, '[tpp-survey]') &&
      !contains(github.event.head_commit.message, '[tpp-retain]')
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      YACS_TPP_CAPTURE_SHA: b1ea05b33b9f3208e7aeb6884f1a67792d9c6121
      YACS_TPP_CAPTURE_RUN: "37800814004"
      YACS_TPP_CAPTURE_ATTEMPT: "1"
      YACS_TPP_CAPTURE_ARTIFACT: "11562342248"
      YACS_TPP_ARCHIVE_SHA256: f9ad39ae59a16dc1fc4615ef10ca950096a94d443bea4dcb0e624284000a0cab
      YACS_TPP_ARCHIVE_BYTES: "1609577808"

    steps:
      - name: Isolate documentation publication Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'tpp-docs.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact publication revision with job-local Git authentication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _sa-calobra-tpp-docs
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          clean: false
          persist-credentials: true

      - name: Verify fixed owner intent, event-head lease and configured retained source
        shell: pwsh
        working-directory: _sa-calobra-tpp-docs
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTOR -ne 'karnalooch' -or $env:GITHUB_REPOSITORY -ne 'karnalooch/YetAnotherCyclingSim' -or $env:GITHUB_REF_NAME -ne 'feat/phase2c-pcgex-cliff-topology') {
            throw 'Documentation publication is restricted to the owner and reviewed Component 230 branch.'
          }
          $actual = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) { throw 'Publication checkout does not match the exact event SHA.' }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'Publication checkout must start clean.' }
          $remote = @(git ls-remote origin refs/heads/feat/phase2c-pcgex-cliff-topology)
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or (($remote[0] -split '\s+')[0] -ne $env:GITHUB_SHA)) {
            throw 'Publication branch changed after the event; preserve it and stop.'
          }
          $state = ./scripts/runner/Get-YacsUnrealHostState.ps1
          $state | ConvertTo-Json -Depth 8 | Write-Host
          if ($state.status -ne 'IDLE') { throw "Shared Unreal host is already owned; status=$($state.status)." }
          if (-not $env:YACS_WORKSPACE_CONFIG) { throw 'Canonical YACS_WORKSPACE_CONFIG was not exported by the runner.' }
          $workspaceJson = python -c "import json,sys; from pathlib import Path; from scripts.manage_local_workspace import load_workspace; print(json.dumps(load_workspace(Path(sys.argv[1]))))" $env:YACS_WORKSPACE_CONFIG
          if ($LASTEXITCODE -ne 0) { throw 'Canonical persistent workspace configuration failed validation.' }
          $workspace = $workspaceJson | ConvertFrom-Json
          $source = Join-Path $workspace.work "proofs/sa-calobra-tpp/$env:YACS_TPP_CAPTURE_SHA/$env:YACS_TPP_CAPTURE_RUN-$env:YACS_TPP_CAPTURE_ATTEMPT"
          if (-not (Test-Path -LiteralPath (Join-Path $source '.yacs-retention/manifest.json') -PathType Leaf)) {
            throw 'Verified persistent source proof is missing; publication never rerenders it.'
          }
          $root = Join-Path $env:RUNNER_TEMP "tpp-docs-$env:GITHUB_SHA-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $root) { throw 'Publication evidence root already exists; refusing stale output.' }
          New-Item -ItemType Directory -Path $root | Out-Null
          "YACS_TPP_DOCS_ROOT=$root" >> $env:GITHUB_ENV
          "YACS_TPP_DOCS_SOURCE=$source" >> $env:GITHUB_ENV
          "YACS_TPP_DOCS_LFS_CACHE=$(Join-Path $workspace.cache 'git-lfs/YetAnotherCyclingSim')" >> $env:GITHUB_ENV

      - name: Download and verify the exact original completed capture ZIP
        shell: pwsh
        working-directory: _sa-calobra-tpp-docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = 'https://api.github.com/repos/karnalooch/YetAnotherCyclingSim/actions'
          $runPath = Join-Path $env:YACS_TPP_DOCS_ROOT 'source-run.json'
          & curl.exe --silent --show-error --fail --proto '=https' --proto-redir '=https' --max-time 60 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -o $runPath "$api/runs/$env:YACS_TPP_CAPTURE_RUN"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed capture run metadata download failed.' }
          $run = Get-Content -LiteralPath $runPath -Raw | ConvertFrom-Json
          if ($run.id -ne 37800814004 -or $run.run_attempt -ne 1 -or $run.head_sha -ne $env:YACS_TPP_CAPTURE_SHA -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') {
            throw 'Fixed source run must be completed successfully at the captured exact SHA.'
          }
          $artifactPath = Join-Path $env:YACS_TPP_DOCS_ROOT 'source-artifact.json'
          & curl.exe --silent --show-error --fail --proto '=https' --proto-redir '=https' --max-time 60 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -o $artifactPath "$api/artifacts/$env:YACS_TPP_CAPTURE_ARTIFACT"
          if ($LASTEXITCODE -ne 0) { throw 'Fixed capture artifact metadata download failed.' }
          $artifact = Get-Content -LiteralPath $artifactPath -Raw | ConvertFrom-Json
          if ($artifact.id -ne 11562342248 -or $artifact.expired -ne $false -or $artifact.workflow_run.id -ne 37800814004 -or $artifact.workflow_run.head_sha -ne $env:YACS_TPP_CAPTURE_SHA -or $artifact.name -ne 'sa-calobra-bidirectional-tpp-b1ea05b33b9f3208e7aeb6884f1a67792d9c6121-37800814004-1') {
            throw 'Fixed source artifact identity failed.'
          }
          $archive = Join-Path $env:YACS_TPP_DOCS_ROOT 'retained-37800814004.zip'
          # Standard curl redirects strip Authorization when the host changes.
          # Never use --location-trusted or forward the token to the storage host.
          & curl.exe --location --silent --show-error --fail --proto '=https' --proto-redir '=https' --max-time 900 --retry 2 -H "Authorization: Bearer $env:GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -o $archive "$api/artifacts/$env:YACS_TPP_CAPTURE_ARTIFACT/zip"
          if ($LASTEXITCODE -ne 0) { throw 'Original capture artifact ZIP download failed.' }
          if ((Get-Item -LiteralPath $archive).Length -ne [int64]$env:YACS_TPP_ARCHIVE_BYTES -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:YACS_TPP_ARCHIVE_SHA256) {
            throw 'Original ZIP differs from its pinned capture artifact size or SHA-256.'
          }
          "YACS_TPP_DOCS_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Export actual inspection images, indexes and original ZIP into documentation
        shell: pwsh
        working-directory: _sa-calobra-tpp-docs
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest scripts.ci.test_export_sa_calobra_tpp_survey_docs -v
          if ($LASTEXITCODE -ne 0) { throw 'Survey documentation export integrity tests failed.' }
          python scripts/proof/export_sa_calobra_tpp_survey_docs.py --source $env:YACS_TPP_DOCS_SOURCE --artifact-zip $env:YACS_TPP_DOCS_ARCHIVE --repo (Get-Location).Path --expected-sha $env:YACS_TPP_CAPTURE_SHA --run-id $env:YACS_TPP_CAPTURE_RUN --attempt $env:YACS_TPP_CAPTURE_ATTEMPT | Tee-Object -FilePath (Join-Path $env:YACS_TPP_DOCS_ROOT 'docs-export-receipt.json')
          if ($LASTEXITCODE -ne 0) { throw 'Verified proof documentation export failed.' }
          python scripts/ci/check_docs_index.py | Tee-Object -FilePath (Join-Path $env:YACS_TPP_DOCS_ROOT 'docs-guards.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Required documentation links, i18n, structure or freshness guard failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Documentation whitespace verification failed.' }

      - name: Stage only fixed documentation paths and publish the original ZIP through Git LFS
        shell: pwsh
        working-directory: _sa-calobra-tpp-docs
        run: |
          $ErrorActionPreference = 'Stop'
          $docs = 'docs/experiments/sa-calobra-tpp-survey-20261008'
          $archive = 'docs/experiments/component230-cliff/evidence/retained-37800814004.zip'
          $changed = @(git diff --name-only; git ls-files --others --exclude-standard)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect generated documentation paths.' }
          $outside = @($changed | Where-Object { $_ -ne $archive -and -not $_.StartsWith("$docs/", [StringComparison]::Ordinal) })
          if ($outside.Count -gt 0) { throw "Exporter changed paths outside its fixed documentation boundary: $($outside -join '; ')" }
          New-Item -ItemType Directory -Force -Path $env:YACS_TPP_DOCS_LFS_CACHE | Out-Null
          git lfs install --local --skip-smudge
          if ($LASTEXITCODE -ne 0) { throw 'Documentation Git LFS setup failed.' }
          git config --local lfs.storage $env:YACS_TPP_DOCS_LFS_CACHE
          if ($LASTEXITCODE -ne 0) { throw 'Configured persistent Git LFS storage setup failed.' }
          $filter = (git check-attr filter -- $archive | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $filter.EndsWith(': filter: lfs', [StringComparison]::Ordinal)) { throw 'Original proof ZIP must use the existing Git LFS rule.' }
          git add -- $docs $archive
          if ($LASTEXITCODE -ne 0) { throw 'Fixed documentation path staging failed.' }
          $staged = @(git diff --cached --name-only)
          $outside = @($staged | Where-Object { $_ -ne $archive -and -not $_.StartsWith("$docs/", [StringComparison]::Ordinal) })
          if ($LASTEXITCODE -ne 0 -or $outside.Count -gt 0 -or $staged.Count -lt 2 -or $staged -notcontains $archive) { throw 'Staged publication must contain only the fixed docs entry and original proof ZIP.' }
          $pointer = git show ":$archive" | Out-String
          if ($LASTEXITCODE -ne 0 -or $pointer -notmatch ('(?m)^oid sha256:' + $env:YACS_TPP_ARCHIVE_SHA256 + '\r?$') -or $pointer -notmatch ('(?m)^size ' + $env:YACS_TPP_ARCHIVE_BYTES + '\r?$')) { throw 'Staged original ZIP Git LFS pointer identity failed.' }
          $remote = @(git ls-remote origin refs/heads/feat/phase2c-pcgex-cliff-topology)
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or (($remote[0] -split '\s+')[0] -ne $env:GITHUB_SHA)) { throw 'Branch changed before LFS publication; do not push or rebase.' }
          git lfs push --object-id origin $env:YACS_TPP_ARCHIVE_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Original proof ZIP Git LFS upload failed.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(world): retain bidirectional Sa Calobra TPP inspection material'
          if ($LASTEXITCODE -ne 0) { throw 'Fixed documentation publication commit failed.' }
          $commit = (git rev-parse HEAD).Trim()
          $parent = (git rev-parse HEAD^).Trim()
          if ($LASTEXITCODE -ne 0 -or $parent -ne $env:GITHUB_SHA) { throw 'Publication commit must directly extend its exact event head.' }
          $readbackStorage = Join-Path $env:YACS_TPP_DOCS_ROOT 'independent-lfs-readback'
          if (Test-Path -LiteralPath $readbackStorage) { throw 'Independent LFS readback storage must be fresh.' }
          New-Item -ItemType Directory -Path $readbackStorage | Out-Null
          git -c "lfs.storage=$readbackStorage" -c lfs.fetchrecentalways=false -c lfs.skipdownloaderrors=false lfs fetch --include=$archive --exclude='' origin $commit
          if ($LASTEXITCODE -ne 0) { throw 'Independent server Git LFS proof ZIP download failed.' }
          $oid = $env:YACS_TPP_ARCHIVE_SHA256
          $readbackObject = Join-Path $readbackStorage ("objects/{0}/{1}/{2}" -f $oid.Substring(0, 2), $oid.Substring(2, 2), $oid)
          if (-not (Test-Path -LiteralPath $readbackObject -PathType Leaf)) { throw 'Independent server Git LFS readback object is missing.' }
          if ((Get-Item -LiteralPath $readbackObject).Length -ne [int64]$env:YACS_TPP_ARCHIVE_BYTES -or (Get-FileHash -LiteralPath $readbackObject -Algorithm SHA256).Hash.ToLowerInvariant() -ne $oid) {
            throw 'Independent server Git LFS ZIP bytes differ from the original proof.'
          }
          [ordered]@{
            status = 'REMOTE_LFS_BYTES_VERIFIED'
            publication_commit = $commit
            archive_sha256 = $oid
            archive_size_bytes = [int64]$env:YACS_TPP_ARCHIVE_BYTES
            storage_started_empty = $true
            verification = 'Independent authenticated Git LFS fetch into new storage followed by SHA-256 and size verification'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:YACS_TPP_DOCS_ROOT 'server-lfs-readback.json') -Encoding UTF8
          $remote = @(git ls-remote origin refs/heads/feat/phase2c-pcgex-cliff-topology)
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or (($remote[0] -split '\s+')[0] -ne $env:GITHUB_SHA)) { throw 'Branch changed during LFS upload; preserve the local commit and stop.' }
          git push origin HEAD:refs/heads/feat/phase2c-pcgex-cliff-topology
          if ($LASTEXITCODE -ne 0) { throw 'Fixed branch documentation fast-forward push failed.' }
          $remote = @(git ls-remote origin refs/heads/feat/phase2c-pcgex-cliff-topology)
          if ($LASTEXITCODE -ne 0 -or $remote.Count -ne 1 -or (($remote[0] -split '\s+')[0] -ne $commit)) { throw 'Published documentation head verification failed.' }
          [ordered]@{
            status = 'DOCS_AND_ORIGINAL_ZIP_PUBLISHED'
            publication_commit = $commit
            parent_commit = $parent
            capture_sha = $env:YACS_TPP_CAPTURE_SHA
            capture_run = [int64]$env:YACS_TPP_CAPTURE_RUN
            capture_attempt = [int]$env:YACS_TPP_CAPTURE_ATTEMPT
            archive_sha256 = $env:YACS_TPP_ARCHIVE_SHA256
            archive_size_bytes = [int64]$env:YACS_TPP_ARCHIVE_BYTES
            remote_lfs_readback = 'REMOTE_LFS_BYTES_VERIFIED'
            docs_url = "https://github.com/karnalooch/YetAnotherCyclingSim/tree/$commit/$docs"
            original_zip_url = "https://github.com/karnalooch/YetAnotherCyclingSim/blob/$commit/$archive"
            source_preserved = $true
            unreal_started = $false
            ci_status = 'PENDING_SEPARATE_AUTHORIZED_TRIGGER_GITHUB_TOKEN_PUSH_SUPPRESSES_WORKFLOWS'
            visual_acceptance = 'PENDING_REVIEW'
            performance_acceptance = 'NOT_MEASURED'
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:YACS_TPP_DOCS_ROOT 'docs-publication-receipt.json') -Encoding UTF8

      - name: Upload publication receipt and documentation guard evidence
        if: ${{ always() && env.YACS_TPP_DOCS_ROOT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sa-calobra-tpp-docs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.YACS_TPP_DOCS_ROOT }}/docs-export-receipt.json
            ${{ env.YACS_TPP_DOCS_ROOT }}/docs-publication-receipt.json
            ${{ env.YACS_TPP_DOCS_ROOT }}/server-lfs-readback.json
            ${{ env.YACS_TPP_DOCS_ROOT }}/docs-guards.txt
            ${{ env.YACS_TPP_DOCS_ROOT }}/source-run.json
            ${{ env.YACS_TPP_DOCS_ROOT }}/source-artifact.json
          if-no-files-found: warn
          retention-days: 90

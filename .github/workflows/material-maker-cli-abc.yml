name: Material Maker CLI A-B-C proof

on:
  push:
    branches:
      - "codex/363-landscape-material-foundation"
    paths:
      - ".github/workflows/material-maker-cli-abc.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Prepare pinned tools and three candidates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = 'D:\yacs\tool-cache\material-forge'
          $mmRoot = Join-Path $toolRoot 'material-maker-1.7'
          $mmExe = Get-ChildItem -LiteralPath $mmRoot -Filter 'material_maker.exe' -Recurse -ErrorAction Stop | Select-Object -First 1
          if ($null -eq $mmExe) { throw 'Pinned Material Maker release is missing.' }
          $mmInstall = $mmExe.Directory.FullName
          $example = Get-ChildItem -LiteralPath (Join-Path $mmInstall 'examples') -Filter 'dry_earth.ptex' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $example) {
            $example = Get-ChildItem -LiteralPath (Join-Path $mmInstall 'examples') -Filter '*.ptex' -ErrorAction Stop | Select-Object -First 1
          }
          if ($null -eq $example) { throw 'No upstream release example .ptex found.' }

          $python = Join-Path $toolRoot 'python\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $python)) { throw 'Material Forge Python venv missing.' }
          & $python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Python deps unavailable.' }

          $root = Join-Path $env:RUNNER_TEMP "mm-cli-interactive-$env:GITHUB_SHA"
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          $forge = Join-Path $root 'forge'
          & $python scripts/assets/material_forge.py author --material-maker $mmInstall --output $forge *> (Join-Path $root 'author.log')
          if ($LASTEXITCODE -ne 0) { throw 'Forge authoring failed before interactive CLI proof.' }

          $old = Resolve-Path 'worldgen/materials/material_maker/limestone_candidate/SaCalobra_PaleLimestone.ptex'
          $new = Resolve-Path (Join-Path $forge 'aged_mountain_asphalt/base/Material.ptex')

          "YACS_ABC_ROOT=$root" >> $env:GITHUB_ENV
          "YACS_MM_EXE=$($mmExe.FullName)" >> $env:GITHUB_ENV
          "YACS_MM_INSTALL=$mmInstall" >> $env:GITHUB_ENV
          "YACS_MM_UPSTREAM=$($example.FullName)" >> $env:GITHUB_ENV
          "YACS_MM_OLD=$($old.Path)" >> $env:GITHUB_ENV
          "YACS_MM_NEW=$($new.Path)" >> $env:GITHUB_ENV

      - name: Run A-B-C in logged-on desktop session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $explorers = @(Get-CimInstance Win32_Process -Filter "Name='explorer.exe'")
          if ($explorers.Count -eq 0) { throw 'No logged-on Windows desktop session.' }
          $explorer = $explorers | Sort-Object SessionId -Descending | Select-Object -First 1
          $owner = Invoke-CimMethod -InputObject $explorer -MethodName GetOwner
          if ($owner.ReturnValue -ne 0 -or [string]::IsNullOrWhiteSpace($owner.User)) {
            throw 'Cannot resolve interactive desktop owner.'
          }
          $userId = if ([string]::IsNullOrWhiteSpace($owner.Domain)) { $owner.User } else { "$($owner.Domain)\$($owner.User)" }

          $existing = @(Get-CimInstance Win32_Process | Where-Object {
            $_.Name -ieq 'material_maker.exe'
          } | Select-Object ProcessId, SessionId, CommandLine)
          $existing | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:YACS_ABC_ROOT 'preexisting-processes.json') -Encoding utf8

          $cases = @(
            @{
              Name = 'A_upstream_example'
              Graph = $env:YACS_MM_UPSTREAM
              Target = $null
            },
            @{
              Name = 'B_old_yacs_limestone'
              Graph = $env:YACS_MM_OLD
              Target = 'YACS/Textures'
            },
            @{
              Name = 'C_new_forge_asphalt'
              Graph = $env:YACS_MM_NEW
              Target = 'YACS/Textures'
            }
          )

          $results = @()
          foreach ($case in $cases) {
            $out = Join-Path $env:YACS_ABC_ROOT $case.Name
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            $parts = @(
              '--export-material',
              '-o', ('"' + $out + '"'),
              '--output-file', $case.Name
            )
            if ($null -ne $case.Target) {
              $parts += @('--target', ('"' + $case.Target + '"'))
            }
            $parts += ('"' + $case.Graph + '"')
            $arguments = $parts -join ' '

            $taskName = "YACS-MM-CLI-$($case.Name)"
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            $action = New-ScheduledTaskAction -Execute $env:YACS_MM_EXE -Argument $arguments -WorkingDirectory $env:YACS_MM_INSTALL
            $principal = New-ScheduledTaskPrincipal -UserId $userId -LogonType Interactive -RunLevel Limited
            Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Force | Out-Null

            $started = [DateTime]::UtcNow
            Start-ScheduledTask -TaskName $taskName
            $deadline = [DateTime]::UtcNow.AddSeconds(120)
            do {
              Start-Sleep -Milliseconds 500
              $state = (Get-ScheduledTask -TaskName $taskName).State
            } while ($state -eq 'Running' -and [DateTime]::UtcNow -lt $deadline)

            if ($state -eq 'Running') {
              Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              $timedOut = $true
            } else {
              $timedOut = $false
            }
            $info = Get-ScheduledTaskInfo -TaskName $taskName
            $files = @(
              Get-ChildItem -LiteralPath $out -File -ErrorAction SilentlyContinue |
                Select-Object Name, Length
            )
            $results += [ordered]@{
              case = $case.Name
              graph = $case.Graph
              target = $case.Target
              interactive_user = $userId
              interactive_session = $explorer.SessionId
              timed_out = $timedOut
              last_task_result = [uint32]$info.LastTaskResult
              elapsed_s = [math]::Round(([DateTime]::UtcNow - $started).TotalSeconds, 3)
              files = $files
            }
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          }

          $results | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:YACS_ABC_ROOT 'interactive-summary.json') -Encoding utf8
          $results | ConvertTo-Json -Depth 8 | Write-Host

      - name: Upload interactive A-B-C evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: material-maker-cli-interactive-${{ github.sha }}
          path: ${{ runner.temp }}/mm-cli-interactive-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

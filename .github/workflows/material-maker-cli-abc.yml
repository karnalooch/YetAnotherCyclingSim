name: Material Maker CLI relative-path proof

on:
  push:
    branches:
      - "codex/363-landscape-material-foundation"
    paths:
      - ".github/workflows/material-maker-cli-abc.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Prepare relative-path probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = 'D:\yacs\tool-cache\material-forge'
          $mmRoot = Join-Path $toolRoot 'material-maker-1.7'
          $mmExe = Get-ChildItem -LiteralPath $mmRoot -Filter 'material_maker.exe' -Recurse -ErrorAction Stop | Select-Object -First 1
          if ($null -eq $mmExe) { throw 'Pinned Material Maker release is missing.' }
          $mmInstall = $mmExe.Directory.FullName
          $python = Join-Path $toolRoot 'python\Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5 Pillow==12.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Python deps unavailable.' }

          $artifactRoot = Join-Path $env:RUNNER_TEMP "mm-relative-$env:GITHUB_SHA"
          Remove-Item -LiteralPath $artifactRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          $forge = Join-Path $artifactRoot 'forge'
          & $python scripts/assets/material_forge.py author --material-maker $mmInstall --output $forge *> (Join-Path $artifactRoot 'author.log')
          if ($LASTEXITCODE -ne 0) { throw 'Forge authoring failed.' }

          $probeName = "yacs-cli-probe-$env:GITHUB_SHA"
          $probe = Join-Path $mmInstall $probeName
          Remove-Item -LiteralPath $probe -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $probe | Out-Null
          Copy-Item -LiteralPath 'worldgen/materials/material_maker/limestone_candidate/SaCalobra_PaleLimestone.ptex' -Destination (Join-Path $probe 'old.ptex')
          Copy-Item -LiteralPath (Join-Path $forge 'aged_mountain_asphalt/base/Material.ptex') -Destination (Join-Path $probe 'new.ptex')

          "YACS_REL_ARTIFACT=$artifactRoot" >> $env:GITHUB_ENV
          "YACS_REL_PROBE=$probe" >> $env:GITHUB_ENV
          "YACS_REL_PROBE_NAME=$probeName" >> $env:GITHUB_ENV
          "YACS_MM_EXE=$($mmExe.FullName)" >> $env:GITHUB_ENV
          "YACS_MM_INSTALL=$mmInstall" >> $env:GITHUB_ENV

      - name: Run relative paths in interactive desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $explorers = @(Get-CimInstance Win32_Process -Filter "Name='explorer.exe'")
          if ($explorers.Count -eq 0) { throw 'No logged-on desktop session.' }
          $explorer = $explorers | Sort-Object SessionId -Descending | Select-Object -First 1
          $owner = Invoke-CimMethod -InputObject $explorer -MethodName GetOwner
          $userId = if ([string]::IsNullOrWhiteSpace($owner.Domain)) { $owner.User } else { "$($owner.Domain)\$($owner.User)" }

          $cases = @(
            @{ Name='A_upstream_relative'; Graph='examples/dry_earth.ptex'; Target=$null },
            @{ Name='B_old_yacs_relative'; Graph="$env:YACS_REL_PROBE_NAME/old.ptex"; Target='YACS/Textures' },
            @{ Name='C_new_forge_relative'; Graph="$env:YACS_REL_PROBE_NAME/new.ptex"; Target='YACS/Textures' }
          )
          $results = @()
          try {
            foreach ($case in $cases) {
              $outRel = "$env:YACS_REL_PROBE_NAME/out-$($case.Name)"
              $outAbs = Join-Path $env:YACS_MM_INSTALL $outRel
              New-Item -ItemType Directory -Force -Path $outAbs | Out-Null

              $parts = @('--export-material','-o',$outRel,'--output-file',$case.Name)
              if ($null -ne $case.Target) { $parts += @('--target',('"' + $case.Target + '"')) }
              $parts += $case.Graph
              $arguments = $parts -join ' '

              $taskName = "YACS-MM-REL-$($case.Name)"
              Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
              $action = New-ScheduledTaskAction -Execute $env:YACS_MM_EXE -Argument $arguments -WorkingDirectory $env:YACS_MM_INSTALL
              $principal = New-ScheduledTaskPrincipal -UserId $userId -LogonType Interactive -RunLevel Limited
              Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Force | Out-Null
              $started = [DateTime]::UtcNow
              Start-ScheduledTask -TaskName $taskName
              $deadline = [DateTime]::UtcNow.AddSeconds(120)
              do {
                Start-Sleep -Milliseconds 500
                $state = (Get-ScheduledTask -TaskName $taskName).State
              } while ($state -eq 'Running' -and [DateTime]::UtcNow -lt $deadline)
              if ($state -eq 'Running') {
                Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
                $timedOut = $true
              } else { $timedOut = $false }
              $info = Get-ScheduledTaskInfo -TaskName $taskName
              $files = @(Get-ChildItem -LiteralPath $outAbs -File -ErrorAction SilentlyContinue | Select-Object Name, Length)
              $results += [ordered]@{
                case=$case.Name
                graph=$case.Graph
                output=$outRel
                timed_out=$timedOut
                last_task_result=[uint32]$info.LastTaskResult
                elapsed_s=[math]::Round(([DateTime]::UtcNow-$started).TotalSeconds,3)
                files=$files
              }
              $copy = Join-Path $env:YACS_REL_ARTIFACT $case.Name
              New-Item -ItemType Directory -Force -Path $copy | Out-Null
              Copy-Item -LiteralPath (Join-Path $outAbs '*') -Destination $copy -Force -ErrorAction SilentlyContinue
              Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            }
          }
          finally {
            Remove-Item -LiteralPath $env:YACS_REL_PROBE -Recurse -Force -ErrorAction SilentlyContinue
          }
          $results | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $env:YACS_REL_ARTIFACT 'relative-summary.json') -Encoding utf8
          $results | ConvertTo-Json -Depth 8 | Write-Host

      - name: Upload relative-path evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: material-maker-cli-relative-${{ github.sha }}
          path: ${{ runner.temp }}/mm-relative-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7

name: Stage 3G authoring one-shot

on:
  push:
    branches: [main]
    paths:
      - ".github/STAGE3G_AUTHORING_ONE_SHOT"

permissions:
  contents: read

concurrency:
  group: yacs-stage3g-authoring-one-shot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  author:
    name: Stage 3G authoring on yacs-ue58
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii

          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

          Write-Host "Using isolated Git config: $isolated"
          git config --global --list --show-origin

      - name: Require trusted main trigger and pinned Stage 3G target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 1591ba1cda79a2beee494854e2cd0050fef822df
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw "Stage 3G authoring one-shot must run from main."
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $url = "https://api.github.com/repos/${{ github.repository }}/branches/feat%2Fstage3g-reference-environment"
          $branch = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
          $resolved = [string]$branch.commit.sha
          if ($resolved -ne $env:TARGET_SHA) {
            throw "Stage 3G branch moved: resolved '$resolved', pinned '$env:TARGET_SHA'."
          }

      - name: Checkout pinned Stage 3G revision with full LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1591ba1cda79a2beee494854e2cd0050fef822df
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: false

      - name: Verify full-LFS checkout provenance
        shell: pwsh
        env:
          TARGET_SHA: 1591ba1cda79a2beee494854e2cd0050fef822df
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:TARGET_SHA) {
            throw "checkout HEAD '$actual' != pinned Stage 3G SHA '$env:TARGET_SHA'."
          }
          # The runner intentionally hides global/system Git config. Git LFS
          # normally stores its smudge/process filters there, so install the
          # filters repo-locally and materialize the objects already fetched by
          # actions/checkout before Unreal touches any binary package.
          git lfs install --local
          if ($LASTEXITCODE -ne 0) {
            throw 'Stage 3G failed to install repo-local Git LFS filters.'
          }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) {
            throw 'Stage 3G failed to materialize fetched Git LFS objects.'
          }

          if (git status --porcelain) {
            throw 'Stage 3G checkout is not clean before authoring.'
          }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) {
            throw 'Stage 3G full-LFS checkout failed git lfs fsck.'
          }

          $lfsPaths = @(git lfs ls-files --name-only)
          if ($LASTEXITCODE -ne 0 -or $lfsPaths.Count -eq 0) {
            throw 'Stage 3G expected tracked Git LFS assets but could not enumerate them.'
          }

          $pointerSignature = 'version https://git-lfs.github.com/spec/v1'
          $remainingPointers = [System.Collections.Generic.List[string]]::new()
          foreach ($path in $lfsPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Tracked Git LFS path is missing after checkout: $path"
            }

            $stream = [System.IO.File]::OpenRead((Resolve-Path -LiteralPath $path).Path)
            try {
              $length = [Math]::Min(256, [int]$stream.Length)
              $buffer = New-Object byte[] $length
              if ($length -gt 0) {
                [void]$stream.Read($buffer, 0, $length)
              }
              $prefix = [System.Text.Encoding]::UTF8.GetString($buffer)
            }
            finally {
              $stream.Dispose()
            }

            if ($prefix.StartsWith($pointerSignature, [System.StringComparison]::Ordinal)) {
              [void]$remainingPointers.Add($path)
            }
          }

          if ($remainingPointers.Count -gt 0) {
            throw ("Stage 3G Git LFS checkout left pointer files in the working tree: {0}" -f ($remainingPointers -join ', '))
          }
          Write-Host "Stage 3G full-LFS materialization: PASS ($($lfsPaths.Count) files)."

      - name: Author Stage 3G binary source state
        shell: pwsh
        env:
          TARGET_SHA: 1591ba1cda79a2beee494854e2cd0050fef822df
        run: |
          $ErrorActionPreference = 'Stop'
          $args = @{
            ExpectedBranch = 'HEAD'
            ExpectedHead = $env:TARGET_SHA
            ArtifactRoot = 'Saved/RuntimeProof/CI/Stage3GAuthoring'
          }
          ./scripts/ue/Invoke-YacsStage3GAuthoring.ps1 @args

          git status --short | Set-Content -LiteralPath 'Saved/RuntimeProof/CI/Stage3GAuthoring/worktree_status.txt' -Encoding UTF8
          git diff --name-only | Set-Content -LiteralPath 'Saved/RuntimeProof/CI/Stage3GAuthoring/changed_tracked_files.txt' -Encoding UTF8

      - name: Upload Stage 3G proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-authoring-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GAuthoring/**/*.json
            Saved/RuntimeProof/CI/Stage3GAuthoring/**/*.txt
            Saved/RuntimeProof/CI/Stage3GAuthoring/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload authored Stage 3G source assets
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-authored-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Content/Prototype/Environment/Stage3G/**
            Content/Prototype/Maps/L_CyclingTest.umap
            Saved/RuntimeProof/CI/Stage3GAuthoring/worktree_status.txt
            Saved/RuntimeProof/CI/Stage3GAuthoring/changed_tracked_files.txt
          if-no-files-found: error
          retention-days: 3

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard
          git clean -ffdx
          if (git status --porcelain) {
            throw 'Stage 3G one-shot workspace is still dirty after cleanup.'
          }
          Write-Host 'Stage 3G one-shot cleanup: PASS'

name: Fail-closed PR orchestrator

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited, closed]
  workflow_run:
    workflows: ["CyclingSim CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: yacs-pr-orchestrator-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  orchestrate:
    name: Orchestrate safe PR lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout trusted default branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Evaluate and advance eligible PRs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/ci/pr_orchestrator.py

name: PR474 evidence cleanup

on:
  push:
    branches: [codex/365-world-graph]
    paths: [.github/workflows/pr474-evidence-cleanup.yml]

permissions:
  contents: write

concurrency:
  group: pr474-evidence-cleanup
  cancel-in-progress: false

jobs:
  archive-candidate:
    if: github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/codex/365-world-graph'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout exact cleanup head and reviewed migration parent
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          fetch-depth: 2

      - name: Extract the two unchanged migration scripts from their immutable reviewed commit
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import textwrap
          source = subprocess.check_output([
              'git', 'show',
              '888ecd072b6cd9fa6d896ec4dc6a5d89fbce42e4:.github/workflows/pr474-evidence-cleanup.yml'
          ], text=True)
          blocks = re.findall(r"          python - <<'PY'\n(.*?)          PY\n", source, re.S)
          if len(blocks) != 2:
              raise SystemExit('PINNED_MIGRATION_BLOCK_COUNT_MISMATCH')
          for name, block in zip(('pr474-prepare.py', 'pr474-publish.py'), blocks):
              code = textwrap.dedent(block)
              compile(code, name, 'exec')
              pathlib.Path(os.environ['RUNNER_TEMP'], name).write_text(code, encoding='utf-8')
          print('Reviewed migration scripts extracted; no branch refs or repository files changed.')
          PY

      - name: Verify architecture and negative tests before preparing changes
        run: |
          python scripts/ci/test_final_architecture_contract.py
          python scripts/ci/test_evidence_storage.py

      - name: Prepare byte-identical archives in the isolated checkout
        run: python "$RUNNER_TEMP/pr474-prepare.py"

      - name: Verify complete candidate before publishing any Git objects
        run: |
          python scripts/ci/check_evidence_storage.py
          python scripts/ci/test_evidence_storage.py
          python scripts/ci/test_final_architecture_contract.py
          python scripts/ci/check_docs_index.py
          python scripts/ci/test_workflow_lifecycle.py
          python scripts/ci/test_script_test_discovery.py
          git diff --cached --check
          git diff --cached --stat

      - name: Publish detached candidate objects only, never update a branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/pr474-publish.py"

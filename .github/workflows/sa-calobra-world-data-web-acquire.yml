name: Sa Calobra Web Source Acquire

on:
  push:
    branches:
      - feature/335-world-data-stack
    paths:
      - .github/workflows/sa-calobra-world-data-web-acquire.yml

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Install requests
        run: python -m pip install --disable-pip-version-check --only-binary=:all: requests==2.32.5

      - name: Validate plan
        run: python scripts/assets/plan_sa_calobra_world_data.py --json

      - name: Acquire
        run: |
          mkdir -p "$RUNNER_TEMP/sa-calobra-working-v1"
          mkdir -p "$GITHUB_WORKSPACE/Saved/WorldDataAcquisition"
          python scripts/assets/acquire_sa_calobra_world_data.py \
            --manifest worldgen/terrain/benchmarks/sa_calobra/world_data/working_space_sources.json \
            --persistent-root "$RUNNER_TEMP/sa-calobra-working-v1" \
            --receipt-out "$GITHUB_WORKSPACE/Saved/WorldDataAcquisition"

      - name: Upload source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sa-calobra-working-space-web-sources-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sa-calobra-working-v1/**
            Saved/WorldDataAcquisition/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

name: Sa Calobra Web Source Acquire

on:
  push:
    branches:
      - feature/335-world-data-stack
    paths:
      - '.github/workflows/sa-calobra-world-data-web-acquire.yml'

permissions:
  contents: read

jobs:
  acquire-web-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false

      - name: Install acquisition dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: requests==2.32.5

      - name: Validate working-space manifest
        run: python scripts/assets/plan_sa_calobra_world_data.py --json

      - name: Acquire non-gated working-space sources
        run: |
          mkdir -p "$RUNNER_TEMP/sa-calobra-working-v1" "$GITHUB_WORKSPACE/Saved/WorldDataAcquisition"
          python scripts/assets/acquire_sa_calobra_world_data.py \
            --manifest worldgen/terrain/benchmarks/sa_calobra/world_data/working_space_sources.json \
            --persistent-root "$RUNNER_TEMP/sa-calobra-working-v1" \
            --receipt-out "$GITHUB_WORKSPACE/Saved/WorldDataAcquisition"

      - name: Inventory downloaded bytes
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root=Path(os.environ["RUNNER_TEMP"])/"sa-calobra-working-v1"
          rows=[]
          if root.exists():
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  h=hashlib.sha256()
                  with p.open("rb") as f:
                      for chunk in iter(lambda:f.read(1024*1024),b""):
                          h.update(chunk)
                  rows.append({
                      "path":str(p.relative_to(root)).replace("\\","/"),
                      "size_bytes":p.stat().st_size,
                      "sha256":h.hexdigest(),
                  })
          out=Path("Saved/WorldDataAcquisition/web-source-inventory.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps({"file_count":len(rows),"total_bytes":sum(r["size_bytes"] for r in rows),"files":rows},indent=2)+"\n")
          print(out.read_text())
          PY

      - name: Upload working-space source material
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sa-calobra-working-space-web-sources-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sa-calobra-working-v1/**
            Saved/WorldDataAcquisition/**
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

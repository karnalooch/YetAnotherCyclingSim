name: Passo Giau Veneto LiDAR source probe

on:
  push:
    branches:
      - feat/stage3g-r4-1-passo-giau-landscape-spike
    paths:
      - 'scripts/assets/probe_veneto_lidar_dtm.py'
      - '.github/workflows/passo-giau-veneto-lidar-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false

      - name: Probe official Veneto LiDAR DTM index
        run: python scripts/assets/probe_veneto_lidar_dtm.py

      - name: Show probe report
        if: ${{ always() }}
        run: |
          if [ -f Saved/RuntimeProof/CI/Stage3GR4_1/VenetoLidarProbe/veneto-lidar-wfs-probe.json ]; then
            cat Saved/RuntimeProof/CI/Stage3GR4_1/VenetoLidarProbe/veneto-lidar-wfs-probe.json
          fi

      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passo-giau-veneto-lidar-probe-${{ github.run_id }}
          path: Saved/RuntimeProof/CI/Stage3GR4_1/VenetoLidarProbe/**
          if-no-files-found: warn
          retention-days: 14

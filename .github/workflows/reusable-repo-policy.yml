name: Reusable repository policy

on:
  workflow_call:

permissions: {}

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          lfs: false

      - name: Verify repository and Git LFS policy
        run: python scripts/ci/repo_guard.py

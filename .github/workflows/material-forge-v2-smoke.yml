name: Material Forge visual v2 smoke

on:
  push:
    branches:
      - "feat/387-material-forge-visual-v2"
    paths:
      - ".github/workflows/material-forge-v2-smoke.yml"
      - "scripts/assets/material_forge.py"
      - "scripts/assets/test_material_forge.py"
      - "worldgen/materials/material_forge/families.json"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.5 Pillow==12.3.0
      - run: python -m py_compile scripts/assets/material_forge.py scripts/assets/test_material_forge.py
      - run: python scripts/assets/test_material_forge.py

name: Stage 3G R1 author and persist assets

on:
  push:
    branches:
      - feat/stage3g-real-assets-r1
    paths:
      - '.github/workflows/stage3g-r1-author-persist.yml'
      - 'YetAnotherCyclingSim.uproject'
      - 'scripts/assets/stage3g_polyhaven.json'
      - 'scripts/assets/download_stage3g_assets.py'
      - 'scripts/ue/Invoke-YacsStage3GAuthoring.ps1'
      - 'scripts/ue/Invoke-YacsStage3GProof.ps1'
      - 'scripts/ue/stage3g_import_source_assets.py'
      - 'scripts/ue/stage3g_author_materials.py'
      - 'Source/YetAnotherCyclingSim/Public/Cycling/Stage3PrototypeTerrainActor.h'
      - 'Source/YetAnotherCyclingSim/Private/Cycling/Stage3PrototypeTerrainActor.cpp'
      - 'Source/YetAnotherCyclingSim/Private/Editor/CyclingStage3RouteSetupCommandlet.cpp'
      - 'Source/YetAnotherCyclingSim/Private/Tests/Stage3PrototypeTerrain.spec.cpp'

permissions:
  contents: write

concurrency:
  group: stage3g-r1-author-persist-${{ github.repository }}
  cancel-in-progress: false

jobs:
  author-persist:
    if: ${{ github.repository == 'karnalooch/YetAnotherCyclingSim' && github.ref == 'refs/heads/feat/stage3g-real-assets-r1' }}
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 180
    steps:
      - name: Isolate self-hosted Git configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'yacs-global.gitconfig'
          Set-Content -LiteralPath $isolated -Value '' -Encoding ascii
          $env:GIT_CONFIG_GLOBAL = $isolated
          $env:GIT_CONFIG_NOSYSTEM = '1'
          "GIT_CONFIG_GLOBAL=$isolated" >> $env:GITHUB_ENV
          "GIT_CONFIG_NOSYSTEM=1" >> $env:GITHUB_ENV

      - name: Checkout exact trusted R1 source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          clean: true
          persist-credentials: false

      - name: Verify source checkout and LFS integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '${{ github.sha }}') {
            throw 'Stage 3G R1 authoring checkout is not exact SHA.'
          }
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw 'git lfs install failed.' }
          git lfs checkout
          if ($LASTEXITCODE -ne 0) { throw 'git lfs checkout failed.' }
          git lfs fsck
          if ($LASTEXITCODE -ne 0) { throw 'git lfs fsck failed.' }
          if (git status --porcelain) {
            throw 'Stage 3G R1 source checkout is dirty before authoring.'
          }
          python --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Python is required on the trusted Stage 3G authoring runner.'
          }

      - name: Author imported assets and deterministic environment
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsStage3GAuthoring.ps1 `
            -ExpectedBranch HEAD `
            -ExpectedHead '${{ github.sha }}' `
            -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR1/Authoring'

      - name: Prove authored R1 state before persistence
        shell: pwsh
        run: |
          ./scripts/ue/Invoke-YacsStage3GProof.ps1 `
            -ExpectedBranch HEAD `
            -ExpectedHead '${{ github.sha }}' `
            -ArtifactRoot 'Saved/RuntimeProof/CI/Stage3GR1/PreCommitProof' `
            -SkipBuild

      - name: Validate mutation scope and stage LFS assets
        id: persist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status = @(git status --porcelain=v1 --untracked-files=all)
          $changed = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $status) {
            if (-not $line -or $line.Length -lt 4) { continue }
            $path = $line.Substring(3).Trim()
            if ($path -match ' -> ') {
              $path = ($path -split ' -> ')[-1].Trim()
            }
            [void]$changed.Add($path)
          }

          if ($changed.Count -eq 0) {
            throw 'Stage 3G R1 authoring produced no source mutations to persist.'
          }

          $allowedPrefix = 'Content/Prototype/Environment/Stage3G/'
          $allowedMap = 'Content/Prototype/Maps/L_CyclingTest.umap'
          $unexpected = @(
            $changed | Where-Object {
              $_ -ne $allowedMap -and -not $_.StartsWith($allowedPrefix)
            }
          )
          if ($unexpected.Count -gt 0) {
            throw ("Stage 3G R1 write-back refused unexpected paths: {0}" -f ($unexpected -join ', '))
          }

          $required = @(
            'Content/Prototype/Environment/Stage3G/Imported/Textures/T_Stage3G_Meadow_BaseColor.uasset',
            'Content/Prototype/Environment/Stage3G/Imported/Textures/T_Stage3G_ForestGround_BaseColor.uasset',
            'Content/Prototype/Environment/Stage3G/Imported/Textures/T_Stage3G_HighAlpine_BaseColor.uasset',
            'Content/Prototype/Environment/Stage3G/Imported/Meshes/SM_Stage3G_Boulder.uasset',
            'Content/Prototype/Environment/Stage3G/Materials/MI_Stage3G_Grass.uasset',
            'Content/Prototype/Environment/Stage3G/Materials/MI_Stage3G_Forest.uasset',
            'Content/Prototype/Environment/Stage3G/Materials/MI_Stage3G_Rock.uasset',
            'Content/Prototype/Maps/L_CyclingTest.umap'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required Stage 3G R1 authored asset is missing: $path"
            }
          }

          git add -- 'Content/Prototype/Environment/Stage3G' 'Content/Prototype/Maps/L_CyclingTest.umap'
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to stage Stage 3G R1 authored assets.'
          }

          $staged = @(git diff --cached --name-only)
          if ($staged.Count -eq 0) {
            throw 'No Stage 3G R1 source assets are staged after authoring.'
          }
          $unexpectedStaged = @(
            $staged | Where-Object {
              $_ -ne $allowedMap -and -not $_.StartsWith($allowedPrefix)
            }
          )
          if ($unexpectedStaged.Count -gt 0) {
            throw ("Staged Stage 3G R1 paths escaped the allowlist: {0}" -f ($unexpectedStaged -join ', '))
          }

          foreach ($path in $staged) {
            if ($path -match '\.(uasset|umap)$') {
              $filter = (git check-attr filter -- $path) -join ''
              if ($LASTEXITCODE -ne 0 -or $filter -notmatch 'filter: lfs') {
                throw "Binary Stage 3G R1 source is not covered by Git LFS: $path"
              }
            }
          }

          git diff --cached --name-only | Set-Content -LiteralPath 'Saved/RuntimeProof/CI/Stage3GR1/staged_source_paths.txt' -Encoding UTF8
          "changed_count=$($changed.Count)" >> $env:GITHUB_OUTPUT
          "staged_count=$($staged.Count)" >> $env:GITHUB_OUTPUT

      - name: Commit and push only proven authored assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(stage3g): persist R1 imported Alpine assets'
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to commit Stage 3G R1 authored assets.'
          }

          $authBytes = [System.Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN")
          $basic = [Convert]::ToBase64String($authBytes)
          $configKey = 'http.https://github.com/.extraheader'
          try {
            git config --local $configKey "AUTHORIZATION: basic $basic"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to push proven Stage 3G R1 authored assets.'
            }
          }
          finally {
            git config --local --unset-all $configKey 2>$null
          }

          Write-Host ("Stage 3G R1 authored commit: {0}" -f (git rev-parse HEAD).Trim())

      - name: Upload R1 authoring and visual proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage3g-r1-author-persist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Saved/RuntimeProof/CI/Stage3GR1/**/*.json
            Saved/RuntimeProof/CI/Stage3GR1/**/*.txt
            Saved/RuntimeProof/CI/Stage3GR1/**/*.log
            Saved/RuntimeProof/CI/Stage3GR1/**/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Clean self-hosted workspace
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git reset --hard
          git clean -ffdx
          if (git status --porcelain) {
            throw 'Stage 3G R1 author/persist workspace is still dirty after cleanup.'
          }
          Write-Host 'Stage 3G R1 author/persist cleanup: PASS'

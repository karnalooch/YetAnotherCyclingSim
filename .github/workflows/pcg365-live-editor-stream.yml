name: PCG365 interactive red Level Editor stream

on:
  push:
    branches: [codex/365-world-graph]

permissions:
  contents: read
  actions: read

jobs:
  await_ci:
    name: Await exact-SHA protected CI and Blender before persistent Editor
    if: >-
      github.event_name == 'push' &&
      github.actor == github.repository_owner &&
      github.repository == 'karnalooch/YetAnotherCyclingSim' &&
      contains(github.event.head_commit.message, '[pcg365-live-stream]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify matching successful hosted CI and independent Material Forge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for poll in $(seq 1 90); do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=pull_request&per_page=50")
            ready=0
            for name in "CyclingSim CI" "Blender Material Forge reference proof"; do
              row=$(jq -r --arg sha "$GITHUB_SHA" --arg name "$name" '[.workflow_runs[] | select(.name == $name and .head_sha == $sha)] | sort_by(.created_at) | last | if . == null then "" else "\(.id)|\(.status)|\(.conclusion // "pending")" end' <<< "$runs")
              if [[ -z "$row" ]]; then continue; fi
              IFS='|' read -r id state outcome <<< "$row"
              if [[ "$state" == completed && "$outcome" != success ]]; then
                echo "::error::$name $id completed with $outcome; no persistent Editor"
                exit 1
              fi
              if [[ "$state" == completed && "$outcome" == success ]]; then
                ready=$((ready+1))
              fi
            done
            if [[ "$ready" -eq 2 ]]; then exit 0; fi
            sleep 20
          done
          echo "::error::The matching CI and Forge checks did not complete"
          exit 1

  stream:
    name: Open PCG365 red markers in the live Level Editor browser stream
    needs: await_ci
    if: ${{ needs.await_ci.result == 'success' }}
    concurrency:
      group: yacs-unreal-ci-${{ github.repository }}
      cancel-in-progress: false
    runs-on: [self-hosted, yacs-ue58]
    timeout-minutes: 16
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - name: Checkout exact launcher without source-world mutation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: stream365-${{ github.run_id }}-${{ github.run_attempt }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Offline CPU and PowerShell preflight before taking host
        shell: pwsh
        working-directory: stream365-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/ci/Test-YacsCodeOnlyCheckout.ps1
          $py='D:/yacs/tool-cache/material-forge/python/Scripts/python.exe'
          if (-not (Test-Path -LiteralPath $py -PathType Leaf)) { throw 'Pinned Python missing' }
          & $py -B -m unittest scripts.ue.test_pcg365_red_marker_preview
          if ($LASTEXITCODE -ne 0) { throw 'Five real-site source test contract failed' }
          & $py -B -m py_compile scripts/ue/pcg365_red_marker_preview.py scripts/ue/bootstrap_pcg365_red_stream.py
          if ($LASTEXITCODE -ne 0) { throw 'UE Python bootstrap invalid' }
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location).Path 'scripts/ue/Start-YacsPcg365RedStream.ps1'),
            [ref]$tokens,[ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors.Message -join '; ') }
          # Validate the *actual* historical successful native marker using
          # PowerShell 7's JSON integer type, before starting another Editor.
          $tokens=$null; $errors=$null
          [Management.Automation.Language.Parser]::ParseFile(
            (Join-Path (Get-Location).Path 'scripts/ue/Assert-YacsPcg365NativeCompletion.ps1'),
            [ref]$tokens,[ref]$errors) | Out-Null
          if (@($errors).Count -gt 0) { throw ($errors.Message -join '; ') }
          . ./scripts/ue/Assert-YacsPcg365NativeCompletion.ps1
          $oldHead='d361e7651d16ff424ae4e812c7d8cbe1fe81d662'
          $markerPath="D:/yacs/work/pcg365/$oldHead/38278235093-1/proof/collection-contact-review/launcher-completed.json"
          $marker=Get-Content -LiteralPath $markerPath -Raw | ConvertFrom-Json
          Assert-YacsPcg365NativeCompletion -Receipt $marker -ExpectedHead $oldHead
          foreach ($integerZero in @([int]0,[long]0)) {
            $test=$marker | ConvertTo-Json | ConvertFrom-Json
            $test.exit_code=$integerZero
            Assert-YacsPcg365NativeCompletion -Receipt $test -ExpectedHead $oldHead
          }
          foreach ($invalidExit in @('0',[bool]$false,[double]0.0,[long]1,[long]-1073741819)) {
            $test=$marker | ConvertTo-Json | ConvertFrom-Json
            $test.exit_code=$invalidExit
            $rejected=$false
            try { Assert-YacsPcg365NativeCompletion -Receipt $test -ExpectedHead $oldHead } catch { $rejected=$true }
            if (-not $rejected) { throw 'Unsafe native exit-code shape was accepted' }
          }
          Write-Host "Native marker gate PASS (actual $($marker.exit_code.GetType().FullName), Int32/Int64 allowed; forged exits rejected)"
      - name: Open authenticated five-red-marker Level Editor and test browser frames
        shell: pwsh
        working-directory: stream365-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/ue/Start-YacsPcg365RedStream.ps1 -ExpectedHead $env:GITHUB_SHA -SessionToken '${{ github.run_id }}-${{ github.run_attempt }}'
      - name: Preserve owned session receipt and receiving video proof
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: pcg365-red-live-editor-${{ github.sha }}-${{ github.run_attempt }}
          path: D:/yacs/work/pcg365-live-review/${{ github.sha }}/${{ github.run_id }}-${{ github.run_attempt }}/**
          if-no-files-found: warn
          retention-days: 7

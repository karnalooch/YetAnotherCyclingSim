version: 2.1

# YACS CI migrated to GitHub Actions.
#
# This file is intentionally a zero-workload tombstone while the CircleCI
# project remains connected externally. The only workflow is disabled by
# default and performs no checkout, cache, workspace, artifact or UE work.
#
# After the project is disconnected in CircleCI, this file can be deleted.
parameters:
  retired_noop:
    type: boolean
    default: false

jobs:
  retired:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: YACS CI moved to GitHub Actions
          command: echo "YACS CI is retired on CircleCI; use GitHub Actions."

workflows:
  retired:
    when: << pipeline.parameters.retired_noop >>
    jobs:
      - retired

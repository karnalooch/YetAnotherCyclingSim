version: 2.1

parameters:
  windows_probe:
    type: boolean
    default: false
  ue_cache_seed:
    type: boolean
    default: false
  ue_canary:
    type: boolean
    default: false
  ue_seed_resource_class:
    type: string
    default: "karnalooch/yacs-ue58-seed"
  ue_seed_working_directory:
    type: string
    default: 'D:\CircleCI\YACS-Runner\Workdir'
  ue_cache_key:
    type: string
    default: "yacs-ue58-win64-v4"

jobs:
  windows-probe:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout

      - run:
          name: Probe Windows executor for YACS
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            powershell.exe -ExecutionPolicy Bypass -File scripts/ci/Invoke-CircleCiWindowsProbe.ps1

      - store_artifacts:
          path: Saved/RuntimeProof/CI/CircleCI-Windows-Probe
          destination: circleci-windows-probe

  ue-cache-seed:
    machine: true
    resource_class: << pipeline.parameters.ue_seed_resource_class >>
    working_directory: << pipeline.parameters.ue_seed_working_directory >>
    environment:
      TEMP: 'D:\CircleCI\YACS-Runner\Temp'
      TMP: 'D:\CircleCI\YACS-Runner\Temp'
      PATH: 'C:\Program Files\Git\usr\bin;C:\Program Files\Git\cmd;C:\Program Files\PowerShell\7;C:\Windows\System32\WindowsPowerShell\v1.0;C:\Windows\System32;C:\Windows'
    steps:
      - checkout

      - run:
          name: Require trusted main branch seed
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            if ($env:CIRCLE_BRANCH -ne 'main') {
              throw "UE cache seed must run from main; actual branch is '$env:CIRCLE_BRANCH'."
            }
            New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
            if (-not $env:TEMP.StartsWith('D:\', [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Self-hosted UE seed TEMP must stay on D:, actual '$env:TEMP'."
            }
            if (-not $env:TMP.StartsWith('D:\', [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "Self-hosted UE seed TMP must stay on D:, actual '$env:TMP'."
            }
            Write-Host ("Self-hosted seed scratch: TEMP={0}; TMP={1}" -f $env:TEMP, $env:TMP)

      - run:
          name: Measure and package local UE 5.8
          shell: powershell.exe -ExecutionPolicy Bypass
          no_output_timeout: 45m
          command: |
            $workdir = (Get-Location).Path
            $runnerRoot = Split-Path -Parent $workdir
            $persistentSeedRoot = Join-Path $runnerRoot 'Persistent\UE58Seed'
            $cacheSeedRoot = Join-Path $workdir 'Saved\RuntimeProof\CI\UE58Seed'

            Write-Host ("Persistent UE seed root: {0}" -f $persistentSeedRoot)
            powershell.exe -ExecutionPolicy Bypass -File scripts/ci/Prepare-YacsUe58Seed.ps1 -OutputRoot $persistentSeedRoot -CreateArchive

            New-Item -ItemType Directory -Path $cacheSeedRoot -Force | Out-Null
            $persistentArchive = Join-Path $persistentSeedRoot 'ue58-win64.zip'
            $persistentManifest = Join-Path $persistentSeedRoot 'ue58-win64-manifest.json'
            $cacheArchive = Join-Path $cacheSeedRoot 'ue58-win64.zip'
            $cacheManifest = Join-Path $cacheSeedRoot 'ue58-win64-manifest.json'

            if (Test-Path -LiteralPath $cacheArchive) {
              Remove-Item -LiteralPath $cacheArchive -Force
            }
            New-Item -ItemType HardLink -Path $cacheArchive -Target $persistentArchive | Out-Null
            Copy-Item -LiteralPath $persistentManifest -Destination $cacheManifest -Force
            Write-Host ("Staged persistent UE seed into CircleCI cache path via hardlink: {0}" -f $cacheArchive)

      - run:
          name: Verify cache staging path and payload
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            if (-not $env:CIRCLE_WORKING_DIRECTORY) {
              throw 'CIRCLE_WORKING_DIRECTORY is not set.'
            }

            $actualWorkingDirectory = [System.IO.Path]::GetFullPath((Get-Location).Path).TrimEnd('\')
            $circleWorkingDirectory = [System.IO.Path]::GetFullPath($env:CIRCLE_WORKING_DIRECTORY).TrimEnd('\')
            if ($actualWorkingDirectory -ne $circleWorkingDirectory) {
              throw ("CircleCI working-directory mismatch: shell='{0}', cache='{1}'." -f $actualWorkingDirectory, $circleWorkingDirectory)
            }

            $cacheSeedRoot = Join-Path $circleWorkingDirectory 'Saved\RuntimeProof\CI\UE58Seed'
            $cacheArchive = Join-Path $cacheSeedRoot 'ue58-win64.zip'
            $cacheManifest = Join-Path $cacheSeedRoot 'ue58-win64-manifest.json'
            if (-not (Test-Path -LiteralPath $cacheArchive -PathType Leaf)) {
              throw "Staged UE cache archive is missing: $cacheArchive"
            }
            if (-not (Test-Path -LiteralPath $cacheManifest -PathType Leaf)) {
              throw "Staged UE cache manifest is missing: $cacheManifest"
            }

            $manifest = Get-Content -LiteralPath $cacheManifest -Raw | ConvertFrom-Json
            $archiveBytes = (Get-Item -LiteralPath $cacheArchive).Length
            if (-not [bool]$manifest.ArchiveCreated -or -not [bool]$manifest.ArchiveIntegrityValidated) {
              throw 'Staged UE cache manifest is not integrity-validated.'
            }
            if ([int64]$manifest.ArchiveBytes -ne [int64]$archiveBytes) {
              throw ("Staged UE cache size mismatch: manifest={0}, actual={1}." -f $manifest.ArchiveBytes, $archiveBytes)
            }
            if ($archiveBytes -lt 1GB) {
              throw ("Staged UE cache archive is implausibly small: {0} bytes." -f $archiveBytes)
            }
            Write-Host ("CircleCI cache staging verified: {0:N3} GiB at {1}" -f ($archiveBytes / 1GB), $cacheArchive)

      - run:
          name: Verify CircleCI workspace gzip prerequisite from Git for Windows
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            $gitUsrBin = 'C:\Program Files\Git\usr\bin'
            $gzipPath = Join-Path $gitUsrBin 'gzip.exe'
            $tarPath = Join-Path $gitUsrBin 'tar.exe'

            if (-not (Test-Path -LiteralPath $gzipPath -PathType Leaf)) {
              throw "Git for Windows gzip prerequisite is missing: $gzipPath"
            }
            if (-not (Test-Path -LiteralPath $tarPath -PathType Leaf)) {
              throw "Git for Windows tar prerequisite is missing: $tarPath"
            }

            $gzipCommand = Get-Command gzip.exe -ErrorAction Stop
            $tarCommand = Get-Command tar.exe -ErrorAction Stop
            if ($gzipCommand.Source -ne $gzipPath) {
              throw ("Unexpected gzip resolved from PATH: {0}" -f $gzipCommand.Source)
            }

            Write-Host ("gzip prerequisite: {0}" -f $gzipCommand.Source)
            Write-Host ("tar prerequisite : {0}" -f $tarCommand.Source)
            & $gzipCommand.Source --version | Select-Object -First 1
            if ($LASTEXITCODE -ne 0) {
              throw 'gzip prerequisite version probe failed.'
            }

      - persist_to_workspace:
          root: 'D:\CircleCI\YACS-Runner\Workdir\Saved\RuntimeProof\CI\UE58Seed'
          paths:
            - ue58-win64.zip
            - ue58-win64-manifest.json

      - store_artifacts:
          path: Saved/RuntimeProof/CI/UE58Seed/ue58-win64-manifest.json
          destination: ue58-seed-manifest.json

  ue-cache-publish:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    retention:
      caches: 1d
    steps:
      - attach_workspace:
          at: 'C:\YacsUe58Seed'

      - run:
          name: Verify workspace UE seed before cache publish
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            $seedRoot = 'C:\YacsUe58Seed'
            $archive = Join-Path $seedRoot 'ue58-win64.zip'
            $manifestPath = Join-Path $seedRoot 'ue58-win64-manifest.json'

            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Workspace UE seed archive missing: $archive"
            }
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              throw "Workspace UE seed manifest missing: $manifestPath"
            }

            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $archiveBytes = (Get-Item -LiteralPath $archive).Length
            if ($archiveBytes -lt 1GB) {
              throw ("Workspace UE seed archive is implausibly small: {0} bytes." -f $archiveBytes)
            }
            if ([int64]$manifest.ArchiveBytes -ne [int64]$archiveBytes) {
              throw ("Workspace UE seed size mismatch: manifest={0}, actual={1}." -f $manifest.ArchiveBytes, $archiveBytes)
            }
            if (-not [bool]$manifest.ArchiveCreated -or -not [bool]$manifest.ArchiveIntegrityValidated) {
              throw 'Workspace UE seed manifest is not integrity-validated.'
            }

            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            $stream = [System.IO.File]::OpenRead($archive)
            try {
              $hashBytes = $sha256.ComputeHash($stream)
              $actualHash = ([System.BitConverter]::ToString($hashBytes)).Replace('-', '').ToLowerInvariant()
            } finally {
              $stream.Dispose()
              $sha256.Dispose()
            }
            if ($actualHash -ne [string]$manifest.ArchiveSha256) {
              throw 'Workspace UE seed SHA256 mismatch.'
            }

            Write-Host ("WORKSPACE SEED PASS: {0:N3} GiB, SHA256={1}" -f ($archiveBytes / 1GB), $actualHash)

      - save_cache:
          key: << pipeline.parameters.ue_cache_key >>
          paths:
            - 'C:\YacsUe58Seed\ue58-win64.zip'
            - 'C:\YacsUe58Seed\ue58-win64-manifest.json'

  ue-cache-verify:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - restore_cache:
          keys:
            - << pipeline.parameters.ue_cache_key >>

      - run:
          name: Verify restored UE cache payload
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            $ErrorActionPreference = 'Stop'
            $seedRoot = 'C:\YacsUe58Seed'
            $archive = Join-Path $seedRoot 'ue58-win64.zip'
            $manifestPath = Join-Path $seedRoot 'ue58-win64-manifest.json'

            if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
              throw "Restored UE cache archive missing: $archive"
            }
            if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
              throw "Restored UE cache manifest missing: $manifestPath"
            }

            $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
            $archiveBytes = (Get-Item -LiteralPath $archive).Length
            if ($archiveBytes -lt 1GB) {
              throw ("Restored UE cache archive is implausibly small: {0} bytes." -f $archiveBytes)
            }
            if ([int64]$manifest.ArchiveBytes -ne [int64]$archiveBytes) {
              throw ("Restored UE cache size mismatch: manifest={0}, actual={1}." -f $manifest.ArchiveBytes, $archiveBytes)
            }
            if (-not [bool]$manifest.ArchiveCreated -or -not [bool]$manifest.ArchiveIntegrityValidated) {
              throw 'Restored UE cache manifest is not integrity-validated.'
            }

            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            $stream = [System.IO.File]::OpenRead($archive)
            try {
              $hashBytes = $sha256.ComputeHash($stream)
              $actualHash = ([System.BitConverter]::ToString($hashBytes)).Replace('-', '').ToLowerInvariant()
            } finally {
              $stream.Dispose()
              $sha256.Dispose()
            }
            if ($actualHash -ne [string]$manifest.ArchiveSha256) {
              throw 'Restored UE cache SHA256 mismatch.'
            }

            Write-Host ("CACHE RESTORE PASS: {0:N3} GiB, SHA256={1}" -f ($archiveBytes / 1GB), $actualHash)

  ue-hosted-canary:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass
    steps:
      - checkout

      - run:
          name: Require trusted main branch canary
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            if ($env:CIRCLE_BRANCH -ne 'main') {
              throw "UE hosted canary must run from main; actual branch is '$env:CIRCLE_BRANCH'."
            }

      - restore_cache:
          keys:
            - << pipeline.parameters.ue_cache_key >>

      - run:
          name: Restore cached UE 5.8
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            powershell.exe -ExecutionPolicy Bypass -File scripts/ci/Restore-YacsUe58Seed.ps1 -SeedRoot 'C:\YacsUe58Seed'

      - run:
          name: Build YACS Editor and run scoped Automation
          shell: powershell.exe -ExecutionPolicy Bypass
          command: |
            pwsh ./scripts/ci/Invoke-YacsUnrealCi.ps1 -ExpectedHead $env:CIRCLE_SHA1

      - store_artifacts:
          path: Saved/RuntimeProof/CI/Unreal
          destination: yacs-unreal-canary

workflows:
  windows-ue-spike:
    when: << pipeline.parameters.windows_probe >>
    jobs:
      - windows-probe

  windows-ue-cache-seed:
    when: << pipeline.parameters.ue_cache_seed >>
    jobs:
      - ue-cache-seed
      - ue-cache-publish:
          requires:
            - ue-cache-seed
      - ue-cache-verify:
          requires:
            - ue-cache-publish

  windows-ue-hosted-canary:
    when: << pipeline.parameters.ue_canary >>
    jobs:
      - ue-hosted-canary
